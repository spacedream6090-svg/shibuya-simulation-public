# 物理ゾーン(P3 境界縫合 竹-4)の**実配置**プロファイル — 渋谷の 3 空間を連続物理にする。
#
# これは「基底 conf/config.yaml との差分だけ」を書いた重ね書き用ファイル(production.yaml /
# observe.yaml と同じ機構)。基底の上に OmegaConf.merge で重なる。
#   使い方(単体):  python scripts/run.py --profile conf/zones_shibuya.yaml
#   使い方(併用):  scripts/run.py の --profile は **1 本しか取らない**(基底 < env < profile <
#                   dotlist)。観察ラン(conf/observe.yaml)や本番(conf/production.yaml)と
#                   併せるときは、**下の `physics:` ブロックをそのまま相手のプロファイルへ貼る**
#                   (observe.yaml が「production.yaml を土台に chance ブロックだけを足す運用でもよい」
#                    と書いているのと同じ、この repo の既定の合成作法)。`world.map` の行も
#                   相手が wide_v7 でなければ一緒に持っていくこと。
#
# ★ 基底 conf/config.yaml は `zones_enabled: false` / `zones: []` のまま**一切触っていない**
#   = ゴールデンは 1 バイトも動かない(このファイルを指定したランだけが世界を変える)。
#   physics.zones_enabled は registry.py に strict / affects_k=false / risk=none で宣言済みの
#   **opt-in の世界変更機能**である(ON にすると位置と到着時刻が物理で決まる)。
#
# 何が起きるか: 下の 3 ポリゴンを**通り抜ける**経路を持つ個体は、その step の頭で物理に所有され、
# dt_sub=0.05 s 刻みで実際にその中を歩く(グラフ移動はしない)。ゾーンの外へ出た時点で経路の
# 折れ線へ射影してグラフ状態へ返る。スクランブル交差点は**信号が青の間しか入場できない**ので、
# 赤で縁石に溜まり青で一斉に横断する挙動が SignalGate から自然に出る。
#
# ---- 地図(ポリゴン座標の前提)------------------------------------------------------
# 下の座標はすべて **data/shibuya_osm_wide_v7.json のローカル平面 m**(原点 = スクランブル
# 交差点 35.6595N/139.70062E・X=east / Y=north)。crossings_shibuya.json と同じ原点なので
# 交差点表の x,y とそのまま突き合わせられる。
world:
  map: data/shibuya_osm_wide_v7.json

physics:
  # ---- P4-2/P4-3 歩行物理較正(SFM ゾーンにだけ効く。ORCA ゾーンは無関係)----
  # 何を ON にするかは実測に従う(reference/physics_bench/README.md §11 の受入判定表・
  # docs/research/p4-calibration-research.md 追記 2026-08-05):
  #   far_field ON のみ … A(±20%帯)1.00 ✓ / B(単調性)0 違反 ✓ / C(10-90 包絡線)1.00 ✓
  #                        churn ≤0.001。**A/B/C が揃って合格するのはこの構成**なので採る。
  #   v_of_s       … 「限界効用はほぼゼロ(最大相対誤差 0.113→0.131 と微悪化)」= 既定 OFF 据え置き
  #                  (README §11-4「必要性は本ベンチでは示せていません」)。**ON にしない**。
  #   wall         … 「壁のみ ON は単独では悪化させます(A 0.20・churn 0.230)。far_field と
  #                  セットで使ってください」(README §11-5)。far+wall(v_of_s なし)の実測列は
  #                  無いうえ、下の 3 ゾーンは walls を 1 本も宣言しない(mode: none)ので
  #                  **壁項はそもそも 1 度も評価されない** = 変える理由がゼロ。既定のまま置く。
  #                  ★将来ゾーンに壁線分を入れるときは README §9 の b=0.06(w=0.9m 単独通過を
  #                    満たす最大の b = Helbing2000 の 0.08 からの乖離が最小)から検討すること。
  #   D(J/w 水準)は全構成で未達のまま = 本ゾーン群でも specific flow は過小に出る(既知の限界)。
  sfm:
    far_field:
      enabled: true           # ← P4-2 の長距離 social 項。既定 OFF からの唯一の変更
      a2: 0.119               # P4-1 Nelder-Mead 収束先(calib_results.json)
      b2: 1.890               # 同上
      cutoff_factor: 2.5      # 体表間隔 2.5·b2 で打ち切り(a2 とセットでしか意味を持たない規則)
      taper_m: 1.0            # その手前 1 m を C¹ smoothstep で 0 へ(右辺の不連続を作らない)

  zones_enabled: true

  # perception は基底の既定のまま(density_radius_m 2.0 / contact_gap_m 0.05 / channels false)。
  # ★channels は **false のまま**にすること(true にすると ext.crowd_local の意味が
  #   「同席人数」から「実測近傍人数」へ変わり、第80 の σ 較正をやり直す必要がある)。

  # ==== 3 ゾーン ==========================================================================
  # 並び順には意味がある: **scramble を先頭に置く**。physics.py は「経路がゾーンを通り抜ける
  # 個体」を **リスト順に先着で** 所有する(_run_zone が `_phys_zone is not None` を飛ばす)。
  # 信号を持つ scramble が先なら「南下して横断→ハチ公前広場」の個体は必ず信号の管理下で
  # 車道を渡る。逆順にすると hachiko_square が先に所有し、**赤信号を無視して車道を渡る**。
  zones:
    # -------------------------------------------------------------------------------- #
    # (1) スクランブル交差点 — 多方向交差流 = P2 決定の割当規則で engine: orca
    #     (交差流の実測: 効率 0.924 vs SFM 0.530・反転 1/5)
    # 幾何: 8 本の横断歩道がぶつかる 8 つの縁側ノード(= ゲート)を結ぶ八角形から 3.5 m 内側。
    #   ゲート(すべて実ノード・地図座標):
    #     n2021391989 (  1.6, 17.4) 北   / n2223657341 (-14.2, 13.0) 北北西
    #     n5244745709 (-25.5, 11.4) 北西 / n1499530624 (-35.8,  2.8) 西
    #     n1499530621 (-25.8,-15.7) 南西 / n1499530620 ( -4.2,-20.3) 南
    #     n2223657295 (  3.3,-13.6) 南東 / n1676749591 ( 13.4, -3.7) 東
    #   内部ノードは中心の n291758776「スクランブル交差点」1 件(= 車道そのもの)。
    #   面積 840 m²(縁石の内側だけ = 密度の分母としては保守側 = 密度は高めに出る)。
    - id: scramble
      engine: orca
      dt_sub: 0.05              # P2 条件1: 0.02–0.05(dt>=0.1 は SFM が rho>=1.5 で後退爆発)
      layers: [0]               # ★地上だけ。ポリゴンは平面図形なので、これを書かないと
                                #   真下の地下通路ノード 3 件(n6219477371 layer-1 /
                                #   n6219477356・n6219435128 layer-2)まで「ゾーン内」になり、
                                #   **地下街を歩いている個体が地上の赤信号で足止めされる**。
      polygon: [[9.92, -3.37], [0.58, 14.05], [-12.27, 10.08], [-22.54, 9.53],
                [-32.34, 2.27], [-22.85, -13.82], [-4.22, -16.8], [1.38, -10.67]]
      arrive_radius_m: 1.0
      signal:
        mode: table
        path: data/crossings_shibuya.json
        # 実在のスクランブル横断(OSM crossing_ref=pedestrian_scramble・name=渋谷駅前)。
        # 交差点表の id は**グラフのノード id と同じ**(n291758776)= 中心ノードそのもの。
        # 表の実測値: cycle_s 140 / green_s 37 / flash_s 10(= 赤 93 s。
        # docs/research/pedestrian-signals.md §2.3 の渋谷スクランブル実測)。
        crossing_id: 291758776
        offset_s: 0.0
      orca:
        pref_noise: 0.05        # 対称性の破れ(未較正。0.0 にすると乱数を 1 本も引かない)
        radius_margin_m: 0.05   # P2 条件3(a) 半径マージン
        separation_iters: 64    # P2 条件3(b) 決定論的な事後分離パス(反復上限)
      gate:
        min_gap_m: 0.10         # guarded: 入口がこの余裕ぶん空いていなければ入れない
        band_m: 3.0             # 緩和帯(この帯の指標は内部と分けて出す)
        # 安全弁 max_hold_steps(入場待ちの上限)/ max_zone_steps(滞在の上限)は
        # zones.py GATE_DEFAULTS の 3 / 6 をそのまま使う。**ここに書かない**理由:
        # timeconv の Δt 分類表(TABLE)に physics.zones.*.gate.max_*_steps が無く、
        # conf に書くと tests/test_timeconv.py の棚卸し検収が「未分類の step 単位キー」
        # として落とす(= Δt≠10 で黙って壊れる形の予防)。値を変えたくなったら
        # 先に timeconv.TABLE へ STEPS として登録すること。

    # -------------------------------------------------------------------------------- #
    # (2) ハチ公前広場 — 開放平面の広場。壁を持たないので engine: sfm(P2 決定の既定)。
    # 幾何: 交差点南側の広場(x -24〜14 / y -56〜-27 の矩形・1,102 m²)。
    #   内部ノード 2 件: n12314075741「ハチ公前広場」(-10.5,-42.1・忠犬ハチ公像 POI がぶら下がる)
    #                    n12352271648 (8.9,-36.9)
    #   ゲート 6 件: n12352271624 (-5.1,-23.8) 交差点南の歩道 / n6219729369 (10.5,-24.2)
    #                n12352271649 (12.2,-56.7) / n12352271650 (32.4,-33.3) 駅ハチ公口側
    #                n5091218473 (-19.1,-81.7) / n5091218458 (-30.6,-83.2) 南口・道玄坂下側
    #   建物footprint との重なりゼロ。scramble ポリゴンとは最短 10.2 m 離してある。
    - id: hachiko_square
      engine: sfm
      dt_sub: 0.05
      layers: [0]
      polygon: [[-24.0, -56.0], [14.0, -56.0], [14.0, -27.0], [-24.0, -27.0]]
      arrive_radius_m: 1.0
      sfm:
        noise: 0.0              # ξ=0 = 乱数を 1 本も引かない(決定論を最大にする)
        wall_range_m: 2.0
      gate:
        min_gap_m: 0.10
        band_m: 3.0
        # 安全弁(max_hold_steps 3 / max_zone_steps 6)は既定のまま。上の scramble の注記参照。

    # -------------------------------------------------------------------------------- #
    # (3) センター街(バスケットボールストリート)入口〜中程 — 一方向優勢の歩行者専用街路 =
    #     engine: sfm。
    # 幾何: 歩行者専用エッジ n10151868701 (-80.7,16.5)〜n5244745710 (-75.7,62.6)(klass=pedestrian
    #   46.4 m)の折れ線に沿った幅 9 m・両端 +5 m の回廊(507 m²)。
    #   入口側の角 n10151868701 は交差点北西の歩道 n12352271657 (-51.1,17.2) から入る実際の
    #   センター街入口(沿道に マツモトキヨシ/ヴィレッジヴァンガード/くら寿司/大黒屋/センター244ビル)。
    #   ゲート 6 件: n12352271657(交差点側)/ n1014529169 (-81.7,5.9・道玄坂側)/
    #                n10151868702 (-103.1,17.5)/ n1424672751 (-102.2,68.7)/
    #                n2268223553 (-57.3,111.5・井の頭通り側)/ n12352271628 (-35.9,29.0)
    #   ★正直な限界: OSM の建物 footprint がこの街区では粗く(b136690966 が一体化した大ブロック)、
    #     建物間の空きが約 4.3 m しかない。実測の街路幅(約 9-10 m)を採ったので 4 棟の footprint
    #     頂点がポリゴンに入る。walls は none(建物は障害物にならない)ので力学には無影響で、
    #     効くのは密度の分母だけ = 密度はやや低め(保守的でない側)に出る。
    - id: center_gai
      engine: sfm
      dt_sub: 0.05
      layers: [0]
      polygon: [[-85.71, 12.02], [-76.77, 11.05], [-70.69, 67.09], [-79.63, 68.06]]
      arrive_radius_m: 1.0
      sfm:
        noise: 0.0
        wall_range_m: 2.0
      gate:
        min_gap_m: 0.10
        band_m: 3.0
        # 安全弁(max_hold_steps 3 / max_zone_steps 6)は既定のまま。上の scramble の注記参照。
