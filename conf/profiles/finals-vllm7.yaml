# =============================================================================
# 運用プロファイル(例)— 本選 GPU 7枚 / vLLM 艦隊(第24バッチ A5 / M4)
#
# 「基底 conf/config.yaml との差分だけ」を重ねる **例**。--profile 明示時のみ有効。
# realism・規模は production.yaml が担う(本ファイルは model=バックエンド配線のみ)。
# 本番相当:  production.yaml の model: ブロックを本内容へ差し替えて --profile production.yaml
#
# 前提トポロジ(ops topology A = 単一データセンターノードに 7 GPU):
#   - vLLM プロセスをポート 8000〜8006 に1本ずつ(GPU0〜6 に固定)= ops/launch-vllm-finals.ps1
#   - FleetLLM が agent_id で sticky 割当 → 同一エージェントの prefix が同じサーバに当たり続け、
#     prefix cache ヒット率が上がる(単一機の天井 ~96%)。
#   - tiers で purpose 別にサーバ群を分ける。下は **MIX-1 混合モデル艦隊(5+2)**:
#       会話(default)= Qwen3-8B ×5(GPU0-4 / port 8000-8004)
#       思考(reflect / plan)= Qwen3-14B ×2(GPU5-6 / port 8005-8006)
#     正典 docs/plans/model-mix-plan.md。1 サーバ = 1 モデル(vLLM は 1 プロセス 1 モデル)なので
#     **14B のポートは servers: に書かない**(書くと起動時 ValueError = 1サーバ2モデルの検算)。
#
# ★speculative decoding / prefix caching は **config ではなく vLLM 起動フラグ**:
#     --enable-prefix-caching / --speculative-config(EAGLE 等)。本ファイルからは制御しない。
#     起動フラグ・GPU 割当・実測手順は ops/launch-vllm-finals.ps1 と
#     ops/finals-compute-checklist.md を参照(EAGLE draft は本選機で未検証=要疎通)。
# =============================================================================

model:
  backend: vllm
  cache: true
  format: json
  temperature: 0.7
  timeout_s: 120           # 1リクエストのタイムアウト秒(重い内省が長い場合は上げる)

  # --- 出力上限(bench 実測の右サイズ。reflect_think=false 前提。根拠は local-ollama.yaml と同じ)---
  #  vLLM は max_tokens ぶんの KV スロットを見込んで連続バッチングするため、reflect の上限を
  #  2048→768 に下げると 1リクエストの KV 予約が縮み、同時実行スロットが増える=高並列時の
  #  スループット改善に効く(ollama 単一ストリームでは非拘束=無効。効果は本選機で要実測)。
  max_tokens: 320
  # 第137 V-P1: plan は 4-8 ブロック×50-80tok+自由文=350-700tok+ を要求するのに 448 で
  # 切られていた(実LLMの壊れ67%の第一容疑=予算切断)。finals_observe.yaml と同値の 896 に
  # 揃える(★この model: ブロックを finals_observe へ貼る運用のため、ここが 448 のままだと
  # 黙って旧値へ戻る。freeze_config 前に必ず一致確認)。
  plan_max_tokens: 896
  plan_temperature: 0.3    # 第137 V-P1(構造出力の安定・deliberate/reply は temperature を維持)
  recall_temperature: 0.2  # 第137 V-P1
  reflect_max_tokens: 768
  reflect_think: false

  # A8 トーナメント実測 2026-08-17: 同一プロンプト束・同一 Qwen3-8B で raw completions 経路の
  # parse 成立 58.7% → chat 経路(chat template が当たる)99.0%。★この model: ブロックを
  # finals_observe.yaml へ貼る運用のため、ここに無いと黙って completions(基底の既定)へ戻る
  # (plan_max_tokens 896 と同じ流儀)。**戻すには `completions`**。
  api_mode: chat

  # --- 混合モデル艦隊 5+2(MIX-1。docs/plans/model-mix-plan.md)---
  # ★servers: は **艦隊既定モデル(= name)のサーバだけ**を並べる。別モデルを載せるポートは
  #   tiers 側の dict 形式で宣言する(1 サーバ = 1 モデル。両方に書くと起動時 ValueError)。
  name: "qwen3:8b"         # 艦隊既定モデル = 会話側(deliberate / reply / speak / ...)
  servers:
    - "http://localhost:8000"   # GPU0  8B
    - "http://localhost:8001"   # GPU1  8B
    - "http://localhost:8002"   # GPU2  8B
    - "http://localhost:8003"   # GPU3  8B
    - "http://localhost:8004"   # GPU4  8B
  tiers:                    # purpose(rng_key 先頭)別のサーバ群。tiers を書くと servers 1本でも艦隊経路を通る
    # 思考層 = Qwen3-14B ×2(GPU5-6)。14B×1 でも思考需要(呼 7% × 速度比 1.74 ≈ 会話換算 12%)は
    # 覆えるが、2 本目が (i) 会話への 14B ランダム割当(MIX-2)の容量 (ii) AWQ の高並列頭打ち
    # (vLLM #20469)へのヘッジ (iii) eviction 緩和 (iv) 片系冗長 を同時に買う。
    # ★**8B へ戻すのは `model:` 行を消すだけ**(URL リスト形式へ戻る = 艦隊既定モデル)。
    # ★ops/launch-vllm-finals.ps1 の GPU→port 割当と**必ず同期**すること
    #   (8005/8006 に 14B を起動していないのにここで宣言すると、思考呼が 8B を叩き続ける)。
    # ★この 5+2 は MIX-3 リハーサル(chat 経路 + 本選相当束の R_eff 実測)で確定する暫定値。
    #   縮退線: 思考タイアのキュー滞留 > 1 step 相当 or T10 外挿 > 140h なら 6+1 へ(conf 1-2 行)。
    reflect:                # 夜の内省 = 最も重い自由文
      urls:
        - "http://localhost:8005"   # GPU5  14B
        - "http://localhost:8006"   # GPU6  14B
      model: "qwen3:14b"
    plan:                   # 朝の一日計画 = 構造化出力(rng_key "plan/<agent>/<step>[/retry]")
      urls:
        - "http://localhost:8005"   # GPU5  14B
        - "http://localhost:8006"   # GPU6  14B
      model: "qwen3:14b"
    default:                # deliberate / reply / speak / recall / ... = 8B ×5 で捌く
      - "http://localhost:8000"
      - "http://localhost:8001"
      - "http://localhost:8002"
      - "http://localhost:8003"
      - "http://localhost:8004"
