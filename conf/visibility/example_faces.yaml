# 広告面プロファイルの見本(可視行列の入力。C0 第68バッチ 2026-07-29)
#
# 使い方:
#   python scripts/build_visibility.py \
#       --faces conf/visibility/example_faces.yaml \
#       --heights data/building_heights_shibuya.json \
#       --bbox -250 -250 250 250 --cell 2.0 --eye 1.5 \
#       --out runs/_visibility/core500
#
# これは**シム外のオフライン事前計算 CLI の入力**であって、シム本体は現時点でこのファイルを
# 一切読まない(消費者は後続 B-L1 の street.py への LOS 配線)。
#
# ---------------------------------------------------------------------------
# ★ 正直な但し書き(捏造しないための明示)
# ---------------------------------------------------------------------------
# **ここに書かれた面の位置・向き・寸法は「実在サイネージの実測値」ではない。** 既定地図
# data/shibuya_osm.json に実在する建物のフットプリントから、下の「機械生成規則」で決定論的に
# 導いた**説明用の見本**である(建物名・建物 ID・実高さ height_m だけが実データ由来)。
# 実サイネージの掲出位置・面数・寸法・照明の収集は計画書レーン1 の別タスク(B0 型 Web リサーチ
# による env プロファイル化)であり、本バッチのスコープ外。実験に使うときは自分で調べた値に
# 差し替えること。kind(large/normal)の割当も見本であって業界区分の実測ではない。
#
# ---------------------------------------------------------------------------
# 既存 street.py(街頭広告)との対応づけ
# ---------------------------------------------------------------------------
# 現行の広告機構 `src/society/street.py` は掲出枠を **POI 名の文字列リスト**で受け取る:
#     ads.large: ["QFRONT", ...]      # 大型ビジョン(視認率 p_see_large)
#     ads.slots: ["渋谷駅前ビル", ...]  # 通常看板(視認率 p_see_normal)
# `resolve_slots(city, cfg)`(street.py:95)がこの名前を
#     ① POI 名(完全一致 → 部分一致)→ その POI のノード座標
#     ② 建物名(完全一致 → 部分一致)→ 建物 centroid
#     ③ 名前つきノード(完全一致 → 部分一致)→ ノード座標
# の順に解決し、`{"name", "x", "y", "large"}` の点として持つ。**枠は点であって面ではなく、
# 高さも向きも無い**(視認は半径 60m の距離判定のみ・LOS なし。実査 §1.5)。
#
# 本プロファイルはその点を**面**へ持ち上げる層である。各面の `slot` は上記の名前と一致させる:
#   - `slot` が同じ面と枠は同一の掲出物を指す(1 枠に複数面=多面ビジョンも書ける)。
#   - `kind: large` は ads.large、`kind: normal` は ads.slots に対応する(p_see_* の選択に使う)。
#   - 面の (x, y) は建物 centroid ではなく**壁面上の点**なので、street.py が解決する枠座標とは
#     一般に一致しない。B-L1 で LOS を配線するときは
#       (a) 可視行列の照合キーを `slot` 名にする(枠 1 個 ↔ 面 1 枚以上の対応表を持つ)
#       (b) 距離ゲート(ads.radius_m)は従来どおり枠座標で判定し、LOS だけを面で判定する
#     のどちらかを選ぶこと。**どちらにするかは本バッチでは決めない**(ランタイム設計は B-L1)。
#   - `building` は面が載っている建物 ID(遮蔽計算から除外する自建物)。street.py 側には無い情報。
#
# ---------------------------------------------------------------------------
# 座標・角度・高さの規約(build_visibility.py と同一。必ず読むこと)
# ---------------------------------------------------------------------------
#   crs        : local-m(地図ローカル m。原点 = スクランブル交差点。X=east, Y=north, Z=up)
#   normal_deg : 面が向いている向きの**方位角** [deg]。0=北(+Y)、90=東(+X)、時計回り。
#                省略可。省略した面は**両面から見える**扱いになる(背面カリングをしない)。
#                自建物を遮蔽から外す都合上、法線の無い面は自建物を透過して見えてしまうので、
#                **原則として書くこと**を強く推奨する。
#   z_base/z_top: 面の下端・上端の高さ [m]。**その面が載っている地面からの高さ**であって
#                標高ではない(--dem 指定時は面位置の地表 z を CLI 側で加算する)。
#   w_m        : 面の幅 [m]。可視判定には使わない(VAI のサイズ変数として行列 meta に運ぶだけ)。
#   kind       : large | normal(street.py の ads.large / ads.slots に対応)
#   id         : 面の一意 ID(可視行列の face_id 列。昇順で決定論に処理される)
#
# ---------------------------------------------------------------------------
# 機械生成規則(この見本の数値の出どころ。再現手順)
# ---------------------------------------------------------------------------
#   1. 建物名 → 建物: 既定地図の建物名の完全一致(street.py の名前解決と同じ向きの規則)。
#   2. 面が載る辺 = その建物フットプリントの辺のうち、長さ ≥ 6m かつ「辺の中点から最寄りの
#      道路ノードまでの距離」が最小の辺(= 通りに面した壁)。
#   3. (x, y) = その辺の中点。w_m = 辺の長さ(上限 24m)。
#   4. normal_deg = その辺の外向き法線(建物 centroid から遠ざかる側)の方位角。
#   5. z: large は建物頂部 −2m を上端に縦 12m、normal は下端 3m・縦 4m(頂部を超えない)。
#   6. height_m は data/building_heights_shibuya.json(PLATEAU 実測・A1 第67バッチ)の値。
#      注記の height_m / height_src は**出典の記録用**で、CLI は読まない(遮蔽高は地図側から取る)。

meta:
  schema: visibility-faces-1.0
  name: example_shibuya_core
  description: >-
    既定地図(data/shibuya_osm.json)中心部の実在建物 12 棟から機械生成した見本の広告面。
    実サイネージの実測ではない(上の但し書き参照)。
  crs: local-m
  axes: X=east, Y=north, Z=up
  normal_convention: 方位角 deg・0=北(+Y)・90=東(+X)・時計回り
  z_convention: 面が載っている地面からの高さ m(標高ではない)
  derived_from:
    map: data/shibuya_osm.json
    heights: data/building_heights_shibuya.json
    rule: >-
      建物名の完全一致 → フットプリントの「最寄り道路ノードに面した長さ6m以上の辺」→
      その中点を面位置・外向き法線を向き・辺長(上限24m)を幅とする。
      z は large=頂部-2m から縦12m / normal=地上3m から縦4m。
  honest_limits:
    - 面の位置・向き・寸法・kind は機械生成の見本であり実測サイネージではない
    - 照明(lighting)と滞留(dwell)は VAI の残り 2 変数だが本スキーマには無い(将来列)
    - 1 建物 1 面しか置いていない(実際の大型ビジョンは多面・可動のことがある)

