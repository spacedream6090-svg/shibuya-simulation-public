# 環境改変条件の見本(world.mod のプロファイル。A1 第67バッチ 2026-07-29)
#
# 使い方:
#   python scripts/run.py world.mod.enabled=true world.mod.profile=example_counterfactual
#   (適用内容は runs/<name>/summary.json の world_mod キーに残る)
#
# 現実の渋谷幾何が「原点」で、このファイルは**その周りの反実仮想を 1 点だけ指定する条件票**。
# 座標はすべて地図ローカル m(原点 = スクランブル交差点。data/shibuya_osm*.json の meta.crs=local-m)。
# 地名・カテゴリ名のリテラルはここ(conf 側)にだけ書く。src/society/world/worldmod.py は
# no-fingerprint 契約により一切の地名・業種名を持たない。
#
# ★ この見本は「駅前コリドーの歩行環境を悪くしたら何が起きるか」という向きの条件。
#   数値は説明用の仮置きであって、実測に基づく較正値ではない(実験に使うときは自分で決める)。

name: example_counterfactual
description: >-
  駅前中心部の一部を歩行者に閉じ、周辺の歩道を狭めた(速度 0.6 倍)反実仮想。
  飲食の営業時間を 24 時間に広げた条件も同時に入れてある(commerce.enabled=true のときのみ実効)。

# ---- ① エッジ集合の無効化(scenario.shock_closure の一般化。routing が迂回する)----
# セレクタは「明示リスト edges」と「矩形 bbox」の 2 通り。両方書けば和集合。
# bbox は [x0, y0, x1, y1] で、**端点のいずれかが矩形内**のエッジを選ぶ。
edges_closed:
  bbox:
    - [-25.0, -25.0, 25.0, 25.0]     # 交差点直近のごく狭い範囲だけを閉じる
  # edges:                            # 明示指定の例(地図に無いエッジを書くとエラーで止まる)
  #   - ["n123", "n456"]

# ---- ② エッジ速度係数(歩道幅の代理)----
# scale < 1 で「遅くなる = 走破に時間がかかる」。走行コスト長 = 実長 / scale として
# 経路選択(A*)と移動所要 step の双方に効く。幾何そのものは変わらない。
# 同一エッジが複数ルールに該当したら**記述順で後勝ち**(決定論)。
edge_speed_scale:
  - scale: 0.6
    bbox:
      - [-200.0, -100.0, 200.0, 100.0]   # 駅前コリドー帯の歩道を狭める
  - scale: 1.25
    bbox:
      - [-600.0, 200.0, -300.0, 500.0]   # 迂回側の裏通りは逆に広げる(比較用)

# ---- ③ 営業時間のオーバーライド ----
# cats: commerce の cat 単位。[開店時, 閉店時] の 24h 表記(open == close で 24 時間営業)。
#   commerce.enabled=false のときはそもそも営業時間ゲートが働かないので実効はない。
open_hours:
  cats:
    food: [0, 0]                        # 飲食を 24 時間営業に(0,0 = 終日)
    shop: [7, 23]                       # 物販の営業時間を拡張
  # pois:                                # ★予約フィールド(本バッチでは未消費)。POI 単位の
  #   "p123": [9, 21]                    #   上書きは commerce 層の改修が要るため将来バッチ。

# ---- ④ 駅ゲート容量 ----
# 第67 では予約フィールド(未消費)。**第84バッチの環境フィードバック 規則2(改札スループット
# 飽和 → 入場規制)が消費する**: env.feedback.gate.capacity_per_min × Δt にこの係数を掛ける
# (= 「もし改札が半分の広さだったら」の反実仮想)。キーは駅ノード id、または単一エントリなら
# 名前は何でもよい。env.feedback が OFF のランでは従来どおり未消費(summary に記録だけ残る)。
# gate_capacity:
#   station: 0.5
