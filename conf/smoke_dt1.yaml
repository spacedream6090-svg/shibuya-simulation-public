# =============================================================================
# Δt=1 分の並行小ラン(OBS-U2)プロファイル — 第94バッチ 2026-08-06
#
# 正典: docs/research/obs-u2-dt1min-design.md §4 B5(推奨=案1の完遂+案3のプロファイル部分)
#       / docs/plans/observe-run-config-proposal.md §3 OBS-U2
#       (本線は Δt=10 のまま。**GPU 余剰があれば** Δt=1 の並行小ランを別に回す)。
#
# ★★ これは「基底 conf/config.yaml との差分だけ」を重ねる自己完結ファイル(OmegaConf.merge)。
#     使い方:
#       python scripts/run.py --profile conf/smoke_dt1.yaml run.name=dt1_smoke
#       python scripts/run.py --resume runs/dt1_smoke run.n_steps=2880   # 続きから
#     規模・期間は dotlist で(例 run.n_agents=24 run.n_steps=1440)。
#
# -----------------------------------------------------------------------------
# 読む前に必ず理解すること(1 行でも読み飛ばすと結果を誤読する)
# -----------------------------------------------------------------------------
# (a) ★**Δt=1 は「別の世界」である**。run.dt_min を変えると乱数消費列そのものが変わるので、
#     Δt=10 のランと **step 単位・個体単位では原理的に対応づかない**(timeconv.py:45-46 の
#     明文規約)。比較は必ず**ラン間の統計量**(1 日あたり・1 人あたり)で行う。
#     「同じ seed なのに違う」は不具合ではなく仕様である。
#
# (b) ★**LLM 呼数は ×1 ではない。実測 ×2.2〜2.4**(mock・12体・1 日・設計調査 §2(b))。
#     内訳: 周期発火は分単位・朝計画/夜内省は per-day なので原理的には ×1 に近い。増えるのは
#     **Δt=10 が構造的に潰していた salience(驚き)発火が解放される**ぶんである
#     (CogQueue は生きたイベントを高々 1 個しか持たず、文脈別基本周期 talking 2.0 分 /
#      walking 8.0 分はどちらも 10 分より短いため、Δt=10 では periodic が常に先に due になる)。
#     実測の質的差分は **salience 発火 0 件(Δt=10)→ 103 件(Δt=1)**。これが OBS-U2 の
#     科学的動機そのものなので、呼数を据え置くために発火を間引いてはならない。
#     → 規模(run.n_agents)で予算を作ること。時間解像度で節約しない。
#
# (c) ★**σ_c(観測チャンネルの分散)は Δt=10 で測った値である**(data/calib/sigma_c.json)。
#     ext.heard / ext.signage は「この step の件数」なので Δt=1 では 1 step あたりが減り、
#     σ_c が過大 → S = Σ g|o−ô|/σ が系統的に小さく → **salience 発火は過小に出る**
#     (= 上の 103 件は控えめな下限)。設計調査 §5 R1。再測するまで、Δt=1 ランの
#     発火**率の絶対値**を Δt=10 ランと直接比較しないこと(方向と有無だけを読む)。
#
# (d) ★**観測の間引きキーは意図的に Δt 不変(INVARIANT)**である(実験者が指定する量)。
#     したがって Δt=1 では**手で 10 倍にしないとログが 10 倍になる**。本ファイルの (3) が
#     まさにその ×10 であり、これがこのプロファイルの存在理由の半分である
#     (もう半分は run.n_steps の ×10)。observer.snapshot_every だけは STEPS 分類=自動で
#     逆比例するので **ここでは触らない**(触ると二重に間引かれる)。
#
# (e) ★**ゾーン外の移動は 1 分刻みの直線補間であって SFM ではない**(設計調査 §5 R4)。
#     P4 の較正値を街路スケールへそのまま外挿しない。主張範囲は「遭遇・思考の時間解像度」。
# =============================================================================

# ============================================================================
# (0) 中央 Δt と期間 — ここが本プロファイルの本体
# ============================================================================
run:
  dt_min: 1                # ★唯一の宣言点。config ロードの 1 箇所(timeconv.apply_dt)が
                           #   RATE / PROB / KEEP / STEPS の 130 キーを毎分レートから作り直す。
                           #   下流のコードは Δt を知らない(Clock 経由で派生量を取る)。
  seed: 42                 # 並行小ランは「Δt だけが違う対照」なので seed も固定して回す。
                           #   観察ラン本線に合わせて採取したいなら dotlist で run.seed=auto。
  n_agents: 24             # 小ラン。★呼数は Δt=10 比 ×2.2〜2.4 なので規模で予算を作る((b))
  n_steps: 1440            # 1 シミュ日 = 1440 step(Δt=1)。★Δt=10 の 144 step と同じ実時間。
                           #   n_steps は INVARIANT(実験者が指定する量)= 自動換算されない。
                           #   10 日回すなら dotlist で run.n_steps=14400。

# ============================================================================
# (1) LLM — まず mock で配線を確かめる。実 LLM は dotlist / --profile 側で差し替える
#     例: model.backend=vllm model.host=... (conf/profiles/finals-vllm7.yaml の値を dotlist で)
# ============================================================================
model:
  backend: mock
  journal: true            # 観察ランの必須記録(何を見せて何を返したかを失わない)
# ★lod.max_llm_per_step は **ここに書いてはいけない**。RATE 分類なので apply_dt が基底の
#   300 を自動で 30 にする(1 日 cap の総量 43,200 = 30 × 1440 は保存される)。
#   このプロファイルは apply_dt の**前**に重なるので、ここに 30 と書くと更に 1/10 されて
#   3 になる(= 予算が 10 分の 1 の別条件になる)。**変換される分類のキーは書かない**
#   というのが Δt プロファイルの鉄則である(書いてよいのは INVARIANT 分類だけ)。

# ============================================================================
# (2) 認知 — **驚き駆動を観るためのプロファイル**なので発火層を ON にする
#     ★これを切ると Δt=1 で回す意味がほぼ無くなる((b) の salience 解放が主目的)。
# ============================================================================
cognition:
  fire:
    enabled: true          # 驚き駆動発火。Δt=10 では salience が構造的に 0 件だった層
  channels:
    every_steps: 10        # ★(d) の ×10。既定 1(毎 step)のままだと観測サイドカーが 10 倍
  g_update:
    log_every_steps: 10    # ★(d) の ×10。g/θ 軌跡サイドカーの採取間隔

# ============================================================================
# (3) 観測の間引き — (d) のとおり **Δt=1 では手で ×10 する**
# ============================================================================
observer:
  flush_every_steps: 1440  # 既定 0 = 無効だが、Δt=1 は L1 が素で ×3〜4 になる(実測)ので
                           #   1 シミュ日ごとに part flush して RAM を解放する(§5 R5)
  checkpoint_every: 1440   # 1 シミュ日ごとに完全状態を保存(観察ランの運用規約=毎日 checkpoint)。
                           #   ★--resume の Δt 二重変換は第94バッチで根治済み
                           #     (scripts/run.py が load_config(apply_dt=False) を使う)。
  state_hash:
    interval: 10           # ★(d) の ×10。ただし state_hash 自体は観察ランでは OFF 推奨
                           #   (enabled は基底の false のまま=この値は保険)
  # ★observer.snapshot_every は **触らない**。STEPS 分類なので apply_dt が
  #   12 → 120 に自動で逆比例させる(実時間 2 時間ごとの粒度が保たれる)。ここで書くと二重。
env:
  feedback:
    log_every_steps: 40    # ★(d) の ×10(既定 4)。env.feedback 自体は既定 OFF=保険

# ============================================================================
# (4) 比較条件 — ★**Δt 以外を 1 つも動かさない**
#     観察ラン本線(conf/observe.yaml 等)と併走させるときは、ON セットを本線と同一にする
#     (提案書 §1)。比較対象が Δt だけになるようにするのが並行小ランの設計そのもの。
#     したがって本ファイルは生活機構(relations/weather/routine…)を**一切書かない**:
#     必要なら本線プロファイルの該当ブロックをそのままコピーするか、dotlist で足すこと。
#     ここで独自の ON/OFF を足すと「Δt の効果」と「機構の効果」が交絡する。
# ============================================================================
