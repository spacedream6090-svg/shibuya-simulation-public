# =============================================================================
# 横煙(WIDE)プロファイル — N=25万 を**数シミュ時間**(第91バッチ 2026-08-03)
#
# 正典: docs/plans/source/design-discussion-20260802.md §3
#   「横テスト(N=25万を数シミュ時間)は **OOM・スループット・計算量の爆発** を検出する。」
#
# 縦煙(conf/smoke_tall.yaml)と目的が正反対である。縦は「中身が退行していないか」、
# 横は「そもそも動くか」。したがって**観測は最小**にする(観測列そのものが N に比例して
# メモリを食うため。とくに observer.regression は窓合計が在場個体数に比例するので OFF)。
#
# ★★ 第91バッチでは**実走していない**。以下は「回すならこの構成」という宣言と、
#    回す前に埋めるべき前提条件の一覧である。実測は estimate/bench の外挿のみ
#    (根拠と数値は docs/research/regression-signals.md §6)。
#
# 使い方(前提条件を満たしてから):
#   python scripts/run.py --profile conf/smoke_wide.yaml run.name=smoke_wide
#   python scripts/watchdog.py --run-dir runs/smoke_wide -- \
#       --profile conf/smoke_wide.yaml run.name=smoke_wide run.out_dir=runs
#
# ---------------------------------------------------------------------------
# 前提条件(**回す前に必ず確認する**。調査で判明した事実をそのまま書く)
# ---------------------------------------------------------------------------
# (a) ペルソナは足りている。data/persona_pool は **実測 1,000,000 件**
#     (L1 30,000 / L2 253,702 / L3 36,690 / L4 678,588 / L5 1,020・ディスク約 737MB)。
#     25万 ≪ 100万なので **複製・水増しは不要**。build_persona_pool.py に複製オプションは
#     無いが、必要になったことがない。
#
# (b) ★**在場 25万は「日常が回る構成」にはならない**(presence.py の層優先の帰結)。
#     優先度は resident(0) > duty(1) > workday_shift(2) > cadence(3) > stochastic(4) で、
#     cap で溢れた層を当日ランキングで切って **break** する。
#       平日: resident 30,034 + duty 986 = 31,020 → 残 218,980 を workday_shift(253,702)が
#             埋めて cap 到達 → **cadence / stochastic が 1 人も入らない = 来街者ゼロの街**。
#       週末: workday_shift が失格 → 在場可能なのは概算 6 万人程度で **25万に届かない**。
#     したがって横煙は「**平日 1 日ぶんのスループット/OOM 試験**」として読むこと。
#     人口構成まで現実に寄せたいなら presence の層優先か pool の総件数を触る判断が要る
#     (= ユーザー判断。第91 では触っていない)。
#
# (c) ★**プールを開くだけで名簿 N に比例するメモリが常駐する**。PoolStore._build_index は
#     total(=100万)件ぶんの PresenceRec / offsets / index を常駐させ、737MB を 1 パス
#     json.loads する。実測ベースの見積は **0.7〜1.2 GB**。present_cap を下げても減らない。
#     25万専用の小さいプールを別ディレクトリに作れば索引常駐は 1/4 になる:
#       python scripts/build_persona_pool.py --fraction 0.25 --out data/persona_pool_250k
#     そのうえで pool.dir=data/persona_pool_250k を渡す。
#
# (d) ★**メモリ見積(実測ではなく外挿)**。P0 の bench_scaling(mock・144step・基底 config)は
#       N=10 → 202.2 MB / N=100 → 269.9 MB / N=300 → 443.8 MB / N=1,000 → **1,454.1 MB**
#     固定分を除いた傾きは (1454.1−202.2)/990 = **1.2645 MB/agent**。素直に延ばすと
#       N=1万 ≈ 14.5 GB / N=10万 ≈ 145 GB / **N=25万 ≈ 316〜363 GB**。
#     これに (c) の索引 0.7〜1.2 GB が乗る。**単ノードでは成立しない**。
#     ★正直な訂正: 「rehearsal_pool10k(1万体)の RSS 実測」は**存在しない**。当該ランの
#       summary.json は peak_rss_mb / elapsed_sec を持たない(両キーは P0=2026-07-29 に
#       追加されたので、2026-07-21 のランには無い)。残っているのは出力量だけ
#       (l1_events.parquet 174.9MB / 16,220,177 events / 18.95 呼・agent・日)。
#       したがって 25万の見積は **N=1,000 からの外挿一本**で、1 万体の実測による裏取りは
#       まだ無い。回す前にまず 1 万体の RSS を取ること(bench.py の peak_rss_mb 経路)。
#     背景 SoA(million-scale.md §4.2-C の「~2.3GB」)は**未実装**なので当てにしない。
#
# (e) 観測ストリーミング(W2-F)も未実装。observer/measure.load_events は全件 RAM 展開なので、
#     このランの L1 を事後解析に素で流し込むと破綻する。**回せても測れない**状態である。
# =============================================================================

# ============================================================================
# (0) 規模と期間 — 「25万を数シミュ時間」
# ============================================================================
run:
  seed: 42
  n_agents: 250000         # pool ON では present_cap 側が効くが、名目 N も揃えておく
  n_steps: 36              # 6 シミュ時間(1 step = 10 分)。§3 の「数シミュ時間」。
                           # ★まず run.n_steps=6(1 時間)で立ち上げ、通ってから伸ばす。

pool:
  enabled: true
  dir: data/persona_pool   # 実測 1,000,000 件。25万専用の小プールを作ったならここを差し替える
  present_cap: 250000      # 在場 = 25万(層優先の帰結は上の (b) を必ず読むこと)
  dormant_cap: 50000       # ★既定 0(無制限)のままだと日次ローテーションで際限なく膨れる。
                           #   LRU で有界にする(数シミュ時間なら回転はほぼ起きないが保険)。
  relations_cap: 20
  episodes_cap: 30

# ============================================================================
# (1) LLM は mock — 横煙が測るのは**エンジンの計算量とメモリ**であって推論品質ではない
#     ★実 LLM のスループット試験は別物(8/15-16 の診断ラン)。ここで混ぜない。
# ============================================================================
model:
  backend: mock
lod:
  # 予算を N 比例にすると 25万 × 0.15 = 37,500 呼/step になる。mock でも
  # 発火経路のコストが線形に効くので、横煙では**固定上限のまま**にしておく。
  n_proportional:
    enabled: false
  max_llm_per_step: 300
engine:
  batch_llm:
    enabled: false         # mock では逐次と同一経路。並行化のオーバーヘッドを混ぜない

# ============================================================================
# (2) 観測は最小 — 「回るか」だけを見る。列の N 比例メモリを載せない
# ============================================================================
observer:
  regression:
    enabled: false         # ★横煙では **OFF**。窓合計(act_totals / fire_totals / active_totals)が
                           #   在場個体数に比例して常駐する。退行の検出は縦煙の仕事。
  echo:
    enabled: false         # 常設列だが、25万 × rolling 窓の発話タリーは横煙では純粋な重し
  llm_health:
    enabled: true          # 3 列だけ(累積カウンタ)。watchdog の監視に要るので残す
  initial_frame:
    days: 0
  snapshot_every: 36       # L3 は 25万 × 250B/体 が 1 回あたり ~60MB。実質 1 回だけ撮る
  flush_every_steps: 6     # ★必須。1 シミュ時間ごとに L1 を part flush して RAM を解放。
                           #   0(既定)のままだと L1 バッファで即 OOM
                           #   (25万 × 1.3 events/agent-step × 36 step ≈ 1,170 万件)。
  checkpoint_every: 18     # 3 シミュ時間ごと。落ちたところから続けられるようにする
                           # ★checkpoint 自体が 25万体の完全状態 pickle なので巨大になる。
                           #   ディスクを先に確認すること。

lens:
  enabled: false           # 観測レンズは全部切る(読むだけでも N 比例のコストがある)

# ---- 生活機構は「日常が回る最小限」に絞る。横煙は現象ではなく計算量の試験である ----
world:
  map: data/shibuya_osm_wide_v7.json
  calendar:
    enabled: true
    start_date: "auto"
    weekday_work: true     # (b) のとおり平日で読む
weather:
  enabled: false
relations:
  enabled: false           # 関係台帳は在場 25万 × 台帳で二乗側に効く。横煙では切る
organizations:
  enabled: false           # 25万の職場割当は init の支配項になりうる。まず素で通す
