# ============================================================
# 実験の全条件をここで宣言する(D11)。コードは書き換えない。
# 上書き例: python scripts/run.py run.seed=7 run.n_agents=30
# ============================================================

run:
  seed: 42
  n_agents: 10
  n_steps: 144          # 144 step = シミュ内1日(既定 dt_min=10 のとき)
  # ---- 中央 Δt(第79バッチ。1 step の分数。既定 10 = 現行動作そのまま=バイト一致)----
  # 「1 step = 10分」という仮定はここ 1 箇所に集約されている。src/society/timeconv.py の
  # 分類テーブルが各定数を レート(線形×Δt/10)/ 確率(1−(1−p)^(Δt/10))/ step 長(×10/Δt)/
  # 不変 に振り分け、config ロードの 1 箇所で一括変換する。
  #   ★dt_min=10 のときは変換テーブルを走査すらしない(恒等式でも浮動小数を通さない)。
  #   ★1440 の約数であること(日境界が step 境界に落ちないと日次機構が壊れる)。
  #   ★run.n_steps は自動換算しない(ランの長さは実験者が指定する量)。Δt を半分にして
  #     同じシミュ内時間を回すなら n_steps も 2 倍にする。
  #   ★Δt≠10 は「別の世界」= 乱数消費列が変わる(同一性ではなく統計量の同オーダーで検証)。
  dt_min: 10
  out_dir: runs         # 実行ごとに runs/<name>/ が作られる
  name: null            # null なら seed から自動命名
  # ---- 開始時刻(day0 step0 の時刻。"HH:MM"。既定 "07:00"=現行値=バイト一致)----
  # 分 of day へ解釈して Clock に渡す(1 step=10分・144 step=1日)。day 番号は sim_min//1440=
  # 開始時刻を含む絶対分の深夜0時境界で、既定 07:00 は day0 が 07:00〜24:00 の短い初日=従来どおり。
  # "00:00" にすると day 境界=深夜0時で自然(day=step//144)になり、natural_start と併用すると
  # 全住民が自然な睡眠から初日の朝を迎える(初日から全員に朝計画)。営業時間・ダイヤ・bedtime 等の
  # 時刻機構は sim_min%1440(時刻)基準なので開始時刻を変えても不変。要クオート(YAML 60 進の回避)。
  start_tod: "07:00"
  # ---- 初日コールドスタート改善(統合リハーサルの発見。既定 false=完全従来挙動=バイト一致)----
  # 既定は全員 sleeping=False で開始→開始時刻が深夜でも起きたまま過ごし初日の朝の起床(wake_up)と
  # 朝計画(day_plan)がほぼ出ない(2日目以降は正常)。true にすると run 開始時の着席で、開始時刻が
  # 本人の自然な睡眠時間帯(bedtime_min〜+sleep_steps から決定論導出・乱数なし)に入っている居住者を
  # 就寝状態・自宅・自然な起床 step で初期化する(既存の起床機構に乗る=朝計画が初日から全員分出る)。
  # 開始時に覚醒しているべき個体(夜勤者等)は従来どおり覚醒で着席。来街者・流入通勤者(自宅が圏外)は
  # 対象外。本番 ON はユーザー判断(production/daily は触らない)。ON の効果はイベント時系列に現れるが
  # LLM 呼数は k 非依存のまま(発火ゲートに k/traits を入れない=既存機構に乗るだけ)。
  natural_start: false
  # ---- ランモード(第72バッチ 2026-07-31。dual-mode-observe-verify-plan.md 第72行)----
  # 機能レジストリ(src/society/registry.py)が全機能トグルに宣言している再現性等級
  # repro_tier(strict / journal / none)を、ラン単位で機械的に取捨するスイッチ。
  #   none    … 既定。**現行動作そのまま**(レジストリは何も落とさない=1バイトも変えない)。
  #   observe … 全等級を許可(制限なし)。本選の観察ラン=面白いものを全部載せる用。
  #   journal … repro_tier=none の機能を自動 OFF(事後再生できる範囲での観察)。
  #   verify  … strict のみ許可(journal / none を自動 OFF)。対照実験・アブレーション用。
  # 自動 OFF は黙って起きない: WARNING ログ(明示 ON を落としたときは★印)+ run_manifest.json の
  # features.auto_disabled に必ず出る。落とした後の config が runs/<name>/config.yaml に保存される。
  mode: none

# ---- state 更新則の magnitude(OPEN#2: 因果構造は factors/update.py、量はここで調律)----
factors:
  congestion_grievance: 0.010     # 混雑遅延 → 不満+(Epstein)
  heard_valence_grievance: 0.020  # ネガ発話を聞く → 不満+ ×|感情価|(SIMCA affective)
  heard_valence_efficacy: 0.006   # ポジ発話を聞く → 効力感+
  being_heard_efficacy: 0.006     # 聞き手がいた → 効力感+(社会的説得)
  ignored_efficacy: -0.004        # 誰にも聞かれない → 効力感−微
  work_done_efficacy: 0.012       # 勤務完遂 → 効力感+(達成経験=最強の源泉)
  vicarious_efficacy: 0.004       # 他者の言葉・成功の目撃 → 効力感+(代理経験)
  park_grievance: -0.008          # 公園滞在 → 不満−(回復環境)
  own_adopted_ownership: 0.030    # 自分の造語が採用される → 当事者意識+
  own_adopted_efficacy: 0.010     #                        → 効力感+
  money_pressure_grievance: 0.015 # 手持ちが逼迫している間 → 不満+(1日1回、経済 v0)
  media_grievance: -0.03          # 在宅娯楽の気分修復(media.enabled 時のみ発火。Vuorre 2024
                                  # の +0.034/15分 を逆符号で。media OFF なら一切読まれない)
  relative_deprivation_grievance: 0.0  # ★ON 推奨: 例 0.012。参照集団(街に居る他者)の所持金
                                  # 中央値を下回る量に応じた不満(Wave G1・1日1回・非LLM・決定論)。
                                  # 個体の相対的地位で grievance に個体差が復活=飽和を破る。0.0=OFF(不変)
  threshold_dist: normal          # normal | lognormal(発火閾値の分布形。B段 seam)
                                  # ★手続き生成経路のみに作用(名簿 entry 使用時は名簿値優先=不変)

# ---- k(経験→内部状態の結合)= 内省の書き戻し自由度(D7) ----
k:
  writeback: free       # free | degraded | sham | off
  degraded_alpha: 0.5   # degraded 時に書き戻す確率
  reflect_period_days: 1

# ---- 反射=自己モデル(第11バッチ)+出来事誘発の深い内省・無意識層(第12バッチ 2026-07-08)----
# 文献検証: docs/research/deep-reflection-triggers.md / self-concept-identity.md。
# deep: 深い内省は固定周期でなく出来事に誘発される。日内の衝撃ゲージ(|Δstate| の
#   ネガ非対称加重=信念との乖離の近似)が個人閾値(traits 写像)を超えた日→侵入的段階
#   (「頭から離れない」記憶)→ incubation_days(1晩以上)おいて夜の内省を深い内省に格上げ
#   (PTG の 侵入的→熟慮的)。深い内省は自己像 self/ties を生成し agent.self_model を更新
#   (呼数・rng 消費は不変=R1。書き込みは belief と同じ k ゲート=作用チャネル1本)。
# implicit_self: 無意識層=行動・経験カウントのベースライン逸脱と感情価から決定論で
#   「最近の自分」1行を日次更新(Bem 自己知覚・working self-concept。揮発層=核自己と分離)。
# self_model_days: 旧固定周期(レガシー・実験対照用)。すべて既定 OFF=従来と完全同一。
reflection:
  self_model_days: 0    # レガシー固定周期(0=無効)。第12バッチ以降の主経路は下の deep
  deep:
    enabled: false      # ★ON 推奨(本番): true(出来事誘発の深い内省)
    threshold: 0.60     # 日内衝撃ゲージの基準閾値(個人差は traits→reflect_trigger_params)
    neg_weight: 2.0     # ネガの非対称重み(Baumeister: 負は徹底処理される)
    pos_weight: 1.0     # ポジもゼロにしない(畏敬・転機も深い内省を誘発しうる)
    incubation_days: 1  # 侵入的→熟慮的の間(日)。個人差で +1 されうる
    cooldown_days: 3    # 深い内省後の不応期(過剰反芻の抑制)
  implicit_self:
    enabled: false      # ★ON 推奨(本番): true(無意識の自己認識更新=裏で回る系)
    ema: 0.7            # 行動ベースラインの平滑率(高いほど「いつもの自分」が変わりにくい)

# ---- 対照系列(D7: null/compute一定は k 掃引時に使用) ----
controls:
  mode: none            # none | null_series | compute_matched
  null_calls: 1         # null_series 時、発火あたりに撃つ内容非結合ダミー LLM の本数

# ---- エージェント(ペルソナ v2: D6)----
agents:
  personas_file: null   # data/personas_80.json 等(scripts/build_personas.py 生成)。null=手続き生成
                        # ★流入通勤者(commuter)入り名簿 = data/personas_100_inflow.json。
                        #   commute=true の個体は朝 arrival_min に範囲外から enter_area →勤務→夕 homing。
                        #   出入口配分・到着二峰・沿線タグは data/shibuya_population.json の inflow 節。
                        #   commuter は名簿の新規生成分のみ有効(既存 personas_40/80 の挙動は不変)。
  icebreak_file: null   # data/icebreak_N.json(scripts/build_icebreak.py 生成)。null=初期関係なし
                        # ★全k条件で同一ファイルを読む=初期関係が条件間で同一(交絡の排除)

# ---- 環境パック(EnvPack)= 場所の知識(基盤モデル抽出 D1-W2 第16/35バッチ)----
# 「機構=基盤・値=環境」の原則: src/society(認知・エンジン・世界・因子)には地名・
# ランドマーク・年中行事・気候・語彙などの **場所の知識を置かない**。それらは全てここ
# (envpack)に集約し、コードは cfg 経由で読む。conf に地名があるのが正しい状態。
# W4 の env/<place>/env.yaml がこのブロックを上書きする(profile と同じ重ね書き機構)。
# 既定値=現在の渋谷リテラルそのまま(=ゴールデン・バイト一致の基準)。
# データ実体(地図/ダイヤ/名簿)は data/ 参照のまま(env.yaml は取得レシピ+attribution を持つ)。
envpack:
  lexicon:
    place_name: 渋谷                     # 街の名前(発火/内省/計画プロンプト冒頭・観光文・persona 文)
    underground_name: 地下通路(渋谷ちかみち)  # 地下(layer<0)ノードのフォールバック地名(world/map.place_label)
    place_hints:                         # 会話からの場所抽出ヒント(schedule。地名固有分のみ。施設語は基盤側)
      - スクランブル交差点
      - スクランブル
      - ハチ公前
      - ハチ公
      - センター街
      - 道玄坂
      - 宮益坂
      - 渋谷駅
      - 渋谷
      - 新宿
      - 原宿
      - 表参道
      - 恵比寿
      - 代官山
  transit:
    station_filters: ["渋谷", "Shibuya"]  # GTFS 実ダイヤ読込時に対象駅停車便を抽出する駅名(world/transit)
  origin:
    landmark: スクランブル交差点          # 群集集約先=地図ローカル原点(0,0)のランドマーク名(annual.gathering_node は座標由来)
  culture:
    events:                              # 年中行事(名前=文化語彙・日付・群集フラグ)。annual_events.enabled で発火
      - {name: 正月,      month: 1,  day: 1,  crowd: false}
      - {name: ハロウィン, month: 10, day: 31, crowd: true}   # 渋谷固有の群集(集会ノードへ寄せる)
      - {name: 年末,      month: 12, day: 31, crowd: false}
  media:                                 # 娯楽メディアの架空番組名(media.prompt_context=true 時のみ注入。実在名は使わない=R17)
    tv:    ["夜のスクランブル", "ハチ公前ニュース9", "渋谷トークナイト", "深夜のセンター街劇場", "みんなの気象台"]
    video: ["路地裏グルメ散歩", "10分でわかる都市伝説", "配信者ミナトの日常", "ネオン街ウォーク", "猫と暮らす部屋"]
    game:  ["スクランブル・ラッシュ", "タワー・オブ・シブヤ", "パズル横丁", "ネオンレーサー2", "ハチ公クエスト"]
  climate:                               # 月別気候の近似(weather.enabled 時のみ。現実の東京の月別気候の近似)
    monthly:                             #   月: [最高気温中心, 最低気温中心, 雨の重み, 雪の重み]
      1:  [10, 2, 0.15, 0.08]
      2:  [11, 2, 0.15, 0.06]
      3:  [15, 6, 0.22, 0.0]
      4:  [20, 10, 0.25, 0.0]
      5:  [24, 14, 0.25, 0.0]
      6:  [26, 18, 0.45, 0.0]
      7:  [30, 23, 0.42, 0.0]
      8:  [32, 25, 0.30, 0.0]
      9:  [27, 20, 0.35, 0.0]
      10: [22, 14, 0.25, 0.0]
      11: [17, 9, 0.20, 0.0]
      12: [12, 4, 0.15, 0.05]
    neutral: [21, 12, 0.22, 0.0]         # calendar OFF(季節なし)時の既定気候(env 非依存フォールバック)
    # ---- 生成型の天候(weather.mode=generated / table)が読む静的ファイル(第80バッチ W2)----
    # gen_params: 実測から較正した確率生成器のパラメータ(scripts/fit_weather_gen.py 生成)。
    # table:      凍結した実測の日別値(scripts/fetch_weather_history.py 生成。出典=気象庁)。
    # どちらも weather.mode=synthetic(既定)では 1 バイトも読まない。
    gen_params: data/snapshot/weather_gen_params.json
    table: data/snapshot/weather_tokyo_aug.json

model:
  backend: mock         # mock | ollama | vllm(本選)
  name: mock-v0
  lang: ja              # ja | en(D3: 日本語仮決定)
  temperature: 0.7
  max_tokens: 320       # 発話・投稿・DMの生成上限
  reflect_max_tokens: 1200  # 内省(思考モード)の生成上限(深い振り返り用)
  plan_max_tokens: 0    # 0=max_tokens と同じ(朝の計画のみ上限を分けたい時に設定)
  reflect_think: true   # 内省を qwen3 の思考モードで回す(thinking/response 分離)
  cache: true           # 応答キャッシュ(D13: 再現性の実体)
  # ---- 第71バッチ 2026-07-31: 実行モードと入出力ジャーナル(dual-mode-observe-verify-plan.md 第71行)----
  cache_mode: free      # free(既定=従来動作そのまま)| replay
                        #   free   : キャッシュミス時は実推論して保存する(FREE ラン=本選の観察ラン)。
                        #   replay : キャッシュミス時は**即例外**。新規推論へは絶対にフォールバックしない
                        #            (silent fallback = 「再現したつもりで再現していない」最悪の失敗モード)。
                        #            FREE ランの llm_cache.jsonl を同じ out_dir に置いて再走すると、
                        #            全 LLM 応答が同一になり L1 がバイト一致する(受入基準 T2)。
                        #            model.cache=false との併用は矛盾なので起動時にエラーにする。
  journal: true         # LLM 入出力ジャーナル(プロンプト全文+応答+params+key を per-run に記録)。
                        #   出力: runs/<name>/llm_journal.jsonl.gz(+ .index.json)。router では子ごとに1本。
                        #   ★**新規別ファイル**なので L1/L2/L3・summary・キャッシュのバイト列には一切触れない
                        #     (ゴールデン tests/data/golden_baseline_l1.json は不変)。書くだけ・シム本体は読まない。
                        #   ★これが無いと「そのエージェントが何を見せられて何を返したか」がラン終了で永久に失われる
                        #     (llm_cache は sha256 キーのみ・L1b は call_id 等のメタのみ=どちらも入力全文を持たない)。
                        #   容量が逼迫しても削るのは snapshot 側であってここではない(dual-mode-requirements §2.3)。
                        #   ★同じ out_dir を作り直したときは**追記**になる(llm_cache.jsonl と同じ
                        #     ディレクトリ単位 append-only の意味論。resume で記録を消さないための必然)。
                        #     「行数 == そのランの llm_calls」が成り立つのは fresh な out_dir のとき。
  journal_flush_records: 128   # この件数ごとに「完結した gzip メンバ」を1個追記する(=常に有効な .gz)。
                        #   大きいほど圧縮率が上がり(共通テンプレートが deflate 32KB 窓に入る)、
                        #   クラッシュ時に失う末尾件数と RAM 使用が増える。checkpoint / flush_every_steps
                        #   のたびに強制 flush されるので、実効の損失窓はそちらの間隔でも頭打ちになる。
  format: json          # 構造化出力の強制(第33バッチ 計画A。docs/research/constrained-decoding.md)
                        #   json(既定)=従来挙動そのまま(ollama format=json / vLLM response_format)。
                        #   none=送らない(プロンプト規約のみ)。schema は将来拡張(未対応)。
                        #   ★think=True の呼(内省)には自動で送らない(GBNF が思考を殺す実測への境界ガード)。
                        #   router の子は spec の format キーで個別指定可。キャッシュキーは json のとき
                        #   従来と同一(過去ランの llm_cache 再生互換)・none のみ別キー。
  # ---- 本選(backend: vllm)用。mock/ollama では未使用=既定挙動は完全不変 ----
  servers: []           # vLLM の base_url リスト。空=vllm 選択時のみエラー。1台マルチGPU/複数ノード両対応。
                        #   単一 (1本):   servers: ["http://localhost:8000"]                     → VllmBackend 直
                        #   1台7GPU:      servers: ["http://localhost:8000", ..., "http://localhost:8006"]  → FleetLLM(艦隊)
                        #   複数ノード:   servers: ["http://node1:8000", "http://node2:8000", ...]          → FleetLLM(艦隊)
  timeout_s: 120        # 1 リクエストのタイムアウト秒(vllm のみ)
  # ---- 1 呼の絶対時限(第86バッチ保守 M-1。全 HTTP backend 共通・mock は対象外)----
  call_deadline_s: 300  # 呼び出し**開始からの**上限秒。0 以下で無効(= 従来どおり)。
                        #   なぜ timeout_s と別に要るか: timeout_s は urlopen のソケット
                        #   タイムアウト = **無通信区間**しか測れない。トークンが細々流れ続ける
                        #   病的生成では一度も無通信 120s に達せず、2026-08-02 夜間ランで
                        #   **1 呼が 1 時間 47 分**張り付いた(10日ランの停止要因)。
                        #   超過は既存のタイムアウト→fallback 経路に合流し、件数を
                        #   summary.json の llm_deadline_exceeded(0 件ならキー自体を出さない)
                        #   と scripts/watchdog_llm.py が拾う。実 LLM 実測 3.05s/呼 に対し
                        #   既定 300s は 100 倍のマージン=正常呼には一切影響しない。
  # tiers:              # 任意: purpose(rng_key 先頭: reflect/deliberate/... )別のサーバ振り分け。既定 null=全 URL を default プールへ。
  #   reflect: ["http://localhost:8000"]                       # 内省=重い/大モデル1本に寄せる
  #   default: ["http://localhost:8001", "http://localhost:8002"]  # 会話・投稿=小モデル群
  #   ※ tiers を書くと servers が1本でも FleetLLM が使われる(seam を通す)。
  # ---- 合成ルータ(backend: router のときだけ読む。第23バッチ M2)----
  # 異なるモデル・異なる提供元(ローカル/API)を purpose 別に1ランへ混載する。
  # 子は各自 CachedLLM で包まれ、キャッシュは子の name 別ファイル(llm_cache.<name>.jsonl)=D13維持。
  # APIキーは環境変数のみ(api_key_env で変数名を指定)。config にキーの値を書かないこと。
  # agent_tier(エージェント階層別)は未実装=ユーザー討議後(docs/research/agent-lod-deepdive.md)。
  # router:
  #   default: {backend: ollama, name: "qwen3:4b"}                       # 必須。deliberate 等すべての既定
  #   purpose:
  #     reflect: {backend: ollama, name: "qwen3:14b"}                    # 例: 内省だけ大モデル
  #     # reflect: {backend: anthropic, name: "claude-haiku-4-5"}        # 例: 内省だけ API
  #     # plan: {backend: openai_compat, base_url: "http://localhost:11434/v1", name: "qwen3:8b"}

  # ---- 心モデル固定 + 三層知能配置(第88バッチ 2026-08-03。**既定 OFF**=現行と完全一致)----
  # 正典: docs/plans/source/design-discussion-20260802.md §5。実装 src/society/mind.py。
  #   「心(会話・思考・価値判断)は 1 エージェント 1 モデルを誕生時に固定する」
  #     理由 ①人格の一貫性 ②モデル差がそのまま人口の多様性(§1 の分散崩壊への最も安い対抗策)
  #          ③面白いエージェントが見つかったときにモデル別分析ができる
  #   「機械的判断(経路選択・定型購買)はモデル不問」= 本リポではそもそも LLM を呼んでいない
  #     ルール層なので、ここは実装ではなく**確認**(tests/test_mind.py が固定している)。
  #   「モデルと人格の交絡が生じるため、agent_id と model_id の対応は必ずログに残す」
  #     → manifest.mind / summary.mind / agents.json(mind_model, mind_tier)/ L1 mind_assign。
  # 三層(§5「知能は均質に配置しない」。人間の日常行動の 4 割強は習慣という実証への整合):
  #   基底層   … 全員が習慣・スケジュールで動く(ほぼ無料)= **既存のルール層そのもの**。
  #              本ブロックは基底層を 1 バイトも変えない(宣言だけ manifest に残す)。
  #   思考層   … 驚き発火時のみ LLM。混成 fleet = 下の pool を重み付きで誕生時固定。
  #   高解像度層 … 1〜5%。大型モデル + 夜内省の対象 + 思考頻度の上限緩和。
  # 決定論: 割当は専用 stream("mind_model" / "mind_tier")だけを引く=既存 stream の draw 順に
  #   無風。(master_seed, agent_id) の純関数なので resume でも pool 再入場でも同一モデルに戻る。
  # ★実モデルのショートリスト(3B〜14B×5〜6本)は DP-U2 = ユーザー判断。ここは器だけ。
  mind:
    enabled: false      # true にすると pool が必須。false では解決層を組まない=現行とバイト一致
    # purposes:         # 「心」と見なす呼び種(rng_key 先頭)。既定 = deliberate / plan / reflect / recall。
    #                   #   ここに無い呼び(現状 "null" = D7 対照系列)と agent_id を持たない呼びは
    #                   #   共有の既定バックエンド(= model.backend で組んだもの)が受ける。
    #   - deliberate
    #   - plan
    #   - reflect
    #   - recall
    pool: []            # 心のモデル群。各要素 = router の子 spec(backend/name/host/base_url/…)+ weight。
                        #   name が model_id(割当・ログ・summary の全てで使う識別子。一意必須)。
                        #   例(mock 3 サブモデルでの検証。応答本文は同一でキャッシュだけ分かれる):
                        #     - {backend: mock, name: "mock:a", weight: 1}
                        #     - {backend: mock, name: "mock:b", weight: 2}
                        #   例(本選):
                        #     - {backend: vllm, name: "qwen3-8b",  base_url: "http://localhost:8000", weight: 3}
                        #     - {backend: vllm, name: "llm-jp-3-13b", base_url: "http://localhost:8001", weight: 1}
    tiers:
      high:
        frac: 0.0       # 高解像度層の割合(§5 は 1〜5% = 0.01〜0.05)。0=層なし=思考層のみ
        name: ""        # 高解像度層の**大型モデル**(pool とは別の model_id)。空なら pool の割当のまま
        # spec: {}      # 大型モデルの子 spec。省略時は pool 先頭と同じ backend 種別で名前だけ差し替える
        reflect: true   # 夜の内省(§8 突入条件 5)の対象を高解像度層にする=第87 reflect_frac から権威を移す
        cap_mult: 1.0   # 思考頻度の上限緩和。engaged の turn_cap / replan_cap にかける倍率(1.0=無風)
        select: uniform # uniform(既定)= traits を 1 つも読まない一様抽選。
                        #   ★これが既定である理由: 「あらかじめ賢い個体を選んでおく」と
                        #     『誰が世界を変えるか』(k*)という問い自体が自壊する(サーベイ S-08)。
                        #   traits = 指定 trait の上位 frac。**アブレーション専用の意図的な交絡**で、
                        #     k* の主張には使えない(ON にすると manifest に警告が残る)。
        select_trait: ""  # select: traits のときに読む agent.traits のキー

world:
  map: data/shibuya_osm.json    # ★OSM 実道路網(渋谷駅中心 約1.0×0.7km)。旧: data/shibuya_core.json
  # ---- 地図の版(既定はここ=コア。本番/日次は conf/production.yaml・daily.yaml が wide を指す)----
  #   data/shibuya_osm_wide_v7.json … 本番の現行既定(2.0×2.0km・attic 2025-04-01)。**据え置き**。
  #   data/shibuya_osm_wide_v8.json … v7 と**同一スナップショット(attic 2025-04-01)を再取得**して
  #     組み直した版(第101 Wave4 III-2)。道路グラフ・建物・線路・ゲートウェイは v7 と
  #     **完全同値(バイト一致)**で、差分は POI だけ(1,975 → 2,337 = +362):
  #       (a) v7 が取りこぼしていた業態を追加(神社仏閣 29・ラブホ 63・病院 7・銭湯/サウナ 4・
  #           ゲーセン 4・パチンコ 8 …)= v7 の POI の cat は 1 件も変わらない
  #           (build_map.poi_category は v7 判定を先に通し、None のときだけ救済する構造)
  #       (b) 重複排除キーの是正((name,cat) → (name,cat,node))= チェーン店の全店が載る。
  #           v7 は同名を 1 件へ潰しており **コンビニが 93 → 9 件**(9 割消失)だった
  #       (c) POI に subcat(第2階層 11 語)を付与 → world.night_economy.hours の
  #           convenience/net_cafe/sauna/karaoke/club が**表を 1 バイトも書き換えずに**当たる
  #           (v7 では 1 件も当たらない no-op だった。tests/test_map_v8.py が固定)
  #       ※建物の差分は POI 由来の用途格上げ 2 棟の kind のみ(generic→office/public。形は同一)
  #     ★opt-in: 既定は v7 のまま(ゴールデン L1 バイト一致を守る)。使うときは
  #       world.map=data/shibuya_osm_wide_v8.json を上書きする。組織台帳(data/organizations_*)
  #       は v7 の POI id を参照しているので、v8 本採用時は build_orgs.py を --map v8 で再生成する
  #       のが清潔(未再生成でも node/建物 id は同値なので解決は node 経由へ後退するだけ)。
  #     生成: python scripts/build_map.py --bbox 35.6505 139.6905 35.6685 139.7115 \
  #             --osm-date 2025-04-01 --out data/shibuya_osm_wide_v8_prepatch.json
  #           python scripts/patch_map.py --base data/shibuya_osm_wide_v8_prepatch.json \
  #             --patch data/poi_patch_shibuya.json --out data/shibuya_osm_wide_v8.json
  #     出典: © OpenStreetMap contributors(ODbL 1.0)。data/ は公開ミラー除外。
  scenario: baseline            # baseline(既定=no-op)| shock_closure | shock_event(#8 摂動カタログ)
  # scenario_params: 選んだ scenario の引数(baseline では未使用)。座標は地図ローカル m(原点=スクランブル交差点)。
  #   shock_closure(区間封鎖): at_step から duration_steps の間、center 半径 radius_m 内の道路を封鎖し
  #                            新規経路が迂回する(移動中は現エッジを走り切る)。解除で復帰。
  #     例) scenario_params: { at_step: 36, duration_steps: 18, center: [0, 0], radius_m: 150 }
  #   shock_event(定型ニュース注入): at_step に title/text/word を世界イベント列へ合流(公式発表と同経路)。
  #     例) scenario_params: { at_step: 24, title: "駅前で大規模イベント", text: "混雑注意", word: "封鎖祭り" }
  scenario_params: {}           # 既定は空(baseline では読まれない)
  perception_radius_m: 40.0     # この距離内で会話が聞こえる(建物内=同じ階のみ)
  edge_capacity: 20             # 混雑=この人数を超えると減速(grievance 源)
  elevation:                    # 3D Phase 0: 標高 z 列(3d-movement.md §7)。ON で move_segment/arrive payload に z[m](DEM 双一次・export_3d と同値)を追加
    enabled: false              # 既定 OFF=イベント不変(バイト一致)。表示・観測専用=移動判定・認知・LLM 呼数は不変
    dir: data/plateau           # terrain.npz + terrain.json のフォルダ(scripts/plateau_extract.py の出力)

  # ---- 建物の実高さ A1 第67バッチ(2026-07-29。既定 OFF=現行挙動と完全同一)----
  # ON 時: CityMap が高さ表(scripts/build_heights.py の生成物=PLATEAU 実測 3,531 棟)を読み、
  #   各建物へ height_m [m] と height_src("plateau" | "levels")を付与する。表に無い建物は
  #   levels x fallback_m_per_level の推定値を入れ、出自を height_src で必ず区別する
  #   (階数が無い建物には属性を付けない=欠測を捏造しない)。
  # ★本バッチでは**属性の付与のみ**。知覚・移動・プロンプト・LLM 呼数のいずれにも影響しない
  #   (消費者は後続バッチ C0 の可視行列 / B-L1 の 2.5D 遮蔽)。全決定論・乱数ゼロ・LLM 呼ゼロ。
  # OFF が保つ不変条件: 高さ表を一切読まない=建物 dict にキーが増えない=新イベント 0 件・
  #   新状態なし・L1 バイト一致(tests/data/golden_baseline_l1.json)・draw 数同一。
  heights:
    enabled: false              # ★可視性/遮蔽の実験で ON。false=完全 no-op(バイト一致)
    path: data/building_heights_shibuya.json   # OSM 建物 id → 実高さ [m](210KB・data/plateau は gitignore だがこの派生表は追跡する)
    fallback_m_per_level: 3.5   # 未照合の建物の推定高さ = levels x この値(export_3d の FLOOR_HEIGHT と同値)

  # ---- 建物実階数への floor クランプ 3D-U0(2026-08-07。既定 OFF=現行挙動と完全同一)----
  # 問題: POI データ(data/shibuya_osm.json)には建物の階数 levels を超える floor が 20 件、
  #   地下(負の floor)が 31 件ある。職場・バイト先の階はこの POI 値から来るため、agent.floor に
  #   建物階数を超える値がそのまま入り L1 の enter_building payload に残る(3D ビューワーでは
  #   2 階建てに floor=42 → +138m 浮遊。実測: 描画フレームの 5.4% が屋根超えだった)。
  # ON 時: 屋内位置の階を [1, max(1, min(levels, 99))] へ丸める。規則は**表示側と完全に同一**
  #   (scripts/export_3d.py::encode_indoor_w。0/負値=地下 POI 由来 → 1F、levels 超え → levels、
  #    上限 99 は w=1000+bIdx*100+floor の 2 桁枠)。地下階は sim も w も表現できないので導入しない。
  # クランプするのは**位置 agent.floor だけ**(work_floor/home_floor/part_time floor は名簿・台帳
  #   の値であって位置ではないので触らない)。決定論=乱数を 1 つも引かない純関数。
  # ★ON は L1 が変わる(floor 値・同一階の co-location 経由でプロンプト loc とその後の展開も)。
  #   観察ランで ON にする想定。OFF が保つ不変条件: 代入値をそのまま返す=L1 バイト一致。
  floor_clamp:
    enabled: false              # ★観察ランで ON。false=完全 no-op(バイト一致)

  # ---- 環境改変条件 world.mod A1 第67バッチ(2026-07-29。既定 OFF=現行挙動と完全同一)----
  # 「現実の渋谷幾何が原点、改変条件はその周りの反実仮想」を条件パラメータ化する層
  # (実装 src/society/world/worldmod.py。scenario.shock_closure の一般化=時間軸を持たず
  #  ワールド構築時に一度だけ・決定論・乱数ゼロで適用する)。
  # profile = conf/worldmod/<name>.yaml の名前(裸の名前 or パス)。ラン config に条件名が残る。
  # 改変4種: edges_closed(エッジ無効化)/ edge_speed_scale(速度係数=歩道幅の代理。走行コスト長
  #   へ写して経路選択と移動所要 step の双方に効く)/ open_hours(営業時間の cat 単位上書き)/
  #   gate_capacity(駅ゲート容量の係数。**第84バッチの env.feedback.gate が消費する**)。
  # ★gate_capacity: 第67 では予約(未消費)だったが、環境フィードバック 規則2(改札スループット
  #   飽和 → 入場規制)が改札の処理能力に掛ける係数として読む=「もし改札が半分の広さだったら」。
  #   env.feedback が OFF のランでは第67 と同じ未消費(summary の consumed が false のまま)。
  # ★未消費の予約フィールド: open_hours.pois(POI 単位)。スキーマ受理・検証・summary への
  #   記録(reserved_not_consumed)までを行い、世界には効かせない=実効は将来バッチ。
  # ★scenario(shock_closure)との併用は非対応: 同じ edge["closed"] を使うため shock の解除が
  #   静的封鎖まで開けてしまう。world.scenario は baseline のまま使うこと。
  # エッジ集合の指定は「明示リスト edges」と「矩形 bbox(端点いずれかが内側)」の 2 通り。
  #   地名・カテゴリ名のリテラルはプロファイル(conf 側)にのみ書く(src は no-fingerprint)。
  # R1: k.writeback / beliefs を読まない。LLM 呼数への影響は co-location 変化の物理経由のみ。
  # OFF が保つ不変条件: プロファイルを開きもしない=地図・エッジ属性・commerce 設定とも不変=
  #   新イベント 0 件・新状態なし・L1 バイト一致・draw 数同一。
  mod:
    enabled: false              # ★反実仮想の条件ランで ON。false=完全 no-op(バイト一致)
    profile: null               # 例) example_counterfactual(= conf/worldmod/example_counterfactual.yaml)

  modes:                        # 移動手段(1 step = 10分 で進める距離 m)
    speeds: { walk: 800.0, bicycle: 2000.0, car: 3500.0 }
  exit_prob: 0.02               # 暇なとき範囲外へ出かける確率/step
  building_enter_prob: 0.35     # 入口に居るとき建物に入る確率
  outside_steps: [18, 144]      # 範囲外滞在の長さ(3時間〜1日)。外は計算しない
  meal_prob: 0.35               # 食事時間帯に飲食店(実在 POI)へ行く確率/step
  traffic:                      # 背景交通(エージェント以外の通過車両)
    enabled: true
    mode: ambient               # ambient(既定=周期的な背景フロー。現行挙動と完全同一)
                                # od(本番推奨): 車を個体化。各車が出発地=車道ゲートウェイ、
                                #   目的地=別ゲートウェイ(通過交通)or 域内 POI 近傍を決め、
                                #   一方通行を尊重した最短路を辿る。信号=ノード別の期待遅延、
                                #   車線=エッジ容量(超過で渋滞減速)。要 features_file。
                                #   重い場合は本番(vllm)だけ od、開発は ambient のままで可。
    cars_per_day: 30000         # ambient: 台/日。センサス区間実値が未確認のため仮置き(幹線+周辺の合算オーダー)
    max_log: 120                # 1step にログへ残す車両軌跡の上限(可視化用。両モード共通)
    # ---- od モード専用(mode: ambient のときは一切読まれない=既定挙動は完全同一)----
    features_file: data/traffic_features_shibuya.json  # scripts/build_traffic.py 生成(信号/車線/oneway/ゲートウェイ)
    od_cars_per_day: 8000       # od: 個体化して追跡する車の 1日総発生台数(ambient の集計フローより軽め)
    through_ratio: 0.7          # od: 発生車のうち通過交通(別ゲートウェイ行き)の比率。残りは域内 POI 近傍へ
    capacity_per_lane: 8        # od: 1車線あたり同時走行許容台数。超過エッジは減速(渋滞)
    default_lanes: 2            # od: OSM に車線タグが無いエッジの既定車線数
    signal_cycle_s: 90          # od: 信号1周期の秒数。★1step=600s>周期なので緑赤の瞬時状態ではなく
                                #     一様到着の期待待ち(r²·C/2)を距離換算で差し引く近似を使う
    # ---- 歩車信号の同一化(既定 false = 現行挙動と完全同一)----
    # ★true は **od の走行を変える挙動変更トグル**である(観測の追加ではない)。
    # 現状(false): 同じ交差点なのに車と歩行者が別々の数字で動いている。
    #   車     … 赤率 = 0.35 + 0.20 × sha256(node)・周期 = 上の signal_cycle_s(全交差点共通)
    #   歩行者 … data/crossings_shibuya.json の実測(渋谷: 周期 140s・青 37s・青点滅 10s)
    #   = 同一交差点の 2 つの現示が**統計的に独立**という、地図にも実測にも無い状態。
    # true にすると、交差点表に載っているノード(車道グラフの OSM node id と交差点 id の
    # 完全一致で結合。実測 69 本中 23 本 ≈ 33%)は
    #     赤率 r = 1 − (green_s + flash_s) / cycle_s   … 140/37/10 なら 1 − 47/140 = 0.664
    #     周期 C = その交差点自身の cycle_s(140s)     … 遅延式 r²·C/2 もこの C を使う
    # になる。仮定は「車の青窓 ≈ 歩行者の横断可能窓」の 1 つだけ(スクランブルでは
    # 140−47=93s を 2 方向が分け合い ≈46.5s ≈ 47s でほぼ実態と一致)。
    # ★主張はここまで: **同じ交差点の車と歩行者が同じ 1 台の装置になる**、それだけである。
    #   方向別スプリット・右折分離・オフセット協調はデータが無いので主張しない。
    #   結合できないノード(表に無い/信号無しの横断歩道)は従来の hash 値のまま(捏造しない)。
    signal_from_crossings: false
    crossings_file: data/crossings_shibuya.json  # 上が true のときだけ読む(歩行者側と同一ファイル)
    free_speed_min: 3000        # od: 自由流速度の下限(m/10分。約18km/h。信号/渋滞で実効はこれ以下)
    free_speed_max: 5000        # od: 自由流速度の上限(m/10分。約30km/h)
    max_cars_log: 200           # od: traffic_flow payload の cars[] 上限(可視化補助)

  events_file: null             # シナリオイベント(例: data/events_demo.json)。ビューアの「シナリオ」タブで作成可

  # ---- 擬似視覚 C(壁による遮蔽。既定 OFF=本番トグル。ユーザー要望 2026-07-06)----
  # ON 時: 半径・同一階の既存フィルタ通過後に視線(LOS)判定を追加。建物内は決定論生成の
  # 壁セグメント(開口部あり)で隔たれたペアが互いに不可聴=交流不可になる。
  # outdoor=true で屋外も建物フットプリント遮蔽(重いので既定 false)。設計: docs/research/vision-los.md
  vision:
    enabled: false
    outdoor: false

  # ---- 構造化シーン記述 v0(エージェント視覚 B。既定 OFF=プロンプト/イベント不変=バイト一致)----
  # ON 時: 発火プロンプトに「見え」の 2〜4 行を注入(方向つき視界=正面/右手/左手の近傍施設・
  #   注視対象リスト=近傍の人+地点を距離で決定論選抜・垂直関係=レイヤ+標高)。追加 LLM 呼ゼロ・
  #   乱数ゼロの純関数集計(crowd_visual と同型の seam)。地名は実行時に世界データから取る。
  #   件数は入力解像度 LOD(lod.input_res.scene_n)対象。設計: docs/research/agent-vision.md §4 v0。
  #   注視の人ソースは同席者(壁 LOS 済み)。垂直は elevation 有効時のみ標高を使う(None ガード)。
  scene_desc:
    enabled: false
    radius_m: 60.0        # 視界・注視に含める近傍地点までの距離(crowd/ads と同レンジ)
    scene_n: 3            # 記述の既定件数(input_res.scene_n 未設定時のフォールバック)
    fov_deg: 100.0        # 「正面」と判定する視野角(全幅)
    vertical: true        # 垂直関係の 1 行(レイヤ/標高)を出すか

  # ---- 日付・カレンダー(第7バッチ 2026-07-07。既定 OFF=現行挙動と完全同一)----
  # ON 時: 全発火/計画/内省プロンプトに「今日は◯年◯月◯日(曜)です。」を1行注入(全員共通・k非依存)。
  #   weekday_work=true にすると本業勤務・登校を平日(非休日)だけに絞る(バイトの曜日挙動は不変)。
  #   日付は sim_min からの純関数導出=乱数不使用。holidays は "YYYY-MM-DD" 文字列リスト(土日は自動休日)。
  calendar:
    enabled: false              # ★ON 推奨(本番): true(暦をエージェント行動の要因にする)
    start_date: "2026-04-01"    # シミュ初日の実日付(day_index=0 の日)
    weekday_work: false         # ★ON 推奨: true(平日のみ勤務・登校。土日祝は休み)
    holidays: []                # 追加の休日(例: ["2026-04-29", "2026-05-05"])。土日は自動で休日

  # ---- 痕跡 = 場所のイベント履歴 IF-D(第96バッチ 2026-08-05。**既定 OFF=現行と完全同一**)----
  # 監査 §3 が挙げた穴: 「場所のイベント履歴 = L1 に座標付きで全部残るが**シム内から読む
  # 経路がゼロ**」。Heylighen の用語ではこれは「medium ではない」状態そのもの(変えられるが
  # 知覚できない = 海に石を投げる状態)で、街で何が起きても後から来た者は何も知り得なかった。
  # 本ブロックは node を medium にする: 行為が強度を残し(集約)、時間が経てば薄れ(蒸発)、
  # その場に居合わせなかった者が定型 1 行として知覚する。
  #
  # ★if-lane-research §1 の位置づけ: 既存の貼り紙(flyer)は node × TTL × 容量 × narrowcast の
  #   **完全なスティグマジー実装**である。本ブロックはその構造を「意図的な掲示」から
  #   「行為の副産物」へ一般化したもので、新機構の発明ではない。
  # ★**演算は集約(aggregation)と蒸発(evaporation)の 2 つだけ**。Parunak の 3 演算のうち
  #   propagation(拡散)は **factor = 0** として入れない(文献的に正当な設定)。理由は
  #   (a) node グラフ上の拡散は近傍列挙順に依存し golden のバイト一致を壊しやすい
  #   (b) 25 万体で O(node × kind) の毎 step 掃引が乗る
  #   (c) 「隣の駅に噂が滲む」は情報オブジェクト(information.rumors)の担当。
  #   実装 src/society/traces.py には拡散に相当するコードが 1 行も存在しない(テストが AST で固定)。
  # ★減衰は欠陥ではなく**機能**(Heylighen):「枯れた餌場を指すフェロモン道は『無関係になった』
  #   のではなく、無駄な旅を誘発する点で**誤誘導**になった」。減衰速度は「情報が陳腐化する速度」に
  #   合わせるべきで、**単一の TTL 既定値を全種に使うのは文献に反する** → TTL 3 階層。
  #
  # R1: LLM 追加呼ゼロ・乱数ゼロ・プロンプトの節ゼロ増(増えるのは既存の 1 行欄の族に並ぶ 1 行)。
  #   OFF が保つ不変条件: trace_mark 0 件・sim に state が生えない・agent に属性が生えない・
  #   summary に traces キーなし・プロンプト 1 バイト不変・L1 バイト一致(golden_baseline_l1.json)。
  traces:
    enabled: false              # ★false=完全 no-op(バイト一致)。true で集約・蒸発・1行注入が動く
    # 痕跡にする出来事の種類(**実装が定型語を持つのは traces.TRACE_SPECS の 5 種だけ**)。
    #   enforcement ← L1 enforcement(摘発)     / gathering ← event_host(イベント開催)
    #   opening     ← venture_open(出店)       / closing   ← venture_close(閉店)
    #   trouble     ← crime・nuisance(窃盗・客引き/ナンパ/喧嘩/騒ぎ)
    # ★chance_event は源にしない: windfall / loss / encounter の 3 種はいずれも**当人にしか
    #   起きない私的な出来事**で payload に場所も無く、通りすがりの人が他人の落とし物を
    #   「場所の性格」として読むことになるため(街の事件系は crime / nuisance が正しい対応物)。
    # リストは**置き換え**(既定に重ねない)= config を読めばそのランの痕跡が一意に判る。
    kinds: ["enforcement", "gathering", "opening", "closing", "trouble"]
    # 種 → TTL 階層の割当(空 = 実装既定)。Parunak の flavor = 意味の違う場を混ぜないので、
    # 種ごとに独立の強度を持つ(「賑わい」と「揉め事」を 1 つのスカラーに足し込まない)。
    tier_of:
      enforcement: daily        # 摘発 = その日のうちは意味を持つ
      gathering: daily          # 集まり = 既存 flyer と同水準(1 日)
      opening: persistent       # 出店 = その場所に定着した性格(商いがある街区)
      closing: persistent       # 閉店 = 同上(商いが去った街区)
      trouble: transient        # 揉め事・事故 = すぐ陳腐化する(数時間)
    # TTL 3 階層の半減期(単位は step)。0 = **減衰しない**(persistent の意味)。
    half_life_steps:
      transient: 18             # ~3 時間: 事故・喧嘩級(その場の空気)
      daily: 144               # 1 日: 出来事・摘発級(既存 tools.flyer_ttl_steps と同水準)
      persistent: 0             # 減衰なし: 場所に定着した性格。★Ledger-State Stigmergy が
                                #   警告した「蒸発しない媒体」を**明示的に選ぶ**枠であって、
                                #   失効ロジックを忘れた状態ではない(下の drop_threshold は効く)
    deposit: 1.0                # 出来事 1 件が置く強度
    max_strength: 3.0           # 同種の上限(クリップ)= 同じことが何度起きても飽和する
    line_threshold: 1.0         # この強度以上の痕跡だけが 1 行になる(最強 1 件のみ注入)
    drop_threshold: 0.05        # これ未満に薄れた痕跡はレコードごと消える(明示的失効ロジック)
    max_per_step: 32            # 1 step に集約する件数の上限(暴走時の L1 膨張を防ぐ安全弁)

  # ---- 夜間経済 = 夜(00:00-05:00)を表現可能にする層(第101 III-1。**既定 OFF=現行と完全同一**)----
  # 監査の指摘: 現行の街は**構造的に夜が無い**。(1) work._window が「閉<=開」を open+8h へ丸めるので
  # 22:00→06:00 の夜勤が原理的に作れない(台帳のシフトは 4 種・最遅 close=23:00)(2) commerce の
  # 営業時間表がカテゴリ 3 種だけで、コンビニは汎用 shop として 21:00-10:00 に強制閉店(3) 夜勤者の
  # 生成器が無い(4) 終電を逃した個体は縁まで歩いて**世界から出る**。
  # 実装 src/society/night.py。生成器側(夜勤者)は scripts/build_orgs.py --night-shifts が担う。
  # R1: LLM 追加呼ゼロ・**乱数ゼロ**(避難先の選定は (距離, node id, poi id) の純関数)。
  # OFF が保つ不変条件: night_refuge 0 件・agent に属性が生えない・営業時間表が 1 エントリも
  #   変わらない・勤務窓の丸めが従来コードのまま・L1 バイト一致(golden_baseline_l1.json)。
  night_economy:
    enabled: false              # ★false=完全 no-op(バイト一致)。true で下の 3 点が同時に効く
    midnight_shift: true        # 日跨ぎシフト(close<open を「翌朝まで」と読む)。親 enabled 配下。
                                #   false にすると営業時間と避難先だけを有効にできる
    # 営業時間の上書き(cat **または** subcat → [開店時, 閉店時]。24h 表記・開==閉 = 24 時間営業)。
    # ★正直な限界: 現行地図 v7(data/shibuya_osm_wide_v7.json)の POI は cat しか持たない
    #   (build_map.poi_category が OSM の shop=convenience を汎用 shop へ潰し、生タグを保存して
    #   いない)。よって **subcat 系のエントリ(convenience/net_cafe/sauna/karaoke/club)は v7 では
    #   1 件も当たらない = 完全な no-op**。地図 v8 が POI に subcat を通した時点で、この表を
    #   1 バイトも書き換えずにそのまま効きはじめる(前方互換)。今すぐ効くのは cat に当たる
    #   nightlife だけ。POI 名の一般名詞マッチは誤判定が多すぎるので既定では使わない(下記)。
    hours:
      convenience: [0, 0]       # コンビニ = 24 時間営業  ※subcat は v8 地図で供給(93 店)・v7 は no-op
      net_cafe: [0, 0]          # ネットカフェ = 24 時間(終電後の受け皿) ※v8 で供給(パッチ 1 店)
      sauna: [0, 0]             # サウナ・カプセル = 24 時間 ※v8 で供給(4 店)
      karaoke: [11, 5]          # カラオケ 11:00〜翌 05:00 ※v8 で供給(17 店)
      club: [22, 5]             # クラブ 22:00〜翌 05:00 ※v8 で供給(17 店)
      nightlife: [18, 5]        # 夜遊び(v7 でも当たる。commerce の既定と同値=明示のみ)
    # サブカテゴリ判定の名称キーワード(subcat → キーワード列)。**既定は空 = 1 件も分類しない**。
    # ★ETHICS §2: 実在企業名(ブランド名)はソース/config に書かない。v7 の POI 名で一般名詞
    #   (「ストア」「マート」等)を拾うと Apple Store / ABC マート等をコンビニと誤判定する
    #   (実測: 一般名詞ヒット 21 件のうちコンビニ相当は 4 件)。運用者が明示したときだけ効く。
    subcat_keywords: {}
    refuge:                     # 終電後の避難先(ネカフェ/サウナ/カラオケ)。親 enabled 配下
      enabled: true
      cats: [nightlife]         # 避難先とみなす POI カテゴリ(v7 で実在するもの)
      subcats: [net_cafe, sauna, karaoke]   # 同 サブカテゴリ(v8 / subcat_keywords で活きる)
      max_dist_m: 800.0         # 駅からこの距離までの避難先だけを使う(終電後の徒歩圏)
      max_stay_min: 480         # 始発が見つからない(運休等)ときの滞在上限 [分]。街に固まらない安全弁

  # ---- 装置(device)層 = 目標を持たないアクター(actor model P2。**既定 OFF=現行と完全同一**)----
  # 設計文書「世界に作用するものは全てアクターにする」の装置(device)の層。装置の契約は
  #   状態を変えてよいのは (a) 宣言済みのスケジュール/物理[DEVS δ_int] か
  #                       (b) エージェントの行為への応答[DEVS δ_ext] のときだけで、
  #   **自発的に(spontaneously)状態を変えてはならない**。
  # 実装 src/society/devices.py。契約は型で与えるだけでなく**機械が検査できる**形にしてある
  #   (δ の窓の外で状態属性へ代入が起きたら監査証跡に illegal として残る)。
  # ★装置は決定論的な応答関数 = **乱数を 1 本も引かない**(module に乱数の識別子が存在しない
  #   ことを tests/test_devices.py が AST で固定)。LLM 追加呼ゼロ・プロンプト 1 バイト不変。
  # OFF が保つ不変条件: registry を組まない=sim に devices が生えない・agent に属性が生えない・
  #   gate_pass / device_load / signal_summary 0 件・L1 バイト一致(golden_baseline_l1.json)。
  devices:
    enabled: false              # ★装置層の親トグル。false=完全 no-op(バイト一致)
    # ---- 改札(faregate)= 通路の配列 + FIFO 待ち行列 ----
    # env.feedback 規則2(改札スループット飽和 → 入場規制)の**細粒度な置き換え**。
    # 規則2 は「1 step の駅流入件数 > 容量 なら数 step 入場規制」という全体一括の近似で、
    # 個体ごとの待ち時間を持たない。本装置が ON のとき envfeedback は規則2 を**評価しない**
    # (同じ物理の二重計上を防ぐ。規則1=停車時間→遅延 と 規則3=POI 占有 はそのまま生きる)。
    # ★較正値は**実測系の公表値**: 日本の駅の自動改札は持続 60 人/分/通路(IC タッチ 0.2 秒)。
    #   エスカレーターの実測は約 80 人/分で、理論値・公称値は実測より 35〜60% 高く出る
    #   → **公称値(nameplate)は絶対に使わない**という原則をこのブロックの既定に適用した。
    faregate:
      enabled: false            # ★改札の待ち行列を効かせる実験で ON(親 enabled も要 true)
      n_gates: 8                # 通路(改札機)の本数。地図データに本数が無いための既定値
      service_rate_per_min: 60  # 1 通路あたりの持続処理人数[人/分]=1.0 秒/人(実測系公表値)
      max_hold_steps: 3         # 1 回の退出で待たせる上限[step](必ず通す安全弁=非発散)
    # ---- 歩行者信号(SignalGate)の観測 ----
    # 信号は「位相 = 絶対時刻の純関数」= 記憶を持たない固定スケジュール装置で、既に
    # world/sfm_core.py に実装がある。装置層が足すのは **同一性(交差点表由来の device_id)**
    # と、この観測 1 本だけ(時刻計算は 1 バイトも変えない)。
    # ★出すのは **1 交差点 1 日に最大 1 件**の signal_summary。信号サイクル(140 秒)は
    #   1 step(600 秒)より短いので、サイクルごとのイベントを出すと L1 が信号で溢れる。
    signal_events: false        # ★true で signal_summary(周期パラメータ+青割合)を日次 1 件
    # ---- 運行事業者(TransitOperator)= 運休を「決める」装置(IF-F W2)----
    # 現状(false): src/society/disaster.py が「台風の日は電車が止まる」を**世界の物理**として
    #   裸で書いている(sim.transit.suspended への直接代入)。しかし現実には
    #     自然事象 = 台風そのもの / 装置の判断 = それを見た事業者が「今日は止める」と決めること
    #   の 2 段で、後者は DEVS の δ_ext である。混ぜたままだと因果台帳の上で
    #   「運休は自然が起こした」ことになり、**止めると決めた主体が世界から消える**。
    # true にすると同じ計算が運行事業者装置の δ_ext を通る(**素通しの shim** = 運休する日は
    #   ビット同値。テストが同 seed で ON/OFF の運休日一致を機械固定している)。得られるのは
    #   DEVS 監査(自発的遷移ゼロの証明)と装置名簿への登録であって、挙動の変化ではない。
    # ★L1 の device_id(operator:transit / operator:infra)は **observer.causality** 側の
    #   仕事で、このトグルとは独立に効く(同一性の観測 ≠ 装置の実体)。
    transit_operator: false

  # ---- 駅到着のパルス量子化(actor model Wave 3。既定 OFF=現行挙動と完全同一)----
  # 境界の研究(Hänseler & Bierlaire の駅需要モデル / SUMO の運用)の要点は、駅からの
  # 流入は**平滑ではなく列車ごとの塊(platoon)**だということ。平滑な流入では改札の
  # 待ち行列もホームの滞留も原理的に立たず、改札装置(world.devices.faregate)や駅員層が
  # 観測すべき現象そのものが消える。
  # ON 時: 駅ゲートウェイの流入通勤者の到着時刻を**時刻表の到着へスナップ**する
  #   (規則 = 引かれた時刻以上で最も早い到着 / 始発前は始発へ / 終電後は最終到着へ。
  #    同着は路線名の昇順。乱数ゼロの純関数=個体順に依存しない)。
  #   二峰分布の draw 自体は 1 ビットも変えない(量子化だけが新しい)。
  #   縁ゲートウェイ(commute_gateway=="edge")は徒歩流入なので対象外。
  # ★分解能の限界(正直に): ダイヤは路線ごとの (始発, 終電, 運転間隔) の 3 値しか無く、
  #   1 本ごとの実発車時刻は保持していない(GTFS 経路も中央値 headway へ畳んでいる)。
  #   9 路線・間隔 3〜6 分の既定ダイヤでは到着の合併集合がほぼ毎分に立つため、
  #   量子化しても塊はできにくい(実測は本バッチの報告を参照)。
  # 既定 false = 到着表を組まず 1 体も触らない(新イベント 0 件・L1 バイト一致)。
  inflow_pulse:
    enabled: false              # ★駅流入を列車ごとの塊にする実験で true

  # ---- 設備 = **摩耗する装置**(昇降設備の DEVS。H5。**既定 OFF=現行と完全同一**)----
  # 実装 src/society/facility_devices.py。world.devices(改札・信号)と同じ DEVS 契約に従う:
  #   δ_int(on_schedule)= 月 1 回の保守・待機摩耗・修理完了(**宣言済みのスケジュール**)
  #   δ_ext(on_input)  = 利用(エージェント)/ 故障(**世界からの外部入力**・actor_id=-1)
  # ★装置自身は乱数を 1 本も引かない(= devices.py の設計契約)。故障の抽選は module の
  #   phase 側が専用 stream "incident_facility" から **1 step に最大 2 本**だけ引く(台数非依存)。
  # 連鎖: 故障 → 閉じ込め → **インターホン通報(行為)** → 対応者の出動(行為) → 復旧。
  # ★停電・漏水は**作らない**: 東京の SAIDI は年約 13 分 = 10 日ランの期待値 0.4 秒。
  #   「起きない」が正しい答えなので、起こす機構を書けばそれは較正ではなく演出になる。
  # OFF が保つ不変条件: 名簿を組まない・facility_* 0 件・agent に属性が生えない・
  #   stream "incident_facility" を引かない・L1 バイト一致(golden_baseline_l1.json)。
  facilities:
    enabled: false              # ★false=完全 no-op(バイト一致)。true で昇降設備が摩耗しはじめる
    max_events_per_step: 16     # 1 step に出す本機構の L1 件数の上限(超過分は捨てる)
    # 対応者の職(**名簿に実在するものを先に置く**)。日本のビルで閉じ込めに最初に応じるのは
    # 防災センター/管理会社の常駐者(=警備員)で、保守会社の技術者はそのあと 30〜80 分で着く。
    # 「設備保守員」は L5 名簿にまだ居ないので、名簿を再生成したランでだけ効く(前方互換)。
    responder_occupations: ["設備保守員", "警備員"]
    response_speed_m_per_min: 80.0   # response_min の換算(徒歩。モデル値であって実走行ではない)
    maintenance_days: 30        # 月 1 回の保守(法定検査は年 1 回だが保守点検契約は月次が慣行)
    wear_full: 500.0            # この摩耗で故障ハザードが (1+wear_gain) 倍になる
    wear_gain: 1.0
    use_wear: 1.0               # 1 回の昇降で進む摩耗
    idle_wear_per_day: 1.0      # 待機だけでも進む摩耗(経年劣化の代理)
    elevator:
      enabled: true
      min_levels: 5             # この階数以上の建物に 1 台(地図に設備台数が無いための代理)
      # ★較正アンカー: EV 閉じ込め **全国およそ 1 万件/年** ÷ **全国設置台数 ≒ 78 万台**
      #   = 0.0128 件/台/年 = 3.5e-5 件/台/日。地図 v7 の該当 405 棟で 0.014 件/日
      #   (= 10 日ランの期待値 0.14 件)。**「何も起きない日が正しい」**側に落ちる較正である。
      fault_per_day: 3.5e-5
      repair_min_lo: 30.0       # 復旧まで 30〜80 分(台ごとに安定ハッシュで決まる決定論値)
      repair_min_hi: 80.0
      traps: true               # エレベーターは閉じ込める
    escalator:
      enabled: true
      min_levels: 3             # retail / station の建物だけが対象(kind による代理判定)
      # ★**推定**(アンカーではない): エスカレーターは構造上「閉じ込め」が起きないので
      #   「閉じ込め件数」という統計そのものが存在しない。桁を合わせた仮の値である。
      fault_per_day: 5.0e-5
      repair_min_lo: 30.0
      repair_min_hi: 80.0
      traps: false              # 停止するだけ(閉じ込めない)

  # ---- 所有権レイヤー O1(登記簿)+ O3(相続)(実装 src/society/assets.py。**既定 OFF=現行と完全同一**)----
  # 正典: docs/plans/ownership-layer-plan.md §1・§2・§5(ユーザー決定3件)/
  #       docs/research/ownership-asset-models.md §4-1〜§4-3・§5-2。
  # ユーザー構想「所有されているもの自体にタグをつけて観察・管理する」への回答 =
  # **タグ付きレコードを登記簿に置く**ハイブリッド(Torrens「台帳が真実」/ ISO 19152 LADM の
  # Party-RRR-BAUnit)。行は「所有」ではなく**権利** (asset_id, party_id, right_kind, since) で、
  # 置き場と書き手は中央台帳 1 つ(sim._asset_state)に限定する。
  #   L-full(台帳に全個体)… 住戸 =(住宅系建物, 階)・車両 = has_car の個体昇格
  #   L-agg (世帯集計)   … 家電・家具 = **O2 で実装**(ここには無い)
  #   L-flow(フローのみ) … 食料・消耗品 = 現行 spend のまま(SNA も資産境界の外)
  # ★資産保存則(貨幣保存則 IF-E の完全な双対): 行は RoW(製造・輸入)からのみ生まれ K5(廃棄・
  #   滅失)でのみ消え、それ以外は party の付け替えだけ。O1 では製造も廃棄も起こさないので
  #   「Σ 所有者別保有数 = 初期ストック」がカテゴリ別に厳密成立する(tests が固定)。
  # ★新しい行動候補を 1 つも作らない(売買・贈与を**勧めない**)。既存の行為(死亡・転居)が
  #   台帳へ写像されるだけの「分類の追加」。中古売買の内生化・持ち物のプロンプト提示は O5。
  # OFF が保つ不変条件: 台帳オブジェクトを作らない・inheritance / asset_transfer 0 件・
  #   **死者の財布は凍結のまま(第107 と完全同値)**・stream "asset_alloc" を引かない・
  #   L1 バイト一致(golden_baseline_l1.json)。
  assets:
    enabled: false              # ★false=完全 no-op(バイト一致)。true で登記簿が立つ
    # 権利種(LADM の RRR)。**O1 が書くのは own 1 種だけ**。lease/permit/lien/custody は
    # 有限表に宣言はあるが O4 まで 1 行も書かれない(綴りを config で増やしても no-op)。
    right_kinds: ["own"]
    # ---- 初期配賦(起動時 1 回・新 stream "asset_alloc" を住戸 1 戸に 1 draw)----
    # 持ち家住宅率: 総務省統計局「住宅・土地統計調査」の渋谷区の値(都全体 ≈45% /
    # 特別区部 ≈43% に対し渋谷区は借家が多く 3 割台前半)。★調査年で ±3pt 揺れるので
    # 「渋谷は借家の街=住戸の 2/3 以上が賃貸」が本較正の主張。
    owner_occupancy_rate: 0.32
    # 賃貸住戸の家主のうち**法人**の割合 ≈ 2 割(国交省の賃貸住宅管理の実態調査系
    # 「賃貸住宅所有者の約 8 割が個人」の裏返し)。本シムには「域外の個人家主」を表す主体が
    # RoW しか無いので、法人 = 域内の不動産 org / 個人 = RoW(不在家主)と写す。
    # ★これがユーザー決定 §5-1「域内の不動産会社も所有者に追加する」の実装形。
    org_landlord_share: 0.20
    # 域内不動産 org の特定(組織台帳 data/organizations_shibuya_census.json の実在フィールド)。
    # RE = 不動産業・物品賃貸業(996社)のうち、住戸の家主になりうる 2 区分だけを採る。
    # オフィス仲介(258社)と物品賃貸(251社)は住戸の家主ではないので外す = 仮定が要らない特定。
    landlord_industry_key: "RE"
    landlord_sectors: ["賃貸仲介/管理", "開発/PM"]
    max_landlord_orgs: 512      # 家主にする org の上限(id 昇順の決定論部分集合)
    dwellings: true             # 住戸を台帳に載せる(地図 v8 = 5,531棟・延べ 11,948 戸)
    vehicles: true              # 車両を台帳に載せる(has_car の個体昇格)
    # ---- 安全弁 ----
    max_assets: 400000          # 台帳の行数の上限(超えたら列挙を打ち切り capped=true を残す)
    max_events_per_step: 32     # 1 step に出す本機構の L1 件数の上限

# ---- 空間レイヤ核(屋内ミクロ状態=シームレスズーム観察の土台。既定 OFF=現行挙動と完全同一)----
# 全建物・全階の屋内間取り(vision.building_layout=決定論・ビューア floorLayout と同一系列)を
# 「単一の真実」として保持し、区画(zone)に用途型(SpaceType)を決定論割当する層。実装
# src/society/world/indoor.py(IndoorSpace)。エンジン配線(scheduler)は次バッチ担当=本セクションは
# スキーマの骨組みで、enabled=false では誰も読まない=イベント/L1/checkpoint のバイトに一切現れない。
# no-fingerprint: use カテゴリ→型の写像はここ(conf)に置き、コードは地名・業種名を書かず汎用に読む。
indoor:
  enabled: false                      # ★空間レイヤ核を使う実験で ON。false=完全 no-op(バイト一致)
  floor_layouts_path: data/floor_layouts.json   # 実フロア構成の補助データ(不在でも間取り正典で動く)
  # use カテゴリ → 型優先順位表 [bulk, accent1, accent2...]。bulk を全区画へ敷き、accent を
  # 「最小側」区画へ1つずつ(小さいほど後方の accent)割り当てる(面積降順+index 順=決定論)。
  # 例) office の [desk, meeting, break] = 最大群 desk・二番目に小 meeting・最小 break。
  # キー = floorguide/floor_layouts の use・POI cat・建物 kind(vision._kind_use=office/station/shop/generic)を網羅。
  space_types:
    office:      [desk, meeting, break]
    station:     [concourse, service]
    bus:         [concourse, service]
    shop:        [sales, register]
    food:        [sales, register]
    fashion:     [sales, register]
    beauty:      [sales, register]
    lifestyle:   [sales, register]
    restaurant:  [seating, kitchen, register]
    hall:        [seating, service]
    theatre:     [seating, service]
    observation: [seating, service]
    attraction:  [seating, service]
    nightlife:   [seating, service]
    leisure:     [seating, service]
    hotel:       [seating, service]
    park:        [seating]
    education:   [classroom, service]
    school:      [classroom, service]
    amusement:   [seating, service]
    clinic:      [service, seating]
    gym:         [service, seating]
    service:     [service]
    generic:     [sales, service]
  # ---- エンジン配線(B3)が読む実パラメータ。indoor.enabled=false では未読=完全に不活性 ----
  markov:                             # フロア内の区画滞在→遷移(LBNL 在室行動 ABM 流の幾何 dwell)
    enabled: false
    dwell_steps: 3                    # 平均滞在 step(遷移確率=1/dwell_steps の幾何 dwell=LBNL 流)
    # 活動 → 初期区画割当の優先型(型語は conf 側=コードは業種名を書かない no-fingerprint)。
    # 先頭から順に、その階の zone_types に在る最初の型を選ぶ。無ければ bulk(最頻型)。
    assign_types:
      working:  [desk, sales, service, concourse, classroom, register, seating]
      eating:   [seating, register, sales]
      shopping: [sales, register, seating]
    # markov 遷移先の候補型(勤務者 desk⇄meeting⇄break・客 sales⇄seating 回遊)。活動別。無指定活動は
    # assign_types にフォールバック。候補型がその階に無ければ遷移しない(=その step は滞在)。
    roam_types:
      working:  [desk, meeting, break]
      eating:   [seating, register]
      shopping: [sales, seating, register]
  sfm:                                # 遷移駆動 Social Force Model(区画内の微視軌跡・Helbing2000)
    enabled: false
    dt: 0.2                           # サブステップ [s]
    max_substeps: 900                 # 1遷移の上限サブステップ(=180s)
    sample_interval: 5                # 軌跡サブサンプル間隔(5×0.2=1s ごと)
    r_contact: 1.2                    # 接触判定の中心間距離 [m](proxemics personal distance 上端)
    t_sub_contact: 3                  # 接触成立の連続サブステップ(=0.6s・瞬間ブラシ除外)
    neighbor_cap: 12                  # 対人斥力の近傍上限(Helbing 近傍・id 昇順で決定論選択)
    wall_a: 2000.0                    # 壁斥力の強さ [N](Helbing2000 壁項)
    wall_b: 0.08                      # 壁斥力の特性距離 [m](Helbing2000)
    arrive_radius: 0.5                # waypoint 到達判定半径 [m]
    bfs_cell: 0.5                     # BFS フォールバック格子 [m]
  meeting:                            # 会議・同席(同一職場グループを同時刻に meeting 区画へ集める)
    enabled: false
    min_party: 2                      # 会合成立の最小人数(同一 (建物,階) の同一職場勤務者)
    prob: 0.5                         # 1職場・1日あたりの開催確率(stream "indoor_meet" (group,day))
    window_min: [600, 900]            # 開催時刻の分 of day 域(10:00-15:00)。この中の1 step で開催
    meeting_types: [meeting, break]   # 会合を開く区画の型(その階にあれば・無ければ不開催)
  encounter:                          # 遭遇(接触ペア)観測のコスト制御
    bystander_cap: 24                 # 1セルの静止在館者を接触計算に含める上限(id 昇順=決定論)
    # ★B3b 動力学接続: 直近(前 step)の屋内遭遇ペアを対面会話の「返答相手」選択で優先する
    #   (遭遇 duration 降順・id 昇順の決定論・乱数なし。_phase_indoor は _apply の後に走るので
    #    使うのは前 step の遭遇=1-step ラグ)。変えるのは相手選択のみ=hearer 集合・会話発生・
    #    LLM 呼数は不変(co-location 変化系の正契約。呼数の k 不変性は compute_matched で担保)。
    #    OFF=返答相手は従来(nearest/closeness)=ゴールデン L1 バイト一致。
    pairing: false
  tracks:                             # 記録サイドカー(indoor.enabled とは独立のサブトグル)
    enabled: false                    # true で indoor_tracks_*.parquet(秒スケール軌跡+遭遇)を書く
  los:                                # ★B3b 屋内知覚の壁 LOS ゲート(擬似視覚=区画粒度の同席文脈)
    # ON 時: 発火プロンプトの同席リスト(近傍リスト)を屋内実座標 ind_x/ind_y の距離上限+間仕切り壁
    #   LOS(vision.IndoorLOSOccluder=segment_blocked)で絞る(同一(建物,階)スコープのまま=構造不変)。
    #   壁で遮られた/遠すぎる相手を「同席文脈」から外す=区画粒度の知覚。プロンプト文言テンプレは不変・
    #   同席リストの中身だけが変わる(co-location 契約)。発火判断・返答権・hearer 集合はゲートしない
    #   =LLM 呼数不変。壁は IndoorSpace のキャッシュ壁を使う。OFF=同席リスト従来=バイト一致。
    enabled: false
    max_dist_m: 15.0                  # 同席文脈に残す屋内での上限距離 [m](0=距離ゲート無効=壁 LOS のみ)

# ---- 経済 v0(賃金+消費+バイト+心理接続。ユーザー決定 2026-07-05)----
# 職業→賃金カテゴリ・持ち金・バイトの写像は src/society/economy.py(persona/sim 側)。
# engine は precompute 済みの金額しか見ない(no-fingerprint 契約に触れない)。
economy:
  enabled: true
  wages:                          # 本業の日給(勤務完遂で支給)。part_time_hourly=学生バイト時給
    会社員: 12000
    自営: 10000
    店員: 9000
    part_time_hourly: 1100        # 学生バイト時給(×4h/シフト)
  # 最低賃金の床(制度深化3 2026-07-08)。一次確認: 東京都最低賃金 1,226円/時(2025-10-03 発効・
  # 東京労働局)。>0 で雇用者賃金に床を適用: part_time_hourly=max(現値, 床)、日給カテゴリ
  # (会社員/店員/公務員)=max(現値, 床×8h)。自営は労働者でない=対象外(現実の制度と同じ)。
  # 既定 0.0=床なし=従来と完全同一(ゴールデン維持)。★ON 推奨(本番): 1226
  min_wage_hourly: 0.0
  prices:                         # 消費の価格(残高不足なら選ばない)
    food: 900
    cafe: 500
    shop: 2500
    nightlife: 1800
    leisure: 0                    # 公園・緑地は無料
  allowance_visitor: 20000        # 来街者の持ち金初期値レンジの中心(賃金なし)
  visitor_refresh: false          # ★ON 推奨(本番): true。来街者が帰宅から戻るたび手持ちを
                                  # allowance_visitor まで補充(家で財布を補充する近似)。来街者は
                                  # 反復収入が無く長期ランで恒久破綻し消費・宿泊から脱落する
                                  # (docs/research/sim-improvement-analysis.md P2)ことへの対処。
                                  # 決定論・k 非依存(wage source="home_refill")。false=従来と完全同一
  money_pressure_threshold: 2000  # 残高がこれ未満 = 逼迫(1日1回 grievance+)
  fixed_cost_daily: 0.0           # ★ON 推奨: 例 300。家賃以外の日次固定費(光熱費・サブスク等)=
                                  # 恒常的生活圧(Wave G1)。日次で spend(cat=fixed_cost)。来街者は対象外。
                                  # 0.0=控除ゼロ=イベントなし(バイト一致)
  # ---- 口座(銀行)概念 E5(既定 OFF。ユーザー決定 2026-07-06。100日=月次の資金繰り)----
  # ON 時: 初期資産を口座8割/現金2割に分割。賃金・バイト・日銭・売上は口座へ入金。
  #   月給者(会社員等)は日割りでなく給料日(payday_dom)に月給まとめ支給、翌日に家賃を
  #   口座から引き落とし(月収相当×rent_share)。支払いは card_threshold 以上=口座(カード)、
  #   未満=現金。現金不足は最寄り ATM で自動引出(移動なし=ATM はどこにでもある近似)。
  #   逼迫判定(money_pressure)は現金+口座の合算に切替。OFF 時はバイト一致で完全不変。
  accounts:
    enabled: false
    payday_dom: 25                # 給料日(暦の何日目。1日=144step、run開始日=1日として day%30)
    rent_share: 0.30              # 家賃 = 月収相当 × これ(給料日翌日に引き落とし)
    card_threshold: 3000          # これ以上の支払いは口座(カード)、未満は現金
    atm_withdraw: 20000           # 現金不足時の1回あたり引き出し基本額(不足分が大きければそれ以上)
    cash_share: 0.20              # 初期資産の現金比率(残り=口座)
    # ---- 立退き・破産サイクル(制度深化3 2026-07-08。要 accounts.enabled=true)----
    # 現実の対応: 滞納の継続→信頼関係破壊の法理で契約解除=立退き(住居喪失=路上就寝・
    # 家賃の新規発生停止)、さらに続くと自己破産(免責=滞納債務消滅+自由財産以外を圧縮+
    # 制限期間=出店不可)。完済で再入居=サイクルが閉じる。既定 0/0=どちらも無効=E5 従来と完全同一。
    eviction_days: 0              # ★ON 推奨(本番): 例 30(滞納がこの日数続くと立退き)
    bankruptcy_days: 0            # ★ON 推奨(本番): 例 60(滞納がこの日数続くと自己破産)
    bankruptcy_keep: 10000        # 破産後も手元に残る自由財産(実法の99万円を所持金スケールに圧縮)
    bankruptcy_restrict_days: 30  # 破産後の制限期間(日)。この間は出店不可(資格制限のモデル)
    eviction_grievance: 0.10      # 立退きの生活不安(factors 経由の不透明 magnitude)
    bankruptcy_grievance: 0.15    # 破産の生活不安(同上)

  # ---- IF-E2 案B: org の会計主体化 + rest-of-world(渋谷域外)部門(既定 OFF)----
  # 設計: docs/research/ifE2-org-accounting-research.md §4-3 / 実装: src/society/economy_sfc.py
  # ON にすると org が**スカラー預金 1 本**を持ち、賃金をそこから払い・消費をそこへ入れる。
  # 受け手が街に居ない金は RoW(域外)へ**チャネル別に**落ち、
  # 「Σ(全主体残高)+RoW 累積=一定」という閉じた不変量が立つ(IF-E の漏れ 71.8〜96.0% を閉じる)。
  # 残高はエージェントのプロンプトに一切出さない(観測層のみ)= k 完全不変・no-fingerprint。
  # false(既定)= 残高も state も L1 も payload キーも 1 つも生えない(ゴールデン L1 バイト一致)。
  org_accounting:
    enabled: false
    sigma: 1.0                    # 初期預金 = σ × 月次賃金支払(Caiani et al. 2016。σ=1)
    month_days: 30                # 「月次賃金支払」= 配属者の日給合計 × この日数
    min_initial: 0.0              # 初期残高の下限(配属0の org の保護。0=下限なし)
    export_production: true       # office/education 系 org(全体の36.5%・従業者の51.5%)の
                                  # 輸出代金を RoW から入金(既存 revenue_est の式・発火点は不変で
                                  # 相手方を void → RoW に付け替えるだけ)。false=輸出なし=当座借越へ
    sidecar: true                 # finance.parquet(部門別残高の日次1行)を書く

# ---- 「世界を変える」ツール群(4軸を最小で覆う affordance。中立提示・自然使用の観察)----
# モノ=open_venture / 制度=propose / 人=host_event(勉強会) / 虚構=host_event・flyer・group。
# R1: 提示・可否は k と無関係(所持金など客観条件のみ)。R4: 効果は客観カウント(LLM審判なし)。
tools:
  enabled: true
  equip_all: false              # 標準装備(H 2026-07-06): true で全発火プロンプトに「所持ツール」節を
                                # 中立告知(勧誘なし・呼数不変)。実LLMのツール0使用対策。
                                # ★B段の実LLM検証で true を新標準にする予定(ユーザー承認待ち)
  venture_cost: 30000           # 出店の開業費(これ以上の所持金がある時だけ提示・実行)
  # 営業許可(制度深化2 第10バッチ。保健所・風営法等の参入障壁の最小形。調査: rights-institutions-gap.md §J)
  permit_steps: 0               # ★ON 推奨(本番): 例 6(申請〜開業までの許可待ち。待ちの間は販売なし)
  permit_deny_prob: 0.0         # ★ON 推奨(本番): 例 0.15(却下確率。新 stream "permit"。却下=開業費は返る)
  venture_price: 800            # 屋台の商品単価(通行人が購入)
  venture_close_days: 3         # 売上ゼロがこの日数続くと自動閉店
  proposal_threshold: 0.25      # 署名が全体のこの割合に達すると提案成立(象徴的成立)
  event_duration_steps: 6       # イベントの開催時間(step)= 会場滞在・教育の帯域
  flyer_ttl_steps: 144          # 掲示・ビラの寿命(1日)
  flyer_max_per_node: 3         # 同一ノードのビラ上限(古い順に上書き)
  attend_base: 0.25             # イベント参加の基礎確率
  attend_relation_bonus: 0.35   # 主催者が関係台帳にいる時の上乗せ
  group_join_prob: 0.4          # グループ名を知り関係者がいる時の加入確率
  buy_prob: 0.3                 # 屋台に到着した通行人が購入する確率

# ---- 制度DSL(ホワイトリスト型ルールの自動制定。ユーザー構想 2026-07-06)----
# エージェントは propose で制度を作る。署名 25% で成立した瞬間、機械可読 rule が
# シミュ世界の実効ルール(価格・支給・行き先抑制・定期イベント)として自動制定される。
# 自由なコード生成は避け、4型のホワイトリストに閉じる(決定論・R1 全員平等・R4 客観測定)。
# 検証に失敗した rule は「文言だけの制度」に降格して成立(壊れない)。false で完全に旧挙動。
rules:
  enabled: true
  allow_declare: false          # ★ON 推奨(本番): true。権利創設・宣言型 rule
                                # {"type":"declare","title":"…"} を許可(制度深化 第9バッチ)。
                                # エンジンの価格・移動には作用しない象徴的制度(現実の例: 渋谷区
                                # パートナーシップ条例 2015=一区の制度改変が全国へ波及した実在 keystone)。
                                # 再帰性の norm_line・ニュースで知覚され、Y の symbolic 層で測る。
  max_active: 5                 # 同時アクティブ上限(超過は古い順に失効=rule_expired)
  duration_days: 0              # 各ルールの有効期限(日)。0 = 無期限
  fee_max_ratio: 0.5            # fee delta の上限 = 対象カテゴリ基準価格に対する比率(±50%)
  bonus_max: 500                # bonus 支給額の上限(円/回)
  boost_prob: 0.5               # weekly_event 発火日にその場所を余暇候補へ選ぶ確率/step

# ---- 再帰性(第9バッチ 2026-07-07。ユーザー要望: 規範・現状の監視→知覚→フィードバック→改変)----
# エージェントが「いま実際に効いている取り決め」と「昨日の街の動き(提案/成立/廃止/取り締まりの
# 客観カウント)」を発火プロンプトで知覚し、気に入らない取り決めは propose の
# rule={"type":"repeal","target":"名前の一部"} で廃止を提案できる(成立で rule_repealed)。
# 取り締まりが多発したルールは日次でニュース化(社会の自己観測=メディアが制度の帰結を報じる)。
# すべて非LLM・決定論・乱数不使用。R1: generate() を1本も足さない(注入は内容のみ=呼数不変。
# impact_news は聞く語が変わり発火が動きうるが k・内面状態を読まない=compute_matched の k 不変性で担保)。
# 既定 OFF=注入なし・rule_repealed/norm_digest 0 件=現行挙動と完全同一(ゴールデンを守る)。
recursion:
  enabled: false                # ★ON 推奨(本番): true(再帰性=世界を変える閉ループの知覚側を有効化)
  rules_in_prompt: true         # いま実効の取り決めを全発火プロンプトに1行注入
  digest_in_prompt: true        # 昨日の街の動き(提案/成立/廃止/取り締まり件数)を1行注入
  allow_repeal: true            # propose の rule.type=repeal(既存の取り決めの廃止)を許可
  impact_news: true             # 取り締まりが多発したルールを日次ニュース化
  impact_news_threshold: 3      # 前日の執行がこの件数以上のルールをニュースにする
  max_rules_in_prompt: 3        # プロンプトに載せる取り決めの最大件数(最新から)

# ---- インターネット層(スマホ: SNS / ニュース / 検索 / DM)----
# 発信(投稿・DM)の起動は欲求発火(drive)経由。ここは閲覧系(非LLM)のみ。
net:
  enabled: true
  browse_prob: 0.12             # 暇なとき SNS タイムラインを見る確率/step
  news_prob: 0.06               # ニュースアプリを見る確率/step
  feed_size: 6                  # 1回の閲覧で読む投稿数
  follow_k: 6                   # 初期フォロー人数(+対面で知り合うと自動フォロー)
  like_prob: 0.15               # 閲覧した投稿にいいねする確率(#14。非LLM・専用stream)
  reshare_prob: 0.03            # 閲覧した投稿をリシェアする確率(#14。フォロワーへ自然再配信)
  posts_max: 0                  # B7(スケール): SNS 投稿の保持上限。>0 で古い投稿をエイジアウト
                                # (id は不変で react/timeline は id ベース=安全)。0=無制限で従来と完全同一。

# ---- 欲求駆動発火(Phase A: 推論タイミングの分散。ユーザー仕様 2026-07-04)----
# 出来事が欲求ゲージを溜め、個人別閾値で「申請」→ 個人の重みで確率発火 →
# 不発ならゲージを数十%減衰。発火回数は k 条件間で監査可能(R1 対策)。
drive:
  decay: 0.02                   # ゲージの自然減衰/step
  fail_decay: 0.30              # 抽選落ち時の減衰(ユーザー仕様「数十%」)
  fire_reset: 0.20              # 発火後に残るゲージ比率
  refractory_steps: 3           # 不応期(発火直後は考え込まない)
  conv_max_turns: 3             # 対面会話で片側が返答できる最大回数(無限連鎖の抑制)
  conv_cooldown_steps: 6        # 会話セッション終了後のクールダウン(step)
  firing: fixed                 # fixed(既定=閾値ゲート+個人重み抽選)| logistic(p=σ(slope·(drive−threshold)))
  slope: 8.0                    # logistic 時のシャープさ(B段 seam。fixed では未使用)
  weights:                      # 出来事 → ゲージ増分(相対重み。RQ1 検収後に調整)
    novel_place: 0.35
    congestion: 0.30
    unknown_word: 0.40
    addressed: 0.25
    dm_received: 0.35
    news: 0.15
    sns: 0.08
    company: 0.10
    silence: 0.015
    state_change: 0.50
  # ---- 内省しやすさの時間ドリフト E2(既定 OFF。設計: docs/research/reflection-drift.md)----
  # 実効閾値 = clip(drive_threshold + theta_drift, 0.30, 0.85)。fire_weight は不変。
  #   馴化: 低顕著の単調入力(沈黙/SNS/同席/ニュース)が続く → theta_drift↑(内省が減る)。
  #   鋭敏化: 発火経験・新奇/強イベント(初訪問/未知語/大 |Δstate|)→ theta_drift↓(乗ってくる)。
  #   自発回復: 毎 step theta_drift を 0 へ緩やかに引く(静穏で base へ戻る)。
  #   向き・速さの個体差は traits 由来(factors/registry.drift_params。NFC高=鋭敏化寄り)。
  # R1: 入力は出来事量・発火経験のみ(belief 書き戻し・k.writeback を一切参照しない)。
  # OFF 時は theta_drift 恒等 0=drive_threshold と完全同一(ゴールデン/決定論を壊さない)。
  drift:
    enabled: false
    habit_rate: 0.02            # 馴化の基準率(× 出来事の顕著さ。閾値↑)
    sens_rate: 0.02             # 鋭敏化の基準率(発火1回=−sens_rate。新奇は × 顕著さ)
    recovery_rate: 0.01         # 自発回復の基準率(毎 step theta_drift を 0 へ)
    max_abs: 0.15               # |theta_drift| の可動域(clip[0.30,0.85] と二重で暴走防止)
  # ---- 好奇心/退屈の内発ドライブ(P2 スライス S5。既定 OFF=現行と完全同一)----
  # 設計: docs/plans/p2-interstitial-design.md §1 S5 / docs/research/interstitial-life.md §4.4-a。
  # 「同じ場所への長居・単調な入力の継続」で退屈ゲージが溜まり(silence ゲージと同じ作法)、
  # 閾値超えで LLM なしの内発的探索(近傍の未訪問/低頻度 POI へ移動=知らない店/ふらっと歩く)を
  # 発火する=ボトムアップ創発の種(自然界志向と整合)。行き先選択は S4 の Gumbel 機構があれば
  # 再利用し、なければ決定論近傍選択。到達先が新奇なら既存 drive の novel_place(鋭敏化=顕著性)に
  # 自然接続し、そこで何かが起きれば既存予算内で C1 熟慮へ(接続点を作るだけ)。
  # 入力は物理量(現在地・移動中か・近傍 POI・訪問回数)のみ=beliefs/k を見ない(no-fingerprint)。
  # R1: 新 stream は "boredom" 1本のみ・追加 LLM 呼ゼロ=呼数 k 非依存・enabled=false で
  #     boredom_explore 0 件=ゴールデン L1 バイト一致。production.yaml は触らない。
  boredom:
    enabled: false              # ★本番はユーザー判断で ON。false=現行の routine と完全同一
    accrual: 0.06               # 同じ場所への長居 1step あたりのゲージ蓄積(0-1)
    decay: 0.10                 # 移動中・新奇な場所での減衰率
    novelty_relief: 0.20        # 新しい場所に着いたときの追加減衰(脱馴化の入口)
    threshold: 0.60             # 探索発火の閾値(ゲージがこれ以上で発火候補)
    fire_prob: 0.5              # 閾値超え時に実際に探索へ動く確率(stream "boredom")
    cooldown_steps: 6           # 探索発火後に次の退屈探索へ入れるまでの step 数(連発の抑制)
    radius_m: 300               # 探索先を探す現在地の近傍半径(m)。周辺 POI 密度がそのまま重み
    stay_steps: 2               # 探索先での滞在 step 数

# ---- 会話3層 C2/C3(P2 スライス S3。docs/plans/p2-interstitial-design.md §1 S3)----
# 「記録に残る会話」を LLM コスト0 で大量に生む主レバー(interstitial-life.md §4.3)。既定 OFF。
# ON 時: 空間索引で同席・会話可能な対を決定論列挙し、専用 stream `c2_meet` で構造化会話(挨拶→話題
#   →スタンス→同意/反論→別れの Dialogue Act 遷移。実文は作らない)を成立させる。話題・トーン・帰結は
#   両者の状態(関係値・opinion・共有語彙)からの決定論写像。機械効果は既存資産を呼ぶだけ:
#   関係更新(relations)・意見更新(opinion の FJ・k 非依存)・語彙接触(labels の complex contagion)・
#   drive ゲージ加算(addressed)。1 会話 1 件の conversation イベント(軽量)を記録。帰結が顕著
#   (強い意見差・関係の転機・未知語接触)なら drive を余分に押し上げ、次 step の _phase_drive が
#   フル LLM 発話(C1)を自然に発火する(C2→C1 昇格)。C3=すれ違いは会話イベントを作らず日次カウンタのみ。
# c2 パラメータ(成立確率・cooldown・1日上限/人)で密度を調整する。初期値は mock 24step 実測で
#   「ON 時 ~30 会話/人日」を狙って置いた(在場密度依存=較正値。密な本番では下げて調整する)。
# R1: 新 stream は c2_meet 1本のみ・既定 OFF で conversation 0 件=ゴールデン L1 バイト一致・追加 LLM 呼
#   ゼロ(呼数 k 非依存)・no-fingerprint(opinion/relations の不透明値のみ)。production.yaml は触らない。
conversation:
  enabled: false                # ★ON 推奨(本番): true(記録に残る会話密度=C2 を有効化)
  c2:
    meet_prob: 0.8              # 同席・会話可能な1対あたり毎step の会話成立確率(c2_meet 抽選)
    cooldown_steps: 2           # 会話後にその個体が次の C2 に入れるまでの step 数(連発の抑制)
    daily_cap: 40               # 1人1日あたりの C2 会話の上限(暴走防止・現実レンジ上限側)
    align_agree: 0.72           # opinion 整合度がこれ以上=同意スタンス
    align_oppose: 0.38          # opinion 整合度がこれ以下=反論スタンス(強い意見差=昇格材料)
    tier_friendly: 1            # 関係 tier がこれ以上(または count>=2)で友好トーン寄り

# ---- 朝の一日計画(ユーザー要望 2026-07-06)----
# 起床(来街者は帰還)直後に1回、LLM で「今日一日の予定(2〜5個)」を立て、それが
# LLM 非駆動時のルールベース行動(routine)の行き先の土台になる。呼数は k 非依存(R1)。
planning:
  enabled: true                 # 既定 ON = 新しい標準挙動。false で完全に旧挙動へ戻る
  max_items: 5                  # 1日の予定の最大件数(2〜max_items を採用)
  # ---- 日課計画フレームワーク(P2 S1。既定 OFF=現行の計画経路・プロンプト・mock と完全一致)----
  # ON で計画を型スキーマ(自由文 intent 先頭 + 3分類 cat + 語彙 what + 時間窓 + 柔軟性 flex)へ
  # 拡張し、計画コンパイラ(勤務・就学アンカー先置き→残り時間窓に裁量活動充填)を通す。実行側
  # (routine)は触らず、結果は現行 day_plan へ降格写像する。設計: docs/research/daily-plan-framework.md
  framework:
    enabled: false              # false=現行どおり。true でスキーマ+コンパイラを有効化
    # 活動タイプ語彙(EnvPack 思想: 街ごとに差し替え可能。既定=現行8語彙 + 学業/用足し/送迎)
    vocab: [work, study, meal, shop, leisure, park, walk, home, visit, personal, escort]
    # what → 3分類 cat の既定導出(LLM が cat を明示しないときに使う)
    cat_map:
      work: mandatory
      study: mandatory
      meal: maintenance
      shop: maintenance
      personal: maintenance
      escort: maintenance
      home: maintenance
      leisure: discretionary
      park: discretionary
      walk: discretionary
      visit: discretionary
    # cat → 既定所要(分)。start/dur_min 省略時のフォールバック
    dur_min:
      mandatory: 240
      maintenance: 45
      discretionary: 60

  # ---- day_plan v1(第86バッチ 2026-08-03。既定 OFF=現行の計画経路・プロンプト・mock と完全一致)----
  # 原文書: docs/plans/source/design-discussion-20260802.md §6(決定と実行の分離)・§7(朝の計画スキーマ)。
  # ON で朝の計画を「メタ+ブロック4〜8個+contingency最大3個」の**列挙型中心の浅い構造**へ差し替え、
  # 日中はルールエンジンが無料で実行する(場所の具体解決はルール側=カテゴリ→習慣/距離/営業状態)。
  # 空き時間はブロックにしない(未計画帯は既存の習慣ポリシー routine が埋める)。
  # 検証3段: ①スキーマ(列挙・個数・型)②物理(移動時間・営業時間・場所カテゴリの実在)
  #          ③決定的修復(時刻の丸め・ずらし・短縮・場所の差し替え・削除・件数上限)
  #          ④修復不能 → 前日の計画 → ペルソナ既定ルーチン(世界を止めない)
  # 割り込み: could+droppable は **LLM を呼ばず**ルールが削り、slideable は後ろへずらす。
  #          must が脅かされたときだけ再計画(plan_version++)。cognition.fire ON のときのみ
  #          内部発火 plan_exception を認知イベントキューへ前倒し登録する(engaged 本体は第87)。
  # R1: enabled=false で新イベント 0 件・L2 に列なし・summary にキーなし・プロンプト 1 バイト不変。
  #     ON でも generate() を 1 本も足さない(再試行なし)・乱数 stream を 1 本も引かない。
  # 実装 src/society/cognition/day_plan.py。planning.framework とは排他(day_plan が優先)。
  day_plan:
    enabled: false            # ★本番はユーザー判断で ON。false=現行の朝計画と完全同一
    min_blocks: 4             # 1日のブロック数の下限(原文書 §7: 4〜8)
    max_blocks: 8             # 同・上限(超過は低優先・遅い方から clip)
    max_conting: 3            # contingency(条件分岐)の上限(原文書 §7: 最大3個)
    round_min: 10             # 時刻の丸め幅[分](= 正準 Δt)
    min_dur_min: 10           # ブロックの最小継続[分]
    max_dur_min: 600          # ブロックの最大継続[分](超過は truncate)
    grace_min: 30             # 開始予定からこれだけ過ぎても始まらなければ割り込み判定に入る
    walk_m_per_min: 80.0      # 移動時間の下限見積りに使う徒歩速度(world.modes.speeds.walk=800m/10分)
    transfer_min: 5           # 同一地点でも要る最小の移動/準備時間[分]
    max_slide_min: 180        # 1ブロックの累積ずらし上限[分](超えたら削除)
    day_end_min: 1440         # 計画が収まるべき日の終端[分 of day]
    mood_chars: 60            # 自由文欄(mood)の上限文字数
    text_chars: 80            # 自由文欄(reason / note / carry)の上限文字数
    # ---- contingency の消費(第93バッチ IF-A・**既定 OFF** = 第86 と完全同一)----
    # 第86 は if_then(条件分岐)を LLM に書かせ検証・格納するが **消費するコードが無かった**
    # (監査 §5-1「contingency がデッドデータ」)。ON にするとブロックの実行直前に
    # `plan["cont"]` を **決定論**(乱数ゼロ・LLM ゼロ)で評価し、最初に成立した 1 件だけを
    # 適用して plan_cont_fire を 1 件記録する。
    #   条件: rain(当日の天気が雨/雪)/ crowded(env.feedback で待ち行列中の POI)/
    #         closed(commerce の営業時間外)/ tired(health の fatigue_high 超え)/
    #         no_money(economy の当該カテゴリ価格に所持金が届かない)/
    #         late(割り込み処理で後ろへずらされた=slid>0)/ invited(joint の当日予定と時間帯が重なる)
    #   ★前提機構が OFF の条件は**常に不成立**(捏造しない)。詳細は day_plan.py の docstring。
    #   対処: skip(やめる)/ postpone(postpone_min 後ろへ)/ go_home(自宅へ)/
    #         swap_indoor(屋外カテゴリを屋内へ)/ shorten(shorten_min 短縮)
    # プロンプトは 1 バイトも変わらない(if_then の書式は day_plan ON なら本トグルと無関係に載る)。
    use_contingency: false
    postpone_min: 60          # then=postpone のずらし幅[分](max_slide_min を超えたら削除)
    shorten_min: 30           # then=shorten の短縮幅[分](min_dur_min は下回らない)
    # ---- 計画駆動の圏外滞在(actor model P4・**既定 OFF** = 第86 と完全同一)----
    # 原文書: docs/plans/actor-model-migration-plan.md §4(境界)。実装 cognition/plan_boundary.py。
    # 「勤務先が街の外にある居住者」を (run.seed, agent.id) の純関数で指名し、その人の計画の
    # work ブロックに boundary 欄(exit/gateway/exit_min/entry_min)を刻む。**その欄がそのまま
    # despawn/respawn の時刻表**であり、境界の出入りに別機構は作らない(退出=既存 _try_exit /
    # 帰還=既存 _phase_wake_and_returns / L1 も既存の exit_area・enter_area を再利用)。
    #   圏外に居る間: イベント 0 件・乱数 0 本・LLM 0 呼(loc=="outside" を既存エンジンが
    #     構造的に素通りする。作用点は plan_boundary.py の docstring に file:line で列挙)。
    #   帰還時: 「計画通りに実行、特筆事項なし」の圧縮記憶 1 行だけ(定型文の純関数)。
    #   二系統の台帳は混ぜない: 計画駆動(本ブロック)= 居住者が圏外へ / 統計駆動(既存の
    #     commute・arrival_min)= 域外住民が域内へ。L1 では payload.boundary=="plan" の有無で分離。
    # 正直な近似(直さない): ①圏外は摩擦ゼロ(外での出来事・消費・出会いは生成しない)
    #   ②フラックスは固定(域内の混雑・災害が「今日は出社しない」に効かない)。
    # R1: enabled=false で新イベント 0 件・payload バイト一致・新 stream 0 本・プロンプト不変。
    boundary:
      enabled: false          # ★本番はユーザー判断で ON。false=第86 の day_plan と完全同一
      outside_work_fraction: 0.7  # 指名率(**地図内に勤務先が解決しない居住者**に対する割合)。
                                  # 未較正の暫定値(shibuya-inflow §1 表B: 区民の 6.9% しか区内で就業)
      places: ["work"]        # 圏外扱いにする場所カテゴリ(education は既定で足さない=学校は地図内に在る)
      gateway: station        # "station"=駅ノード / それ以外=city.gateways から決定論選択
      start_min: 480          # 骨格計画での圏外勤務の開始(分 of day、8:00)
      start_spread_min: 150   # 開始のばらつき幅[分](persona._pick_workplace と同じ 8:00〜10:30)
      start_grid_min: 10      # ばらつきの刻み[分](= 正準 Δt)
      hours_min: 480          # 圏外に居る長さ[分](8時間)
      min_outside_steps: 1    # 退出が遅れて帰還時刻を過ぎた場合の最小滞在 step(必ず 1 step は外に居る)

# ---- 確率的実行=行動のゆらぎ(P2 スライス S4。docs/plans/p2-interstitial-design.md §1 S4 /
#      docs/research/interstitial-life.md §4.1 の実証3層 L1/L2/L3 + Gumbel)。既定 OFF=現行と完全同一 ----
# LLM 非駆動の routine 実行に「人間らしいランダム性」を実証値で較正して注入する。摂動は専用 stream
# (motif/jitter_time/detour/interrupt/gumbel)にだけ載せ、既存 routine の乱数(choose_destination 等)の
# draw 順は汚さない(crowd/curfew/media が確立した作法)。入力は物理量・時刻・活動種別のみ(因子・k を
# 見ない=no-fingerprint)。追加 LLM 呼はゼロ=呼数 k 非依存。
# R1: enabled=false で新 stream を一切引かず・detour/interrupt 0 件=ゴールデン L1 バイト一致。
# 較正ターゲット(interstitial-life §4.1): 日次逸脱 25〜35% / per-move 寄り道 10〜20% / 予測可能性≈93%。
routine:
  stochastic:
    enabled: false              # ★本番はユーザー判断で ON。false=現行の決定論 routine と完全同一
    # ---- L1 骨格 motif(stream "motif"): 朝1回、その日の行動骨格を確率抽選 ----
    novelty_prob: 0.15          # 「いつもと違う一日」を引く確率(1-これ=routine 日)。Schneider: 17motif で90%
    novelty_scale: 1.6          # novelty 日に L2/L3 の強度(ジッター幅・逸脱率)へ掛ける倍率
    # ---- L2 時刻ジッター(stream "jitter_time"): flexible 活動の開始/継続を一様 ±jitter_min ----
    jitter_min: 30              # 片側幅(分)。MATSim mutationRange=1800s=±30分・一様・affectsDuration。fixed アンカーは不変
    # ---- L3 逸脱イベント(stream "detour"/"interrupt"): 活動種別で確率可変(mandatory 低・discretionary 高)----
    detour_prob:                # per-move 寄り道確率(目的地手前で近傍 POI に立ち寄り)
      mandatory: 0.05
      maintenance: 0.12
      discretionary: 0.18
    detour_radius_m: 300        # 寄り道先を探す現在地の近傍半径(m)。周辺スポット密度がそのまま重みになる
    interrupt_prob:             # 滞在中の活動を途中で中断=離脱する確率/step
      mandatory: 0.0
      maintenance: 0.06
      discretionary: 0.10
    # ---- Gumbel ロジット化(stream "gumbel"): 行き先 argmax を U=V+ε の確率選択へ置換(ON 時のみ)----
    gumbel:
      enabled: false            # true で自由時間の行き先選択を Gumbel-max 化(温度は活動3分類で固定)
      temperature:              # 低温=いつもの行き先(≒決定論)/ 高温=多様化(気まぐれ)
        mandatory: 0.3
        maintenance: 0.8
        discretionary: 1.5

# ---- プロンプト調整(改善 P3 第9バッチ。既定 OFF=注入なし=バイト一致)----
# 発話の定型化対策(sim-improvement-analysis.md P3: 冒頭句「この時間の渋谷…」が発話の5〜9.5%)。
# ON で social/reply/solo の状況文に「決まり文句で始めない」注意書きを1行足す(内容のみ=呼数不変=R1)。
prompts:
  variety_hint: false           # ★ON 推奨(本番): true(実LLM の発話多様性を上げる)
  reflect_variety: false        # 第20バッチ検収=belief の25%が雛形復唱(「今日の経験から〜」で始まる定型文)
                                # への対策(A4)。ON で内省プロンプトの belief 説明を個体×日で 4 バリアントの
                                # 決定論ローテーション(_stable_hash 選択=乱数不使用)+「決まり文句で始めない」
                                # 1行を追加。バリアントは意味等価・JSON契約キー不変・呼数/発火は不変(R1)。
                                # 既定 OFF=内省プロンプトが現行とバイト一致=ゴールデン不変。★ON 推奨(本番): true
  # ---- ナラティブ補間(P2 S2。docs/plans/p2-interstitial-design.md §1 S2)。既定 OFF=バイト一致 ----
  # ON 時: 各 LLM 発火(計画/発話/内省)のプロンプトに、前回発火以降のその個体の客観的な出来事
  # (立ち寄った場所・会った人・起きたこと)を機械ダイジェスト(意味づけしない列挙)として1行注入する。
  # 意味づけ(なぜ印象に残ったか)は夜内省の LLM に委ねる二段構え。追加 LLM 呼はゼロ=呼数 k 非依存。
  # ダイジェストは実行時バッファ(有界=最大30件のリングバッファ)から決定論で生成し、記録は増やさない。
  # OFF 時は1行も足さない=ゴールデン(golden_baseline_l1.json)を守る。切替は主計画者が production 側で行う。
  interstitial:
    enabled: false

# ---- 交通機関: タクシー+簡易バス(ユーザー要望 2026-07-06)----
# 電車の高度化(GTFS 実ダイヤ・駅構内)は API 申請待ちのため保留(transit.gtfs_dir 参照)。
transit_ride:
  taxi:                         # 既定 ON。遠距離かつ所持金があれば低確率で乗車。自家用車保有者は使わない
    enabled: true
    prob: 0.15                  # 条件成立時に乗る確率(stream("taxi", id, step))
    min_dist_m: 600             # 直線距離がこれ超で候補(近距離は徒歩/自転車)
    base_fare: 500              # 初乗り(円)
    per_km: 400                 # 距離運賃(円/km)。運賃 = base_fare + per_km × 距離km
  bus:                          # 既定 OFF = 本番トグル。合成/簡易路線での短縮移動+運賃
    enabled: false
    fare: 230                   # 運賃(円)
    stop_radius_m: 100          # 出発/目的ノードが停留所からこの距離内なら乗車可
    headway_steps: 1            # 便の間隔(step。1 step = 10分)
  # ---- 実バスダイヤの静的表 v-Ride-2(既定 OFF=従来の簡易バス近似のまま=バイト一致)。
  #      正典: docs/research/sumo-live-transit.md §3(静的表推奨=SUMO を回さない軽量版)。
  #      ON 時(bus.enabled も要): scripts/build_bus_table.py が GTFS から吐いた実ダイヤ静的表を読み、
  #      出発/目的が停留所 access 圏内なら「次便の待ち時間 + 区間所要」を実ダイヤ近似で乗車に反映する
  #      (到着 step が実際に変わる=別ゴールデン)。ride payload に wait_s/ride_s を追記。運賃は既存のまま。----
  bus_table:
    enabled: false
    path: data/odpt/bus_table_shibuya.json   # build_bus_table.py の出力(停留所・系統・発時刻・区間所要)
    access_radius_m: 150        # 出発/目的が停留所からこの距離内なら乗車可(実ダイヤ近似の access 圏)
  # ---- SUMO ライブ連成タクシー配車 v-Ride-1(既定 OFF=SUMO プロセスを一切起動しない=完全従来挙動=
  #      ゴールデン L1 バイト一致)。正典: docs/research/sumo-live-transit.md / traffic-indirect-effects.md。
  #      ON 時: エージェントが taxi を選んだ瞬間だけ SUMO(taxi device・dispatch=traci)へ予約を注入し、
  #      配車待ち wait_s / 乗車時間 ride_s を到着 step の追加待ちへ量子化する(到着 step が実際に変わる=
  #      別ゴールデン)。乗車判断は既存の非LLM _ride_extra のまま=LLM 呼数を1本も足さない(k 非依存)。----
  live:
    enabled: false
    backend: traci              # traci=実 SUMO(TraCI) / mock=純関数ブリッジ(SUMO 不要・テスト用)
    n_taxis: 8                  # taxi fleet 台数(ソート済みエッジへ決定論配置)
    seed: 42                    # SUMO seed(固定・--random 禁止=決定論)
    max_wait_s: 900             # この秒内に配車できなければ未配車(捕まらない)=徒歩フォールバック
    net: null                   # 車道網 net.xml(null=runs 配下の *_car.net.xml を自動探索)
    # ---- 相乗り・並行配車 v-Ride-3(既定 OFF=v-Ride-1 と完全同一=単発配車のみ・shared キー無し)。
    #      ON 時: 同 step の複数予約を id 昇順で処理(並行配車)し、近接・同方向・回り道上限内の予約を
    #      capacity まで 1 台に束ねる(我々の決定論 greedyShared)。ride payload に shared(同乗者数)を追記。----
    shared:
      enabled: false
      capacity: 3               # 1 台に相乗りできる上限人数
      max_detour_ratio: 1.4     # 相乗りで許容する回り道の上限比(SUMO relLossThreshold 相当)

transit:
  file: data/transit_shibuya.json  # 定刻ダイヤ(乱れなし)。GTFS 実ダイヤに差し替え可
  gtfs_dir: null                # ODPT 等の GTFS(stops.txt 等)を置いたフォルダを指定すると実ダイヤに切替

# ---- 駅員・車掌 = 持ち場を持つアクター(actor model P3a。実装 src/society/transit_staff.py)----
# 正典: docs/plans/actor-model-migration-plan.md「3a 駅員・車掌」= 車掌をドア閉判断エージェントに
#   して**ダイヤ結合ループを内生化**する(ホーム密度 → 乗降時間 → 続行遅延 → 滞留)。
# 監査事実: 電車は実体ではなく(transit.has_service は時刻表の述語)、遅延を作っていたのは
#   env.feedback 規則1(主体なしの近似)と disaster の日次サイコロだけ。ペルソナに実在する
#   駅員/車掌/電車運転士 は地図に対応 POI カテゴリが無く work.bind_workplace が束ねられない
#   (no_category)ため、**一度も持ち場に立っていなかった**。
# ★ON にすると env.feedback 規則1 は**評価されない**(同じ物理の二重計上の防止。改札装置が
#   規則2 を置き換えるのと同じ線引き)。停車時間の式・閾値・上限・回復運転項は規則1 と
#   **同一の関数**を呼ぶので、既定サブフラグでは「誰が決めるか」だけが変わり数値は不変。
# ★env.feedback.enabled=false のときは本ブロックを ON にしても停車時間ループは動かない
#   (遅延の下流の消費者=退出/帰還の待ち・ext.transit_delay が全部あちら側にあるため)。
# 既定 OFF が保つ不変条件: 束ねを 1 件も行わない・dwell_decision / transit_staff_bound 0 件・
#   sim にも agent にも属性が生えない・プロンプト 1 バイト不変・L1 バイト一致。
transit_staff:
  enabled: false                # ★駅員・車掌アクター層の親トグル。false=完全 no-op(バイト一致)
  # ---- 持ち場への束ね(駅員・乗務員 → 駅ノード)----
  bind:
    enabled: true               # 親 enabled も要 true。false=判断だけ動かして束ねない実験用
    station_occupations: ["駅員"]              # 駅係員(改札・ホーム・案内)= 在席するだけ
    crew_occupations: ["車掌", "電車運転士"]    # 乗務員 = ドア閉を判断する層
    # 合成当直表(ペルソナ pool の duty_pattern は record 側にあり agent へ届かないため、
    # 名簿順(agent id 昇順)の index から決定論で割り振る。**乱数は 1 本も引かない**)。
    # 既に勤務窓を持つ個体の窓は上書きしない。日跨ぎの直は現行の勤務窓判定が表現できない
    # ので 24:00 で切る(= 終電帯は無人 → dwell_decision が unstaffed で出る)。
    first_open: "05:00"         # 最初の直の始まり(初電の帯)
    shift_hours: 8              # 1 直の長さ[時間](pool の duty_pattern.shift_hours と同値)
    n_shifts: 2                 # 1 日に回す直の数(05:00-13:00 / 13:00-21:00)
  # ---- 車掌のドア閉判断(= 停車時間延長 → 遅延)----
  dwell:
    enabled: true               # 親 enabled も要 true。true のとき規則1 は評価されない
    require_service: true       # 運行が無い step(終電後・運休)は停車時間を足さない
                                #   = 閉めるドアが無い。false にすると規則1 と全 step 完全同値
    # ★東京の実測則(Palmqvist / Tomii / Ochiai 2020 ほか): **+15 人/車両 ≒ +1 秒の停車時間**、
    #   通勤列車の総遅延の**約 9 割は 5 分以下の停車時間超過**。
    #   既定 false = env.feedback.transit.dwell_sec_per_pax(規則1 の既定係数)をそのまま使う
    #   = legacy の数値を 1 も動かさない。true のとき係数だけ dwell_s_per_15pax/15 に差し替わる
    #   (式・上限 dwell_cap_min・回復運転項 recovery は共有のまま)。
    calibrated: false
    dwell_s_per_15pax: 1.0      # 東京実証則の係数[秒 / 15人](calibrated=true のときだけ効く)
    log_every_steps: 1          # dwell_decision の記録間引き(観測装置の設定であって世界の量ではない)

# ---- ラッシュ時の車内 = シミュレートされた空間(Wave 4 II-1。実装 src/society/transit_interior.py)----
# 監査事実: 駅からの流入は**瞬間移動**だった(loc=outside → enter_area の 1 step)。渋谷に着く人の
#   大半は直前まで十数分、混雑率 111〜167% の車内で他人と密着していたのに、その時間は存在しなかった。
# ★前提: world.inflow_pulse.enabled が ON でなければ「同じ列車の乗客」という集団が立たない
#   (全員が別々の分に着く)。したがって本層は **2 つの ON の論理積**でしか動かない
#   (transit_staff が env.feedback の ON を要求するのと同じ「誰も読まない数字を書かない」線引き)。
# ★★会話は 1 本も増やさない: 車内は静かな同席(スマホ 70〜84% / うたた寝 / 読書)で、見知らぬ他人との
#   会話はほぼゼロ(車内の迷惑行為の第 1 位が「騒々しい会話」51.8% = 話しかけない規範が強い)。
#   同席は L1 に**記録するだけ**で、そこから何かが起きるかは既存の関係機構が街の中で決める
#   (= familiar strangers は通勤の規則性から自然に生まれる、という PNAS 2013 の枠組み)。
# 既定 OFF が保つ不変条件: train_* の L1 0 件・agent に属性が生えない・記憶に 1 行も入らない・
#   sim にも state が生えない・プロンプト 1 バイト不変・L1 バイト一致。
transit_interior:
  enabled: false                # ★車内層の親トグル。false=完全 no-op(バイト一致)
  ride_minutes: 15              # 乗車の長さ[分]。降車(帰還 step)から遡ってこの長さが車内
                                #   実効は max(1, round(ride_minutes / Δt)) step
  include_plan_returnees: true  # 計画駆動の圏外帰還者(planning.day_plan.boundary)も駅から帰るなら
                                #   列車に乗せる。★帰還時刻そのものは 1 ビットも動かさない
                                #   (その時刻に着く列車の名前を後付けするだけ = 読むだけ)
  # ---- 車両諸元の既定(路線表に当たらない路線はこれ)。20 m 4 扉のありふれた通勤形式 ----
  # ★基盤(src)は路線名のリテラルを 1 つも持たない(envpack ドクトリン)。実諸元は下の lines 表 = データ。
  default_line:
    cars: 10                    # 編成両数
    car_len_m: 20.0             # 1 両の長さ[m]
    capacity: 150               # 1 両の定員[人] ★物理的上限ではない(混雑率 250% まで乗る)
    seats: 51                   # 1 両の座席数
    doors: 4                    # 片側のドア数(= ドア脇区画の数)
    congestion: 1.30            # 混雑率アンカー(ピーク時・最混雑区間)
  # ---- 路線別の諸元と混雑率アンカー(match = 路線名の部分一致トークン。最長一致が勝つ)----
  # 混雑率は国土交通省の三大都市圏 混雑率調査(渋谷**方向**のピーク 1 時間・最混雑区間)。
  # ★半蔵門線は渋谷が最混雑区間ではない(ピークは渋谷の**先**)ので、渋谷到着時点の値としては低い。
  # 車両諸元は各形式の公表値。★銀座線だけ 16 m 3 扉(20 m 4 扉の定数を絶対に流用しない)。
  lines:
    - {match: "山手線",     cars: 11, car_len_m: 20.0, capacity: 157, seats: 51, doors: 4, congestion: 1.36}
      # E235 系 11 両(先頭 142 / 中間 160・中間の座席 51)= 編成 1,724 人。capacity は 1 両平均
    - {match: "埼京線",     cars: 10, car_len_m: 20.0, capacity: 160, seats: 51, doors: 4, congestion: 1.67}
      # ★渋谷方向の最混雑(167%)= 本シムで最も押し込まれる路線
    - {match: "銀座線",     cars: 6,  car_len_m: 16.0, capacity: 104, seats: 40, doors: 3, congestion: 1.53}
      # ★16 m 3 扉・6 両(先頭 93 / 中間 106・座席 28/40)。20 m 4 扉の定数を流用しない
    - {match: "田園都市線", cars: 10, car_len_m: 20.0, capacity: 153, seats: 52, doors: 4, congestion: 1.38}
      # 2020 系 10 両 = 編成 1,526 人(先頭 141 / 中間 152・座席 48/54)。池尻大橋→渋谷
    - {match: "東横線",     cars: 9,  car_len_m: 20.0, capacity: 150, seats: 51, doors: 4, congestion: 1.24}
    - {match: "副都心線",   cars: 10, car_len_m: 20.0, capacity: 150, seats: 51, doors: 4, congestion: 1.17}
    - {match: "半蔵門線",   cars: 10, car_len_m: 20.0, capacity: 150, seats: 51, doors: 4, congestion: 1.11}
    - {match: "井の頭線",   cars: 5,  car_len_m: 20.0, capacity: 150, seats: 51, doors: 4, congestion: 1.25}
  # ---- 時間帯の混雑倍率([開始分, 終了分, 倍率]・分 of day の半開区間。最初に当たった窓が勝つ)----
  # アンカーは「ピーク 1 時間」の値なので、日中はその 60〜80%・深夜早朝は更に下へ落とす。
  congestion_scale:
    windows:
      - [420, 540, 1.00]        # 07:00-09:00 朝ラッシュ = アンカーそのもの
      - [540, 1020, 0.70]       # 09:00-17:00 日中
      - [1020, 1200, 0.95]      # 17:00-20:00 夕ラッシュ
      - [1200, 1380, 0.60]      # 20:00-23:00 夜
    default: 0.45               # それ以外(早朝・終電帯)
  # ---- 立客の区画別シェア(1 両の立位定員 = 定員 − 座席 を割る比)----
  # 実測: 立客はドア脇の吹き溜まりに ~49%・座席前の帯に ~31%・残りが中央通路。
  zone_share: {door: 0.49, front: 0.31, aisle: 0.20}
  # ---- 車両選択(logit-lite = 誤差項なしの決定論 argmax)----
  # ★UCL の推定にある「降車駅の出口位置(重み ~0.44)」の項は**持たない**: 本シムの駅は
  #   1 ノードで全員が同じ改札から出るため恒等的に消える。消える項を重みつきで残すのは嘘。
  car_choice:
    pos_weight: 1.0             # 編成上の「好みの位置」との距離のペナルティ
    load_weight: 0.6            # その車両に既に居る地図内乗客数 / 目標乗車人数 のペナルティ
  # ---- 車内行動(静かな同席の 3 種)。★会話はここに無い(語彙として存在させない)----
  # スマホ 70〜84% の中央、うたた寝は**着席時のみ**(立位では他 2 種へ重み比で再配分)。
  activity: {smartphone: 0.77, doze: 0.13, read: 0.10}
  memory:
    enabled: true               # 降車後に読む圧縮記憶 1 行(乗車 1 回につき 1 行だけ)
    crowd_bands: [0.9, 1.5]     # 乗車率の段の境目 → 空いていた / 混んでいた / ぎゅうぎゅうだった
                                #   ★文面に数字は 1 つも出ない(個体は混雑率という統計量を知らない)
  # ---- 不快・疲労(Evans & Wener: 効くのは車両平均ではなく**座席周りの局所密度**)----
  comfort:
    density_floor: 1.0          # 局所密度がこれを超えた分だけ疲労が乗る(1.0 = 公称容量)
    fatigue_per_step: 0.02      # 1 step・超過密度 1.0 あたりの疲労[/step]
    fatigue_max: 0.12           # 1 乗車で乗せる疲労の上限(安全弁)
  # ---- 同席の記録(familiar strangers の素材。ここから何も起こさない)----
  copresence:
    enabled: true
    max_pairs_per_car: 24       # 1 乗車 1 人あたりに控える同席相手の上限(L1 の量の上限)
    max_pairs_per_day: 8        # ★1 日 1 **人**あたりの記録上限。総量の硬い上限は
                                #   n_agents × この値。グローバルな日次カウンタにしないのは
                                #   resume のため(sim 側の日次カウンタは checkpoint に載せられず、
                                #   上限が binding なランで resume ≠ straight になる)。
                                #   個体側の予算なら agents pickle に自然同梱される
    adjacent_only: false        # true = 同一/隣接区画の対だけを記録する(相互作用可能な距離に限る)
  # ---- 車掌の巡回(transit_staff も ON のときだけ)----
  conductor:
    enabled: true
    patrol_interval_steps: 1    # 何 step ごとに 1 両進むか
    dwell_load_weight: 0.0      # ★既定 0 = 観測のみ。車内の立客数を停車時間の負荷へ足す重み。
                                #   0 にしてあるのは、ホーム密度 → 停車時間の較正(+15 人/車両 ≒ +1 秒)を
                                #   既に env.feedback 規則1 が**ホーム側の人数**で持っているため
                                #   (素で足すと同じ物理の二重計上)。0 でも payload には出る

lod:
  max_llm_per_step: 300         # LLM 発火の step 上限(実機実測で更新)
                                # ★注意: この上限がかかるのは _phase_drive の発火 2 箇所と返答保証の
                                # 計 3 箇所(scheduler.py の budget.take())のみ。**朝の計画と夜の内省は
                                # 予算外の無条件呼び出し**=日次総呼数はこの値では拘束しきれない
                                # (実測 14〜25 呼/agent/日。docs/research/finals-llm-budget.md)。
  # (削除) congestion_surprise: 驚きゲートは 2026-07-04 に欲求駆動発火へ移行して消滅し、
  #         このキーを読むコードは存在しなかった(死んだキー。第P0バッチ 2026-07-29 に削除)。
  # ---- 予算のN比例化(P2-S6a・既定OFF=バイト一致)。docs/plans/million-scale.md §2.3 ----
  # 全員思考の「200体相当の思考密度をNに比例して維持」: ON で step 上限を
  # ceil(density × run.n_agents) に置換(固定 max_llm_per_step は使わない)。
  # density=0.15 は 200体較正 day1 実測(4,293呼/144step/200体)。P3 ローテーション導入後は
  # N を「思考層の在場数」に差し替える(presence ゲートとセットで拡張)。
  n_proportional:
    enabled: false
    density: 0.15
  # ---- 入力解像度LOD(第30バッチ・既定OFF=バイト一致)。docs/plans/input-resolution-lod.md ----
  # 「世界に対する解像度」の個体差: 知覚/記憶/フィードの注入件数を水準別に振る(呼数不変=R1安全)。
  # 割当は cognition/lod.py の共通軸機構(trait非依存・軸専用 stream "lod_input_res")。
  # levels 省略時は lod.py の既定(narrow/mid/wide・mid=現行定数。beliefs と全員共通行は対象外)。
  input_res:
    enabled: false

# ---- ペルソナプール / 日次ローテーション(W2 P3・既定 OFF=run.n_agents 固定=ゴールデンバイト一致)----
# docs/plans/w2-execution-plan.md §4 P3 / docs/plans/persona-pool.md §5「presence 純関数」・§9。
# enabled=true で 100万ペルソナプール(data/persona_pool: L1-L5 シャード + meta.json)から日ごとに
# 「今日この街にいる人(present)」を決定論選択し、いない人はドーマント化(コストゼロ・記憶保持)。
# 再来街時は同一実体として記憶が続く。presence は stream("presence", persona_id, day) の純関数
# (k 非依存・trait 非依存・resume 不変)。false=現行の run.n_agents 固定=挙動バイト一致(掟)。
# ON 時は S6a の N 比例 cap の N を「当日の在場数 len(sim.agents)」に自動で差し替える。
pool:
  enabled: false
  dir: data/persona_pool     # P5 生成物(L1-L5 シャード + meta.json)のルート
  present_cap: 300           # 日次の総在場数の上限(層優先で充足)。ON 時は N=在場数
  dormant_cap: 0             # ドーマント退避ストアの上限(0=無制限)。>0 で LRU 退避(有界=persona-pool §3.3)
  # ---- 退避スリム状態の台帳幅(第86バッチ保守 M-3。既定=現行値=挙動不変)----
  relations_cap: 20          # 退避する関係台帳の件数(接触回数の多い上位)。
                             #   ★dunbar(relations.dunbar)ON との相互作用: 休眠した関係は
                             #     closeness=0 に退避されるうえ接触回数も伸びないので、20 件切りだと
                             #     **再会する前に台帳から落ちやすい**(第75バッチ実測の持ち越し)。
                             #     忘却/再会を観察するランではここを広げる(例 60)。
  episodes_cap: 30           # 退避する統合エピソードの件数(直近から)。同上の理由で広げられる口。
  # ---- 層別クォータ(DP-U3 案A・既定 OFF=現行の層優先 break と 1 バイト一致)----
  # 正典: docs/plans/proposal-dp-u3-observe-250k.md §1.2「案 A の中身」。
  # 層優先は「優先順に埋めて途中 break」なので、上位層が present_cap を食い切ると下位層が
  # 構造的に全滅する(第91 実測: cap 25万 の平日は workday_shift が埋め切り cadence /
  # stochastic が 0 人 = 来街者ゼロの街)。true にすると cap を層ごとのクォータへ分配する:
  #   quota[t] = round(present_cap × 当日資格者[t] / Σ 当日資格者)  ← 構成比を保存
  # 端数は整数演算の最大剰余法(同値は層の固定順)で合計 = cap に正規化。溢れた層だけ従来と
  # 同じ当日ランキング(presence_rank stream)で切る。**追加する乱数はゼロ**。
  # ★ON では resident も比率で切られる(「上位層は毎日不変」は ON では成り立たない)。
  tier_quota:
    enabled: false

# ---- LLM一括発行(P2-S6b・既定OFF=バイト一致)----
# 個体間で独立なLLMフェーズ(朝計画。夜内省は次段)を「build id順→未命中のみ並行発行→
# id順apply」に切替。イベント列・カウンタ・キャッシュは逐次と完全同一(test_batch_llm)。
# 実LLMサーバでは並行発行が継続バッチングを充填=スループットがper-callレイテンシから解放。
engine:
  batch_llm:
    enabled: false
    workers: 8                # 並行発行数(実LLM時。mock/1では逐次=同一経路)

# ---- 方針キャッシュ(P2-S7・既定OFF=バイト一致)。docs/research/interstitial-life.md §4.4-b ----
# 朝計画・日中熟慮の出力を k 非依存の物理量キー(職業/年代/曜日型/時間帯/場所種別/天気/活動cat)で
# キャッシュし、類似状況の再訪で LLM 呼をスキップ。本番採否はブラインドA/B比較で決定(既定OFF運用)。
cognition:
  policy_cache:
    enabled: false
    reuse_rate_cap: 0.6   # 再利用の確率ゲート兼ハード上限(多様性の下限を保証)
    per_agent_max: 16     # 個体あたりキャッシュ上限
    global_max: 4096      # 全体 LRU 上限
    max_relax: 2          # near-match 緩和の最大段(0=完全一致/1=+場所種別/2=+時間帯)
  # ---- 観測チャンネル o_c(t)(第80バッチ 2026-08-01・**既定 OFF**)----
  # 驚き駆動発火(cognition-design-record.md §2.3-2.4)の入力側 o_c を、外界/身体/予測不成立の
  # 3 源で定義して観測サイドカー channels.parquet へ書き出す層。定義は
  # src/society/cognition/channels.py が唯一の源(14 本。うち予測不成立は第81 まで値=null の枠)。
  # ON にしても **世界は変わらない**: 読み取り専用・乱数ゼロ・LLM ゼロ・L1/L2/L3 バイト不変で、
  # サイドカーが 1 本増えるだけ(第77 live_viewer / 第78 state_hash と同じ「観測はシムを変えない」)。
  # σ_c(発火判定式の分母)は scripts/measure_sigma.py がこの parquet から実測して
  # data/calib/sigma_c.json へ凍結する。較正テーブルと σ_c の sha256 は run_manifest.json へ。
  channels:
    enabled: false
    every_steps: 1        # 観測の採取間隔(1=毎 step。位相は step=0 を含む=L3 と揃う)
    sigma_file: ""        # 空=data/calib/sigma_c.json(無くてもランは落とさない=来歴に absent と残す)
    calib_file: ""        # 空=conf/cognition/calib_default.yaml(壊れていたら即エラー)
  # ---- 閾値発火 + 認知イベントキュー + 同期バリア(第81バッチ 2026-08-01・**既定 OFF**)----
  # 「1 step = 10 分」が兼ねている『世界の進行』と『思考の頻度』を分離する層
  # (physics-instructions.md Part P0 / cognition-design-record.md §2.3・§3.3)。
  #   S_i(t) = Σ_c g_ic·|o_c(t) − ô_ic|/σ_c、  発火 ⟺ S > θ_i     … 毎 tick コード側のみ・LLM ゼロ
  # 発火源は 4 種: periodic(文脈別の基本周期=較正テーブル)/ salience(驚き=上式)/
  # internal(ニーズ閾値の上向き横断)/ social(会話返答・夜内省・朝計画の第一級化=§6-3)。
  # ★ON は journal 等級・affects_k=true(LLM 呼の発生点そのものが変わる)。旧 k 非依存則は
  #   OFF のときに従来どおり成立し、ON では「スケジュール列が同一なら世界が同一」に置き換わる。
  # ★後方互換の要: sources=[periodic] / period_override_min=10 / period_cv_scale=0 /
  #   sleep_period_mult=1.0 が「全員の基本周期 10 分・他の発火源なし」= 現行の特殊ケース。
  fire:
    enabled: false
    sources: [periodic, salience, internal, social]
    period_override_min: 0    # >0 = 全文脈の基本周期をこの分数で上書き(0=較正テーブルに従う)
    period_scale: 1.0         # 較正テーブルの基本周期にかける全体倍率
    period_cv_scale: 1.0      # 周期のばらつき(較正 cv への倍率)。0=乱数を1本も引かない
    sleep_period_mult: 6.0    # 睡眠中の周期の伸び(P0(2)「睡眠中は伸びる」)
    theta_scale: 1.0          # θ の全体スケール(較正は第83のパイロット。ここは実験レバー)
    max_contrib: 3            # L1 に残す S 寄与内訳の件数(観測装置の設定)
  # ---- 監視仕様 watch spec(第82バッチ 2026-08-01・**既定 OFF**。fire ON が前提)----
  # 設計 §2.2:「期待値 ô_ic は **LLM が出力する**」「名前付きトリガは**制約付き DSL・
  # 自由文は不可**」「ホワイトリスト + 数値クランプで検証し、**不正出力なら前回仕様を維持**」
  # 「**有効期限は持たせない**(時間で失効させると時間軸が裏口から入る)」。
  # ON にすると発火プロンプトの末尾に watch 節(記号一覧 + JSON の形)が 1 つ増え、応答の
  # "watch" キーが ô とトリガになる。★プロンプトに出るのは不透明記号 c01… と中立ラベルだけ
  # (チャンネル id は factors 層のキーを含みうるので出さない = no-fingerprint)。
  # ★model_revision(計画書 §6-3): **驚き発火のときだけ**中立な 1 行を足し、世界モデルの
  #   書き直しを促す。beliefs ON なら未検証の伝聞信念の確信度も決定論規則で見直す。
  watch:
    enabled: false
    clamp_sigmas: 6.0         # ô を「いまの観測から σ 何本ぶん」までに抑える(数値クランプ)
    max_triggers: 3           # 1 個体が同時に持てる名前付きトリガの本数
    trigger_weight: 1.0       # w_ij(単位は σ)。**LLM は設定しない**(§2.4 と同じ理由)
    name_max: 24              # トリガ名の最大長(自由文の書き込み先にしない)
    model_revision: true      # 驚き発火に中立 1 行(§6-3)。false=watch 節だけ足す
    belief_revision: 0.9      # model-revision 時に未検証の伝聞信念の確信度に掛ける係数
    belief_max_facts: 5       # 1 回の見直しで触る信念の上限(イベント量を有界にする)
  # ---- 感度 g / 閾値 θ の更新則(第82バッチ・**既定 OFF**。fire ON が前提)----
  # 設計 §2.5: g ← g + η(r − ρ·ē) − λ(g − g⁰)  /  §2.6: θ ← θ + μ(f̄ − f*)
  #   ē=最近の平均誤差(**慣れ**)・r=結果に効いた度合い(**感作**)・λ=ペルソナへの引き戻し。
  #   「**単なる反復は慣れ、結果を伴う反復は感作**」= 生の予測誤差だけで駆動してはならない。
  # LLM は一切関与しない(§2.8「自分の過敏さは自分では設定できない」)。
  # ★g の更新は**認知イベント 1 回につき 1 度**(Δt 非依存)。ē の EMA だけ半減期を分で持つ。
  # ★θ の恒常性は**日境界 1 回**(§2.6「μ の時定数は日オーダーにすること」)。
  g_update:
    enabled: false
    eta_scale: 1.0            # 可塑性 η の全体倍率(個体値はペルソナ写像が決める)
    lam_scale: 1.0            # 引き戻し λ の全体倍率(0 にすると性格が履歴に上書きされる)
    rho: 0.10                 # 慣れの重み(平均誤差 1σ あたりどれだけ鈍らせるか)
    ebar_halflife_min: 120.0  # ē の半減期[分](**分で持つ**= Δt 非依存)
    r_window_min: 60          # 発火から結果を測るまでの窓[分](credit assignment)
    r_gain: 4.0               # 結果スカラの差分 → g の単位への倍率
    max_pending: 12           # 同時に開ける credit 窓の本数(適格性トレースの上限)。
                              # 1 本だと次の発火が前の窓を上書きして**感作が死ぬ**(実測済み)
    g_min: 0.05
    g_max: 5.0
    theta_mu: 0.02            # 恒常性の利得 μ(日境界 1 回だけ効く)
    theta_target_per_day: 8.0   # f*: 目標**驚き発火**率[件/日/人]。★仮値=第83で較正
                                #    (θ が門番をしているのは salience だけなので制御量もsalience)
    fbar_weight: 0.5          # f̄ の日次 EMA 重み(小さいほど時定数が長い)
    theta_min_mult: 0.25
    theta_max_mult: 4.0
    log_every_steps: 1        # g/θ 軌跡サイドカーの採取間隔(0=書かない)。観測装置の設定
  # ---- Perception / Intent 契約(第85バッチ 2026-08-01・**既定 OFF**)----
  # physics-instructions.md Part P1: エージェントコアと世界の結合面を 2 つのデータ型に
  # 限定する層(物理エンジンはこの契約の**裏側**に入るので、契約が先・エンジンが後)。
  #   Perception … 1 回の思考が受け取る世界情報の唯一の型(視覚/聴覚/身体/内部 + salience)
  #   Intent     … 思考の出力の唯一の型(移動目標・急ぎ度・回避傾向・対話意図・滞在意図。
  #                **経路の各点・速度の時系列は含めない**= 実行は世界側・物理側の責務)
  # ★ON にしても**この時点では挙動は変わらない**(P1(3)): 契約経路は情報の通り道を
  #   変えるだけで、組み上がるプロンプト文字列は 1 バイトも変わらない。
  #   したがって契約 ON/OFF で L1/L2/L3・乱数 draw・LLM 呼数がすべて一致する
  #   (tests/test_perception_contract.py が同 seed 288 step で機械的に固定する)。
  # ★salience は第80 channels の σ 正規化誤差を**再利用**する(二重計算しない)。
  #   channels/fire が OFF のランでは salience は空 = 欠測(0.0 で埋めない)。
  contract:
    enabled: false
  # ---- engaged モード = AUTOPILOT / ENGAGED の 2 状態機械(第87バッチ 2026-08-03・**既定 OFF**)----
  # 原文書: docs/plans/source/design-discussion-20260802.md §8(突入5条件・脱出4条件・補助規則3つ)。
  # 第81(fire)が答えたのは「いつ考えるか」= **点**。ここが足すのは「いつまで考えるか」= **区間**。
  #   AUTOPILOT … スクリプト実行・LLM 呼びゼロ / ENGAGED … 会話・再計画・内省のエピソード
  # 突入5条件: (1) S>θ_in (2) 社会的直接性=話しかけられたら即突入(関係の薄い定型接触は
  #   1ターンのテンプレ応答=LLM 呼ゼロで流す) (3) 実行不能例外(第86 plan_exception)
  #   (4) 欲求臨界(ニーズ閾値の上向き横断) (5) 予定思考(朝計画=全員・夜内省=高解像度層)
  # 脱出4条件: (1) 解消(会話は**双方**の別れ挨拶=Schegloff&Sacks 1973 の terminal exchange /
  #   再計画は検証を通る計画の生成) (2) 減衰(S < θ_out=ratio×θ_in。**ヒステリシス**)
  #   (3) ターン上限(切り上げターンを1回挟んで自然終了) (4) プリエンプト(must 期限・欲求臨界
  #   → 中断内容を1行だけ兆しメモリへ=「あとで考えよう」の再燃フック)
  # 補助規則: 不応期(脱出後30分は同種刺激の θ を引き上げ)/ **会話は両者 ENGAGED が成立条件**
  #   (片方 AUTOPILOT なら挨拶で終わる)/ 全エピソードのログ(L1 episode_start / episode_end)
  # ★**fire ON が前提**(watch / g_update と同じ)。cognition.fire が OFF なら完全 no-op。
  # ★ON は journal 等級・affects_k=true: エピソードが既存発火を束ねるので呼数が変わる。
  #   ただし **generate() の呼び出しサイトは 1 つも増やさない**(§6 の予算整合)。
  # ★fingerprint_risk=possible: ON のとき会話ターンのプロンプトに「切り上げるなら end と
  #   書いてよい」の 1 節が増える(=終結の宣言路。§8 が要求した設計なので隠さない)。
  #   機構語・実験条件語・因子名は 1 文字も出さない。
  # ★乱数 stream を 1 本も引かない(全段決定論。高解像度層の選定も _stable_hash)。
  # R1: enabled=false で新イベント 0 件・L2 に列なし・manifest にキーなし・プロンプト 1 バイト不変。
  # 実装 src/society/cognition/engaged.py。
  engaged:
    enabled: false
    # ---- §8 の初期パラメータ(**すべて較正対象**)------------------------------------ #
    # 較正目標(§8): 縦煙テストの最初の1シミュ日で
    #   ・1人あたり平均エピソード数 **4〜8 件/日**
    #   ・**engaged 滞在時間が起床時間の 1〜2 割**
    # に収まるよう調整する。最大のリスクは θ_in の較正(低すぎれば予算崩壊・高すぎれば
    # 誰も考えない世界)で、θ_in 自体は cognition.fire.theta_scale と較正テーブル側の量。
    theta_out_ratio: 0.5      # θ_out = ratio × θ_in。**必ず 1 未満**(これが無いと閾値境界で発振)。
                              # 文献の唯一の推奨は Canny 1986 の high:low=2:1〜3:1(=0.33〜0.5)で
                              # §8 の 0.5 はその帯の端。認知科学側に標準値は無い=掃引対象。
    turn_cap: 12              # 会話のターン上限(退行ループの保険)。Generative Agents は 8 ラウンド、
                              # CAMEL は 40 メッセージで同じ役割を果たす(フラグは助言・上限が権威)。
    replan_cap: 3             # 再計画の試行上限(= 思考系エピソードの実効ターン上限)
    refractory_min: 30        # 不応期[シミュ内分]。脱出後この間は**同種**トリガの θ を引き上げる
    refractory_mult: 2.0      # 不応期中に θ_in へ掛ける倍率(1.0=不応期を無効化)
    min_stay_min: 10          # 最短滞在[分]。閾値ギャップだけでは止まらない dithering の保険
                              # (O'Brien & Arkin 2020: 駆動量がなめらかに境界を往復する場合)
    talk_idle_min: 20         # 会話が生きているとみなす無音の上限[分]。超えたら減衰判定に入る
    familiar_closeness: 1.0   # relations ON: これ未満の親密度からの接触は定型で流す
    familiar_contacts: 2      # relations OFF: 同上を接触回数で測る(closeness が台帳に無いため)
    reflect_frac: 0.05        # 夜内省をエピソード化する割合(§8「高解像度層のみ」。第88 の
                              # cognitive_tier が入るまでの暫定。_stable_hash の決定論選定=乱数ゼロ)
    wrapup: true              # ターン上限で切り上げターンを 1 回挟む(false=即終了)
    sign_memory: true         # プリエンプト時に兆しメモリを 1 行書く(既存 remember に kind="sign")
  # ---- 拒否通知の段階 conf 化 IF-B(第94バッチ 2026-08-05・**既定 "silent"=現行と完全同一**)----
  # 監査 §2-C: 裁定拒否には「通知される拒否」と「まったく通知されない拒否」が混在している。
  # 無音だったのは 所持金不足の出店 / 敷金不足の転居 / 空き住戸なし / 交際申込の相手不在 /
  # 経路が張れない / verify の no_target・no_witness・no_channel の 8 件(全て裁定側の1点ずつ)。
  # これは SayCan が自ら述べた限界(「弾かれたのは分かるが**なぜ**かが返らない」)と同じ位置で、
  # Inner Monologue の答え(失敗の**記述**を自然言語で戻すとループが閉じる)を 3 水準で入れる。
  #   silent  … 現行と完全同一(無音。既定=ゴールデン L1 バイト一致)
  #   memory  … 定型文 1 行を当人の記憶へ + L1 action_reject{kind, reason}
  #   engaged … memory + 認知イベントを「今」へ前倒し(既存 note_plan_exception と同じ流儀。
  #             cognition.engaged が OFF のランでは **memory へ縮退**する)
  # ★心理側の根拠は **Ovsiankina 効果**(中断課題の再開率 67%)+ Masicampo & Baumeister 2011
  #   (計画を立てるだけで侵入思考が消える → 再計画が実ったら失敗理由を**降格**する)。
  #   **Zeigarnik 効果は 2025 年のメタ分析(59文献・再生比 0.99)で否定済み=根拠に書かない。**
  # ★no-fingerprint との両立: 通知文は **(行為種, 理由コード) の純関数**で、config・実験条件・
  #   k・特性・時刻・数値を 1 つも読まない = 同じ拒否は全実験条件で同一バイト列(テストで固定)。
  # ★対象外(3件・理由つき): envfeedback 系(改札規制・遅延・poi_hold)= あちらの
  #   「プロンプトに 1 バイトも足さない」は意図的規約 / 閉店が候補から静かに消える件 =
  #   選択**前**のフィルタであって拒否ではない / config ゲート層の静かな無視 = 機能 OFF の
  #   世界に「できなかった」を出すのは矛盾。詳細は src/society/reject.py の docstring。
  # ★乱数 stream を 1 本も引かず、generate() の呼び出しサイトを 1 つも作らない。
  rejection_notify: silent

# ---- 開放行動+価値の4軸(第17バッチ 2026-07-10。既定 OFF=現行と完全同一)----
# LLM 自身が自由記述で行動を決める "do" をメニューに追加し、価値(実用/感情/社会/認識)で
# 観測する(決定論辞書+中立自己申告のブレンド)。接地: docs/research/desire-value-theory.md。
freedom:
  open_actions: false           # "do" 行をヘッダに足す(OFF=ヘッダ・挙動バイト一致)
  satiation_gain: 0.3           # 価値の飢餓→ゲージ感度の変調幅(0=純観測。k掃引では0推奨)
  sat_step: 0.15                # 自由行動1回の充足量(限界効用逓減つき)
  sat_decay: 0.15               # 日次の中立(0.5)への回帰率(需要の再蓄積)
  max_minutes: 240              # 1回の開放行動の上限時間(分)
  # ---- 未定義行動レジスタ + 沈黙の第一級化(第70バッチ IDEA② 2026-07-31。既定 全 OFF=バイト一致)----
  # undefined_register: enum 外だが構文としては行動を主張している出力(= JSON は読めて "action" は
  #   あるが、既知の動詞に当てはまらない)を捨てずに L1 `undefined_action` として記録する。
  #   現行はこれが `fallback{reason:"parse_error"}` = JSON 崩れと同じ箱に入って内容ごと消えている。
  #   ON でも **プロンプトは 1 バイトも変わらない**(パース後の振り分けだけ)= LLM 呼数・乱数不変。
  #   保存則: 振り分けなので `llm_fallback_rate + undefined_action_rate` が旧 `llm_fallback_rate` に一致。
  #   ★正直な限界: mock は enum 内しか返さないので、実際の発火は実 LLM ランに限られる。
  # explicit_nothing: 「関わらない/何もしない」をヘッダの選択肢に 1 行だけ足す(open_actions の "do"
  #   1 行と完全同型)。parse は ON/OFF に関わらず常に寛容受理する(P2 の move_home 等と同じ流儀=
  #   OFF は「提示されないだけ」)が、L1 `stay{reason:"chosen_nothing"}` を出すのは ON のときだけ
  #   =既定 OFF はイベント 0 件・ヘッダ不変・ゴールデンとバイト一致。
  undefined_register: false
  explicit_nothing: false
  # ---- 生活の自己決定 P2(D3 棚卸し。docs/plans/agent-freedom-plan.md #6-#10。既定 全 OFF=バイト一致)----
  # 5項目を個別 bool で切る(中立メニュー提示+決定論裁定=R1 呼数不変)。ON 化はユーザー判断(daily/production は触らない)。
  p2:
    move_home: false            # #6 空き住戸への転居(敷金=現金障壁)
    buy: false                  # #7 発火時の消費意思(非発火の buy 抽選はフォールバックで残す)
    study: false                # #8 学校/図書館での聴講(記録のみ。賃金経路は Skill 討議後)
    partnership: false          # #9 交際の申込/別れ(相手側の応答は将来拡張)
    deviance: false             # #10 無許可出店(既存 enforcement が近傍で摘発)
    deposit: 50000              # #6 引っ越しの敷金(1ヶ月分の家賃相当の現金障壁)
    deviance_fine: 5000         # #10 無許可出店の摘発時の罰金(既存 enforcement 機構に接続)
    partner_closeness: 15.0     # #9 交際成立の closeness 閾値(household 既定と同値。household OFF 時の後退値)

# ---- 主観的世界モデル(第20バッチ 2026-07-12。既定 OFF=現行と完全同一)----
# 各エージェントの「世界の解釈」: C1 期待形成(場所×時間帯の人出EMA=検証可能な仮説)+
# C2 可制御性(全員0.5起点・世界の応答だけで分岐=純経験の経路依存)+ C6 規範予期
# (新しいことを始める人がいる街かの記述規範)。日次 worldview イベントで観測。
# 乱数ゼロ・呼数不変。接地: docs/research/world-models.md C1/C2/C6。
worldview:
  enabled: false
  crowd_alpha: 0.2              # C1: 期待EMAの学習率
  expect_line: true             # C1: 「いつもと違う」1行(差が gap_min 以上のときだけ)
  gap_min: 3.0                  # C1: 期待との人数差の閾値
  ctrl_line: true               # C2: 手応え/無力の自然文1行(閾値超えのみ)
  ctrl_step: 0.15               # C2: 世界の応答1件あたりの更新幅(限界効用逓減)
  weak_scale: 0.3               # C2: 弱い応答(売上・閲覧・参加・賛同)の倍率
  ctrl_hi: 0.7                  # C2: これ以上で「手応え」文
  ctrl_lo: 0.3                  # C2: これ以下で「無力」文
  ctrl_daily_strong: 2          # C2: 強い応答の日次計上上限(応答洪水での全員天井=飽和を防ぐ)
  ctrl_daily_weak: 3            # C2: 弱い応答の日次計上上限
  norm_line: true               # C6: 記述規範1行(全員共通)
  norm_window_days: 7           # C6: 開拓的行動(出店・提案・主催・結成)の集計窓
  norm_hi: 0.02                 # C6: 1人日あたり率がこれ以上で「珍しくない」
  snapshot: true                # 日次 worldview イベント(観測の要)

# ---- 群のオントロジー(文化圏×経験の世界観共有群。2026-07-21。既定 OFF=属性なし=バイト一致)----
# 「地震に慣れた人と、地震をほとんど経験しない旅行者では行動が大きく異なる」という外部助言を受け、
# 各エージェントに「文化圏×経験」の群を1つ割り当てる。割当は安定ハッシュ(seed, persona id)=run.seed
# 非依存(同一設定なら全ランで同一人物は同一群=比較実験の要)・乱数ゼロ・traits/k 非参照(因子と直交)。
# 行動分岐はルールで書かず、群の「経験の事実」1行(groups.*.line)だけをプロンプトに注入して LLM に委ねる
# (nature-like 方針)。群の割合(composition)を振る A/B で「地震慣れ層の割合→街の反応」を精密に予測する。
# 本番 ON はユーザーが割合を決めてから(daily/production は触らない=既定 OFF のまま)。
ontology:
  enabled: false                # 既定 OFF=属性なし・プロンプト不変=ゴールデン L1 バイト一致
  seed: 20260721                # 群割当の安定ハッシュ種(run.seed と独立=ラン間で同一人物は同一群)
  groups:                       # 群の定義はデータ駆動(基盤コードに文化名・地名リテラルを書かない)
    jp_metro:   { label: "都市圏在住の日本人",   line: "長く都市部で暮らし、地震や混雑した街には慣れている。", quake_exp: high, city_exp: high, ja: native, drill_exp: high, drill_line: "避難訓練には何度も参加したことがあり、揺れたらまず身を守り指定ルートで動く手順が身体に染みついている。" }
    jp_other:   { label: "国内他地域からの来街者", line: "国内の別の地域から来ており、地震には慣れているがこの街の土地勘は薄い。", quake_exp: high, city_exp: mid, ja: native, drill_exp: high, drill_line: "毎年の避難訓練で手順は身体に入っているが、この街の避難経路や集合場所には不慣れだ。" }
    asia_visit: { label: "アジア圏からの旅行者",  line: "海外からの旅行者で、大都市には慣れているが地震の経験は少なく、日本語は限定的だ。", quake_exp: low, city_exp: high, ja: partial, drill_exp: low, drill_line: "避難訓練にはほとんど参加したことがなく、いざという時にどう動けばよいか自信がない。", wv_offsets: { controllability: -0.05 } }
    west_visit: { label: "欧米圏からの旅行者",   line: "海外からの旅行者で、地震をほとんど経験したことがなく、日本語はほぼ話せない。", quake_exp: none, city_exp: mid, ja: none, drill_exp: none, drill_line: "避難訓練を受けた経験がほとんどなく、非常時の手順や標識の意味がすぐには分からない。", wv_offsets: { controllability: -0.1 } }
  # 層別の群構成比(合計は正規化されるので厳密に 1.0 でなくてよい)。tier は P3 presence の実層名:
  #   resident / duty / workday_shift / cadence / stochastic(world/presence.py)+ 直接ラン用 default。
  composition:
    resident:      { jp_metro: 1.0 }                                              # L1 住民/L5 議員
    duty:          { jp_metro: 1.0 }                                              # L5 役割(駅員/運転士/警察/配信者)
    workday_shift: { jp_metro: 0.85, jp_other: 0.15 }                             # L2 域内従業者
    cadence:       { jp_metro: 0.7,  jp_other: 0.3 }                              # L3 定期来街(学生/常連)
    stochastic:    { jp_metro: 0.45, jp_other: 0.40, asia_visit: 0.10, west_visit: 0.05 }  # L4 非定期来街
    default:       { jp_metro: 0.8,  jp_other: 0.2 }                              # プール非使用の直接ラン(n_agents 生成)用
  # ---- 防災訓練経験(方式A。第41バッチ 2026-07-21)。文化圏群の drill_line を別行として付加する
  #      (既定 line は不変=将来 ON でも割当は変わらない)。enabled で訓練句を入/切=A/B に使う。
  #      根拠: 事前の避難訓練参加者は非参加者より避難率が高い(調整 OR=1.99, 東日本大震災 2,314名)。
  drill:
    enabled: true               # ontology ON 時に文化圏群の訓練経験1行を注入(false で行を消す=割当不変)
  # ---- 直交する第2軸(方式B。第41バッチ)。文化圏軸と真に独立な軸を別名前空間で持つ。軸ごとに
  #      独立ハッシュ(_stable_uniform(seed + seed_offset, pid))で割当=同一 pid でも文化圏群と
  #      無相関(直交)。既定 OFF・軸未指定は現行と完全同一(assign_group は axes を読まない)。
  #      第1軸=info_behavior(情報行動・情報源信頼)。根拠: 災害情報の入手手段が 18-29歳 SNS 76.6%>
  #      TV 73.8%・70歳+ TV 91.9%(内閣府 防災世論調査)=年代で SNS→公式へ勾配。年齢は人口統計 P0
  #      属性で traits/k と独立=R1 直交。ステレオタイプ断定を避け「一人称の行動の事実」で書く。
  axes:
    info_behavior:
      seed_offset: 101          # 文化圏軸(seed のみ)と独立なハッシュ=軸間の割当は無相関
      groups:                   # 断定(「若者は〜」)でなく一人称の行動の事実(文言は config 由来)
        info_sns:      { label: "SNS一次情報を頼る人", line: "気になることがあると、まずスマホで現地の投稿や短い動画を探して状況をつかもうとする。" }
        info_mixed:    { label: "両方を使い分ける人",   line: "気になることは、まずスマホで調べつつ、大事な判断はテレビや公式の知らせでも確かめる。" }
        info_official: { label: "公式・放送を頼る人",   line: "大事な知らせは、テレビや駅・行政のアナウンスで確かめてから動く習慣がある。" }
      bands:                    # 年代条件付き構成比(agent.age がある時に優先・キー=年齢下限)。SNS→公式へ勾配
        0:  { info_sns: 0.60, info_mixed: 0.30, info_official: 0.10 }   # ~29: SNS 優位(内閣府。下端で全若年を捕捉)
        30: { info_sns: 0.45, info_mixed: 0.35, info_official: 0.20 }   # 30-44
        45: { info_sns: 0.30, info_mixed: 0.35, info_official: 0.35 }   # 45-59
        60: { info_sns: 0.15, info_mixed: 0.20, info_official: 0.65 }   # 60~: 公式/放送 優位
      composition:              # age 不明時の全体分布(tier 別に振れる)。渋谷=若年濃い
        default: { info_sns: 0.45, info_mixed: 0.30, info_official: 0.25 }
    # ---- 第3軸=同行者構成(単独/連れ)。第42バッチ 2026-07-21。文化圏・情報行動いずれとも直交。
    #      根拠: 2人組は単独より約30%遅い・合議による避難開始遅延・はぐれ待ち(Moussaïd 2010 ほか)。
    #      準静的=当日の同行者構成 (pid, day) の純関数(day_varying=true で day を混ぜる=日ごとに
    #      変わるが決定論・run.seed 非依存)。プールの party_size(L4 来街者に実在=同行人数)がある個体は
    #      party_map でデータ駆動に確定(ハッシュ不要・day 非依存で固定)。無い個体(住民/従業者等)は
    #      tier 別 composition。将来 seam: S-R3 共同行動エンジンが承認されたら pair/group が実同伴者と結ぶ。
    companions:
      seed_offset: 202          # 文化圏軸(seed)・info_behavior(seed+101)と独立なハッシュ=軸間直交
      day_varying: true         # 同行者構成は日単位で変わりうる=day を混ぜる(同一 day=同一割当=resume 安定)
      party_map:                # party_size(実人数)→群 id。データ駆動・最優先(ハッシュ不要・固定)
        "1": solo               # キーは文字列(config_hash の JSON sort_keys が混在型キーで壊れないため)
        "2": pair
        default: group          # 3人以上(party_size>=3)
      groups:                   # 「一人称の行動の事実」規律(配偶断定なし・自分で改善可・断定禁止)
        solo:  { label: "単独で動いている人",        line: "今日は一人で動いている。" }
        pair:  { label: "連れと2人で動いている人",    line: "今日は連れと2人で動いていて、行き先は相談しながら決める。" }
        group: { label: "3人以上のグループで動く人",  line: "今日は3人以上のグループで動いていて、はぐれないよう互いを気にかけている。" }
      composition:              # party_size 不明の個体(住民/従業者/L3常連)の tier 別構成比
        resident:      { solo: 0.82, pair: 0.15, group: 0.03 }   # 住民=単独支配
        duty:          { solo: 0.90, pair: 0.08, group: 0.02 }   # 役割従事(駅員/運転士等)=単独支配
        workday_shift: { solo: 0.80, pair: 0.16, group: 0.04 }   # 域内従業者=単独支配
        cadence:       { solo: 0.55, pair: 0.33, group: 0.12 }   # L3 定期来街(学生/常連)
        stochastic:    { solo: 0.30, pair: 0.46, group: 0.24 }   # L4 非定期(連れ厚め=女友達同伴54%と整合)
        default:       { solo: 0.55, pair: 0.30, group: 0.15 }   # プール非使用の直接ラン用

# ---- 街路の環境情報(第18バッチ 2026-07-11。既定 OFF=現行と完全同一)----
# 街頭広告(OOH)=掲出地点の視認判定→ad_exposure+発火時の中立1行(広告主=シミュ内 POI で
# 接触→来店→購買のファネルが閉じる)。効果量の接地: docs/research/commercial-analytics.md §7。
# 掲出地点(large/slots)は環境プロファイル側で与える(基盤=機構のみ・場所の値を持たない)。
ads:
  enabled: false                # OFF=draw・イベント・プロンプトとも既定と不変
  large: []                     # 大型ビジョンの掲出地点(POI 名)
  slots: []                     # 通常看板の掲出地点(POI 名)
  radius_m: 60.0                # 掲出地点からの視認距離(m)
  p_see_large: 0.45             # 大型の視認率(現実バンド 0.3〜0.6)
  p_see_normal: 0.20            # 通常看板の視認率(0.1〜0.3)
  cooldown_steps: 6             # 同一枠の再接触の最短間隔(6step=1時間)
  daily_cap: 4                  # 1人1日の接触記録上限
  recall_steps: 144             # プロンプト注入の想起窓(1日=adstock 近似)
  eff_frequency: 3              # 有効フリークエンシー(累計これ以上で「何度も」)
  campaign_days: 7              # キャンペーン改定周期(日)
  target_cats: [food, cafe, shop, leisure, nightlife]   # 広告主になれる POI カテゴリ
crowd_visual:
  enabled: false                # 群衆の視覚情報1行(同席者の決定論要約=記述的規範)。OFF=不変

# ---- エージェント視覚 v1: 顕著性駆動の POV 画像(休眠・全プロファイル OFF)----
# 設計: docs/research/agent-vision.md §4 v1。本番初日に採否決定=当面 OFF のまま。
# 骨格のみ配線: 顕著性ゲート(客観量のみ=R1: k 由来量・traits は絶対に入れない)→ CPU 決定論
# POV レンダ(viz/render_pov.py・同一入力→同一バイト PNG)→ サイドカー画像ストア(runs/<name>/pov/)+
# pov_image イベント参照キー。専用 stream "pov_salience" 1 本のみ(既存 draw 順に挿入しない)。
# 追加 LLM 呼はゼロ(VLM は別 tier=text LLM 呼数に非依存)。既定 OFF=stream を引かず・
# イベント 0 件・画像 0 枚・agent に新フィールドを生やさない=バイト一致(ゴールデン維持)。
pov:
  enabled: false
  salience:                     # ゲートは客観量のみ(物理位置・訪問履歴・世界イベント現場・人数)
    first_visit: true           # 初訪問ノードで発火候補
    crowd_min: 12               # 近傍(同席者)人数がこれ以上で発火候補
    world_event: true           # 世界イベントの現場(当 step の world_event/disaster 等)で発火候補
    prob_cap: 0.05              # ゲート通過者のうち実際に撮る確率上限(stream "pov_salience")
  render:
    width: 96                   # POV 画像の幅 px(低解像度セマンティック)
    height: 72                  # 高さ px
    fov_deg: 90.0               # 水平画角
    max_dist_m: 200.0           # レイキャストの最大距離
  store:
    enabled: true               # runs/<name>/pov/ に PNG を保存(pov.enabled=false なら無効)
    dir: pov                    # サイドカー画像フォルダ(out_dir 相対)
  vlm:
    backend: none               # none | mock | <実VLM>。stub 配線(実 VLM は本選 Day-0)。
                                # mock はテストで経路を通すだけ(text LLM 呼数に影響しない)

sns_geo:
  enabled: false                # SNS/DM 伝播に両者の物理距離 dist_m を記録(第22バッチ P2)。
                                # ON でも乱数・LLM呼数は不変(transmission payload にキーを足すだけ)。OFF=バイト一致

labeling:
  mode: constrained             # constrained | open(D9)
  adopt_threshold: 2            # complex contagion: 2回聞いたら採用

  # ---- 場所の意味づけ最小版 D1 第69バッチ(2026-07-29。既定 OFF=現行挙動と完全同一)----
  # 実査で特定された唯一の構造的欠落(「造語をノードに束縛する機構が無い」= 意味が場所に戻らない)
  # への最小の手当て。ON 時: 熟慮の coin_label が受理された瞬間、その造語を**発生ノード**へ束縛し
  #   (語ごとに最初の 1 回だけ・上書きなし)、L1 に place_label_bind を 1 件記録する。
  #   以後、そのノードに居る人の熟慮プロンプトへ中立 1 行
  #   「この場所の呼ばれ方: 「〈語〉」と呼ばれることがある。」を注入する
  #   = 命名 → 場所 → 他者の知覚 → 採用 という「痕跡の蓄積」経路が開く。
  # 注入条件: その語の**採用者数 >= min_adopters**。1 ノードに複数語が束縛されている場合も
  #   プロンプトに出るのは決定論で 1 語だけ(束縛 step 降順 → 語の辞書順)。
  #   行は状態記述のみ(行動指示・評価語・推奨は一切書かない=no-fingerprint / 促進しない)。
  # 束縛するのは熟慮 coin_label 経路のみ。グループ名・提案文の coin(tools)とメディア発の
  #   coin_media(創作者 -1・場所を持たない)は束縛しない。
  # 全決定論・乱数ゼロ(新 stream も既存 draw の追加消費も無し)・LLM 呼数不変(変わるのは
  #   プロンプトの内容だけ)。R1: k.writeback / beliefs を読まない。
  #   束縛台帳は LabelSystem 内に閉じるので checkpoint("labels")へ同梱=resume==straight。
  # 実装 src/society/labeling/labels.py。設計 docs/plans/twin-physics-vision-affordance-plan.md
  #   §2 レーン1 D1(ON にするかは D0 の事前登録閾値+実 LLM 診断ランで判定)。
  # OFF が保つ不変条件: 束縛台帳を作らない(place_bind is None)=新イベント 0 件・新状態なし・
  #   プロンプト 1 バイト不変・L1 バイト一致(tests/data/golden_baseline_l1.json)・draw 数同一・
  #   L2 に place_bound_labels 列なし。
  place_binding:
    enabled: false              # ★D0 事前登録ゲート通過後に実験投入。false=完全 no-op(バイト一致)
    min_adopters: 1             # 束縛語の採用者数がこれ以上のときだけ知覚に出す(1=造語者本人だけでも出る)
    prompt_line: true           # 熟慮プロンプトへの1行注入(false=束縛と観測だけ行い知覚には出さない)

  # ---- 規範化ステージ検出器 第74バッチ IDEA③(2026-07-31。**観測のみ**=世界に一切効かない)----
  # 語ごとに 4 段階を **既存 L1 イベントと発話テキストだけ**から決定論検出する:
  #   S1 初出(label_coin の step。主=coiner)
  #   S2 他者引用(coiner 以外による最初の使用。transmission の from もしくは発話本文)
  #   S3 定冠詞化(発話本文に「〈definite マーカー〉+ 語」が現れた初出。主=definitizer)
  #   S4 制度化 (発話本文に〈agreement マーカー〉と語が共起した初出。主=institutionalizer)
  # 段階 n は n-1 が既に成立しているときにしか記録しない(飛び段・逆順を作らない)。
  # ★ここの markers が **検出語彙の単一の源**。コードには 1 語も書いていない(envpack 流儀)ので、
  #   リストを空にすれば S3/S4 は永久に 0 件になる(= 語彙を差し替えて感度分析ができる)。
  # enabled は **L2 の 2 列(norm_stage_max / norm_steps_to_agreement)を出すかどうかだけ** の
  #   スイッチ。false(既定)= 列なし = L2 バイト不変。語別の台帳・命名者/制度化者の突合・
  #   下方因果(Part E)の検定は **解析側** scripts/analyze_norms.py が保存済み L1 から
  #   いつでも再現する(= enabled に依存しない)。
  # プロンプト 1 バイト不変・LLM 呼数不変・乱数ゼロ・L1 イベント追加ゼロ(R1)。
  # 実装と正直な限界(表層文字列一致しか見ない・mock では S3/S4 が 0 件)は
  #   src/society/observer/norms.py の docstring を参照。
  norm_stage:
    enabled: false              # true で L2 に 2 列。false=列なし(既存ランと L2 バイト一致)
    min_word_len: 2             # 検出対象にする語の最小文字数(1 文字語の部分一致誤爆よけ)
    max_gap: 2                  # 定冠詞マーカーと語の間に許す文字数(「例の『語』」の括弧を吸収)
    markers:
      # 定冠詞相当(既知の共有物として指す形式)。日本語には冠詞が無いので指示詞・限定詞で代替する。
      definite: ["例の", "れいの", "あの", "いつもの", "おなじみの", "先ほどの", "さっきの", "その"]
      # 合意参照(既に決まった事として引く形式)= 規範化の言語的指標。
      agreement: ["さっき決めた", "前に決めた", "決めたとおり", "決めた通り", "決まりだから",
                  "決まりです", "ということになった", "ルール", "取り決め",
                  "いつもどおり", "いつも通り", "そういうこと"]

# ---- 情報オブジェクトの一般化 IF-C(第95バッチ 2026-08-05。**既定 OFF=現行と完全同一**)----
# 監査 §3: 「語彙(coin_label)」だけが ID 付き Item + transmissions を持ち因果ループが完全に
# 閉じている一方、「街で何が起きたか」の伝聞は無構造の発話テキストを流れるだけで、誰から誰へ
# 何が伝わったかを機構として追えない。provenance.Item の kind には rumor が**宣言済み**なので、
# その空き枠に実体を入れる(= 新スキーマは足さない・既存のカスケード木ツールがそのまま効く)。
#
# ★if-lane-research §2 の位置づけ: Generative Agents (Park et al. 2023) の拡散測定は
#   **2日終了時点の自然言語インタビュー**で、ID つき情報オブジェクトを機構として持たない
#   (幻覚率 1.3%)。本シムは走行中の台帳から誤差ゼロで測れる = **追随ではなく先行**。
# ★足りなかったのは「噂が止まる理由」。Daley & Kendall 1964/1965 と Maki & Thompson 1973 の
#   核心は「全員が知って飽和するから止まる」のではなく「**既知の相手に出会った語り手が
#   語るのをやめる**から止まる」ことで、だから極限で 2 割が永久に知らないままになる
#   (理論値: 最終 ignorant ≈ 20% / spreader ピーク = 1 − ln2 ≈ 0.3069)。
#
# 3つの設計判断(詳細と理由は src/society/rumors.py の docstring):
#   (1) 源は**構造化イベントに限る**(自由文の解釈をしない)。文面は (源イベント種, 場所名 or
#       人名) の**純関数**で、源イベントの自由文(title / name)は 1 バイトも読まない。
#   (2) **発話テキストには噂を注入しない**。LLM が書いた文を機械が改竄すると会話の自然さが
#       壊れ、改竄の有無が実験条件と相関すれば no-fingerprint 違反に直結する。噂は
#       「その会話の傍らで伝わった伝聞」= 聞き手の**記憶に定型文 1 行**だけが載る別チャネル。
#   (3) stifler 化は**完全決定論**(誰と誰が同席するかは既存の物理・接触過程が既に決めている
#       ので、接触順だけで停止が決まる)= 乱数 stream を 1 本も引かない。
#
# R1: LLM 追加呼ゼロ・乱数ゼロ・プロンプトの節ゼロ増(増えるのは既存「直近の出来事」欄の中身)。
#   OFF が保つ不変条件: Item 0 件(item_id の採番も動かない)・rumor_born/rumor_stifle/
#   transmission いずれも 0 件・agent に _rumors 属性が生えない・sim に state が生えない・
#   summary に rumors キーなし・プロンプト 1 バイト不変・L1 バイト一致(golden_baseline_l1.json)。
# ★正直な相互作用: ON のランでは凍結指標(measure.py / stream.py / echo.py の c_transmission /
#   n_transmission / transmission_novel_rate)に噂の伝播が混ざる(あちらは item の kind を
#   見ない)。凍結 14 ファイルは 1 バイトも触れないので、切り分けは解析側
#   scripts/analyze_rumors.py(item_id 接頭辞 "rumor-" で分離)で行う。既定 OFF では無風。
information:
  rumors:
    enabled: false              # ★false=完全 no-op(バイト一致)。true で噂の誕生・伝播・停止が動く
    # 噂の源にする L1 イベント種(**既定は公共の出来事 3 種だけ = 保守的**)。
    # 実装が定型文を持つのは 5 種(rumors.SRC_SPECS): 下の 3 種 + partner_formed / relation_break。
    # private な 2 種を既定から外す理由 = 当事者しか知り得ない出来事で「同席者が目撃する」規則が
    # 意味を成さず、既存の負の評判機構(gossip.seed_events の relation_break)と二重になるため。
    # リストは**置き換え**(既定に重ねない)= config を読めばそのランの源が一意に判る。
    sources: ["event_host", "venture_open", "enforcement"]
    stifle: mt                  # mt(既定・Maki & Thompson 1973)| none(止まらない=現行の伝播機構と同じ)
    stifle_threshold: 1         # mt: 既に知っている相手へ語った回数がこれに達したら以後語らない
    forget_steps: 0             # 忘却 TTL [step]。0=忘れない(既定)。>0 で日境界に掃引
    max_per_step: 8             # 1 step に生む噂の上限(暴走の安全弁)
    max_per_talk: 1             # 1 回の発話/DM で伝える噂の本数(知った順=古い順)

rewards:
  enabled: false                # D9: 既定 off(過正当化の交絡を排除)
  amount_per_adoption: 300      # enabled 時、自分の造語が採用されるたび creator に与える報酬額(円)

# ---- 記憶(P2 seam。既定は日常 push のみ=現状不変)----
memory:
  agentic_pull: false           # 発火・内省で能動的に記憶検索する(true でプロンプトに1行想起を追加)
  relations_max: 0              # B6(スケール): 関係台帳の上限件数。>0 で超過時に LRU(last_step 最古)を退避。
                                # 0=無制限で従来と完全同一。大規模ラン(hub 個体の台帳肥大・checkpoint 膨張)対策。

# ---- 社会関係の質(現実ギャップ Wave G2 2026-07-07。既定 OFF=現行挙動と完全同一)----
# ON 時: 関係台帳に親密度 weight(closeness)を持たせ、交流の符号(発話/DM の感情価)で増減。
#   weight の閾値で質的段階 tier(0=見知らぬ/1=知人/2=友人/3=親友)を決定論導出し、プロンプトに
#   「○○とは友人」と載せる。ネガ交流・長期不在(日次減衰)で weight が下がり段階が落ちる
#   (relation_tier/relation_break)。各 agent の評判(reputation)を語の採用・被傾聴で集計し
#   「街で名が知られている」1行に反映(reputation_update)。同じグループ所属は「同じ仲間」注記。
#   すべて決定論・RNG不要・LLM 非増(R1)。tier/reputation は efficacy/grievance 等の因子には
#   結合しない(独立の観測スコア+プロンプト文脈)。OFF 時は closeness を一切足さず・イベント
#   0 件・プロンプト不変=ゴールデン(golden_baseline_l1.json)を守る。
relations:
  enabled: false                # ★ON 推奨(本番): true(関係の質=社会資本を有効化)
  tier_acquaintance: 2.0        # closeness weight がこれ以上で知人(tier 1)
  tier_friend: 5.0              #   〃           友人(tier 2)
  tier_close: 12.0             #   〃           親友(tier 3)
  pos_weight: 1.0               # ポジ交流(感情価≥0)1件あたりの weight 増分
  neg_weight: 2.0               # ネガ交流(感情価<0)1件あたりの weight 減分(悪化は速い)
  decay_per_day: 1.0            # 長期不在の相手の weight を1不在日ごとにこれだけ減衰
  decay_after_days: 0           # 最終接触からこの日数を超えた不在で減衰(0=翌日から)
  rep_adopted: 1.0              # 自分の造語が採用されるたび評判+(影響の可視化)
  rep_mention: 0.2              # 聞き手のいる発話をするたび評判+(社会的可視性)
  rep_decay_per_day: 0.5        # 評判の日次風化
  rep_known_threshold: 3.0      # 評判がこれ以上で「街で名が知られている」文脈をプロンプトに
  faction: true                 # 同じグループ所属を「同じ仲間」1行に(軽量。重い分極は後続波)
  # ---- 承諾/拒否判断の内生化 第62バッチ フェーズ1(2026-07-27。既定 OFF=現行挙動と完全同一)----
  # 共同行動(joint)の誘い→承諾を「較正確率のみの抽選」から「較正値を事前分布に残した内生判定の合成」へ。
  # 合成 p = clamp(prior_weight·p_calib + (1−prior_weight)·p_endo) − gossip_penalty(gossip は常に最後の減算)。
  # 判定材料は被誘者の**前日までの構造化出力のみ**(①予定帳簿の当日予定=schedule ON時 ②前日 day_schedule の
  # 志向 ③前日発話の明示キュー=prompts.dialog_history ON時 ④判定不能→較正フォールバック)。全決定論・
  # LLM 呼ゼロ・"joint" stream の draw は always-draw で ON/OFF 不変。実装 src/society/relations_endo.py +
  # joint.py(語彙・較正はここと relations_endo.py にのみ)。設計正典 docs/plans/endogenous-relations-plan.md §2。
  # ON 時のみ joint_invite(判定内訳)を記録し L2 に joint_accept_rate / joint_endo_share /
  # joint_accept_calib_gap / joint_fulfill_rate の4列を出す。要 joint.enabled=true で活きる。
  endogenous_accept:
    enabled: false              # ★実験 treatment(フェーズ2で OFF/ON × k の6セル比較=D17)
    prior_weight: 0.5           # 較正確率の事前分布重み(1.0=完全較正/0.0=完全内生。乖離±15pp超はここで調整)
    conflict_veto: true         # 当日予定と時間帯衝突なら確率でなく確定拒否(draw は破棄=消費数不変)
    positive_boost: 0.35        # 受諾材料(誘い主との予定/計画 with/明示キュー)の p_endo 加算
    negative_cut: 0.35          # 拒否材料(単独志向の計画が過半)の p_endo 減算
    fallback: calibrated        # 判定不能時の後退先(現在唯一のモード=較正確率をそのまま使う)
    # 前日計画の「単独志向」what 語彙(with 空×これに該当が過半=拒否材料)。walk=ウォーキングは典型同伴
    # 「一人」(レジャー白書2024 §2.6)、home/personal/study は計画スキーマの定義上単独行動。
    solo_whats: [walk, home, personal, study]
    # 前日発話の明示キュー動詞(受諾方向のみ。「(誘い主名)と…<cue>」)。拒否方向のキューは置かない=
    # 日本語の断りは間接的意味公式が支配的(Beebe et al. 1990)で辞書法は誤検出が多い(relations_endo.py 冒頭)。
    positive_cues: [行きたい, 行こう, したい, しよう, 遊びたい, 遊ぼう, 会いたい, 楽しみ]
    # 曖昧化マーカー: 同一文に共起した発話はキューに数えない=フォールバック(「行きたいのは山々ですが」=
    # 願望+言い訳の婉曲断りを受諾に誤検出しない。曖昧例は落とす=計画書§1)。
    hedge_markers: [山々, ですが, だけど, けれど, けど, のに, 無理, 難しい, また今度, 行けたら]
  # ---- 誘う相手の選択の内生化 第64バッチ フェーズ3(2026-07-27。既定 OFF=現行挙動と完全同一)----
  # ★位置づけ: 本バッチは「実装」まで。実験条件として回すかは**フェーズ2評価(本選実LLM=D17)の
  #   phase3_go 機械判定(scripts/analyze_endo_treatment.py)の合否ゲート**=計画書の原則(実装と実験実施の
  #   分離。docs/plans/endogenous-relations-plan.md §4)。
  # 共同行動(joint)の誘い先選抜(_companions の friend 経路)の**候補集合の並べ替え・拡張のみ**
  # (選抜の枠組み・min/max_group・発生判定 daily_rate は不変)。ON 時の候補順:
  #   ①前日計画 with の解決相手(従来=最優先のまま)→ ②前日発話の明示キュー相手(「(相手名)と…
  #   行きたい/行こう」=endogenous_accept.positive_cues/hedge_markers を invite 方向に共用=単一の源)
  #   → ③従来の closeness 降順(較正分布を事前分布として維持=二段構えの invite 版)→ ④弱い紐帯の
  #   探索枠(tier=1 知人から (agent,day) 安定ハッシュで決定論選択=乱数ゼロ・候補**末尾**)。
  # 関係の総量上限は変更しない: 誘いは一時的接触であり、層編成(Dunbar 入れ子層=friend_graph の
  # close 3-5/friend 7-12/acq +20)は relations の tier 遷移(closeness 蓄積)が担う=誘い候補の拡張が
  # 層次数上限を新規超過させる経路は構造上ない(tier は closeness の純関数・誘い自体は closeness を
  # 書き換えない)。max_group(2-4人)も従来のまま=Dunbar 上限維持。
  # 弱い紐帯枠の根拠: Granovetter 1973(AJS 78(6)=弱い紐帯は新規情報の橋)+ Onnela et al. 2007
  # (PNAS 104(18):7332=交流量の大半は強い紐帯)。誘い先が知人である現実頻度の直接統計は文献に
  # 見つからず=**探索枠1は保守的既定**(正直な注記)。
  # 全決定論・LLM 呼ゼロ・追加乱数ゼロ(新 stream "invite" は不要のまま。"joint" stream は承諾抽選
  # 専用を維持=別用途 draw を混ぜない。ON では候補列が変わるため承諾 draw 数は OFF と差が出得る=
  # treatment そのもの)。ON 時のみ joint_invite(endogenous_accept ON 時)に source
  # (plan_with/dialog_cue/weak_tie/closeness/housemate/colleague)が付き、L2 に
  # invite_weak_tie_rate / invite_endo_share の2列を出す。要 joint.enabled=true で活きる。
  endogenous_invite:
    enabled: false              # ★実験 treatment 候補(投入は phase3_go ゲート合格後=実装と実験の分離)
    weak_tie_slots: 1           # 弱い紐帯(tier=1 知人)の探索枠数(候補末尾。0=無効。1=保守的既定=直接統計なし)
  # ---- 関係の質の内生化 第65バッチ フェーズ4(2026-07-27。既定 OFF=現行挙動と完全同一)----
  # 従来 note_contact は交流の**符号**だけを見て増減量が一定(+pos_weight/−neg_weight)だった。
  # ON 時は既生成の会話テキストから決定論抽出した不透明係数 magnitude を増減**量**にのみ載せる:
  #   ①発話長(len_chars で正規化・len_gain まで)②往復数(_dialog_hist の蓄積・turn_gain/回・turn_max まで)
  #   ③明示キューの共起(endogenous_accept.positive_cues を**そのまま再利用**=語彙は単一の源・cue_gain)
  #   ④hedge_markers の共起 → 中立 1.0 へ(婉曲/逆接の曖昧文は関係の質に効かせない=保守側)
  #   最後に [mag_min, mag_max] へ clamp。
  # 文献: Altman & Taylor 1973(社会的浸透)/ Reis & Shaver 1988(親密さ=自己開示+応答性)/
  #   Laurenceau, Barrett & Pietromonaco 1998 JPSP 74(5):1238-1251(開示の**深さ**と応答性が当日の
  #   親密さを予測・事実より感情の開示が効く)。**正直な限界**: 文字数は「深さ」の代理にならない=
  #   len_gain を最大加点にしない既定にとどめる。
  # ★片方向 hook: magnitude は closeness の増減量にのみ入り、発火判定・会話ペアリング・tier 閾値の式・
  #   誘い/承諾判定には一切流さない=会話数・LLM 呼数・イベント数・乱数消費は ON/OFF で不変
  #   (magnitude が closeness の蓄積速度を変えて tier 遷移の**時期**を動かすのは treatment そのもの)。
  # ON 時のみ L2 に quality_magnitude_mean(当日の会話由来 magnitude 平均)1列を出す。
  # 要 relations.enabled=true(closeness が動く経路が前提)。実装 src/society/relations_endo.py。
  endogenous_quality:
    enabled: false              # ★実験 treatment 候補(フェーズ4=最終段。実装と実験実施は分離)
    mag_min: 0.5                # clamp 下限(従来の半分より下げない)
    mag_max: 2.0                # clamp 上限(従来の2倍より上げない)
    len_chars: 60.0             # 発話長の正規化基準(この文字数で長さ由来の加点が満点)
    len_gain: 0.5               # 発話長由来の最大加点(長さは開示の深さの代理にならない=控えめ)
    turn_gain: 0.15             # 往復1回ごとの加点(応答性=Reis & Shaver 1988)
    turn_max: 0.45              # 往復由来の加点上限(相手別バッファは最大4発話=3往復で到達)
    cue_gain: 0.4               # 明示キュー(positive_cues)共起の加点(感情/意向の表出)
  # ---- ダンバー認知枠(関係の維持コスト)+忘却/再会 第75バッチ IDEA⑤(2026-07-31。既定 OFF=現行挙動と完全同一)----
  # 現状の関係機構には「維持には認知資源が要る」制約が無く、closeness はいくらでも並列に積める。
  # Granovetter 1973 の要点は「維持コストが低いから弱い紐帯は多く持てる」= 維持コストを入れて初めて
  # 強い/弱い紐帯の非対称が**内生的に**出る(第64 invite_weak_tie_rate と相補的)。
  # ON 時: 各 agent の**活性関係**(closeness 台帳を持ち休眠していない相手)の総数に上限を置き、
  #   超過したら**最も弱い紐帯**(closeness 昇順・同値は相手id昇順)から**休眠**にする。休眠は
  #   **削除ではない**: 台帳エントリ・count・記憶はそのまま残し、休眠前の closeness を退避して
  #   closeness=0(=tier 0)にする。再接触(会話・DM・joint の同席)で **退避値 × rekindle_discount**
  #   に復元する(「久しぶりに会った友達」の非対称性)。イベントは relation_dormant / relation_rekindle、
  #   L2 は active_relations_mean / dormant_total / rekindle_total の3列。全決定論・乱数ゼロ・LLM 呼ゼロ。
  # ★上限の適用は**日境界の1回だけ**(接触時は再会のみ)。接触のたびに適用すると closeness が近接する
  #   紐帯群で「最弱」が入れ替わり休眠/再会が振動する(mock 実測 300体2日で 5739 件)。代償として
  #   活性関係数は**日内では一時的に上限を超え得る**(翌日の日境界で収束)= 正直な限界。
  #   直近 keep_days 日以内に接触した相手は休眠にしない(接触こそが維持=Dunbar の接触頻度による層維持)。
  # ★層と拘束: close/friend/acquaint/total は Dunbar の入れ子層(5/15/50/150)。**休眠を起こす拘束は
  #   最外層(total)のみ**で、内側の層は比率の宣言と感度分析の軸(内側を拘束にすると「降格」=closeness
  #   の書き換えが要り、蓄積した交流履歴を不可逆に失うため実装しない=正直な限界)。
  # ★scale: Dunbar の絶対値は N≳150 の共同体前提で、本シム(N=20〜100)ではそのままでは上限が原理的に
  #   効かない(相手の総数が上限に届かない)。比率 1:3:10:30 を保ったまま実効規模へ縮約する係数。
  #   既定 0.34 → close2 / friend5 / acquaint17 / **total 51** = friend_graph の初期次数(親友3-5+
  #   友人7-12+知人20 ≈ 最大37)に会話由来の新規紐帯が積んで初めて拘束が効く水準。**値自体が較正対象**
  #   (Lindenfors et al. 2021 Biology Letters 17:20210158 は 150 という値の統計的根拠を否定=感度分析の軸)。
  # ★誘い選抜(第64)との整合規則: 休眠関係は tier 0 になるので closeness 降順の同伴候補経路から
  #   **自動的に外れ**、**弱い紐帯探索枠(weak_tie_slots)でのみ再会し得る**(Levin, Walter & Murnighan
  #   2011 Organization Science 22(4):923-939 = 休眠紐帯の再接続は「新規性は弱い紐帯並み・信頼は強い
  #   紐帯並み」=弱い紐帯と同じ探索の箱が理論的に整合)。ただし**明示的な意向**(前日計画の with /
  #   前日発話の明示キュー)は休眠でも通す(名指しの意向は認知枠の淘汰より上位)。dunbar OFF では
  #   dormant キーが一度も生えないので endogenous_invite の挙動は 1 バイトも変わらない。
  # 要 relations.enabled=true(closeness が動く経路が前提)。実装 src/society/dunbar.py。
  dunbar:
    enabled: false              # ★実験 treatment 候補(維持コストの ON/OFF で強弱の非対称を比較)
    close: 5                    # Dunbar 入れ子層: 親友層(比率の宣言。拘束は total のみ)
    friend: 15                  #   〃           友人層
    acquaint: 50                #   〃           知人層
    total: 150                  #   〃           知り合い層=**活性関係の総数上限の素の値**
    scale: 0.34                 # 実効規模への縮約係数(既定 → total 51。値自体が較正対象)
    rekindle_discount: 0.5      # 再会時に休眠前 closeness をこの率で復元(復元率の直接統計は文献に無い=保守的既定)
    keep_days: 0                # 直近この日数以内に接触した相手は休眠にしない(接触こそが維持。0=当日接触のみ保護)
    protect_housemates: true    # 同居人は休眠の対象外(日々の共在で維持される紐帯。枠は消費するが落ちない)

# ---- 友人グラフ生成(関係性パッケージ完結 第45バッチ S-R2。ユーザー要望 2026-07-21。既定 OFF=現行挙動と完全同一)----
# 現状の初期関係は「同建物の顔なじみ最大3人」のみ=地理的共在だけが源泉。本ブロックは起動時1回、居住者の
# 現実的な友人ネットワークを決定論で張る: homophily(McPherson: 年齢>職業)+共有所属(同 work org_id=
# 職場友人34.0% / 学生同士=学生時代友人31.6%)+同地区近接、次数は Dunbar の入れ子層(親友~3-5=tier3 /
# 友人~10-15=tier2 / 知人=tier1)で較正して relations の closeness/tier(閾値 2.0/5.0/12.0)へ直接注入する。
# 実装 src/society/friends.py(較正値・所属ロジックはここと friends.py にのみ=no-fingerprint 契約)。
# 決定論・run.seed 非依存: 辺は (persona id ペア, seed) の安定ハッシュ+属性の純関数=乱数 stream ゼロ
# (RngHub 無風)=別ランでも同一人物ペアは同一の間柄(比較実験の要)。来街者は対象外(圏外=household と整合)。
# 既定 OFF=何も張らず・relations 台帳不変・friend_graph_built も出さない=バイト一致(ゴールデンを守る)。
friend_graph:
  enabled: false                # ★ON 推奨(本番): true(現実的な友人ネットワークを有効化。要 relations.enabled=true で質が活きる)
  seed: 20260722                # 安定ハッシュ種(run.seed と独立=別ランで同一人物ペアは同一辺)
  w_age: 1.0                    # homophily 年齢近接の重み(McPherson で最強)
  w_occ: 0.5                    # homophily 職業一致の重み(年齢の次点)
  w_same_work: 1.2              # 共有所属: 同 work org_id(職場友人34.0%)
  w_same_school: 1.0            # 共有所属: 学生同士かつ同 org_id(学生時代友人31.6%)
  w_same_area: 0.4              # 同地区近接(同一住宅建物=近所)
  age_scale: 15.0               # 年齢差の正規化スケール(歳。この差で年齢類似度が 0)
  noise: 0.3                    # スコアの決定論ノイズ幅(タイ破り・多様性=run.seed 非依存)
  close_min: 3                  # 親友層(tier3)の下限次数(Dunbar 支援クリーク~5)
  close_max: 5                  # 親友層の上限次数
  friend_min: 7                 # 友人層(tier2)の追加次数下限(親友+友人で~10-15)
  friend_max: 12                # 友人層の追加次数上限
  acq_extra: 20                 # 知人層(tier1)の追加次数(弱い紐帯を薄く)
  margin: 0.5                   # 注入 closeness の上乗せ(閾値+margin=その tier に確実に載る)

# ---- 社会的ヒエラルキー(地位・信用・名声。第11バッチ 2026-07-08。既定 OFF=現行挙動と完全同一)----
# 調査: docs/research/hierarchy.md(採択候補 #2 観測 + #1 評判→動員 + #3 優先的選択)。
# 理論: マタイ効果/累積優位(Merton, DiPrete)= 信用のある人に人とリソースが集まる正のフィードバック。
#       優先的選択(Barabási)= 既に多く繋がる相手へ優先接続=べき則/ハブの創発。威信=prestige(Henrich)。
# ON 時: 客観カウント(評判/被フォロー数/資産/提案可決数/売上/主催回数)の母集団内百分位を重み混合して
#   各 agent の合成地位 status(0..1)を日次再計算(決定論・非LLM・k 非参照)。地位は既存確率の変調のみに
#   使う: イベント集客(+attract_gain×主催者 status)・グループ加入(同・創設者)・屋台購買(×(1+buy_gain×店主
#   status))・フィード露出(×(1+feed_gain×status)×(1+被フォロー数)=優先的選択)。★禁止(injection):
#   プロンプトへ「地位が高い/低い」注入や高地位個体の変革行動への直接誘導はしない(可視化・変換のみ)。
# OFF 時: status 一切不変(=0)・動員フックは加算0/倍率1・feed は従来 TL・L3 に status なし・L2 集計は列なし
#   =乱数消費・イベント列・スナップショットがバイト一致(ゴールデン golden_baseline_l1.json を守る)。
hierarchy:
  enabled: false                # ★ON 推奨(本番): true(地位=信用に人とリソースが集まる機構)
  attract_gain: 0.15            # イベント参加/グループ加入の確率に + gain × 主催者(創設者)status
  feed_gain: 0.3                # フィード露出重みに ×(1 + gain × 投稿者 status)
  buy_gain: 0.2                 # 屋台購買確率に ×(1 + gain × 店主 status)
  # weights(材料の混合重み)は build_status_cfg の既定に埋め込み済み(rep/followers/wealth/inst/biz/host)。
  # 上書きするなら hierarchy.weights.followers=0.4 のように指定(母集団内百分位への相対重み)。

# ---- 観測レンズ 3本(第50バッチ 2026-07-23。外部アドバイスを observable へ翻訳。既定 OFF)----
# 「読むだけ」= 行動・乱数・LLM 呼を一切増やさない(R1)。ロジックは observer 層(observer/lens.py +
# aggregate.py)と本ブロックに閉じる(engine/cognition/world/factors/actions/labeling に軸語を書かない)。
#   T1 value4:  イベント種 → 価値の4軸(utility/emotion/social/epistemic=第17バッチ values.TAGS を再利用)。
#               当日のイベント数構成を L2 の全体スカラー4列(value4_*)で観測。
#   T2 motives: イベント種 → 3M欲望(earn 儲けたい / love モテたい / recognition 認められたい)。L2 3列(motive_*)。
#   T6 trust:   status.py の合成地位スコアの材料別内訳・分布(status.material_breakdown / L2 trust_gini・trust_top10)。
# 正準の kind_map は observer/lens.py の DEFAULT_*(単一の源)。下の kind_map は「上書き」用の空マップ
# (値を書けば既定へ重なる。値を空にすればそのキーを外す)。ビューアは runs/<name>/lens_map.json 経由で写像を読む。
# enabled=false = L2 に列を足さず・サイドカーも書かず・ダッシュボードのレンズタブは非表示=ゴールデン L1/L2 バイト一致。
lens:
  enabled: false                # マスター。★ON はユーザー判断(production/daily は触らない)
  value4:
    enabled: true               # マスター ON 時に価値4軸の列・タブを出すか
    kind_map: {}                # 例: {free_action: emotion}(既定 DEFAULT_VALUE4_MAP へ上書き)
  motives:
    enabled: true               # マスター ON 時に3M欲望の列・ビューを出すか
    kind_map: {}                # 例: {venture_open: earn}(既定 DEFAULT_MOTIVE_MAP へ上書き)
  trust:
    enabled: true               # マスター ON 時に信用内訳(status 可視化)を出すか。要 hierarchy.enabled=true
  # ---- ペルソナ逸脱率レンズ(第55バッチ タスクA 2026-07-23。独立 observable。既定 OFF)----
  # エージェントが注入されたペルソナ(職業・趣味)にどれだけ従順か/逸脱するかを測る。逸脱がゼロに近いなら
  # それ自体が本シミュレーションの限界を語るデータ(world-changer 検出=k* 測定の感度の補助指標)。観測のみ。
  # 主指標=**裁量時間限定**の逸脱(義務ルーチン=勤務行動を母数から除外=水増しを避ける)。全時間版は参考。
  # 逸脱判定=行動種別(behavior_map で "@work" に落ちる kind=勤務=裁量から除外)による近似。
  # L2 全体スカラー: deviation_mean(裁量・主)/ deviation_var / deviation_top_share / deviation_fulltime_mean(参考)。
  # 住民別スコア・ドリルダウンはビューア事後計算(deviation_map.json サイドカー経由)。正準 map は
  # observer/deviation.py の DEFAULT_*(単一の源)。下の map は「上書き」用の空マップ(値を書けば既定へ重なる)。
  # enabled=false = L2 に列を足さず・サイドカーも書かず・ダッシュボードの逸脱タブは非表示=ゴールデン L1/L2 バイト一致。
  deviation:
    enabled: false              # ★ON はユーザー判断(production/daily は触らない)。lens.enabled とは独立
    top_threshold: 0.5          # 「上位逸脱者」= 裁量逸脱率がこの値以上の測定対象住民の割合(deviation_top_share)
    occupation_map: {}          # 職業→期待勤務POIカテゴリ(ドリルダウンの注記のみ=勤務系イベントにPOIカテゴリが無く厳密判定不能。既定 DEFAULT_OCCUPATION_MAP へ上書き)
    hobby_map: {}               # 職業→期待余暇POIカテゴリ列(既定 DEFAULT_HOBBY_MAP へ上書き。例 {研究員: [leisure]})
    behavior_map: {}            # イベント種→行動カテゴリ(既定 DEFAULT_BEHAVIOR_MAP へ上書き)
  # ---- 社会構造の内生変動レンズ(第56バッチ タスクB 2026-07-24。独立 observable。既定 OFF)----
  # 「強制トリガーなしで社会構造は変化するのか、固着するのか」を正面から測る。関係性の固定化が実際に
  # 起きるかを介入せず観測する(危機トリガー不採用の日常観察方針=Entry 47)。観測のみ。
  # L2 全体スカラー(当日イベント+当日母数だけで計算する軽量スカラー。前日状態をシム側に持たない):
  #   edges_formed(当日 relation_tier{tier==1}=新規紐帯)/ edges_broken(relation_break{cause=contact}=断絶)/
  #   edges_decayed(relation_break{cause=absence}=長期不在の風化)/ edge_churn_rate(=組み替え率=churn/活性関係数)。
  # 順位相関(Kendall τ)・中心性入れ替わり・コミュニティ変化・固着検知は事後層 scripts/analyze_structure.py が
  # L1(+hierarchy ON なら L3 status)から計算(コミュニティ検出=既存の決定論 LPA observer/measure.communities を
  # 再利用=新規依存なし)。ダッシュボードの「🏛 社会構造」タブは structure.json(事後層出力)が有る時だけ表示。
  # enabled=false = L2 に列を足さない=ゴールデン L1/L2 バイト一致。
  structure:
    enabled: false              # ★ON はユーザー判断(production/daily は触らない)。lens.enabled とは独立
  # ---- 資産分布レンズ(第59バッチ スライス(a) 2026-07-25。独立 observable。既定 OFF)----
  # 口座 E5 で永続ストックになった wealth=money+account の「残高そのもの」の分布と、格差が固定化するか
  # (資産順位の固着)を正面から測る。合成地位 status の Gini は合成スコアであって残高ではない=別軸。観測のみ。
  # L2 全体スカラー(住民別は L2 に出さない=ビューア事後計算):
  #   asset_gini(残高の集中度)/ asset_top10_share(上位割合の占有率)/ asset_median / asset_mean /
  #   asset_rank_tau(前日比 順位 Kendall τ=高いほど順位不変=格差固定。前日 wealth を sim に1本だけ持つ=
  #   status の rank_mobility と同流儀。初日/共通id<2 は初期値 1.0=順位不変。checkpoint 非搭載=resume 後の初日も初期値)。
  # 住民別分布ヒスト・上位/下位ドリルダウンは L3 スナップ(money[+account])からビューアが事後計算(deviation/trust と同型)。
  # ダッシュボードの「💰 資産」タブは assets_map.json(ON 時サイドカー)が有る時だけ表示。
  # enabled=false = L2 に列を足さず・サイドカーも書かず=ゴールデン L1/L2 バイト一致。
  assets:
    enabled: false              # ★ON はユーザー判断(production/daily は触らない)。lens.enabled とは独立
    top_pct: 0.1                # 上位集中度 asset_top10_share の分位(既定 0.1=上位10%)

# ---- 行動心理プラグイン(config 着脱式・すべて既定 OFF。ユーザー方針 2026-07-06)----
# 文献の数値を固定実装せず、回しながら柔軟に変える seam。OFF 時はイベント列がバイト一致で不変。
# no-fingerprint: engine/cognition は因子名を見ず、factors から不透明な倍率・スコアだけ受け取る。
psych:
  sdt:                          # 自己決定理論(Ryan&Deci): 内発/外発で欲求ゲージ入力を個人別に倍率化
    enabled: false
    intrinsic_boost: 1.4        # 内発(NFC+内的統制)高 → novel_place/unknown_word をこの倍率まで押し上げ
    extrinsic_boost: 1.4        # 外発(外的統制+リスク許容)高 → sns/addressed/company/dm_received を押し上げ
  collective:                   # 集団効力感・社会的アイデンティティ(SIMCA/Bandura)
    enabled: false
    group_success_magnitude: 0.05  # 所属グループの成功(提案成立・イベント参加)→ collective_efficacy+
    ingroup_boost: 1.2          # 同じグループのメンバーの発話を聞く → heard_valence をこの倍率
    attend_threshold: 2         # グループイベントで「成功」とみなす参加メンバー数の下限
  lynch:                        # 都市イメージ(Lynch): landmark 重み付き行き先 + 観測レンズ
    enabled: false
    landmark_weight: 1.0        # landmark_score = 1.0 + weight×(POI数 + 命名地点 + 命名建物)
  searle:                       # 制度化(Searle "X counts as Y"): 成立提案を制度としてプロンプト注入
    enabled: false
    max_recent: 2               # 発火プロンプトに載せる最新の取り決め件数

# ---- 意見力学(Friedkin-Johnsen #16)。チャネル別の説得重み。既定で有効(y_external 不変)----
opinion:
  enabled: true                 # false で意見更新を止める(opinion_shift を出さない)
  w_face: 0.20                  # 対面で聞いた話に意見が寄る強さ
  w_dm: 0.15                    # DM で受け取った話
  w_sns: 0.08                   # SNS 閲覧(弱い)

storage:
  backend: memory               # memory(開発) | redis_pg(本番)

observer:
  snapshot_every: 12            # L3 スナップショット間隔(=2時間ごと)
  checkpoint_every: 0           # D16: この step ごとに完全状態を保存+ログを part 化(0=無効)。
                                # >0 で --resume 可能に。既定0=part を作らず出力・挙動は従来と完全同一。
  flush_every_steps: 0          # B2(スケール): この step ごとに L1 ログを part 化して RAM を解放
                                # (checkpoint とは独立。0=無効で従来と完全同一)。大規模ランの OOM 回避用。
                                # checkpoint_every と同一 step では二重 flush しない。finalize で part を結合。
  # ---- finalize のメモリ有界化(W2-6 第98バッチ 2026-08-07・**既定 OFF**)----
  # 上の part 化は「走行中の RAM」を解放するが、finalize の結合は **全 part を read_table して
  # concat_tables** するので、ランのピークメモリは結局 L1 の総量で決まる。在場 25万 × 10 日の
  # L1 は 42.7 GB・40.6 億イベント(proposal-dp-u3-observe-250k.md §2-4 の実測外挿)であり、
  # **解析以前に「ランの書き終わり」で落ちる**。ON にすると part を 1 つずつ row-group 単位で
  # 読み ParquetWriter へ流すので、ピークは row-group 1 個ぶん(下の row_group_rows)だけになり
  # part 数にも L1 総量にも依存しない。
  # ★観察ラン(25万体)では ON にすること。既定 OFF は現行経路と 1 バイトも変わらない。
  # ON の出力は OFF と **行の内容・行順・スキーマが完全同値**だが、parquet の**バイト列は
  # 一致しない**(row-group の切れ目が変わるため)。part が 1 つも無いラン(checkpoint も
  # flush_every_steps も無効)は ON でも従来経路に落ちる=バイト一致。
  # ★W4-E(第99バッチ 2026-08-08): この 1 キーが **L1/L1b/L2/L3 とサイドカー全部**
  #   (indoor_tracks_samples / indoor_tracks_contacts / org_ledger / finance / channels /
  #   cognition_g)に同時に効く。同型の finalize を各サイドカーが自前で持っていたのを
  #   src/society/observer/finalize.py の 1 本へ括り出した。**サイドカー用の別キーは作らない**
  #   (1 つの判断で全ファイルが同じモードになるのが正)。
  # 実装と正直な限界は src/society/observer/finalize.py の docstring を参照。
  finalize:
    streaming: false
    row_group_rows: 1048576     # 書き出す row-group の行数(= ON 時のピークメモリの単位。
                                # pyarrow の write_table 既定と同じ 2**20)。streaming=false では未使用。
  # ---- 第71バッチ 2026-07-31: ラン来歴 run_manifest.json(既定 ON=新規別ファイル)----
  # ラン開始時に runs/<name>/run_manifest.json を書く: git SHA/branch/dirty・resolved config の
  # 正準 JSON sha256・run_seed・モデル ID・cache_mode・**真偽値スイッチ全状態**(機械採取)・
  # イベントスキーマ hash・開始時刻(壁時計=観測メタデータ)・開始日。
  # **書くだけ・読む経路なし** = L1/L2/L3・summary・決定論・LLM 呼数のいずれにも影響しない。
  # 同じ out_dir を再利用/resume したときは前回分の要点を history に畳んで残す(来歴を失わない)。
  run_manifest: true
  # ---- 行為 → 思考の来歴リンク IF-1(第93バッチ 2026-08-05・**既定 OFF**)----
  # 正典: docs/research/llm-world-interface-audit.md §4/§6 IF-1 /
  #       docs/research/if-lane-research.md §4(W3C PROV-DM の wasInformedBy + prov:role)。
  # ON にすると「LLM が決めた行為」が生む L1 イベント(speak / sns_post / dm / spend /
  # free_action / tools 系 / P2 系 / verify 系 …)に、**その行為を決めた LLM 呼**の
  #   - llm_call_id … 既存の L1 固定列(これまで思考系イベントにしか入っていなかった)
  #   - llm_role    … payload の新キー。**l1b_llm.parquet の purpose と同じ語彙**
  #                   (social / reply / dm / post / solo / novel_place / congestion /
  #                    unknown_word / plan)= 新語彙を 1 つも作らない
  # を刻む。これで (step, agent_id) join に頼らず l1b_llm と 1:1 で突き合わせられる
  # (同 step 複数発火の曖昧さが構造的に消える)。
  # ★刻むのは **行為者自身が出したイベントだけ**(聞き手の hear / opinion_shift は
  #   別主体の activity なので刻まない)。DAG の組み立ては事後の解析側の仕事で、
  #   シム側はグラフを持たない(捕集と組み立ての分離=観測がシムを変えない)。
  # ★ON のときだけ、熟慮経路に迷い込んだ plan / recall / reflect を
  #   fallback{reason:"misrouted_action"} として 1 件記録する(従来は無音の no-op)。
  # 読むだけ・乱数ゼロ・LLM 呼ゼロ・プロンプト 1 バイト不変。
  # OFF では一時キーすら積まれない = ゴールデン L1 バイト一致。実装 src/society/provlink.py。
  llm_link: false
  # ---- 因果台帳 IF-F(第100バッチ 2026-08-09・**既定 OFF**)----
  # 正典: docs/research/llm-world-interface-audit.md §2(誰が何を起こしたかが L1 から
  #       復元できない)/ 実装と分類表 src/society/observer/causality.py。
  # L1 の agent_id は「この行の主語」ではなく「**この行が誰の視点で記録されたか**」で、
  # 種によって意味が違う(speak=話した本人 / hear=聞いた側 / wage=受け取った本人 /
  # weather=-1)。同じ 1 列に同居しているので「エージェントが起こした変化」と
  # 「装置が起こした変化」を事後に分離できず、**『世界を変えた人』の測定が成立しない**。
  # ON にすると L1 に 2 列が生える:
  #   - cause_type … agent / device / schedule / physics / natural / boundary の 6 語
  #                  (設計文書の 4 分類への射影は causality.PROJECTION_4WAY。
  #                   schedule と physics は device の下位 = DEVS の δ_int)
  #   - actor_id   … その出来事に結びつく行為者 id。hear→payload["speaker"]・
  #                  opinion_shift→["source"]・transmission→["from"] のように
  #                  **agent_id が患者(受け手)である種は payload から戻す**。
  #                  復元できないもの(世界イベントの -1)は null で正直に開示する。
  # 分類は kind 単位の静的表なので、事後解析(scripts/analyze_causality.py)は
  # **この列が無い既存ランでも同じ分類ができる**。列がある場合は表と突き合わせて
  # 食い違いを報告する(表の誤りを検出する装置)。
  # 読むだけ・乱数ゼロ・LLM 呼ゼロ・プロンプト 1 バイト不変。
  # OFF では logger が刻印経路にも入らず parquet の列も生えない = L1 バイト一致。
  causality:
    enabled: false
  # ---- 状態ハッシュチェーン(第78バッチ 2026-07-31・**既定 OFF**)----
  # 検証ラン(run.mode=verify)専用の装置。ON にすると各 step の終了時に world state の
  # **正準シリアライズ**(dict/set はキーでソート・浮動小数は固定桁十進・集約順固定)を
  # sha256 し、**前 step のハッシュを混ぜてチェーン**にして runs/<name>/state_hash.jsonl
  # へ 1 行 1 step で書く。1 レコードでも書き換われば以降のチェーンが全部ずれるので、
  # 「同じ seed で同じ世界が再生されたか」を L1 バイト比較より軽く・機械的に判定できる。
  # 正準化の流儀は engine/checkpoint.py の config_hash(sort_keys=True の JSON)を再利用。
  # **書くだけ・読む経路なし**(R1)= L1/L2/L3・summary・乱数・LLM 呼数のいずれも変えない。
  #   受入基準 T1: 同一 seed の 2 ラン(mock)でチェーンが完全一致する
  #   受入基準 T6: engine.batch_llm.workers を 1 と 4 に変えてもチェーンが一致する
  # interval: 1(既定)= 毎 step。大きくすると n step ごとにだけ計算して書く(性能の逃げ道。
  #   チェーンは「記録した step どうし」で繋がるので、間隔を変えたラン同士は比較できない)。
  state_hash:
    enabled: false
    interval: 1                 # 何 step ごとにハッシュを採るか(1=毎 step)
    float_digits: 6             # 浮動小数の固定桁十進(正準化。桁を変えると全ハッシュが変わる)
  y_weights: null               # Y外部(世界改変量)の4層合成重み。既定 null=合成せず列を出すのみ。
                                # ★合成式は B段でユーザーと決定(analyze 側で使用)。例:
                                # y_weights: { spatial: 1.0, resource: 1.0, symbolic: 1.0, network: 1.0 }
  # ---- LLM 健全性 KPI(P0バッチ 2026-07-29・既定 OFF=L2 列なし=既存ランとバイト一致)----
  # ON で L2 に 3 列(llm_calls_total / llm_fallback_rate / llm_cache_hit_rate)を毎 step 追加する。
  # 読むだけ・乱数ゼロ・LLM 呼ゼロ・イベント追加ゼロ(R1: 機構は k を読まない)。
  # 値はランのプロセス開始からの**累積**(CachedLLM.calls/hits と ObserverLogger のカウンタ)なので
  # **resume すると 0 から数え直す**(= resume 前後で L2 バイト一致にならない)。既定 OFF はこの
  # 性質が既存の resume バイト一致テストと衝突しないための選択。本選 10 日ランでは ON にして
  # scripts/watchdog.py --fallback-warn の監視対象にする。
  # llm_fallback_rate の定義と正直な限界は observer/aggregate.py の該当ブロックを参照
  # (分子 = L1 `fallback` イベント = 発話系のパース失敗のみ。plan の再試行・reflect の空応答は
  #  別イベントを持たないので分子に入らない=真のパース失敗率の下限)。
  llm_health:
    enabled: false
  # ---- エコー/自己反復の計測(第70バッチ IDEA① 2026-07-31・**常設**)----
  # L2 に 5 列(echo_max / self_similarity_mean / echo_utterance_rate /
  # transmission_novel / transmission_novel_rate)を毎 step 追加する。
  # 「同じ語が繰り返し出た」が伝播なのか LLM の反復癖なのかを切り分けるための観測で、
  # **他の全ての伝播数値(造語 k*・誤情報・規範化)の信頼性の前提**になるため、
  # speech_diversity(R12 崩壊検知)と同じ「常設の観測列」として既定 ON にしてある。
  # 読むだけ・乱数ゼロ・LLM 呼ゼロ・L1 イベント追加ゼロ・プロンプト 1 バイト不変
  # (=ゴールデン tests/data/golden_baseline_l1.json はバイト一致で不変)。
  # enabled: false にすると 5 列とも消える(過去ランと L2 を完全一致させたい場合の逃げ道)。
  # 定義・正直な限界は src/society/observer/echo.py の docstring を参照。
  echo:
    enabled: true
    window_steps: 144           # rolling 窓(144 = 1 日)
    ngram: 4                    # 自己類似度の文字 n-gram の n
    sim_threshold: 0.6          # 直前の自分の発話との Jaccard がこれ以上ならエコー扱い
    min_utterances: 2           # echo_max の対象にする最小発話数(1 件で 1.0 になる退化を防ぐ)
  # ---- 退行シグナル監視(第91バッチ 2026-08-03・**既定 OFF = 列が 1 つも生えない**)----
  # 正典: docs/plans/source/design-discussion-20260802.md §3。
  #   「監視すべき退行シグナルは、行動分散の単調減少、訪問地点エントロピーの低下、
  #     発話の語彙エントロピー低下と n-gram 重複率上昇、発火率の 0 または飽和への張り付き」
  # 25万人ランで最も怖いのは落ちることではなく **終了後に全員が同じ行動へ収束していたと
  # 判明すること**(§3)。その 4 群を L2 の rolling 窓列として出す。
  # ON で 9 列(reg_act_between_var / reg_act_entropy_mean / reg_act_agents /
  #   reg_visit_entropy / reg_visit_nodes / reg_vocab_entropy / reg_ngram_repeat_rate /
  #   reg_vocab_tokens / reg_vocab_excluded)。
  # **`cognition.fire` も ON なら更に 5 列**(reg_fire_rate_p10/p50/p90 /
  #   reg_fire_zero_frac / reg_fire_sat_frac)。fire OFF では材料(cog_fire)が 1 件も
  #   出ないので、0 を並べて「張り付いている」と誤読させるより列ごと消す。
  # 読むだけ・乱数ゼロ・LLM 呼ゼロ・L1 イベント追加ゼロ・プロンプト 1 バイト不変
  # (= ゴールデン tests/data/golden_baseline_l1.json は無風)。
  # ★横煙(N=25万)では **OFF のまま回すこと**。窓合計が在場個体数に比例して常駐する。
  # 判定は事後の `python scripts/detect_regression.py <run>`(閾値は引数必須)。
  # 定義・正直な限界は src/society/observer/regression.py の docstring を参照。
  regression:
    enabled: false
    window_steps: 144           # rolling 窓(144 = 1 シミュ日)
    ngram: 2                    # 語彙の文字 n-gram の n(analyze_specialization.py と同値)
    exclude_template: true      # 第87 engaged の定型応答を語彙系から除外(件数は列に残す)
    fire_sat_per_step: 1.0      # 発火率がこれ以上なら「飽和に張り付き」とみなす
    min_agents: 2               # 個体間分散を出す最小個体数(1 人では分散が定義できない)
  # ---- 初期フレーム共変量 第74バッチ IDEA④(2026-07-31。既定 OFF=summary にキーを足さない)----
  # 「そのランが最初の N 日をどう解釈したか」を **ラン単位の共変量** として summary.json へ残す。
  # workplace チームの実測(初期の解釈枠がその後の分化の形を決める)を層別の材料にするための
  # 記録で、**L1/L2/プロンプト/乱数/LLM 呼数のいずれも変えない**(finalize で確定済みの
  # l1_events.parquet を読み直して決定論集計するだけ = 完全な事後処理)。
  # days: 0(既定)= 一切集計しない = summary.json に initial_frame キーが出ない(既存ランと同形)。
  # >0 で最初の days 日(1 日 = 144 step)を窓に取り、行動(イベント種)構成比・造語数・
  #   発話数・規範マーカー出現率・L2 平均(mean_grievance / mean_drive 等)を書く。
  # 解析側は scripts/analyze_norms.py --cohort / analyze_sweep が層別軸として読む。
  initial_frame:
    days: 0                     # 0=OFF(summary にキーなし)。1 で初日、2 で 2 日分を窓にする
    top_kinds: 20               # 記録するイベント種の上限(件数降順→種名昇順の決定論で切る)

# ============================================================
# アブレーション(第78バッチ 2026-07-31。dual-mode-observe-verify-plan.md §2 第78行 /
# dual-mode-instructions.md Phase 1 / dual-mode-instruments.md Part C(2)・Part D)。
# **対照条件のスイッチだけ**を置く層で、世界の機構は 1 つも増えない。
# 既定は全て OFF(cognitive_tier は "full")= 現行挙動と完全同一(golden L1 バイト一致)。
# 実装は src/society/ablate.py に集約。再現性等級は src/society/registry.py に宣言済み。
# ★アブレーションは「差分でしか主張しない」ための装置。単独ランの数値に合否を付けないこと。
# ============================================================
ablate:
  # ---- (1) LLM を使わない対照 ----
  # true にすると **LLM を 1 本も呼ばず**、既存のルール層だけで世界を回す:
  #   熟慮(_llm_speak)は即 None=沈黙 → routine.decide(既存のニーズ充足 + POI 選好)へ後退。
  #   朝の一日計画(planning)と夜の内省(reflection)も撃たない。
  # ルールは **既存のものだけ**で構成し、新しい凝ったヒューリスティックは足していない
  # (比較のベースラインなので素朴であることに価値がある=原指示 Phase 1)。
  # ★呼数 k は当然 0 になる(affects_k=true と正直に宣言してある)。
  # ★controls.mode=null_series(内容非結合のダミー呼)とは**軸が別**。併用すると
  #   ダミー呼だけが残る(矛盾した設定)ので、対照ランでは controls.mode=none にすること。
  llm_off: false
  # ---- (2) 伝播を止める対照(語彙の専門化スコアの帰無モデル)----
  # true にすると、発話は**通常どおり生成される**(= LLM 呼の発生箇所・本数の構造は不変)が、
  # その**内容が他エージェントの文脈に一切入らない**。切る/保つの線引きは:
  #   切る … 他者の記憶へ積む発話文・他者の対話履歴・他者へ渡る語彙(adopted)・
  #          他者の予定帳簿への抽出・他者の信念(伝聞)・SNS タイムライン本文・DM 本文。
  #   保つ … 自分の発話の記憶(自己連続性)・同席者の顔ぶれ・`hear` の発生・接触台帳
  #          (会話量)・返答権の付与(= 返答の LLM 呼はこれまでどおり撃たれる)。
  # この条件で専門化スコアが落ちなければ、その専門化は相互作用ではなく**ペルソナのプロンプト
  # 由来**だったと結論する(Part C の狙い)。
  # ★no-fingerprint: 合成文(「誰かが何か言っていた」等)は**注入しない**。他条件に現れない
  #   新種の痕跡になり語彙指標も汚すため。残る痕跡は「周りは居るが誰も何も言わない街」で、
  #   これは原理的に消せない = fingerprint_risk="known" として登録してある。
  propagation_off: false
  # ---- (3) 認知階層のダイヤル(Part D)----
  # llm.fleet の割当を強制的に下位ティアへ落とす。現象ごとに「それが消える知能の下限」を測る。
  #   full  … 既定(上書きなし)
  #   mid   … model.tiers の "mid" プールへ全 purpose を強制
  #   small … model.tiers の "small" プールへ全 purpose を強制
  #   rule  … LLM を使わないルール層(= llm_off と同一の層。呼数 0)
  # ★正直な縮退宣言: FleetLLM を使っていないラン(mock / 単一 vLLM / ollama)や、
  #   model.tiers に該当プールが無いランでは **small / mid は 1 バイトも効かず full と同一**に
  #   なる。黙って「ティアを下げた」ことにはせず、起動時 WARNING と run_manifest.json の
  #   ablate.tier_effective に「効いていない理由」を必ず出す。
  # ★実時間の漏れ防止: ティアを変えるとレイテンシが変わるが、世界時間は sim clock のみが
  #   供給する(src に datetime.now() は grep ゼロ)ので世界の挙動には漏れない。
  cognitive_tier: full
  # ---- (4) 相手選択をランダムにする対照 ----
  # true にすると、発話の返答権/宛先を関係グラフ(closeness)でも距離(nearest)でもなく
  # **同席者からの一様乱択**にする。関係構造が効いているのか、単に会話量が効いているのかを
  # 分離する(Part C(2))。聞き手の集合(hearers)は変えない=会話量・呼数は不変。
  # ★専用 stream "shuffle_partners" から **always-draw**(ON/OFF に関わらず候補が 1 人以上
  #   いれば必ず 1 本引く)。RngHub はステートレスなので新 stream の消費は既存 stream の
  #   draw 順に干渉しない = 既定 OFF は golden バイト一致のまま draw 数も不変。
  shuffle_partners: false
  # ============================================================
  # ---- (5)(6)(7) プラセボ・アブレーション L1(第89バッチ 2026-08-03)----
  # 正典: docs/plans/source/design-discussion-20260802.md §1
  #   「L0(ルールのみ)から L4(大型モデル)まで知能の水準を段階化し、特に L1 として
  #    『呼び出し回数・フォーマット・乱数消費は同一のまま中身だけ壊したプラセボ LLM』
  #    (文脈シャッフル・ペルソナ入れ替え・文脈遮断)を挟む。マクロ指標が L0 から L4 へ
  #    単調に変化するなら、LLM 由来の知的振る舞いが集団結果を生んでいる証拠になる。」
  # 梯子の全体像と実行レシピ(conf 例)は docs/research/ablation-ladder.md。
  #
  # 3 種の共通規約
  #   ・LLM 呼び出しの**発生箇所を 1 つも足さない/減らさない**(プロンプト文字列を書き換える
  #     だけ)。作用点は cognition/deliberate.build_prompt の末尾 3 行だけ。
  #   ・**書式は不変**: 節の位置(行の並び)・接頭辞・区切り文字・項目数を保ち中身だけ差し替える。
  #     行数は増減しない。触る節の一覧は src/society/ablate.py の SECTIONS(監査用の列挙)。
  #   ・乱数は**専用 stream のみ**("ablate_persona_swap" / "ablate_context_shuffle")。
  #     RngHub はステートレスなので既存 stream の draw 順・値に干渉しない = 既定 OFF は
  #     golden バイト一致かつ draw 数も不変。
  #   ・★**相互排他**: 3 種は同じ節を書き換える同一軸の条件。同時 ON は解釈不能なので
  #     構築時に ValueError で落とす。propagation_off との併用も禁止(あちらは節を「消す」・
  #     こちらは「潰す/入れ替える」ので重ねると節の同定ができない)。llm_off との併用は
  #     プロンプトが 1 つも組まれない=プラセボが無効になる矛盾設定なので WARNING を出す。
  #   ・★fingerprint_risk=known(正直な宣言): **中身が入れ替わればエージェントの応答は変わり
  #     世界も変わる。それが目的**(変わらなければプラセボとして無意味)。当人から観測できる
  #     差分を隠す方法は存在しないので registry へ known として登録し、manifest と
  #     summary.placebo に「壊した量」を必ず残す。
  # ============================================================
  # ---- (5) 文脈シャッフル ----
  # true にすると、他者由来の文脈節(知っている言葉/直近の出来事/記憶に残っていること/
  # ふと思い出したこと/間柄/同席の身近な人/近くにいる人/タイムライン/直前のやりとり/
  # 返答の相手発話)を、**同一ラン内の別エージェントの同種の節**と決定論的に入れ替える。
  # ペルソナ・自分の状態(自分の理解・あなたの考え・日記・さっき言ったこと・馴染みの場所)と
  # 物理世界(時刻・場所・気分・天気)は**保持**する = 「文脈が正しいこと」だけを壊す。
  context_shuffle: false
  # ---- (6) ペルソナ入れ替え ----
  # true にすると、プロンプトのペルソナ節を**別エージェントのペルソナ**と入れ替える。
  # 割当は**対合**(A↔B の相互交換=全単射)なので人口のペルソナ分布は完全に保存される
  # (片方向置換だと分布が変わり「結びつきを壊したせい」と分離できなくなる)。
  # 世界状態・文脈は正しいまま = 「人格と行動の結びつき」だけを壊す。
  # ★限界: 対合表は**構築時の名簿**から組む。persona_pool のローテーションで構築後に
  #   実体化した個体は表に無いため一方向ドナーへ後退する(summary.placebo.involution=false
  #   で判る)。pool × persona_swap では対合性を保証しない。
  persona_swap: false
  # ---- (7) 文脈遮断(完全版)----
  # true にすると、上と同じ文脈節を中立プレースホルダ "…" へ潰す(項目数と区切りは保つので
  # 「直近の出来事: … / … / …」のように**書式だけが残る**)。
  # ★第78 propagation_off との違い: あちらは**送り手側**の遮断で、発話内容が他者の記憶・語彙・
  #   信念・TL へ入るのを止める(世界状態そのものが変わり、受け手のプロンプトから節が消える)。
  #   こちらは**受け手側**の遮断で、世界状態は 1 バイトも変えずプロンプトを組む最後の一手前で
  #   中身だけを潰す(節は消えない)。前者は伝播の因果、後者は文脈利用の因果を測る。併用不可。
  # ★合成文は注入しない(第78 と同じ判断): 「誰かが何か言っていた」等の**文**は他条件に
  #   現れない新種の痕跡になり語彙指標を汚染するので、記号 1 文字に限る。
  context_sever: false
  # ============================================================
  # ---- (8) プロンプト言い換え(第92バッチ SV-U1 B4 = サーベイ S-16)----
  # 正典: docs/research/sv-items-research.md §3 / docs/research/llm-social-sim-survey.md §3 S-16
  #   「出力は乱数種・**プロンプトの言い回し**・モデルの軽微な変更に敏感」(サーベイ §7)。
  #   我々は「プロンプトが何であったかの完全な記録と、変わっていないことの証明」は極めて
  #   強い(journal 全文保存・no-fingerprint・contract の ON/OFF 完全文字列一致)が、
  #   「**言い回しを変えたら結論の符号が変わるか**」を一度も測っていない。これがその装置。
  #
  # 値: ""(既定=OFF・現行挙動とバイト一致)/ "v1".."v4"
  #   v1 … 語彙のみ(内容語を同義語へ。語尾・語順は原文のまま)
  #   v2 … 文体のみ(敬体→常体・命令形。内容語と語順は原文のまま)
  #   v3 … 語彙 + 文体
  #   v4 … 語彙 + 文体 + 統語限定(節の順序を変えるのは宣言した 5 文だけ)
  #   水準を単独と複合に分けてあるので「どの水準が効いたか」まで言える(PromptBench の 4 水準)。
  #
  # ★中身は **data/prompt_paraphrase_sets.json の凍結ルックアップ表**が唯一の源。
  #   LLM で動的生成してはならない(呼数の構造保証 affects_k=False が壊れる)。表の sha256 は
  #   run_manifest.json の ablate.paraphrase.sets_sha256 に必ず残る。
  # ★JSON キーと行動語彙(speak/post/dm/…の動詞名)は 1 文字も変えない=パース互換。
  # ★乱数を 1 本も引かない(表引きは決定論)= 既定 OFF は golden バイト一致・draw 数も不変。
  # ★**相互排他**: プラセボ 3 種(接頭辞リテラル一致で節を同定する)と併用すると節が
  #   同定できなくなるので構築時に ValueError。propagation_off との併用も同じ理由で不可。
  #   llm_off との併用はプロンプトが 1 つも組まれない=無効なので WARNING で告知して素通し。
  # ★予算: CachedLLM は内容アドレスキャッシュなので言い換えると**全ミス**する。実 LLM 呼が
  #   セット数だけ増えるため、paraphrase ランは短ラン(≤24 step または 1 日)に限ること。
  # ★判定は事前登録 前文 ④(b): 主要結論の**符号が反転したら**その結論を取り下げる。
  prompt_paraphrase: ""

# ============================================================
# 実験セル(第74バッチ IDEA④ 2026-07-31)。**対照条件の宣言だけ**を置く層で、
# 世界の機構は 1 つも増えない。既定は全て OFF = 現行挙動と完全同一(バイト一致)。
# ============================================================
experiment:
  # ---- 初期個体差ゼロ対照(flat_traits)----
  # 研究課題「生まれつきか、環境から創発か」に対する最強の対照条件。ON にすると
  # **全エージェントの traits を同一の定数**にし、traits から決まる発火個体差
  # (drive_threshold / fire_weight)も同じ定数写像へ潰す = R²(k) の分母を実験的に消す。
  # ペルソナ文(名前・年齢・職業・住所・職場・就寝時刻)は **一切変えない**
  #   = 消すのは「生まれつきの傾性」だけで、履歴と環境は残す(ebiyama 講評と整合)。
  # 実装点は src/society/agents/persona.py:build_agent の 1 箇所だけ(名簿経路・
  #   pool 経路の両方がここを通る)。**乱数の消費本数は ON/OFF で完全に同一**
  #   (sample_traits / drive_params は従来どおり引いてから値を捨てる)。
  # 実査で確認した「traits の漏れ経路」= drive_params(発火閾値)・opinion_params・
  #   drift_params・reflect_trigger_params・sdt_params・needs_profile・collective_init。
  #   全て build_agent が据えた agent.traits を読むので、ここを定数化すれば全経路に効く。
  #   presence の日次選抜は stream("presence", pid, day) の純関数 = **traits 非依存**
  #   (engine/scheduler.py の _phase_pool_rotation)なので漏れない。
  # ★LLM 呼数は ON/OFF で一致しない(閾値が変われば誰が発火するかが変わる=それが実験の目的)。
  #   k との交絡は conf/experiments/zero_traits.yaml が controls.mode=compute_matched で潰す。
  flat_traits:
    enabled: false              # true で全個体の traits を定数化(既定 false=現行挙動)
    value: 0.5                  # 定数化する値(全 trait 共通。0.5=分布の中心)
    include_derived: true       # traits から決まる drive_threshold / fire_weight も定数写像へ潰す
  # ---- 感度 g の初期値条件 F / N / P(第82バッチ・設計 §2.7)----
  # 「**フラット初期値は中立ではない**。『全チャンネルに等しく注意を向ける人間がいる』
  #  という強く非人間的な仮説である。したがって初期値そのものを実験条件として記録する」
  #   F = flat   … 全員 g⁰ 同一(純粋対照)
  #   N = noise  … フラット + 専用 stream のノイズ(**異質性のみ**の効果)
  #   P = persona… ペルソナ由来(既定。**ペルソナ整合的な異質性**の効果)
  # 「**条件 N が鍵**。P と N を比較すると『初期の多様性そのものが効くのか、ペルソナと
  #  整合した多様性が効くのか』が分離できる。P ≈ N ならペルソナの中身は効いておらず
  #  異質性だけが効いている。どちらに転んでも主張になる」
  # ★CRN: ノイズは **3 条件すべてで同じ本数だけ引く**(使うのは noise 条件だけ)。
  #   → 条件間の差から「乱数消費列の差」という交絡が消える(第74 flat_traits と同型)。
  # ★このブロックは cognition.g_update.enabled=true のときだけ意味を持つ(OFF は無風)。
  # 分析は scripts/analyze_g.py(g(0) 分散 vs Δg 累積の分散分解 + 対数変化 + 順位変化)。
  g_init:
    mode: persona               # persona(=P・既定)/ flat(=F)/ noise(=N)
    flat_value: 0.5             # F/N の土台になる trait 定数(flat_traits と同じ既定)
    sigma0: 0.30                # σ₀: ノイズの相対分散(§2.7「σ₀ 自体をパラメータ化する」)
                                # (false にすると名簿の個体差が発火閾値経由で残る=不完全な対照)

# ============================================================
# 第6バッチ(ユーザー要望 2026-07-06)。すべて既定 OFF=現行挙動と完全同一。
# 本番・B段での ON はユーザー承認のうえ一括で行う(ON 例は各ブロックのコメント)。
# ============================================================

# ============================================================
# 制度値 institutions(基盤モデル抽出 D1-W3。docs/plans/env-classification.md の3層設計)。
# 従来 government.py に **コード埋没** していた日本の制度値をここへ外出しした(既定=現行コード値
# =ゴールデン/本番の挙動を一切変えない)。simulation.py が institutions.build_cfg で1回正準化し、
# government(税・予算・給付)が読む。W4 の EnvPack ローダは env.yaml の institutions.pref: tokyo を
# ref/institutions_jp.yaml から解決してこのブロックへ展開する(② 共有参照 → ③ 環境固有 の橋渡し)。
# 掟(値の二重管理のズレ検知): 国・都道府県スコープの値は ref/institutions_jp.yaml と一致させる
# (tests/test_institutions.py が固定)。市区町村スコープ(区の予算・給付)は env 固有=③ として残す。
# ============================================================
institutions:
  # 所得税 実効税率ブラケット(国スコープ。額面年収レンジ→実効税率の近似=累進の圧縮)。
  # up_to=null は上限なし。年換算は日給×labor.annual_workdays。ref national.income_tax_effective と一致。
  income_brackets:
    - {up_to: 2000000,  rate: 0.02}
    - {up_to: 3300000,  rate: 0.03}
    - {up_to: 5000000,  rate: 0.05}
    - {up_to: 7000000,  rate: 0.07}
    - {up_to: 10000000, rate: 0.11}
    - {up_to: null,     rate: 0.20}
  consumption:                    # 消費税(国スコープ)。ref national.consumption と一致。
    rate: 0.10                    # 標準税率
    reduced_rate: 0.08            # 軽減税率(food系)
    national_share: 0.78          # 国:地方=78:22(地方消費税=消費税額×22/78)
    reduced_cats: [food]          # 軽減対象カテゴリ
  resident:                       # 住民税(所得割)。rate=国スコープ / ward_share=都(特別区)スコープ。
    rate: 0.10                    # 標準税率(区6%+都4%)。ref national.resident_tax.rate と一致。
    ward_share: 0.6               # 区:都=6:4。ref prefectures.tokyo.special_ward_resident_split と一致。
  labor:
    annual_workdays: 245          # 年間労働日(日給→年換算)。ref national.labor.annual_workdays と一致。
  budget:                         # 予算初期残高(円。年予算÷人口×100体スケール)。
    ward_initial: 60000000        # 渋谷区(市区町村スコープ=③ 環境固有)
    metro_initial: 65000000       # 東京都(都道府県スコープ)
    nation_initial: 92000000      # 国(国スコープ)
  benefit:                        # 区の生活困窮者支援(市区町村スコープ=③ 環境固有)。
    threshold: 2000               # 所持金がこの額未満で給付
    amount: 3000                  # 給付額

# ---- 行政 B(区/都/国の税・給付・公務員給与。調査: docs/research/shibuya-government.md)----
# ON 時: 賃金から所得税(→国)+住民税(→区6:都4)を源泉徴収(手取り支給)、消費に内税の
# 消費税(標準10%/食品8%、国78:地方22)を計上(価格の名目は不変)。区は困窮者へ給付。
# 公務員(区職員=区予算/警察官・消防士=都予算)の給与は予算から歳出。日次で public_budget。
# 制度値(税率・予算初期値・給付閾値・income_brackets)は上の institutions ブロックが供給する。
# この government ブロックは機構トグル(enabled)を持つ(個別の制度値上書きも後方互換で可)。
government:
  enabled: false                # ★ON 推奨(本番): true。公務員入り名簿 = data/personas_100_civic.json

# ---- 娯楽メディア D(TV/動画/ゲーム。文献: docs/lit/media__entertainment-effects.md)----
# ON 時: 在宅の朝/夜帯に年齢・職業別プロファイルでメディアセッション(media_use)。
# セッション中は外出・SNS閲覧を置換(時間置換)。終了時に factors.media_grievance で気分修復。
media:
  enabled: false                # ★ON 推奨(本番): true(現代生活の再現に必須=ユーザー要望)
  prompt_context: false         # 直近視聴タイトル(架空)1行を発火文脈へ(LLMキャッシュキーに影響する独立フラグ)
  start_prob: 0.5               # 在宅×時間帯の1機会あたり基礎開始確率(×年齢・職業倍率)
  min_steps: 2                  # セッション長 下限(20分)
  max_steps: 8                  # セッション長 上限(80分)
  max_sessions_per_day: 2

# ---- 組織 W2-1(職場・学校の実態。台帳: data/organizations_shibuya.json = 架空・統計準拠)----
# ON 時: 名簿対応の配属(org_assignments_*)で各エージェントに職場/学校を付与。勤務完遂→
# production(何を作った/提供したか)、学生の登校→study(何を学んだか)、プロンプトに所属1行。
# 組織会計(org_ledger)は集計のみ(市場メカニズムは B段)。仕様: docs/design-candidates/org-integration-spec.md
organizations:
  enabled: false                # ★ON 推奨(本番): true(要 agents.personas_file=data/personas_80.json 等)
  book: data/organizations_shibuya.json
  revenue_margin: 1.5           # 勤務完遂1回=日給×これ を組織収益の代理指標として集計
  commute_to_poi: false         # ★ON 推奨(本番): true(第7バッチ)。配属者の職場/学校を台帳の
                                # workplace_poi(実在ノード)へ束縛=実際にそこへ通勤・通学する。
                                # false(既定)なら work_node は上書きしない=既存挙動とバイト一致。

# ---- L2 域内従業者の「業務の実体」(work.service。既定 OFF。設計: docs/research/l2-work-reality.md)----
# 勤務中(work_node に在場・勤務時間帯)のエージェントへ「業務の実体」を与える決定論機構(LLM/乱数ゼロ)。
#  接客系(小売27%/対人サービス14.5%/飲食7%): 客の消費 spend と同一 work_node の勤務中スタッフに serve を帰属。
#  オフィス系(office 51.5%): 日次境界に「出勤者数×role重み」を org_output として集計(会社が何かを作る最小形)。
# 業務が本人に残る: serve 要約を interstitial(S2)ダイジェストに1行供給→夜内省の材料へ自然合流(ONでもLLM呼数不変)。
# 既定 OFF=イベント 0 件・状態も増やさない=ゴールデン L1 とバイト一致(R1)。業種→業務は POI カテゴリ駆動。
work:
  service:
    enabled: false              # ★ON 推奨(本番): true(L2 の業務の実体を有効化=ユーザー要望)
    serve_by_cat:               # 客の消費カテゴリ(spend.cat)→ 接客業務ラベル(業務名は config 由来)
      food: 飲食の接客
      cafe: 飲食の接客
      nightlife: 接客・サービス
      shop: 販売・レジ対応
    max_serve_per_event: 1      # 1消費あたり帰属するスタッフ数の上限(id 昇順で先頭から)
    record_unstaffed: true      # スタッフ不在の消費を agent_id=-1 の記録として残す(挙動変更なし・観測のみ)
    digest: true                # interstitial ON 時、スタッフの S2 ダイジェストに業務要約を1行供給
    # ---- 会社観測データ層 B4(既定 OFF=serve payload バイト不変・org_ledger 不在)----
    indoor_fields: false        # ★ serve に org_id/floor を付ける。解決順=スタッフ経由(主)→ unstaffed は
                                #   node→org が一意のときのみ → 多義ノードは org_id=null(unknown を正直開示)。
                                #   (建物,階)絞り込み(客とスタッフの floor 一致)は indoor.enabled かつ本 ON 時のみ。
    office:
      enabled: true             # オフィス系の日次 org_output を出すか
      poi_cats: [office]        # オフィス系職場と見なす職場 POI カテゴリ
      base_weight: 1.0          # role 重みの既定(1人=1.0 → 産出は出勤者数に比例)
      role_weights: {}          # occupation/role → 産出重み(空=全員 base_weight)
      by_org: false             # ★ org_output を org_id 単位に分解(同居複数社)。indoor.enabled のとき値を
                                #   「頭数×重み」でなくミクロ在席分へ。basis フィールドで式を自己記述。
                                #   ON 時 org_output は日次境界(翌日先頭 step)に完了日分を記録(payload に day)。
      attendance_zones: [desk, meeting]  # ミクロ在席分に数える職務区画型(break/rest は在席に数えない)
    ledger:                     # 組織日次系列サイドカー(runs/<run>/org_ledger.parquet)
      enabled: false            # ★ true で 1 日 1 行/社を書く(会社 UI=B7 が読む契約)。列: day, org_id,
                                #   production, revenue_est, wage_paid, serve_count, attendance_min。値無し列=0。
  # ---- 職場束ね直し(第49バッチ。既定 OFF=現行の work_node 付与と完全同一=バイト一致)----
  # pool 経路の L2/L3 は occupation(role)が persona._pick_workplace の _WORK_CAT に載らないと
  # work_node を持たない=接客(serve)/産出(org_output)の帰属から漏れる(coverage の穴)。ON 時:
  # 台帳 organizations の workplace_poi.node へ org_id で直束ね(organizations.commute_to_poi の pool 版)。
  # 台帳ノードが現行地図に無い時は POI カテゴリ + 安定ハッシュで決定論マッチ(ontology 流儀)。束ねは
  # (pool_pid, 固定属性)の純関数=run.seed 非依存=hydrate 再入で同一 work_node(P3 ローテーション不変)。
  bind_workplace:
    enabled: false              # ★ON 推奨(本番): true(L2 の work_node coverage 拡大=serve/org_output の網羅率↑)
    book: data/organizations_shibuya_wide11k.json  # org_id が参照する台帳(100万プールの母体)
    rebind_bound: false         # 既に work_node を持つ個体も実 POI へ束ね直すか(既定=未束のみ=coverage 拡大に限定)
    poi_match_fallback: true    # 台帳ノードが「現行地図に無い」**または「その業種の POI を実際に
                                # 持たない」**時、POI カテゴリ + 安定ハッシュで決定論マッチ(第100)。
                                # ★後者の条件が第100の是正点: 台帳は産業×規模帯→建物の分布で置いた
                                #   合成値なので node が地図の POI 実体と食い違う(実測 wide_v7: 同カテゴリ
                                #   POI のある node に居るのは food 401/1650・shop 986/3850 社のみ)。
                                #   食い違ったまま束ねると客の来ない場所に店員が立ち serve が永久不在。
                                #   false にすると旧挙動(台帳 node を無条件採用)へ戻る。
    seed: 20260722              # 決定論マッチの安定ハッシュ seed(run.seed 非依存)
    default_open: "09:00"       # 勤務窓の既定(台帳/record の shift_pattern が無い時の後退値)
    default_close: "18:00"
    occ_cat: {}                 # occupation/role → 職場 POI カテゴリ(org_id が無い層=L5 等を束ねたい時。既定=空)。
                                # 空でも persona._WORK_CAT(既存の職業→職場カテゴリ表)を後退参照する。
                                # 地図に対応カテゴリが無い役割(駅員/警察官/運転士/議員)は束ねず
                                # n_unbound_after に正直に数える(推測で写像を作らない)。

# ---- 欲求プロファイルの個人差 W2-2(文献: docs/lit/needs__individual-differences.md)----
# ON 時: traits・年齢・職業から5次元の価値プロファイル(刺激/安全/関係/有能/自律)を決定論生成し、
# 欲求ゲージ入力(novel_place/congestion/silence 等)への個人別感度倍率に変換(「何を欲し・
# 何を不快と感じるか」の個体差)。R1: k 非依存(専用 stream "needs")。psych.sdt と乗算合成可。
needs:
  enabled: false                # ★ON 推奨(本番): true(現実の欲求多様性の再現=ユーザー要望)
  sensitivity_gain: 0.6         # 倍率の効き幅(1±gain×プロファイル偏差)
  profile_sigma: 0.10           # 個体固有ゆらぎ(価値プロファイルの分散)
  occupation_weight: 1.0        # 職業ニュアンスの強さ
  clip_lo: 0.5                  # 倍率下限
  clip_hi: 2.0                  # 倍率上限

# ---- 感情・興味・注意ハブ(affect。文献: docs/lit/neuroscience__emotion-interest-attention.md §5.1/§6)----
# 脳科学の核: 感情・興味・注意は独立モジュールでなく、覚醒度 arousal(1スカラ)+ 顕著さ salience(1関数)を
# 共有した1回路(Russell core affect / Menon&Uddin salience network)。最小版=非LLM・決定論・RNG不要の3改造:
#  (1) arousal スカラ(観測イベントで↑、毎step baseline へ減衰)
#  (2) novelty/arousal → memory.importance 加点(顕著記憶の符号化増強)
#  (3) salience 上位 K ゲート(同時知覚の容量制約 Cowan)+ 発火閾値の逆U字変調(Yerkes-Dodson)
# すべて既定 OFF=現行挙動と完全同一(バイト一致)。R1: 入力は観測イベントのみ(k 非依存)。ON は本番でユーザー承認のうえ。
affect:
  enabled: false               # ★ON推奨: true(感情・興味・注意を有効化)
  arousal_baseline: 0.2
  arousal_gain: 0.0            # ★ON推奨: 例 0.15(観測イベント→覚醒の上がりやすさ)
  arousal_decay: 0.1          # 毎step baseline へ戻る率(ON時のみ効く)
  importance_arousal_w: 0.0   # ★ON推奨: 例 2.0(高覚醒の出来事を顕著記憶に)
  importance_novelty_w: 0.0   # ★ON推奨: 例 1.5
  salience_k: 0               # 0=無効(全通し)。★ON推奨: 4(Cowan。同時知覚の上限)
  threshold_gain: 0.0         # ★ON推奨: 小さめ(中覚醒で発火しやすく=逆U字)

# ---- 内面本格版(現実ギャップ 後続波 H6。文献: docs/lit/neuroscience__emotion-interest-attention.md §5.2)----
# 内面を3機構で豊穣化する。すべて決定論・非LLM・既定 OFF=現行挙動と完全同一(バイト一致)。実装 src/society/inner_life.py。
#  (1) 離散感情ラベル(emotion): core affect(mood_valence × arousal)から Ekman 系ラベルを純関数写像し
#      「今は不安/高揚している」等をプロンプトへ(神経科学 §1.2 の二層設計)。★affect.enabled=true が前提
#      (arousal が動かないと無効)。ラベル変化のときだけ emotion_label を記録(sparse)。
#  (2) 長期目標(goals)★keystone 駆動源: 価値プロファイル(needs)/traits から長期目標を決定論導出し、
#      「長期的に◯◯したい」をプロンプトへ注入して行動を長期的に方向づける(現状は1日計画のみ)。long_goal を記録。
#  (3) 趣味・関心(hobbies): 職業+価値プロファイルから趣味を決定論付与→プロンプト文脈 + 余暇の行き先バイアス。
# R1: 感情/目標/趣味のプロンプト注入は内容のみ=呼数不変(FixedLLM で ON==OFF)。趣味の行き先バイアス
# (hobbies.leisure_bias>0)だけは物理位置=co-location を変えうる=呼数不変は compute_matched 下の k 不変性で担保
# (crowd G4 / 観光 H5 と同型。専用 stream "inner")。既定 leisure_bias=0.0=注入のみ(純粋 ON==OFF を保つ)。
# 既定 OFF(enabled=false)=感情ラベル更新なし・目標/趣味を付けず・プロンプト注入なし・"inner" stream も
# 引かない=イベント 0 件・乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。
inner_life:
  enabled: false               # ★master ゲート。ON推奨(本番): true(内面=感情・目標・趣味を有効化)
  emotion:                     # 離散感情ラベル(要 affect.enabled=true)
    enabled: true
    arousal_high: 0.35         # 覚醒がこれ以上=高覚醒帯(高揚/不安)。未満=低覚醒帯(穏やか/しょんぼり)
    valence_deadzone: 0.15     # |mood_valence| がこれ未満=中立(平静/高ぶり)
  goals:                       # 長期目標・人生設計(keystone 駆動源)
    enabled: true
    inject_prompt: true        # 「長期的な目標: ◯◯」を発火プロンプトへ注入
    leisure_bias: 0.0          # 現状は注入のみ(目標の行き先方向づけは趣味 hobbies 側に集約)
  hobbies:                     # 趣味・関心・サブカルチャー
    enabled: true
    inject_prompt: true        # 「趣味・関心: ◯◯」を発火プロンプトへ注入
    leisure_bias: 0.0          # ★ON推奨: 例 0.3(余暇の行き先を趣味の場所へ寄せる。専用 stream "inner")

# ============================================================
# 第7バッチ(ユーザー要望 2026-07-07: 日付・天気・通勤/通学の物理 POI 束縛)。
# 日付=world.calendar / 通勤=organizations.commute_to_poi / 天気=下記 weather。
# すべて既定 OFF=現行挙動と完全同一(バイト一致)。ON は本番でユーザー承認のうえ。
# ============================================================

# ---- 天気(第7バッチ 2026-07-07)----
# ON 時: 日次で天気を決定論生成(新 stream "weather")。全発火/計画/内省プロンプトに
# 「今日の天気: ◯、最高◯℃。」を1行注入(全員共通・k非依存)。1日の始まりに weather イベントを
# agent_id=-1 で1件ログ。calendar 有効なら月から季節バイアス(夏は高温・梅雨は雨増)を掛ける。
# 雨天の日は rain_grievance 分だけ不快感(grievance)を上げる(factors 経由・1日1回・決定論)。
weather:
  enabled: false                # ★ON 推奨(本番): true(暦とともに現代生活の再現)
  rain_grievance: 0.0           # ★ON 推奨: 0.01(雨天の日の不快感。0.0=天気イベント・文脈行のみで grievance 不変)
  # ---- 天候の決め方(第80バッチ W2。正典 docs/research/weather-generator-design.md)----
  # synthetic … 既定=現行のまま(月別テーブル + ±3℃ 一様)。**既存ランとバイト一致**。
  #             ただし構造的欠陥がある: 8月は 32±3 なので上限35℃・36℃以上は確率0・
  #             日間自己相関ゼロ・年ごとの差もほぼ無い(=連続猛暑が原理的に出ない)。
  # generated … 較正済み確率生成器(実測30年から較正。3状態マルコフ+2変量AR(1)+年効果)。
  #             再現性等級 strict(静的ファイル+シードの純関数・ラン中のネットワーク呼び出しゼロ)。
  #             パラメータは envpack.climate.gen_params(場所の値)。較正済みでない月は
  #             synthetic へ自動フォールバックし、件数と理由を summary/manifest に残す。
  # table     … 凍結した実測日別データを実日付(world.calendar.start_date 基準)で引く。
  #             乱数を1つも引かない完全決定論。凍結範囲外の日付は synthetic へフォールバック。
  #             データは envpack.climate.table。★ON 時は world.calendar.enabled=true が要る。
  mode: synthetic               # synthetic(既定) | generated | table
  # true で天気1行に「最低気温・湿度・降水・猛暑日・暑さ指数(推定)」を追記する。
  # ★プロンプトが変わる。mode=synthetic では無視する(既定モードの文言は絶対に変えない)。
  extra_prompt_fields: false

# ---- 長期予定・スケジュール帳(第7バッチ 2026-07-07)----
# ON 時: 会話(speak/DM)に未来の日付・時刻が入っていれば決定論パーサで抽出し、話者と
# 聞き手の双方のスケジュール帳へ自動記入(appointment イベント)。近い予定は発火・計画
# プロンプトに1行注入し、行動・発話の継続性(人間らしさ)を出す。追加 LLM 呼び出しゼロ
# (既に生成済みの発話テキストの正規表現解析)。相対日は world.calendar で絶対日に解決。
# 既定 OFF=抽出も注入もせず・appointment 0 件=現行挙動と完全同一(バイト一致)。
schedule:
  enabled: false                # ★ON 推奨(本番): true(会話からの予定抽出・スケジュール帳)
  max_items: 8                  # 1人が保持する予定の上限(超過は古い順に間引き)
  horizon_days: 14              # 何日先まで抽出・注入するか
  inject_prompt: true           # 近い予定をプロンプトに1行注入(ON時のみ効く)

# ---- 制度改変の3ルート(現実ギャップ Wave G3 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 世界改変=制度の変更には現実で3ルートある。既存の propose/rules/government を土台にした最小拡張。
# すべて決定論・非LLM(R1: FixedLLM で ON==OFF 呼数不変)。OFF 時は labor_action/vote_*/enforcement
# が 0 件・プロンプト/イベント列/乱数消費が不変=ゴールデン(golden_baseline_l1.json)を守る。
institution_routes:
  # 労働争議/組合(職域ルート): 被雇用者(organizations 配属の非学生)の propose を「労働争議」
  #   variant として記録(labor_action)。賛同/露出が同じ org の同僚に偏る集合行為。可決は既存
  #   proposal_passed 経路 or 下の投票。要 organizations.enabled=true(org_id が付く)。
  labor:
    enabled: false              # ★ON 推奨(本番): true(要 organizations.enabled=true + personas_file)
  # 選挙/投票(民主ルート): ON かつ露出者が閾値に達したとき、署名でなく決定論投票で可決を決める。
  #   各 agent は grievance が閾値超 or 提案語への opinion 整合で yes(LLM 非呼び出し)。過半数で可決。
  vote:
    enabled: false              # ★ON 推奨(本番): true(署名モードを投票モードに置換)
    grievance_threshold: 0.5    # grievance がこれ以上なら yes(不満が投票行動に出る)
    majority: 0.5               # 可決 = yes 比率がこの値を超える(既定=過半数)
    # 供託金(制度深化 第9バッチ。公選法の供託金=政治参入の所持金障壁のモデル)。既定 0=不変。
    # propose の正式受理に deposit 円の拠出が要る(払えなければ演説どまり=SNS投稿のみで受理されない)。
    # 可決 or 得票率 >= refund_share で返還、未満は没収(government ON なら区の歳入)。deposit イベント。
    deposit: 0                  # ★ON 推奨(本番): 例 30000(区議選の供託金30万円を所持金スケールに圧縮)
    refund_share: 0.1           # 返還ライン(公選法の没収ライン=有効投票の1/10 に準拠)
  # 審議・パブコメ段階(制度深化 第9バッチ。現実の「請願→パブコメ→議会審議→議決(否決可)」の最小形。
  # 調査: docs/research/rights-institutions-gap.md §H=最重要。摩擦ゼロの署名即成立を否決されうる熟議に)。
  # 署名到達で即決せず proposal_review(start)→審議 days 日のあいだ認知者の反対(決定論 no)を集め、
  # 反対 > 賛同×reject_ratio なら否決(reject+供託金没収)、でなければ approve→投票/成立へ。
  # 決定論・非LLM・乱数なし(R1)。既定 OFF=proposal_review 0 件・従来どおり即成立(バイト一致)。
  deliberation:
    enabled: false              # ★ON 推奨(本番): true(制度改変に否決可能な熟議の摩擦を導入)
    days: 2                     # 審議期間(日)=パブコメ窓
    reject_ratio: 0.5           # 否決 = 反対数 > 賛同数 × これ(審議満了時)
  # 代表制議会(制度深化3 2026-07-08。rights-institutions-gap の見送り分)。既定 OFF=露出者の
  # 直接投票のまま(現行挙動と完全同一)。ON: term_days ごとに住民(非来街者)が「意見が最も
  # 近い他の住民」に投票する決定論選挙(Downs 空間投票の最近傍形・非LLM・乱数なし)で size 人の
  # 議会を選出(council_elected)し、提案の採決は露出者でなく議会が行う(vote_cast/vote_result
  # に council 印)。直接投票と結果が変わり得る=代表制の歪みを観測できる。
  assembly:
    enabled: false              # ★ON 推奨(本番): true(要 vote.enabled=true)
    size: 9                     # 議席数(渋谷区議会34議席を100体スケールに圧縮)
    term_days: 30               # 任期(日)。満了で改選(100日ランで3期)
  # 警察/条例執行(執行ルート): 制度DSL の prohibit ルール下で、近傍(同ノード)の警察官が
  #   禁止カテゴリの場所に居る違反者を執行=罰金(区の歳入)+ grievance+(factors 経由)。
  enforcement:
    enabled: false              # ★ON 推奨(本番): true(要 rules.enabled=true + 警察官入り名簿)
    fine: 1000                  # 執行時の罰金(円)。government ON なら区(ward)の歳入へ
    grievance: 0.05             # 執行を受けた違反者の不満増分(0.0=罰金のみで grievance 不変)
    # 勾留の最小形(制度深化2 第10バッチ。逮捕→勾留→処分の「時間による自由の剥奪」を1段で。
    # 調査: docs/research/rights-institutions-gap.md §F)。執行時に違反者をその場で行動停止
    # (会話・発火・移動なし。detention イベント)。既定 0=拘束なし=従来と完全同一。
    detention_steps: 0          # ★ON 推奨(本番): 例 3(=30分の拘束)

# ---- 文化カレンダー・群集(現実ギャップ Wave G4 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 暦(world.calendar)の上に文化的リズムを載せる。ON 時: 命名年中行事(正月/ハロウィン/年末)を
# 暦の特定日に発生させ、全発火プロンプトに「今日は◯◯です。」を1行注入(全員共通・k非依存)+
# annual_event を1日1回記録。群集フラグ(crowd)のある行事日(渋谷ハロウィン)には、自由時間の
# 行き先をスクランブル交差点付近の集会ノードへ確率的に寄せ(専用 stream "crowd")、集中が閾値超で
# crowd_surge を記録する(=世界改変・規制=G3 執行 の実舞台)。要 world.calendar.enabled=true。
# 定例イベント(会場集客の外生リズム)は既存の制度DSL weekly_event(rules)に委ねる(重複回避)。
# R1: 群集は generate を1回も増やさない(行き先バイアス=移動のみ / 群集密度は発火系に接続しない)。
# 既定 OFF=event_line/annual_event/crowd_surge とも無し・乱数消費不変(ゴールデン golden_baseline_l1 を守る)。
# ---- キャリア転換(現実ギャップ Wave G5 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 生活基盤の非連続=行動と動機の転換点。既存の economy/organizations/open_venture の最小拡張。
# ON 時: 日境界で新 stream "career" から確率判定(決定論・非LLM)。
#  失業: 被雇用者(organizations 配属の非学生)が layoff_prob で職を失う=org/勤務窓/賃金クリア(自由時間 EPR へ)+
#        unemployment(lost)+job_change を記録+生活不安(grievance+。unemployment_grievance=factors 経由)。政府 ON なら
#        既存の生活保護 seam に自然に載る。
#  求職: 失業者が rehire_prob で新 org へ再就職=勤務窓・収入が復帰(unemployment(hired)+job_change)。
#  転職: 被雇用者が switch_prob で別 org へ(職場が変わる。job_change。失業と排他=失業判定を優先)。
#  起業転換: open_venture の累計売上 ≥ venture_fulltime_sales かつ開店から venture_fulltime_days 以上で、
#        所有者が本業を辞め出店を本業化(venture_fulltime)=org/本業賃金クリア・勤務地を屋台へ。
# 要 organizations.enabled=true(再配属に会社台帳が要る。失業/起業転換は org 配属が前提)。
# R1: career は generate を1回も増やさず k・内面状態を読まない(呼数は k 非依存)。ただし失業=物理位置が変わり
# 対面 co-location が変化しうる(群集 G4 と同型)=呼数不変は compute_matched 下の k 不変性で担保。
# 既定 OFF=unemployment/job_change/venture_fulltime とも無し・新 stream も引かない=乱数消費不変
# (ゴールデン golden_baseline_l1.json を守る)。
career:
  enabled: false                # ★ON 推奨(本番): true(要 organizations.enabled=true + personas_file)
  layoff_prob: 0.02             # 被雇用者が職を失う日次確率(失業)
  switch_prob: 0.02             # 被雇用者が別 org へ移る日次確率(転職。失業と排他)
  rehire_prob: 0.30             # 失業者が新 org へ再就職する日次確率(求職)
  unemployment_grievance: 0.05  # 失業時の生活不安=不満増分(factors 経由。0.0=金銭のみで grievance 不変)
  venture_fulltime_sales: 8000  # 起業転換の累計売上閾値(open_venture の売上がこれ以上で本業化。0=起業転換 OFF)
  venture_fulltime_days: 2      # 起業転換の最短経過日数(開店からこの日数以上)
  # 解雇規制の最小形(制度深化2 第10バッチ。解雇権濫用法理のモデル。調査: rights-institutions-gap.md §C)
  severance_days: 0.0           # ★ON 推奨(本番): 例 5(解雇時の退職金=日給×日数。wage source="severance")
  unfair_ratio: 0.0             # ★ON 推奨(本番): 例 0.3(解雇のうち不当解雇の割合。>0 のときのみ追加 draw)
  unfair_grievance_mult: 2.0    # 不当解雇時の生活不安(unemployment_grievance)の倍率
  # career選択由来化(内部可動性 第60バッチ b。既定 OFF=求職 tool を出さない=バイト一致)。ON:
  # LLM の行動空間に求職 tool(job_search)を1件足し(既存 tool 選択枠内=呼数不変)、発火→台帳から
  # 定員空きの org を決定論マッチ(wage_tier整合+職場近接)→ 既存 switch_org/rehire を呼ぶ。要
  # organizations.enabled=true。確率駆動 switch_prob とは独立(両立可)。実装 src/society/mobility.py。
  by_choice:
    enabled: false              # ★ON 推奨(本番): true(転職を確率でなくエージェントの選択起点にする)

annual_events:
  enabled: false                # ★ON 推奨(本番): true(要 world.calendar.enabled=true)
  crowd_threshold: 8            # 集会ノード周辺(crowd_radius_m 内)の在住者数がこれ超で crowd_surge
  crowd_bias: 0.7               # 群集日に自由時間の行き先を集会ノードへ寄せる確率/step(stream "crowd")
  crowd_radius_m: 60.0          # 集会ノード(スクランブル交差点)からこの距離内を群集としてカウント
  ambient: false               # 群集密度(非LLM・可視化用の雰囲気推定)を crowd_surge payload に併記
  ambient_per_surge: 3000       # ambient=true 時、level×これ を推定群集規模として payload に載せる
  # events: 未指定なら既定(正月 1/1 / ハロウィン 10/31=群集 / 年末 12/31)。上書き例:
  #   events: [ {name: ハロウィン, month: 10, day: 31, crowd: true}, {name: 正月, month: 1, day: 1, crowd: false} ]

# ---- 情報環境の非対称(現実ギャップ Wave G6 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 意見分極と伝播の加速器。既存の net/internet(SNS)+ opinion(FJ)の最小拡張。すべて非LLM・決定論。
# ON 時(マスター enabled=true + 各機構 enabled=true):
#  推薦(recommendation): SNS の TL 提示を閲覧者の意見整合バイアスで並べ替え/選別(近い投稿を優先表示・
#    遠い投稿を間引く=エコーチェンバー)。意見参照は opinion.alignment 経由で不透明化。feed_rank を記録。
#  バイラル(influence): フォロワー数の非対称を活かし高フォロワー author の投稿のリシェア到達(reach)を加重
#    (拡散カウンタの増分=非LLM 状態更新・新規投稿は作らない)。viral_cascade を記録。
#  炎上(misinfo): 一部投稿を誤情報として扱い(新 stream "info" で決定論判定)、訂正の拡散・炎上(ネガ反応の
#    殺到)を記録。炎上→発信者の grievance は factors 経由・任意(flame_grievance>0 のときのみ・drive 非接続)。
# R1: どの機構も generate() を1本も足さない。推薦は「どの投稿を読むか」を変えるため FixedLLM で ON!=OFF に
#   なりうるが、機構は k・内面状態を読まず暦・config・意見・フォロワー・新 stream のみ参照する=compute_matched
#   下の k 不変性で担保(career G5 / crowd G4 と同型)。既定 OFF=feed_rank/viral_cascade/misinfo とも 0 件・
#   TL は従来の時系列・乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。
info_env:
  enabled: false                # ★ON 推奨(本番): true(情報環境の非対称=意見分極の加速器を有効化)。マスターゲート
  recommendation:
    enabled: false              # ★ON 推奨(本番): true(意見整合バイアスで TL を選別=エコーチェンバー)
  influence:
    enabled: false              # ★ON 推奨(本番): true(高フォロワー投稿の reach を加重=バイラル)
    follower_threshold: 8       # フォロワーがこれ以上の author をインフルエンサーとみなす
    reach_weight: 1.0           # 追加 reach = weight ×(フォロワー数 − 閾値 + 1)
    max_reach: 30               # 1投稿あたり追加 reach の上限(暴走防止)
  misinfo:
    enabled: false              # ★ON 推奨(本番): true(誤情報・訂正・炎上のダイナミクス)
    rate: 0.15                  # 新規投稿が誤情報として扱われる割合(新 stream "info")
    correction_prob: 0.5        # 誤情報が訂正(拡散)される確率
    flame_grievance: 0.0        # ★ON 推奨: 例 0.02。炎上を受けた発信者の不満増分(factors 経由・drive 非接続)。
                                # 0.0=観測のみ(misinfo イベントは出るが grievance は不変)

# ---- 健康・疲労・病気・メンタル(現実ギャップ 後続波 H1 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 生活の身体的基盤。最小・非LLM・決定論の3機構(実装 src/society/health.py):
#  疲労: fatigue ゲージ(drive/arousal と並列の内部 transient)が活動(勤務/移動)で蓄積・睡眠で回復。
#    高疲労で発火 effective_threshold を上げる(休息へ寄る=行動が鈍る)。fatigue_gain=0 で恒等(不変)。
#  病気: 日次に新 stream "health" で確率発症→欠勤(勤務スキップ)・外出抑制(在宅=自宅へ寄せる)・
#    受診で医療消費(medical_visit=spend cat="medical")。illness_days 日で回復(illness state=onset/recover)。
#  メンタル: 慢性的な高 grievance の持続→引きこもり(withdrawn=自由時間の外出を控え社会的活動が低下)。
#    grievance の参照は health.py(CHECKED_DIRS 外)に閉じる=no-fingerprint 契約に触れない。
# R1: どの機構も generate() を1本も足さない。病気(在宅)・疲労(休息)は物理位置を変え対面 co-location が
#   変化しうる(=FixedLLM で ON!=OFF)が、機構は k・内面状態(構成概念)を発火判断に食わせず暦・config・
#   新 stream・物理位置・grievance(k 非依存)のみ参照=compute_matched 下の k 不変性で呼数一致を担保する。
# 既定 OFF(enabled=false)=疲労更新なし・発症/受診なし・引きこもりなし・health stream も引かない・
#   イベント 0 件・乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。新イベント種は illness /
#   medical_visit / health_update(schema.py 登録済み)。
health:
  enabled: false                # ★ON 推奨(本番): true(生活の身体的基盤=疲労・病気・メンタルを有効化)
  # ---- 疲労(内部 transient。既定 gain=0=恒等=不変)----
  fatigue_gain_work: 0.0        # ★ON 推奨: 例 0.02。勤務中1stepあたりの疲労蓄積
  fatigue_gain_move: 0.0        # ★ON 推奨: 例 0.015。移動中1stepあたりの疲労蓄積
  fatigue_recovery: 0.15        # 睡眠中1stepあたりの回復量(ON時のみ効く)
  fatigue_high: 0.6             # 「高疲労」とみなす閾値(health_update / 行動鈍化の境界)
  fatigue_threshold_gain: 0.0   # ★ON 推奨: 例 0.1。高疲労→発火 effective_threshold の上げ幅(休息へ寄る)。0=恒等
  # ---- 病気(新 stream "health"。既定 onset_prob=0=発症なし)----
  onset_prob: 0.0               # ★ON 推奨: 例 0.02。居住者の日次発症確率(数日間の欠勤・在宅)
  illness_days: 3               # 発症してから回復までの日数
  medical_prob: 0.0             # ★ON 推奨: 例 0.5。発症直後に受診する確率(→ medical_visit + spend)
  medical_cost: 3000            # 受診1回の医療費(spend cat="medical")
  # ---- メンタル(慢性高 grievance→引きこもり。既定 閾値高で通常不発)----
  mental_grievance_threshold: 0.7  # 「高 grievance」とみなす閾値
  mental_withdraw_days: 3       # 高 grievance がこの日数続いたら引きこもり(0=メンタル無効)
  # ======================================================================================
  # 重症度の状態機械(身体と事件のレイヤー H1 2026-08-10。正典 docs/plans/body-incident-layer-plan.md §1)
  # ======================================================================================
  # 上の「病気」は真偽値ひとつ(sick)しか持たず、軽い風邪も路上で倒れる事態も同じ 1 ビットだった。
  # enabled: true にすると S0 健康 → S1 軽症 → S2 中等症 → S3 重症 → S4 心停止 → {回復, 死亡} の
  # 状態機械へ置き換わる。既定 false では上の単一真偽値の現行動作と**完全同値**(新経路を通らない)。
  #   発症チャネル5種 … 各=独立ハザード × 共変量 × frailty。新 stream "health_onset"(既存 draw 順不変)
  #   frailty        … 年齢帯の通院者率(65+ ≒ 0.70)から導く体力係数が全ハザードを乗算する
  #   sick-role      … S1=予定どおり出勤しうる(presenteeism)/ S2=受診または停留 / S3+=行動不能
  #   救急の引き金   … city_ops の暫定ハッシュゲートを「S3/S4 への遷移そのもの」へ置換(世代交代)
  #   死             … ユーザー決定(計画書 §6-1)により**本トグル配下**。境界 despawn と同型の永続退場
  # ★数値はすべて実測アンカーつき(下のコメント)。「面白さのための増量」は較正破壊なので行わない。
  severity:
    enabled: false              # ★ON 推奨(本番): true(身体の階層化=重症度・発症チャネル・死)
    # ---- frailty(年齢帯の通院者率 → 全ハザードの乗数)----
    frailty_ref: 0.40           # 基準の通院者率(この値で frailty=1.0。20代 ≒0.15 / 65-74 ≒0.69)
    frailty_jitter: 0.25        # 個体差の幅((seed, id) の安定ハッシュ=純関数。乱数は引かない)
    frailty_min: 0.20
    frailty_max: 3.00
    # ---- ① 急病(現行 onset_prob の後継。S1-S2 帯)----
    acute_illness_daily: 0.0068  # 成人の感冒・胃腸炎などの発症 年2〜3回 ≒ 2.5/365 /人日
    acute_illness_days_lo: 3     # 回復まで(日)
    acute_illness_days_hi: 7
    acute_illness_mild: 0.85     # 残りが S2(中等症)
    # ---- ② 熱中症: λ(WBGT) の閾値関数(sim.today_weather["wbgt"] を読む)----
    #  ★正直な依存関係: WBGT を作るのは weather.mode が generated / table のときだけで、
    #    既定の synthetic では欠測(null)= 熱中症は 1 件も起きない。欠測を 0 と偽って
    #    発生させることはしない(このチャネルを効かせたいランは weather.mode を上げる)。
    #  都の日次搬送(23区)から。WBGT 28 で ≒3e-6 /人日、WBGT 33 で ≒2.6e-5 /人日 を通る指数曲線。
    #  λ = heat_base × exp(heat_slope × (WBGT − heat_ref_wbgt))、WBGT < floor では 0(発生しない)。
    heat_base: 3.0e-6
    heat_ref_wbgt: 28.0
    heat_slope: 0.432           # ln(2.6e-5 / 3e-6) / 5 ≒ 0.432(32 以上で急峻になる勾配)
    heat_floor_wbgt: 25.0
    heat_outdoor_mult: 2.0      # 屋外(路上)に居るあいだの増幅
    heat_elderly_mult: 3.0      # 65 歳以上の増幅
    heat_mild: 0.55
    heat_moderate: 0.40         # 残りが S3
    heat_days_lo: 1
    heat_days_hi: 2
    # ---- ③ 急性アルコール(夜間店舗に居るときだけ実現する)----
    #  都の急性アルコール搬送(≒1.8万件/年)を夜間の飲酒機会数で割り戻した水準。74% が軽症(実測)。
    alcohol_nightlife_daily: 3.0e-4   # 夜に夜間店舗へ居る個体 1 人日あたり。20代ピークの年齢重みつき
    alcohol_weekend_mult: 1.6   # 金・土の増幅
    alcohol_mild: 0.74
    alcohol_moderate: 0.24      # 残りが S3
    alcohol_days_lo: 1
    alcohol_days_hi: 1
    # ---- ④ 外傷(転倒)----
    #  一般負傷は搬送のおよそ2割。区の 65 件/日 × 0.2 ÷ 23 万人 ≒ 5.7e-5 /人日 を年齢重み込みの
    #  平均として置いた基準値(高齢で 5 倍・65 歳未満で 0.5 倍)。
    trauma_daily: 3.0e-5
    trauma_night_mult: 1.5
    trauma_crowd_mult: 1.4
    trauma_crowd_n: 6           # 近傍にこの人数以上で「混雑」とみなす(索引 percept_index に相乗り)
    trauma_mild: 0.62
    trauma_moderate: 0.33
    trauma_days_lo: 2
    trauma_days_hi: 10
    # ---- ⑤ 心停止 / 脳卒中(極低率・**年齢帯レート必須**)----
    #  年齢帯別の OHCA 発生率(人口10万対/年)を日次へ直した内部表を引く: <20 ≒2 / 20-39 ≒7 /
    #  40-64 ≒40 / 65-74 ≒180 / 75+ ≒700。全国平均(≒100)の直適用は禁忌(街頭人口は 20-40 代)。
    cardiac_scale: 1.0          # 年齢帯レートへの一括較正係数(1.0=表そのまま)
    cardiac_arrest_share: 0.45  # 発症のうち S4(心停止)の割合。残りは S3(脳卒中等)
    cardiac_days_lo: 7
    cardiac_days_hi: 21
    ward_ohca_per_day: 0.6      # ★参照値のみ(渋谷実測 0.5〜0.7 件/日)。判定には使わない
    # ---- 進行(状態機械が単なる「跳躍」に退化しないための項)----
    worsen_daily: 0.02          # 発症中の 1 日あたり悪化確率(S1→S2→S3)
    # ---- sick-role ----
    presenteeism: 0.45          # 軽症で予定どおり出勤する割合(日本の実測 ≒45%)
    seek_care: 0.62             # 中等症で受診する割合(残りは自宅停留)
    care_cost: 3000             # 受診1回の自己負担(既存 spend cat="medical")
    mild_threshold_gain: 0.06   # 軽症で出勤している個体の性能デバフ(発火閾値の上げ幅)
    # ---- 搬送先での確定(通報時点の「見かけ」と分離する)----
    #  東京消防庁の搬送人員の程度別構成: 軽症 52.8 / 中等症 38.6 / 重症 7.3 / 死亡 1.3 %。
    #  ★「全通報が重病ではない」= 通報は不確実性から生まれる、の観測可能な再現。
    confirm_mild: 0.528
    confirm_moderate: 0.386
    confirm_severe: 0.073
    # ---- 死(ユーザー決定 §6-1。本トグル配下・別オプトインにしない)----
    ohca_survival: 0.10         # OHCA の生存退院率 ≒10% → P(死|S4) = 0.90
    severe_fatality: 0.005      # ★S3 の致死率。搬送全体の死亡 1.3%(東京)から OHCA 寄与を
                                #   差し引いた**残差として置いた較正値**で、単独の実測ではない
    arrest_outcome_steps: 6     # S4 の転帰が確定するまでの長さ
    severe_outcome_steps: 144   # 致死性 S3 の転帰が確定するまでの長さ

# ======================================================================================
# 医療の受け皿(身体と事件のレイヤー H2 2026-08-10。正典 docs/plans/body-incident-layer-plan.md §2)
# ======================================================================================
# H1(上の重症度)が「倒れる」まで、city_ops の救急連鎖が「通報 → 出動」までを作った。ここが
# 足すのはその続き=搬送先・入院・医療費(実装 src/society/medical.py)。
#   搬送先 … 地図の subcat=hospital(v8 は 7 件)。★subcat を持たない地図(v7 以前)では
#            **0 件 = 搬送が起きない**(名前から病院を推測しない=無い施設を捏造しない)
#   入院   … 確定重症度で在院長が決まる(軽症=数時間で帰宅 / 中等症=数日 / 重症=長期)。
#            物理は宿泊(lodging)と同型の「非自宅建物で N 泊」テンプレート
#   金の三本足 … ① 救急搬送=公費(区の歳出 → RoW ems_operation。運行主体の都は街の外)
#                ② 患者 3 割=既存 spend cat="medical"(**受け手を受診先ノードで解決する是正**)
#                ③ 保険 7 割=RoW チャネル insurance_reimbursement(新部門は作らない)
# ★治療は転帰を変えない(死は H1 が発症時に決める=レーン H1 の設計判断を再開封しない)。
# ★高額療養費・年齢別負担割合・病床数の制約は作っていない(持っていないデータで埋めない)。
# 既定 OFF=新 4 種(ems_transport / hospital_admit / hospital_discharge / medical_bill)0 件・
#   agent に属性が生えず・乱数消費不変(ゴールデン golden_baseline_l1.json をバイト一致で守る)。
medical:
  enabled: false                # ★ON 推奨(本番・要 health.severity.enabled=true + city_ops.ems)
  max_events_per_step: 24       # 1 step に出す本レーンの L1 件数の上限(暴走の安全弁)
  transport:
    enabled: true               # 搬送(現場 → 病院)。false では倒れた個体はその場に留まる
    steps: 3                    # 搬送にかかる長さ(★モデル値であって走行時間ではない)
    max_per_day: 24             # 1 日に出す搬送の上限(L1 の安全弁)
    hold_crew: true             # 搬送中は隊を戻さない(= 救急車ひっ迫が観測できる)
  hospital:
    poi_cats: [service]         # 地図が amenity=hospital を潰しているカテゴリ
    subcat: hospital            # v8 が付けるサブカテゴリ(これが搬送先の判定)
    name_keywords: []           # ★既定は空: 名前から病院を推測しない(捏造の防止)
  clinic:
    enabled: true               # 自力受診(中等症)の受診先解決=医療費の受け手の是正
    poi_cats: [service]
    hints: [クリニック, 医院, 診療, 歯科, 内科, 眼科]   # ★subcat=hospital は必ず除く
    radius_m: 1500              # 受診先を探す半径(徒歩圏の医院)
  admit:
    enabled: true               # 入院(在院という状態)。false では搬送されても在院しない
    mild_steps: 18              # 軽症の在院の長さ(既定 Δt=10 分で 3 時間 = 数時間で帰宅)
    moderate_days: 3            # 中等症の在院日数
    severe_days: 14             # 重症の在院日数(一般病床の平均在院日数 ≒16 日が上位アンカー)
    arrest_days: 21             # 心停止から蘇生した場合(重症より長い)
    max_days: 30                # 在院長の上限(暴走の安全弁)
  money:
    enabled: true               # 金の三本足。false では搬送・入院だけが起き会計は動かない
    ems_cost: 45000             # 救急出動 1 件あたりの公費(消防庁の試算 ≒4.5 万円/件)
    coinsurance: 0.3            # 患者の自己負担割合(健康保険法=3 割。年齢別・上限は未実装)
    admit_self_pay_per_day: 10500  # 入院 1 日あたりの自己負担(急性期 ≒3.5 万円/日 × 3 割)

# ---- 世帯・家族・恋愛(現実ギャップ 後続波 H2 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 現状は全員独立個人。生活の紐帯(世帯・同居・家族・恋愛)を最小・非LLM・決定論で載せる
# (実装 src/society/household.py)。3機構(childbirth/死別=エージェント数が変わる重い機構は本波では作らない):
#  世帯・同居: 起動時に居住者を決定論で世帯(夫婦・家族・ルームシェア)へグループ化(新 stream "household")。
#    同一世帯は home(住居建物・ノード・階)を共有=夜間の家庭内 co-location(会話の場)。各メンバに
#    household_id / 同居者 id を付し、後段の「顔なじみ」で housemate が初期関係に入る。
#  家族関係: 同居者・恋人が同席したとき「同居する家族/同居人/恋人の○○」をプロンプトに1行添える(G2 と協調)。
#  恋愛・パートナー: G2 relations の親密度 closeness が相互に partner_closeness 超の2者を日次で決定論的に
#    パートナー(恋人)にする(要 relations.enabled=true。closeness が積まれる)。パートナーは特別な間柄
#    (親友の上位)+ デート(共有の目的地・新 stream "date")が移動理由に。partner_formed / life_event を記録。
# R1: どの機構も generate() を1本も足さない。住居共有・デートは物理位置を変え対面 co-location が変化しうる
#   (=FixedLLM で ON!=OFF)が、機構は k・内面状態を読まず名簿・config・closeness・物理位置のみ参照する=
#   compute_matched 下の k 不変性で呼数一致を担保(career G5 / crowd G4 / 健康 H1 と同型)。
# 既定 OFF=世帯を組まず(home 割当も不変)・パートナー形成なし・context/date とも無し・"household"/"date"
#   stream も引かない=イベント 0 件・乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。新イベント種は
#   partner_formed / life_event(schema.py 登録済み。世帯の家族文脈は relation 文脈で表現=新種不要)。
household:
  enabled: false                # ★ON 推奨(本番): true(生活の紐帯=世帯・家族・恋愛を有効化。恋愛は要 relations.enabled=true)
  # ---- 世帯グループ化(起動時1回。新 stream "household")----
  sizes: [1, 2, 3, 4]           # 取りうる世帯サイズ(1=単身は世帯を組まない=個人のまま)
  size_weights: [0.35, 0.30, 0.22, 0.13]  # サイズの相対重み(合計は正規化)
  family_ratio: 0.7             # 2人以上世帯が「家族」の割合(残りはルームシェア=同居人)
  # ---- 世帯の現実化(第44バッチ S-R1。false=現行の id 順機械束ねと完全同一)----
  realistic: false              # ★ON 推奨(本番): true(地理×年齢の整合束ね+続柄=夫/妻/親/子+渋谷 size_weights)
  # 渋谷区の現実(令和2国勢調査: 単身64.5%・2人以上35.5%を全国分布で 2/3/4 に按分)。realistic=true 時のみ使用。
  size_weights_realistic: [0.645, 0.176, 0.104, 0.075]
  # ---- 恋愛・パートナー形成(日次。G2 closeness から決定論。要 relations.enabled=true)----
  partner_closeness: 15.0       # 相互 closeness がこれ以上でパートナー成立(親友 relations.tier_close の上位)
  date_bias: 0.5                # 自由時間にパートナーとの共有デート先へ寄せる確率/step(stream "date")
  # ---- 夕食の共食(第44バッチ S-R1。夜帯に世帯 home へ収束し2人以上同席で joint_activity 記録。新 stream "dinner")----
  family_dinner:
    enabled: false              # ★ON 推奨(本番): true(家族の夕食共食を有効化。要 household.enabled=true)
    prob: 0.69                  # 夕食帯の home 収束バイアス/step(農水省 食育調査 令和5=家族と夕食「ほぼ毎日」68.7%)
    band_start_min: 1080        # 夕食帯の開始(分 of day)= 18:00
    band_end_min: 1260          # 夕食帯の終了(分 of day)= 21:00
  # ---- bond→同棲/unbond→転出(内部可動性 第60バッチ b。既定 OFF=世帯の物理再編なし=バイト一致)----
  # パートナー成立(bond)から days 日継続+相互 closeness 維持で同棲(後から来た側=id 大が相手宅へ転居し
  # 世帯併合。move_in)。別離(unbond)時は後から来た側が新居へ転出(世帯分離。move_out)。新 stream "housing"。
  cohabit:
    enabled: false              # ★ON 推奨(本番): true(同棲=世帯の物理再編を有効化。要 household.enabled=true + 恋愛)
    days: 14                    # 同棲判定の最短 bond 継続日数(初観測日から起算)
    closeness: 0.0              # 維持すべき相互 closeness(0=household.partner_closeness を採用)

# ---- 転居(内部可動性 第60バッチ b 2026-07-24。既定 OFF=現行挙動と完全同一)----
# 閉じた世界の構造固着を「運営者の介入なし」に内生的に動かす転居機構(devlog Entry 50)。トリガーは
# エージェント側の状態に由来する内生変化のみ(火種介入とは別物): (i)職場変更(switch_org/rehire/
# venture本業化/求職)後、通勤距離が閾値超なら日次確率で職場近接へ転居 (ii)家賃逼迫(E5 滞納 rent_due>0)
# なら日次確率で転居。外生イベントでの強制転居は作らない。行き先=persona が使う city.residential_buildings
# を近接重み+ (agent,day) 乱数で決定論選択し、世帯全員が一緒に動く(_share_home 整合)。同棲転居は
# household.cohabit が担う。新 stream "housing"。実装 src/society/mobility.py。
# R1: generate() を1本も足さず、k・内面状態を発火判断に食わせず暦・config・物理位置(home/work)・
#   新 stream のみ参照(呼数は compute_matched 下の k 不変性で担保。career G5 / household H2 と同型)。
# 既定 OFF=relocate 0 件・"housing" stream も引かない=乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。
housing:
  relocation:
    enabled: false              # ★ON 推奨(本番): true(内生的な転居=構造固着を運営者介入なしに動かす)
    job_prob: 0.5               # 職場変更後・通勤閾値超の日次転居確率(職場近接へ)
    rent_prob: 0.3              # 家賃逼迫(E5 滞納)時の日次転居確率(要 economy.accounts.enabled=true)
    commute_threshold_m: 1500.0 # この通勤距離(m)超で職場近接転居を検討
    candidate_k: 5              # 近接上位 K 件から (agent,day) 乱数で1件(過度な遠距離を避ける)

# ---- 共同行動エンジン(関係性の再現 第44バッチ S-R3。ユーザー要望 2026-07-21。既定 OFF=現行挙動と完全同一)----
# 関係(友人 relations tier≥2 / 同居人 housemates)を起点に「N人が同一(POI,時刻)へ独立に収束+合流は
# 決定論」で共同行動(外食・カフェ/映画/カラオケ/買い物)を発生させる。誘い→承諾→合流は全決定論=
# LLM 呼を1本も増やさない(既存 household.date_dest の一般化)。合流後の会話は既存の対面会話予算内。
# 実装 src/society/joint.py(較正値・活動名リテラルはここと joint.py にのみ書く=no-fingerprint 契約)。
# R1: 日次編成(新 stream "joint")・同伴選択(relations closeness/housemates=k 非依存)・誘い承諾
#   (新 stream "joint")・ランデブー POI(グループ最小 id/day/活動タイプの純関数=乱数ゼロ)。合流=物理
#   位置=対面 co-location の変化は career/health/household と同型で許容(呼数不変は compute_matched 下の
#   k 不変性で担保)。既定 OFF=何も編成せず・joint_activity 0 件・"joint" stream も引かない(ゴールデンを守る)。
joint:
  enabled: false                # ★ON 推奨(本番): true(友人・同居人の共同行動を有効化。友人には要 relations.enabled=true)
  daily_rate: 0.15              # 1人1日あたりの共同外出の発生確率(学生時代友人と月1=~0.03/特定相手と桁が合う集約率≈週1)
  accept_base: 0.5              # 誘いの基礎承諾確率(host_event の attend_base 相当)
  tier_bonus: 0.3               # 親友(relations tier 3)への承諾加算(関係の強さで参加率↑)
  min_group: 2                  # 成立に必要な最小人数(自分含む)
  max_group: 4                  # グループ最大人数(自分含む。2-4人)
  friend_tier: 2                # 同伴候補の最小 relations tier(2=友人)
  # ---- 職場の会食・飲み会の階層依存(第45バッチ S-R4。§2.5: 飲みニケーション忌避は"上司同席・義務的"に
  #      集中=上司ありの飲み会「苦手」66.7% だが同世代なら「好き」50.8%)。組織台帳に役職(rank/founder)
  #      データは無い(org_role は職種名で階層でない)ため、上司/同世代の代理指標は年齢差>boss_age_gap 歳。----
  hierarchy_penalty: 0.35       # hierarchical=true の活動で、年齢差>boss_age_gap の相手の承諾を下げる幅
  boss_age_gap: 10              # これを超える年齢差を上司/部下(階層)の代理指標に(役職データ不在の近似)
  # 活動カタログ(渋谷較正=レジャー白書 参加率)。poi_cat は routine の food/leisure/shop と整合。
  # band=下の bands の名前。activity_tag=routine 活動タグ(eating で既存 _charge_meal が飲食費を課金)。
  # companion_type=同伴の関係タイプ(friend=友人 tier≥friend_tier[既定] / housemate=同居人 / colleague=同 org_id)。
  # hierarchical=true で上司同席(年齢差>boss_age_gap)の承諾に hierarchy_penalty(飲み会に付す)。
  # ★ 職場の会食(第45バッチ S-R4)は既定の activities マップを変えないため**コメントアウトで同梱**する
  #   (map に足すと活動名の並び=ランデブー POI ハッシュが動き既存 joint ON 挙動が変わるため)。有効化=下の
  #   colleague_* 行のコメントを外し weight を上げる(要 organizations.enabled=true で org_id が付く)。較正
  #   (§2.5): 同僚ランチ14.4%[単独60.4%が主]=weight~0.02、飲み会 月0回64%=weight~0.03(いずれも低頻度)。
  activities:
    meal_cafe: {weight: 0.39, poi_cat: food, band: night, activity_tag: eating}    # 外食・カフェ(参加率39.2%)
    cinema:    {weight: 0.34, poi_cat: leisure, band: day, activity_tag: ""}        # 映画(33.7%)
    karaoke:   {weight: 0.20, poi_cat: leisure, band: night, activity_tag: ""}      # カラオケ(20.2%)
    shopping:  {weight: 0.15, poi_cat: shop, band: day, activity_tag: ""}           # ショッピング(渋谷若年で高頻度)
    # colleague_lunch:  {weight: 0.02, poi_cat: food, band: lunch, activity_tag: eating, companion_type: colleague}                    # 同僚ランチ(昼・低確率=単独が主)
    # colleague_dinner: {weight: 0.03, poi_cat: food, band: night, activity_tag: eating, companion_type: colleague, hierarchical: true}  # 飲み会=居酒屋相当(夜・上司同席で承諾↓)
  # 時間帯(分 of day の [開始, 終了))。day=昼〜夕方、night=夕〜夜、lunch=昼食帯(同僚ランチ有効化時に使用)。
  bands:
    day: [660, 1020]            # 11:00-17:00
    night: [1020, 1320]         # 17:00-22:00
    lunch: [690, 810]           # 11:30-13:30(同僚ランチ)
  # 年齢条件付き重み倍率(キー=年代下限の文字列)。渋谷=若年で友人遊び高(カラオケ/買い物/映画↑)。
  age_weights:
    "0":  {karaoke: 1.6, shopping: 1.4, cinema: 1.2, meal_cafe: 1.0}
    "35": {karaoke: 0.8, shopping: 0.9, cinema: 1.0, meal_cafe: 1.0}
    "55": {karaoke: 0.4, shopping: 0.7, cinema: 0.8, meal_cafe: 1.0}

# ---- 負の評判(悪評)の内生伝播 第61バッチ スライス(c)(2026-07-25。既定 OFF=現行挙動と完全同一)----
# 現状の評判(relations)は「正の地位が上がり日次風化する」のみ=対人レベルの負の評判(ゴシップ制裁)が
# 無い=「いい人ばかりの世界」。語彙伝播で実証済みの complex contagion(閾値2)を負方向に再利用し、悪評の
# 内生伝播を実装する(外部からの危機注入ではない=種は既存の負イベントのみ)。実装 src/society/gossip.py
# (較正値・種イベント種の写像はここと gossip.py にのみ=no-fingerprint 契約)。設計正典 devlog Entry 50。
# ON 時: ① 種=既存の負イベント(seed_events マップ)当事者が (agent,day) 確率で匿名の悪評タグ化し、対象の
#   直近会話相手が初期の知る者になる。② 伝播=会話接触に乗り、相異なる知人が adopt_threshold 人に達すると採用
#   ((listener,day) キー決定論)。③ 忘却=日次 decay_prob で忘れる(烙印にしない)。制裁は相手選択の後退・
#   共同行動の誘い低下・status の負項(いずれも max_penalty で上限=孤立への滑り台にしない)。悪評文は LLM に
#   生成させない(呼数不変・指紋回避)。★ 効くのは relations.enabled=true(種の relation_break・会話接触台帳)。
# OFF 時: gossip_seed/spread/fade 0 件・stream "gossip" を引かず・L2 に gossip_* 列を足さず・status/相手選択/
#   joint 誘いとも不変=乱数消費・イベント列がバイト一致(ゴールデン golden_baseline_l1.json を守る)。
gossip:
  enabled: false                # ★ON はユーザー判断(対人レベルの負の評判=ゴシップ制裁を有効化。要 relations.enabled=true で活きる)
  seed_prob: 0.5                # 負イベント当事者が悪評タグ化する (agent,day) 確率(× 下の event weight)
  # 種になる既存の負イベント種 → 重み(コードに固有名詞を書かない=データ駆動の写像。与えたキーだけ既定へ重なる)
  seed_events:
    bankruptcy: 1.0             # 自己破産(常に負)
    eviction: 0.7              # 立退き(回復 phase=rehoused は下の除外で種にしない)
    relation_break: 0.3        # 関係断絶(原因側が特定できない=台帳所有者=正直に低確率)
    misinfo: 0.6               # 誤情報の発信者(author 一貫)
  seed_exclude_payload: [rehoused]  # payload 値にこれを含むイベントは種にしない(eviction の回復等=データ駆動)
  seed_contact_days: 1          # 種化時、対象の直近この日数内に会話した相手を初期の知る者にする
  adopt_threshold: 2           # 相異なる知人が何人で悪評を採用するか(labels と同じ complex contagion 閾値)
  decay_prob: 0.15             # 悪評を1日で忘れる確率(永続の烙印にしない=噂の風化)
  max_penalty: 0.2             # 各制裁効果の上限(孤立への滑り台にしない安全弁)
  joint_penalty: 0.15          # 悪評を知る相手を共同行動に誘う確率の低下幅
  status_weight: 0.1           # 被知覚数(/N)を status の負項に反映する重み(既定=効果最小)

# ---- 真偽台帳ミニマル(第73バッチ Part B。2026-07-31。既定 OFF=現行挙動と完全同一)----------
# 正典 docs/plans/source/dual-mode-instruments.md Part B / dual-mode-observe-verify-plan.md §1.3 訂正3。
# 狙い: このシミュレーションで最も強い人工オラクル=「実際に何が起きたか」を世界の内部が知っていること。
#   ① 真偽台帳(ground truth)= 既存の L1 イベントから決定論で fact を抽出(fact_kinds マップ=データ駆動。
#      コードに固有名詞を書かない)。ID・発生step・場所・真値・直接目撃可能条件(半径×時間窓)を持つ。
#      ★台帳は**エージェント絶対不可視**: プロンプトには 1 バイトも入らない。実装 src/society/truth_ledger.py
#      は src/society 直下 = cognition から import されない(tests が静的に固定)+ 全プロンプトに canary 検査。
#   ② 信念状態 = agent×fact の 値/確信度/情報源/取得step/検証済み/親ノード(= 伝播木が事後に構成できる)。
#      取得経路は 直接目撃(位置ログの決定論判定)と 伝聞(既存 speak/dm に乗る・話題の一致判定は部分文字列)。
#      変形は**ホップ数による無情報 0.5 へのドリフト + 確信度減衰**だけ(凝った変形モデルは入れない)。
#   ③ 検証行動 3 種(verify_actions=true のときだけ行動空間に中立 1 行)。誘導文言は書かない
#      (誰が確かめに行くかが観測対象そのもの)。LLM 呼は 1 本も足さない(既存応答のパースで受理)。
# OFF 時: fact/belief/belief_* イベント 0 件・L2 に belief_* 列を足さず・プロンプト不変・乱数消費ゼロ
#   =イベント列がバイト一致(ゴールデン golden_baseline_l1.json を守る)。
# 真値そのものは L1 に出さない(runs/<name>/beliefs_ledger.json のサイドカーに分離)。解析 scripts/analyze_beliefs.py。
beliefs:
  enabled: false                # ★ON はユーザー判断(観察ランでの信念計測。fact 種は下のマップ次第)
  verify_actions: false         # 「確かめる」を行動空間に追加(要 enabled=true。全発火プロンプトへ中立1行)
  # 台帳の供給源: L1 の event kind → fact 仕様(★ dotlist 上書きは OmegaConf の仕様でマップが
  #   **merge** される=種を減らしたいときは profile YAML 側でブロックごと置き換えること)
  #   topic_key … 話題トークンに使う payload キー(場所名に加えて1個)
  #   value_key/value_scale … 真値に使う数値 payload キーと正規化除数(無ければ定数 value=1.0)
  #   radius_m  … 目撃半径の上書き(<=0 は市域全体)/ window … 目撃可能な時間窓 [step, step+window)
  fact_kinds:
    event_host:   {topic_key: title}          # 組織/集合(payload に node=会場・start_step。場所と時刻が確定)
    venture_open: {topic_key: name}           # 経済/出店(payload に node。「そこに店が出た」= 現場で確かめられる)
    flyer_post:   {}                          # 情報物の掲示(payload に node)
    group_found:  {topic_key: name}           # 組織の結成(座標が確定=結成者の位置)
    crime:        {topic_key: kind}           # 治安(座標が確定=被害の現場)
    stock_out:    {topic_key: poi}            # 経済/欠品(poi は POI 名。座標は客の位置)
    price_change: {topic_key: cat, value_key: ratio, value_scale: 2.0}  # 経済/価格急変(真値が連続量)
    disaster:     {topic_key: kind, radius_m: 0}  # 外生ショック(市域全体=その場に居る全員が目撃しうる)
  witness_radius_m: 60.0        # 直接目撃の半径 [m](発生地点からこの距離以内)
  witness_window: 6             # 直接目撃の時間窓 [step](6 step = 1 時間)
  fact_ttl_steps: 288           # これより古い fact は伝聞に乗らない(鮮度 = 2 日)
  max_facts_per_utterance: 2    # 1 発話で伝わる fact 数の上限(地名の過剰一致に対する安全弁)
  max_beliefs_per_agent: 32     # 1 人が保持する信念数の上限(古い取得順に捨てる=有界)
  min_topic_len: 2              # 話題トークンの最小長(1 文字は雑音)
  hop_drift: 0.15               # 1 ホップごとに真値から無情報 0.5 へ寄る率(唯一の変形モデル)
  conf_decay: 0.8               # 1 ホップごとの確信度の減衰係数
  min_conf: 0.05                # これを下回る確信度は伝えない(噂が自然に消える)
  verify_deadline_steps: 36     # 現場確認(go)の有効期限 [step](6 時間)
  net_conf: 0.7                 # ネット裏取りで得る確信度(公開記録=真値だが直接目撃より弱い)
  ask_conf: 0.9                 # 目撃者に聞いて得る確信度の上限

# ---- 来街者 party の実体化(関係性パッケージ完結 第45バッチ S-R5。ユーザー要望 2026-07-21。既定 OFF=現行挙動と完全同一)----
# プールの L4 来街者 record に party_size 1-5(build_persona_pool.py=同行人数)が実在するが sim 内で未使用
# だった。本ブロックは present な来街者を party_size でグループ化=「同席の連れ」にする: 同一初期ノードへ寄せ・
# 連れ相互に relations 注入・回遊先を代表と共有(party_dest。新 stream "party")。観測は joint_activity{type:party}
# を再利用(過剰な新 kind なし)。実装 src/society/party.py(較正値・グループ化はここと party.py にのみ)。
# presence 整合: presence(P3 純関数)の draw 順に一切触れず、present 実体化の後にグループ化するだけ=rotation の
# 決定論・resume バイト一致(test_pool_rotation)を保つ。乱数は新 stream "party" のみ(回遊バイアス抽選)。
