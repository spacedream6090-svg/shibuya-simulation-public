# ============================================================
# 実験の全条件をここで宣言する(D11)。コードは書き換えない。
# 上書き例: python scripts/run.py run.seed=7 run.n_agents=30
# ============================================================

run:
  seed: 42
  n_agents: 10
  n_steps: 144          # 144 step = シミュ内1日(1 step = 10分)
  out_dir: runs         # 実行ごとに runs/<name>/ が作られる
  name: null            # null なら seed から自動命名
  # ---- 開始時刻(day0 step0 の時刻。"HH:MM"。既定 "07:00"=現行値=バイト一致)----
  # 分 of day へ解釈して Clock に渡す(1 step=10分・144 step=1日)。day 番号は sim_min//1440=
  # 開始時刻を含む絶対分の深夜0時境界で、既定 07:00 は day0 が 07:00〜24:00 の短い初日=従来どおり。
  # "00:00" にすると day 境界=深夜0時で自然(day=step//144)になり、natural_start と併用すると
  # 全住民が自然な睡眠から初日の朝を迎える(初日から全員に朝計画)。営業時間・ダイヤ・bedtime 等の
  # 時刻機構は sim_min%1440(時刻)基準なので開始時刻を変えても不変。要クオート(YAML 60 進の回避)。
  start_tod: "07:00"
  # ---- 初日コールドスタート改善(統合リハーサルの発見。既定 false=完全従来挙動=バイト一致)----
  # 既定は全員 sleeping=False で開始→開始時刻が深夜でも起きたまま過ごし初日の朝の起床(wake_up)と
  # 朝計画(day_plan)がほぼ出ない(2日目以降は正常)。true にすると run 開始時の着席で、開始時刻が
  # 本人の自然な睡眠時間帯(bedtime_min〜+sleep_steps から決定論導出・乱数なし)に入っている居住者を
  # 就寝状態・自宅・自然な起床 step で初期化する(既存の起床機構に乗る=朝計画が初日から全員分出る)。
  # 開始時に覚醒しているべき個体(夜勤者等)は従来どおり覚醒で着席。来街者・流入通勤者(自宅が圏外)は
  # 対象外。本番 ON はユーザー判断(production/daily は触らない)。ON の効果はイベント時系列に現れるが
  # LLM 呼数は k 非依存のまま(発火ゲートに k/traits を入れない=既存機構に乗るだけ)。
  natural_start: false

# ---- state 更新則の magnitude(OPEN#2: 因果構造は factors/update.py、量はここで調律)----
factors:
  congestion_grievance: 0.010     # 混雑遅延 → 不満+(Epstein)
  heard_valence_grievance: 0.020  # ネガ発話を聞く → 不満+ ×|感情価|(SIMCA affective)
  heard_valence_efficacy: 0.006   # ポジ発話を聞く → 効力感+
  being_heard_efficacy: 0.006     # 聞き手がいた → 効力感+(社会的説得)
  ignored_efficacy: -0.004        # 誰にも聞かれない → 効力感−微
  work_done_efficacy: 0.012       # 勤務完遂 → 効力感+(達成経験=最強の源泉)
  vicarious_efficacy: 0.004       # 他者の言葉・成功の目撃 → 効力感+(代理経験)
  park_grievance: -0.008          # 公園滞在 → 不満−(回復環境)
  own_adopted_ownership: 0.030    # 自分の造語が採用される → 当事者意識+
  own_adopted_efficacy: 0.010     #                        → 効力感+
  money_pressure_grievance: 0.015 # 手持ちが逼迫している間 → 不満+(1日1回、経済 v0)
  media_grievance: -0.03          # 在宅娯楽の気分修復(media.enabled 時のみ発火。Vuorre 2024
                                  # の +0.034/15分 を逆符号で。media OFF なら一切読まれない)
  relative_deprivation_grievance: 0.0  # ★ON 推奨: 例 0.012。参照集団(街に居る他者)の所持金
                                  # 中央値を下回る量に応じた不満(Wave G1・1日1回・非LLM・決定論)。
                                  # 個体の相対的地位で grievance に個体差が復活=飽和を破る。0.0=OFF(不変)
  threshold_dist: normal          # normal | lognormal(発火閾値の分布形。B段 seam)
                                  # ★手続き生成経路のみに作用(名簿 entry 使用時は名簿値優先=不変)

# ---- k(経験→内部状態の結合)= 内省の書き戻し自由度(D7) ----
k:
  writeback: free       # free | degraded | sham | off
  degraded_alpha: 0.5   # degraded 時に書き戻す確率
  reflect_period_days: 1

# ---- 反射=自己モデル(第11バッチ)+出来事誘発の深い内省・無意識層(第12バッチ 2026-07-08)----
# 文献検証: docs/research/deep-reflection-triggers.md / self-concept-identity.md。
# deep: 深い内省は固定周期でなく出来事に誘発される。日内の衝撃ゲージ(|Δstate| の
#   ネガ非対称加重=信念との乖離の近似)が個人閾値(traits 写像)を超えた日→侵入的段階
#   (「頭から離れない」記憶)→ incubation_days(1晩以上)おいて夜の内省を深い内省に格上げ
#   (PTG の 侵入的→熟慮的)。深い内省は自己像 self/ties を生成し agent.self_model を更新
#   (呼数・rng 消費は不変=R1。書き込みは belief と同じ k ゲート=作用チャネル1本)。
# implicit_self: 無意識層=行動・経験カウントのベースライン逸脱と感情価から決定論で
#   「最近の自分」1行を日次更新(Bem 自己知覚・working self-concept。揮発層=核自己と分離)。
# self_model_days: 旧固定周期(レガシー・実験対照用)。すべて既定 OFF=従来と完全同一。
reflection:
  self_model_days: 0    # レガシー固定周期(0=無効)。第12バッチ以降の主経路は下の deep
  deep:
    enabled: false      # ★ON 推奨(本番): true(出来事誘発の深い内省)
    threshold: 0.60     # 日内衝撃ゲージの基準閾値(個人差は traits→reflect_trigger_params)
    neg_weight: 2.0     # ネガの非対称重み(Baumeister: 負は徹底処理される)
    pos_weight: 1.0     # ポジもゼロにしない(畏敬・転機も深い内省を誘発しうる)
    incubation_days: 1  # 侵入的→熟慮的の間(日)。個人差で +1 されうる
    cooldown_days: 3    # 深い内省後の不応期(過剰反芻の抑制)
  implicit_self:
    enabled: false      # ★ON 推奨(本番): true(無意識の自己認識更新=裏で回る系)
    ema: 0.7            # 行動ベースラインの平滑率(高いほど「いつもの自分」が変わりにくい)

# ---- 対照系列(D7: null/compute一定は k 掃引時に使用) ----
controls:
  mode: none            # none | null_series | compute_matched
  null_calls: 1         # null_series 時、発火あたりに撃つ内容非結合ダミー LLM の本数

# ---- エージェント(ペルソナ v2: D6)----
agents:
  personas_file: null   # data/personas_80.json 等(scripts/build_personas.py 生成)。null=手続き生成
                        # ★流入通勤者(commuter)入り名簿 = data/personas_100_inflow.json。
                        #   commute=true の個体は朝 arrival_min に範囲外から enter_area →勤務→夕 homing。
                        #   出入口配分・到着二峰・沿線タグは data/shibuya_population.json の inflow 節。
                        #   commuter は名簿の新規生成分のみ有効(既存 personas_40/80 の挙動は不変)。
  icebreak_file: null   # data/icebreak_N.json(scripts/build_icebreak.py 生成)。null=初期関係なし
                        # ★全k条件で同一ファイルを読む=初期関係が条件間で同一(交絡の排除)

# ---- 環境パック(EnvPack)= 場所の知識(基盤モデル抽出 D1-W2 第16/35バッチ)----
# 「機構=基盤・値=環境」の原則: src/society(認知・エンジン・世界・因子)には地名・
# ランドマーク・年中行事・気候・語彙などの **場所の知識を置かない**。それらは全てここ
# (envpack)に集約し、コードは cfg 経由で読む。conf に地名があるのが正しい状態。
# W4 の env/<place>/env.yaml がこのブロックを上書きする(profile と同じ重ね書き機構)。
# 既定値=現在の渋谷リテラルそのまま(=ゴールデン・バイト一致の基準)。
# データ実体(地図/ダイヤ/名簿)は data/ 参照のまま(env.yaml は取得レシピ+attribution を持つ)。
envpack:
  lexicon:
    place_name: 渋谷                     # 街の名前(発火/内省/計画プロンプト冒頭・観光文・persona 文)
    underground_name: 地下通路(渋谷ちかみち)  # 地下(layer<0)ノードのフォールバック地名(world/map.place_label)
    place_hints:                         # 会話からの場所抽出ヒント(schedule。地名固有分のみ。施設語は基盤側)
      - スクランブル交差点
      - スクランブル
      - ハチ公前
      - ハチ公
      - センター街
      - 道玄坂
      - 宮益坂
      - 渋谷駅
      - 渋谷
      - 新宿
      - 原宿
      - 表参道
      - 恵比寿
      - 代官山
  transit:
    station_filters: ["渋谷", "Shibuya"]  # GTFS 実ダイヤ読込時に対象駅停車便を抽出する駅名(world/transit)
  origin:
    landmark: スクランブル交差点          # 群集集約先=地図ローカル原点(0,0)のランドマーク名(annual.gathering_node は座標由来)
  culture:
    events:                              # 年中行事(名前=文化語彙・日付・群集フラグ)。annual_events.enabled で発火
      - {name: 正月,      month: 1,  day: 1,  crowd: false}
      - {name: ハロウィン, month: 10, day: 31, crowd: true}   # 渋谷固有の群集(集会ノードへ寄せる)
      - {name: 年末,      month: 12, day: 31, crowd: false}
  media:                                 # 娯楽メディアの架空番組名(media.prompt_context=true 時のみ注入。実在名は使わない=R17)
    tv:    ["夜のスクランブル", "ハチ公前ニュース9", "渋谷トークナイト", "深夜のセンター街劇場", "みんなの気象台"]
    video: ["路地裏グルメ散歩", "10分でわかる都市伝説", "配信者ミナトの日常", "ネオン街ウォーク", "猫と暮らす部屋"]
    game:  ["スクランブル・ラッシュ", "タワー・オブ・シブヤ", "パズル横丁", "ネオンレーサー2", "ハチ公クエスト"]
  climate:                               # 月別気候の近似(weather.enabled 時のみ。現実の東京の月別気候の近似)
    monthly:                             #   月: [最高気温中心, 最低気温中心, 雨の重み, 雪の重み]
      1:  [10, 2, 0.15, 0.08]
      2:  [11, 2, 0.15, 0.06]
      3:  [15, 6, 0.22, 0.0]
      4:  [20, 10, 0.25, 0.0]
      5:  [24, 14, 0.25, 0.0]
      6:  [26, 18, 0.45, 0.0]
      7:  [30, 23, 0.42, 0.0]
      8:  [32, 25, 0.30, 0.0]
      9:  [27, 20, 0.35, 0.0]
      10: [22, 14, 0.25, 0.0]
      11: [17, 9, 0.20, 0.0]
      12: [12, 4, 0.15, 0.05]
    neutral: [21, 12, 0.22, 0.0]         # calendar OFF(季節なし)時の既定気候(env 非依存フォールバック)

model:
  backend: mock         # mock | ollama | vllm(本選)
  name: mock-v0
  lang: ja              # ja | en(D3: 日本語仮決定)
  temperature: 0.7
  max_tokens: 320       # 発話・投稿・DMの生成上限
  reflect_max_tokens: 1200  # 内省(思考モード)の生成上限(深い振り返り用)
  plan_max_tokens: 0    # 0=max_tokens と同じ(朝の計画のみ上限を分けたい時に設定)
  reflect_think: true   # 内省を qwen3 の思考モードで回す(thinking/response 分離)
  cache: true           # 応答キャッシュ(D13: 再現性の実体)
  format: json          # 構造化出力の強制(第33バッチ 計画A。docs/research/constrained-decoding.md)
                        #   json(既定)=従来挙動そのまま(ollama format=json / vLLM response_format)。
                        #   none=送らない(プロンプト規約のみ)。schema は将来拡張(未対応)。
                        #   ★think=True の呼(内省)には自動で送らない(GBNF が思考を殺す実測への境界ガード)。
                        #   router の子は spec の format キーで個別指定可。キャッシュキーは json のとき
                        #   従来と同一(過去ランの llm_cache 再生互換)・none のみ別キー。
  # ---- 本選(backend: vllm)用。mock/ollama では未使用=既定挙動は完全不変 ----
  servers: []           # vLLM の base_url リスト。空=vllm 選択時のみエラー。1台マルチGPU/複数ノード両対応。
                        #   単一 (1本):   servers: ["http://localhost:8000"]                     → VllmBackend 直
                        #   1台7GPU:      servers: ["http://localhost:8000", ..., "http://localhost:8006"]  → FleetLLM(艦隊)
                        #   複数ノード:   servers: ["http://node1:8000", "http://node2:8000", ...]          → FleetLLM(艦隊)
  timeout_s: 120        # 1 リクエストのタイムアウト秒(vllm のみ)
  # tiers:              # 任意: purpose(rng_key 先頭: reflect/deliberate/... )別のサーバ振り分け。既定 null=全 URL を default プールへ。
  #   reflect: ["http://localhost:8000"]                       # 内省=重い/大モデル1本に寄せる
  #   default: ["http://localhost:8001", "http://localhost:8002"]  # 会話・投稿=小モデル群
  #   ※ tiers を書くと servers が1本でも FleetLLM が使われる(seam を通す)。
  # ---- 合成ルータ(backend: router のときだけ読む。第23バッチ M2)----
  # 異なるモデル・異なる提供元(ローカル/API)を purpose 別に1ランへ混載する。
  # 子は各自 CachedLLM で包まれ、キャッシュは子の name 別ファイル(llm_cache.<name>.jsonl)=D13維持。
  # APIキーは環境変数のみ(api_key_env で変数名を指定)。config にキーの値を書かないこと。
  # agent_tier(エージェント階層別)は未実装=ユーザー討議後(docs/research/agent-lod-deepdive.md)。
  # router:
  #   default: {backend: ollama, name: "qwen3:4b"}                       # 必須。deliberate 等すべての既定
  #   purpose:
  #     reflect: {backend: ollama, name: "qwen3:14b"}                    # 例: 内省だけ大モデル
  #     # reflect: {backend: anthropic, name: "claude-haiku-4-5"}        # 例: 内省だけ API
  #     # plan: {backend: openai_compat, base_url: "http://localhost:11434/v1", name: "qwen3:8b"}

world:
  map: data/shibuya_osm.json    # ★OSM 実道路網(渋谷駅中心 約1.0×0.7km)。旧: data/shibuya_core.json
  scenario: baseline            # baseline(既定=no-op)| shock_closure | shock_event(#8 摂動カタログ)
  # scenario_params: 選んだ scenario の引数(baseline では未使用)。座標は地図ローカル m(原点=スクランブル交差点)。
  #   shock_closure(区間封鎖): at_step から duration_steps の間、center 半径 radius_m 内の道路を封鎖し
  #                            新規経路が迂回する(移動中は現エッジを走り切る)。解除で復帰。
  #     例) scenario_params: { at_step: 36, duration_steps: 18, center: [0, 0], radius_m: 150 }
  #   shock_event(定型ニュース注入): at_step に title/text/word を世界イベント列へ合流(公式発表と同経路)。
  #     例) scenario_params: { at_step: 24, title: "駅前で大規模イベント", text: "混雑注意", word: "封鎖祭り" }
  scenario_params: {}           # 既定は空(baseline では読まれない)
  perception_radius_m: 40.0     # この距離内で会話が聞こえる(建物内=同じ階のみ)
  edge_capacity: 20             # 混雑=この人数を超えると減速(grievance 源)
  elevation:                    # 3D Phase 0: 標高 z 列(3d-movement.md §7)。ON で move_segment/arrive payload に z[m](DEM 双一次・export_3d と同値)を追加
    enabled: false              # 既定 OFF=イベント不変(バイト一致)。表示・観測専用=移動判定・認知・LLM 呼数は不変
    dir: data/plateau           # terrain.npz + terrain.json のフォルダ(scripts/plateau_extract.py の出力)
  modes:                        # 移動手段(1 step = 10分 で進める距離 m)
    speeds: { walk: 800.0, bicycle: 2000.0, car: 3500.0 }
  exit_prob: 0.02               # 暇なとき範囲外へ出かける確率/step
  building_enter_prob: 0.35     # 入口に居るとき建物に入る確率
  outside_steps: [18, 144]      # 範囲外滞在の長さ(3時間〜1日)。外は計算しない
  meal_prob: 0.35               # 食事時間帯に飲食店(実在 POI)へ行く確率/step
  traffic:                      # 背景交通(エージェント以外の通過車両)
    enabled: true
    mode: ambient               # ambient(既定=周期的な背景フロー。現行挙動と完全同一)
                                # od(本番推奨): 車を個体化。各車が出発地=車道ゲートウェイ、
                                #   目的地=別ゲートウェイ(通過交通)or 域内 POI 近傍を決め、
                                #   一方通行を尊重した最短路を辿る。信号=ノード別の期待遅延、
                                #   車線=エッジ容量(超過で渋滞減速)。要 features_file。
                                #   重い場合は本番(vllm)だけ od、開発は ambient のままで可。
    cars_per_day: 30000         # ambient: 台/日。センサス区間実値が未確認のため仮置き(幹線+周辺の合算オーダー)
    max_log: 120                # 1step にログへ残す車両軌跡の上限(可視化用。両モード共通)
    # ---- od モード専用(mode: ambient のときは一切読まれない=既定挙動は完全同一)----
    features_file: data/traffic_features_shibuya.json  # scripts/build_traffic.py 生成(信号/車線/oneway/ゲートウェイ)
    od_cars_per_day: 8000       # od: 個体化して追跡する車の 1日総発生台数(ambient の集計フローより軽め)
    through_ratio: 0.7          # od: 発生車のうち通過交通(別ゲートウェイ行き)の比率。残りは域内 POI 近傍へ
    capacity_per_lane: 8        # od: 1車線あたり同時走行許容台数。超過エッジは減速(渋滞)
    default_lanes: 2            # od: OSM に車線タグが無いエッジの既定車線数
    signal_cycle_s: 90          # od: 信号1周期の秒数。★1step=600s>周期なので緑赤の瞬時状態ではなく
                                #     一様到着の期待待ち(r²·C/2)を距離換算で差し引く近似を使う
    free_speed_min: 3000        # od: 自由流速度の下限(m/10分。約18km/h。信号/渋滞で実効はこれ以下)
    free_speed_max: 5000        # od: 自由流速度の上限(m/10分。約30km/h)
    max_cars_log: 200           # od: traffic_flow payload の cars[] 上限(可視化補助)

  events_file: null             # シナリオイベント(例: data/events_demo.json)。ビューアの「シナリオ」タブで作成可

  # ---- 擬似視覚 C(壁による遮蔽。既定 OFF=本番トグル。ユーザー要望 2026-07-06)----
  # ON 時: 半径・同一階の既存フィルタ通過後に視線(LOS)判定を追加。建物内は決定論生成の
  # 壁セグメント(開口部あり)で隔たれたペアが互いに不可聴=交流不可になる。
  # outdoor=true で屋外も建物フットプリント遮蔽(重いので既定 false)。設計: docs/research/vision-los.md
  vision:
    enabled: false
    outdoor: false

  # ---- 構造化シーン記述 v0(エージェント視覚 B。既定 OFF=プロンプト/イベント不変=バイト一致)----
  # ON 時: 発火プロンプトに「見え」の 2〜4 行を注入(方向つき視界=正面/右手/左手の近傍施設・
  #   注視対象リスト=近傍の人+地点を距離で決定論選抜・垂直関係=レイヤ+標高)。追加 LLM 呼ゼロ・
  #   乱数ゼロの純関数集計(crowd_visual と同型の seam)。地名は実行時に世界データから取る。
  #   件数は入力解像度 LOD(lod.input_res.scene_n)対象。設計: docs/research/agent-vision.md §4 v0。
  #   注視の人ソースは同席者(壁 LOS 済み)。垂直は elevation 有効時のみ標高を使う(None ガード)。
  scene_desc:
    enabled: false
    radius_m: 60.0        # 視界・注視に含める近傍地点までの距離(crowd/ads と同レンジ)
    scene_n: 3            # 記述の既定件数(input_res.scene_n 未設定時のフォールバック)
    fov_deg: 100.0        # 「正面」と判定する視野角(全幅)
    vertical: true        # 垂直関係の 1 行(レイヤ/標高)を出すか

  # ---- 日付・カレンダー(第7バッチ 2026-07-07。既定 OFF=現行挙動と完全同一)----
  # ON 時: 全発火/計画/内省プロンプトに「今日は◯年◯月◯日(曜)です。」を1行注入(全員共通・k非依存)。
  #   weekday_work=true にすると本業勤務・登校を平日(非休日)だけに絞る(バイトの曜日挙動は不変)。
  #   日付は sim_min からの純関数導出=乱数不使用。holidays は "YYYY-MM-DD" 文字列リスト(土日は自動休日)。
  calendar:
    enabled: false              # ★ON 推奨(本番): true(暦をエージェント行動の要因にする)
    start_date: "2026-04-01"    # シミュ初日の実日付(day_index=0 の日)
    weekday_work: false         # ★ON 推奨: true(平日のみ勤務・登校。土日祝は休み)
    holidays: []                # 追加の休日(例: ["2026-04-29", "2026-05-05"])。土日は自動で休日

# ---- 空間レイヤ核(屋内ミクロ状態=シームレスズーム観察の土台。既定 OFF=現行挙動と完全同一)----
# 全建物・全階の屋内間取り(vision.building_layout=決定論・ビューア floorLayout と同一系列)を
# 「単一の真実」として保持し、区画(zone)に用途型(SpaceType)を決定論割当する層。実装
# src/society/world/indoor.py(IndoorSpace)。エンジン配線(scheduler)は次バッチ担当=本セクションは
# スキーマの骨組みで、enabled=false では誰も読まない=イベント/L1/checkpoint のバイトに一切現れない。
# no-fingerprint: use カテゴリ→型の写像はここ(conf)に置き、コードは地名・業種名を書かず汎用に読む。
indoor:
  enabled: false                      # ★空間レイヤ核を使う実験で ON。false=完全 no-op(バイト一致)
  floor_layouts_path: data/floor_layouts.json   # 実フロア構成の補助データ(不在でも間取り正典で動く)
  # use カテゴリ → 型優先順位表 [bulk, accent1, accent2...]。bulk を全区画へ敷き、accent を
  # 「最小側」区画へ1つずつ(小さいほど後方の accent)割り当てる(面積降順+index 順=決定論)。
  # 例) office の [desk, meeting, break] = 最大群 desk・二番目に小 meeting・最小 break。
  # キー = floorguide/floor_layouts の use・POI cat・建物 kind(vision._kind_use=office/station/shop/generic)を網羅。
  space_types:
    office:      [desk, meeting, break]
    station:     [concourse, service]
    bus:         [concourse, service]
    shop:        [sales, register]
    food:        [sales, register]
    fashion:     [sales, register]
    beauty:      [sales, register]
    lifestyle:   [sales, register]
    restaurant:  [seating, kitchen, register]
    hall:        [seating, service]
    theatre:     [seating, service]
    observation: [seating, service]
    attraction:  [seating, service]
    nightlife:   [seating, service]
    leisure:     [seating, service]
    hotel:       [seating, service]
    park:        [seating]
    education:   [classroom, service]
    school:      [classroom, service]
    amusement:   [seating, service]
    clinic:      [service, seating]
    gym:         [service, seating]
    service:     [service]
    generic:     [sales, service]
  # ---- エンジン配線(B3)が読む実パラメータ。indoor.enabled=false では未読=完全に不活性 ----
  markov:                             # フロア内の区画滞在→遷移(LBNL 在室行動 ABM 流の幾何 dwell)
    enabled: false
    dwell_steps: 3                    # 平均滞在 step(遷移確率=1/dwell_steps の幾何 dwell=LBNL 流)
    # 活動 → 初期区画割当の優先型(型語は conf 側=コードは業種名を書かない no-fingerprint)。
    # 先頭から順に、その階の zone_types に在る最初の型を選ぶ。無ければ bulk(最頻型)。
    assign_types:
      working:  [desk, sales, service, concourse, classroom, register, seating]
      eating:   [seating, register, sales]
      shopping: [sales, register, seating]
    # markov 遷移先の候補型(勤務者 desk⇄meeting⇄break・客 sales⇄seating 回遊)。活動別。無指定活動は
    # assign_types にフォールバック。候補型がその階に無ければ遷移しない(=その step は滞在)。
    roam_types:
      working:  [desk, meeting, break]
      eating:   [seating, register]
      shopping: [sales, seating, register]
  sfm:                                # 遷移駆動 Social Force Model(区画内の微視軌跡・Helbing2000)
    enabled: false
    dt: 0.2                           # サブステップ [s]
    max_substeps: 900                 # 1遷移の上限サブステップ(=180s)
    sample_interval: 5                # 軌跡サブサンプル間隔(5×0.2=1s ごと)
    r_contact: 1.2                    # 接触判定の中心間距離 [m](proxemics personal distance 上端)
    t_sub_contact: 3                  # 接触成立の連続サブステップ(=0.6s・瞬間ブラシ除外)
    neighbor_cap: 12                  # 対人斥力の近傍上限(Helbing 近傍・id 昇順で決定論選択)
    wall_a: 2000.0                    # 壁斥力の強さ [N](Helbing2000 壁項)
    wall_b: 0.08                      # 壁斥力の特性距離 [m](Helbing2000)
    arrive_radius: 0.5                # waypoint 到達判定半径 [m]
    bfs_cell: 0.5                     # BFS フォールバック格子 [m]
  meeting:                            # 会議・同席(同一職場グループを同時刻に meeting 区画へ集める)
    enabled: false
    min_party: 2                      # 会合成立の最小人数(同一 (建物,階) の同一職場勤務者)
    prob: 0.5                         # 1職場・1日あたりの開催確率(stream "indoor_meet" (group,day))
    window_min: [600, 900]            # 開催時刻の分 of day 域(10:00-15:00)。この中の1 step で開催
    meeting_types: [meeting, break]   # 会合を開く区画の型(その階にあれば・無ければ不開催)
  encounter:                          # 遭遇(接触ペア)観測のコスト制御
    bystander_cap: 24                 # 1セルの静止在館者を接触計算に含める上限(id 昇順=決定論)
    # ★B3b 動力学接続: 直近(前 step)の屋内遭遇ペアを対面会話の「返答相手」選択で優先する
    #   (遭遇 duration 降順・id 昇順の決定論・乱数なし。_phase_indoor は _apply の後に走るので
    #    使うのは前 step の遭遇=1-step ラグ)。変えるのは相手選択のみ=hearer 集合・会話発生・
    #    LLM 呼数は不変(co-location 変化系の正契約。呼数の k 不変性は compute_matched で担保)。
    #    OFF=返答相手は従来(nearest/closeness)=ゴールデン L1 バイト一致。
    pairing: false
  tracks:                             # 記録サイドカー(indoor.enabled とは独立のサブトグル)
    enabled: false                    # true で indoor_tracks_*.parquet(秒スケール軌跡+遭遇)を書く
  los:                                # ★B3b 屋内知覚の壁 LOS ゲート(擬似視覚=区画粒度の同席文脈)
    # ON 時: 発火プロンプトの同席リスト(近傍リスト)を屋内実座標 ind_x/ind_y の距離上限+間仕切り壁
    #   LOS(vision.IndoorLOSOccluder=segment_blocked)で絞る(同一(建物,階)スコープのまま=構造不変)。
    #   壁で遮られた/遠すぎる相手を「同席文脈」から外す=区画粒度の知覚。プロンプト文言テンプレは不変・
    #   同席リストの中身だけが変わる(co-location 契約)。発火判断・返答権・hearer 集合はゲートしない
    #   =LLM 呼数不変。壁は IndoorSpace のキャッシュ壁を使う。OFF=同席リスト従来=バイト一致。
    enabled: false
    max_dist_m: 15.0                  # 同席文脈に残す屋内での上限距離 [m](0=距離ゲート無効=壁 LOS のみ)

# ---- 経済 v0(賃金+消費+バイト+心理接続。ユーザー決定 2026-07-05)----
# 職業→賃金カテゴリ・持ち金・バイトの写像は src/society/economy.py(persona/sim 側)。
# engine は precompute 済みの金額しか見ない(no-fingerprint 契約に触れない)。
economy:
  enabled: true
  wages:                          # 本業の日給(勤務完遂で支給)。part_time_hourly=学生バイト時給
    会社員: 12000
    自営: 10000
    店員: 9000
    part_time_hourly: 1100        # 学生バイト時給(×4h/シフト)
  # 最低賃金の床(制度深化3 2026-07-08)。一次確認: 東京都最低賃金 1,226円/時(2025-10-03 発効・
  # 東京労働局)。>0 で雇用者賃金に床を適用: part_time_hourly=max(現値, 床)、日給カテゴリ
  # (会社員/店員/公務員)=max(現値, 床×8h)。自営は労働者でない=対象外(現実の制度と同じ)。
  # 既定 0.0=床なし=従来と完全同一(ゴールデン維持)。★ON 推奨(本番): 1226
  min_wage_hourly: 0.0
  prices:                         # 消費の価格(残高不足なら選ばない)
    food: 900
    cafe: 500
    shop: 2500
    nightlife: 1800
    leisure: 0                    # 公園・緑地は無料
  allowance_visitor: 20000        # 来街者の持ち金初期値レンジの中心(賃金なし)
  visitor_refresh: false          # ★ON 推奨(本番): true。来街者が帰宅から戻るたび手持ちを
                                  # allowance_visitor まで補充(家で財布を補充する近似)。来街者は
                                  # 反復収入が無く長期ランで恒久破綻し消費・宿泊から脱落する
                                  # (docs/research/sim-improvement-analysis.md P2)ことへの対処。
                                  # 決定論・k 非依存(wage source="home_refill")。false=従来と完全同一
  money_pressure_threshold: 2000  # 残高がこれ未満 = 逼迫(1日1回 grievance+)
  fixed_cost_daily: 0.0           # ★ON 推奨: 例 300。家賃以外の日次固定費(光熱費・サブスク等)=
                                  # 恒常的生活圧(Wave G1)。日次で spend(cat=fixed_cost)。来街者は対象外。
                                  # 0.0=控除ゼロ=イベントなし(バイト一致)
  # ---- 口座(銀行)概念 E5(既定 OFF。ユーザー決定 2026-07-06。100日=月次の資金繰り)----
  # ON 時: 初期資産を口座8割/現金2割に分割。賃金・バイト・日銭・売上は口座へ入金。
  #   月給者(会社員等)は日割りでなく給料日(payday_dom)に月給まとめ支給、翌日に家賃を
  #   口座から引き落とし(月収相当×rent_share)。支払いは card_threshold 以上=口座(カード)、
  #   未満=現金。現金不足は最寄り ATM で自動引出(移動なし=ATM はどこにでもある近似)。
  #   逼迫判定(money_pressure)は現金+口座の合算に切替。OFF 時はバイト一致で完全不変。
  accounts:
    enabled: false
    payday_dom: 25                # 給料日(暦の何日目。1日=144step、run開始日=1日として day%30)
    rent_share: 0.30              # 家賃 = 月収相当 × これ(給料日翌日に引き落とし)
    card_threshold: 3000          # これ以上の支払いは口座(カード)、未満は現金
    atm_withdraw: 20000           # 現金不足時の1回あたり引き出し基本額(不足分が大きければそれ以上)
    cash_share: 0.20              # 初期資産の現金比率(残り=口座)
    # ---- 立退き・破産サイクル(制度深化3 2026-07-08。要 accounts.enabled=true)----
    # 現実の対応: 滞納の継続→信頼関係破壊の法理で契約解除=立退き(住居喪失=路上就寝・
    # 家賃の新規発生停止)、さらに続くと自己破産(免責=滞納債務消滅+自由財産以外を圧縮+
    # 制限期間=出店不可)。完済で再入居=サイクルが閉じる。既定 0/0=どちらも無効=E5 従来と完全同一。
    eviction_days: 0              # ★ON 推奨(本番): 例 30(滞納がこの日数続くと立退き)
    bankruptcy_days: 0            # ★ON 推奨(本番): 例 60(滞納がこの日数続くと自己破産)
    bankruptcy_keep: 10000        # 破産後も手元に残る自由財産(実法の99万円を所持金スケールに圧縮)
    bankruptcy_restrict_days: 30  # 破産後の制限期間(日)。この間は出店不可(資格制限のモデル)
    eviction_grievance: 0.10      # 立退きの生活不安(factors 経由の不透明 magnitude)
    bankruptcy_grievance: 0.15    # 破産の生活不安(同上)

# ---- 「世界を変える」ツール群(4軸を最小で覆う affordance。中立提示・自然使用の観察)----
# モノ=open_venture / 制度=propose / 人=host_event(勉強会) / 虚構=host_event・flyer・group。
# R1: 提示・可否は k と無関係(所持金など客観条件のみ)。R4: 効果は客観カウント(LLM審判なし)。
tools:
  enabled: true
  equip_all: false              # 標準装備(H 2026-07-06): true で全発火プロンプトに「所持ツール」節を
                                # 中立告知(勧誘なし・呼数不変)。実LLMのツール0使用対策。
                                # ★B段の実LLM検証で true を新標準にする予定(ユーザー承認待ち)
  venture_cost: 30000           # 出店の開業費(これ以上の所持金がある時だけ提示・実行)
  # 営業許可(制度深化2 第10バッチ。保健所・風営法等の参入障壁の最小形。調査: rights-institutions-gap.md §J)
  permit_steps: 0               # ★ON 推奨(本番): 例 6(申請〜開業までの許可待ち。待ちの間は販売なし)
  permit_deny_prob: 0.0         # ★ON 推奨(本番): 例 0.15(却下確率。新 stream "permit"。却下=開業費は返る)
  venture_price: 800            # 屋台の商品単価(通行人が購入)
  venture_close_days: 3         # 売上ゼロがこの日数続くと自動閉店
  proposal_threshold: 0.25      # 署名が全体のこの割合に達すると提案成立(象徴的成立)
  event_duration_steps: 6       # イベントの開催時間(step)= 会場滞在・教育の帯域
  flyer_ttl_steps: 144          # 掲示・ビラの寿命(1日)
  flyer_max_per_node: 3         # 同一ノードのビラ上限(古い順に上書き)
  attend_base: 0.25             # イベント参加の基礎確率
  attend_relation_bonus: 0.35   # 主催者が関係台帳にいる時の上乗せ
  group_join_prob: 0.4          # グループ名を知り関係者がいる時の加入確率
  buy_prob: 0.3                 # 屋台に到着した通行人が購入する確率

# ---- 制度DSL(ホワイトリスト型ルールの自動制定。ユーザー構想 2026-07-06)----
# エージェントは propose で制度を作る。署名 25% で成立した瞬間、機械可読 rule が
# シミュ世界の実効ルール(価格・支給・行き先抑制・定期イベント)として自動制定される。
# 自由なコード生成は避け、4型のホワイトリストに閉じる(決定論・R1 全員平等・R4 客観測定)。
# 検証に失敗した rule は「文言だけの制度」に降格して成立(壊れない)。false で完全に旧挙動。
rules:
  enabled: true
  allow_declare: false          # ★ON 推奨(本番): true。権利創設・宣言型 rule
                                # {"type":"declare","title":"…"} を許可(制度深化 第9バッチ)。
                                # エンジンの価格・移動には作用しない象徴的制度(現実の例: 渋谷区
                                # パートナーシップ条例 2015=一区の制度改変が全国へ波及した実在 keystone)。
                                # 再帰性の norm_line・ニュースで知覚され、Y の symbolic 層で測る。
  max_active: 5                 # 同時アクティブ上限(超過は古い順に失効=rule_expired)
  duration_days: 0              # 各ルールの有効期限(日)。0 = 無期限
  fee_max_ratio: 0.5            # fee delta の上限 = 対象カテゴリ基準価格に対する比率(±50%)
  bonus_max: 500                # bonus 支給額の上限(円/回)
  boost_prob: 0.5               # weekly_event 発火日にその場所を余暇候補へ選ぶ確率/step

# ---- 再帰性(第9バッチ 2026-07-07。ユーザー要望: 規範・現状の監視→知覚→フィードバック→改変)----
# エージェントが「いま実際に効いている取り決め」と「昨日の街の動き(提案/成立/廃止/取り締まりの
# 客観カウント)」を発火プロンプトで知覚し、気に入らない取り決めは propose の
# rule={"type":"repeal","target":"名前の一部"} で廃止を提案できる(成立で rule_repealed)。
# 取り締まりが多発したルールは日次でニュース化(社会の自己観測=メディアが制度の帰結を報じる)。
# すべて非LLM・決定論・乱数不使用。R1: generate() を1本も足さない(注入は内容のみ=呼数不変。
# impact_news は聞く語が変わり発火が動きうるが k・内面状態を読まない=compute_matched の k 不変性で担保)。
# 既定 OFF=注入なし・rule_repealed/norm_digest 0 件=現行挙動と完全同一(ゴールデンを守る)。
recursion:
  enabled: false                # ★ON 推奨(本番): true(再帰性=世界を変える閉ループの知覚側を有効化)
  rules_in_prompt: true         # いま実効の取り決めを全発火プロンプトに1行注入
  digest_in_prompt: true        # 昨日の街の動き(提案/成立/廃止/取り締まり件数)を1行注入
  allow_repeal: true            # propose の rule.type=repeal(既存の取り決めの廃止)を許可
  impact_news: true             # 取り締まりが多発したルールを日次ニュース化
  impact_news_threshold: 3      # 前日の執行がこの件数以上のルールをニュースにする
  max_rules_in_prompt: 3        # プロンプトに載せる取り決めの最大件数(最新から)

# ---- インターネット層(スマホ: SNS / ニュース / 検索 / DM)----
# 発信(投稿・DM)の起動は欲求発火(drive)経由。ここは閲覧系(非LLM)のみ。
net:
  enabled: true
  browse_prob: 0.12             # 暇なとき SNS タイムラインを見る確率/step
  news_prob: 0.06               # ニュースアプリを見る確率/step
  feed_size: 6                  # 1回の閲覧で読む投稿数
  follow_k: 6                   # 初期フォロー人数(+対面で知り合うと自動フォロー)
  like_prob: 0.15               # 閲覧した投稿にいいねする確率(#14。非LLM・専用stream)
  reshare_prob: 0.03            # 閲覧した投稿をリシェアする確率(#14。フォロワーへ自然再配信)
  posts_max: 0                  # B7(スケール): SNS 投稿の保持上限。>0 で古い投稿をエイジアウト
                                # (id は不変で react/timeline は id ベース=安全)。0=無制限で従来と完全同一。

# ---- 欲求駆動発火(Phase A: 推論タイミングの分散。ユーザー仕様 2026-07-04)----
# 出来事が欲求ゲージを溜め、個人別閾値で「申請」→ 個人の重みで確率発火 →
# 不発ならゲージを数十%減衰。発火回数は k 条件間で監査可能(R1 対策)。
drive:
  decay: 0.02                   # ゲージの自然減衰/step
  fail_decay: 0.30              # 抽選落ち時の減衰(ユーザー仕様「数十%」)
  fire_reset: 0.20              # 発火後に残るゲージ比率
  refractory_steps: 3           # 不応期(発火直後は考え込まない)
  conv_max_turns: 3             # 対面会話で片側が返答できる最大回数(無限連鎖の抑制)
  conv_cooldown_steps: 6        # 会話セッション終了後のクールダウン(step)
  firing: fixed                 # fixed(既定=閾値ゲート+個人重み抽選)| logistic(p=σ(slope·(drive−threshold)))
  slope: 8.0                    # logistic 時のシャープさ(B段 seam。fixed では未使用)
  weights:                      # 出来事 → ゲージ増分(相対重み。RQ1 検収後に調整)
    novel_place: 0.35
    congestion: 0.30
    unknown_word: 0.40
    addressed: 0.25
    dm_received: 0.35
    news: 0.15
    sns: 0.08
    company: 0.10
    silence: 0.015
    state_change: 0.50
  # ---- 内省しやすさの時間ドリフト E2(既定 OFF。設計: docs/research/reflection-drift.md)----
  # 実効閾値 = clip(drive_threshold + theta_drift, 0.30, 0.85)。fire_weight は不変。
  #   馴化: 低顕著の単調入力(沈黙/SNS/同席/ニュース)が続く → theta_drift↑(内省が減る)。
  #   鋭敏化: 発火経験・新奇/強イベント(初訪問/未知語/大 |Δstate|)→ theta_drift↓(乗ってくる)。
  #   自発回復: 毎 step theta_drift を 0 へ緩やかに引く(静穏で base へ戻る)。
  #   向き・速さの個体差は traits 由来(factors/registry.drift_params。NFC高=鋭敏化寄り)。
  # R1: 入力は出来事量・発火経験のみ(belief 書き戻し・k.writeback を一切参照しない)。
  # OFF 時は theta_drift 恒等 0=drive_threshold と完全同一(ゴールデン/決定論を壊さない)。
  drift:
    enabled: false
    habit_rate: 0.02            # 馴化の基準率(× 出来事の顕著さ。閾値↑)
    sens_rate: 0.02             # 鋭敏化の基準率(発火1回=−sens_rate。新奇は × 顕著さ)
    recovery_rate: 0.01         # 自発回復の基準率(毎 step theta_drift を 0 へ)
    max_abs: 0.15               # |theta_drift| の可動域(clip[0.30,0.85] と二重で暴走防止)
  # ---- 好奇心/退屈の内発ドライブ(P2 スライス S5。既定 OFF=現行と完全同一)----
  # 設計: docs/plans/p2-interstitial-design.md §1 S5 / docs/research/interstitial-life.md §4.4-a。
  # 「同じ場所への長居・単調な入力の継続」で退屈ゲージが溜まり(silence ゲージと同じ作法)、
  # 閾値超えで LLM なしの内発的探索(近傍の未訪問/低頻度 POI へ移動=知らない店/ふらっと歩く)を
  # 発火する=ボトムアップ創発の種(自然界志向と整合)。行き先選択は S4 の Gumbel 機構があれば
  # 再利用し、なければ決定論近傍選択。到達先が新奇なら既存 drive の novel_place(鋭敏化=顕著性)に
  # 自然接続し、そこで何かが起きれば既存予算内で C1 熟慮へ(接続点を作るだけ)。
  # 入力は物理量(現在地・移動中か・近傍 POI・訪問回数)のみ=beliefs/k を見ない(no-fingerprint)。
  # R1: 新 stream は "boredom" 1本のみ・追加 LLM 呼ゼロ=呼数 k 非依存・enabled=false で
  #     boredom_explore 0 件=ゴールデン L1 バイト一致。production.yaml は触らない。
  boredom:
    enabled: false              # ★本番はユーザー判断で ON。false=現行の routine と完全同一
    accrual: 0.06               # 同じ場所への長居 1step あたりのゲージ蓄積(0-1)
    decay: 0.10                 # 移動中・新奇な場所での減衰率
    novelty_relief: 0.20        # 新しい場所に着いたときの追加減衰(脱馴化の入口)
    threshold: 0.60             # 探索発火の閾値(ゲージがこれ以上で発火候補)
    fire_prob: 0.5              # 閾値超え時に実際に探索へ動く確率(stream "boredom")
    cooldown_steps: 6           # 探索発火後に次の退屈探索へ入れるまでの step 数(連発の抑制)
    radius_m: 300               # 探索先を探す現在地の近傍半径(m)。周辺 POI 密度がそのまま重み
    stay_steps: 2               # 探索先での滞在 step 数

# ---- 会話3層 C2/C3(P2 スライス S3。docs/plans/p2-interstitial-design.md §1 S3)----
# 「記録に残る会話」を LLM コスト0 で大量に生む主レバー(interstitial-life.md §4.3)。既定 OFF。
# ON 時: 空間索引で同席・会話可能な対を決定論列挙し、専用 stream `c2_meet` で構造化会話(挨拶→話題
#   →スタンス→同意/反論→別れの Dialogue Act 遷移。実文は作らない)を成立させる。話題・トーン・帰結は
#   両者の状態(関係値・opinion・共有語彙)からの決定論写像。機械効果は既存資産を呼ぶだけ:
#   関係更新(relations)・意見更新(opinion の FJ・k 非依存)・語彙接触(labels の complex contagion)・
#   drive ゲージ加算(addressed)。1 会話 1 件の conversation イベント(軽量)を記録。帰結が顕著
#   (強い意見差・関係の転機・未知語接触)なら drive を余分に押し上げ、次 step の _phase_drive が
#   フル LLM 発話(C1)を自然に発火する(C2→C1 昇格)。C3=すれ違いは会話イベントを作らず日次カウンタのみ。
# c2 パラメータ(成立確率・cooldown・1日上限/人)で密度を調整する。初期値は mock 24step 実測で
#   「ON 時 ~30 会話/人日」を狙って置いた(在場密度依存=較正値。密な本番では下げて調整する)。
# R1: 新 stream は c2_meet 1本のみ・既定 OFF で conversation 0 件=ゴールデン L1 バイト一致・追加 LLM 呼
#   ゼロ(呼数 k 非依存)・no-fingerprint(opinion/relations の不透明値のみ)。production.yaml は触らない。
conversation:
  enabled: false                # ★ON 推奨(本番): true(記録に残る会話密度=C2 を有効化)
  c2:
    meet_prob: 0.8              # 同席・会話可能な1対あたり毎step の会話成立確率(c2_meet 抽選)
    cooldown_steps: 2           # 会話後にその個体が次の C2 に入れるまでの step 数(連発の抑制)
    daily_cap: 40               # 1人1日あたりの C2 会話の上限(暴走防止・現実レンジ上限側)
    align_agree: 0.72           # opinion 整合度がこれ以上=同意スタンス
    align_oppose: 0.38          # opinion 整合度がこれ以下=反論スタンス(強い意見差=昇格材料)
    tier_friendly: 1            # 関係 tier がこれ以上(または count>=2)で友好トーン寄り

# ---- 朝の一日計画(ユーザー要望 2026-07-06)----
# 起床(来街者は帰還)直後に1回、LLM で「今日一日の予定(2〜5個)」を立て、それが
# LLM 非駆動時のルールベース行動(routine)の行き先の土台になる。呼数は k 非依存(R1)。
planning:
  enabled: true                 # 既定 ON = 新しい標準挙動。false で完全に旧挙動へ戻る
  max_items: 5                  # 1日の予定の最大件数(2〜max_items を採用)
  # ---- 日課計画フレームワーク(P2 S1。既定 OFF=現行の計画経路・プロンプト・mock と完全一致)----
  # ON で計画を型スキーマ(自由文 intent 先頭 + 3分類 cat + 語彙 what + 時間窓 + 柔軟性 flex)へ
  # 拡張し、計画コンパイラ(勤務・就学アンカー先置き→残り時間窓に裁量活動充填)を通す。実行側
  # (routine)は触らず、結果は現行 day_plan へ降格写像する。設計: docs/research/daily-plan-framework.md
  framework:
    enabled: false              # false=現行どおり。true でスキーマ+コンパイラを有効化
    # 活動タイプ語彙(EnvPack 思想: 街ごとに差し替え可能。既定=現行8語彙 + 学業/用足し/送迎)
    vocab: [work, study, meal, shop, leisure, park, walk, home, visit, personal, escort]
    # what → 3分類 cat の既定導出(LLM が cat を明示しないときに使う)
    cat_map:
      work: mandatory
      study: mandatory
      meal: maintenance
      shop: maintenance
      personal: maintenance
      escort: maintenance
      home: maintenance
      leisure: discretionary
      park: discretionary
      walk: discretionary
      visit: discretionary
    # cat → 既定所要(分)。start/dur_min 省略時のフォールバック
    dur_min:
      mandatory: 240
      maintenance: 45
      discretionary: 60

# ---- 確率的実行=行動のゆらぎ(P2 スライス S4。docs/plans/p2-interstitial-design.md §1 S4 /
#      docs/research/interstitial-life.md §4.1 の実証3層 L1/L2/L3 + Gumbel)。既定 OFF=現行と完全同一 ----
# LLM 非駆動の routine 実行に「人間らしいランダム性」を実証値で較正して注入する。摂動は専用 stream
# (motif/jitter_time/detour/interrupt/gumbel)にだけ載せ、既存 routine の乱数(choose_destination 等)の
# draw 順は汚さない(crowd/curfew/media が確立した作法)。入力は物理量・時刻・活動種別のみ(因子・k を
# 見ない=no-fingerprint)。追加 LLM 呼はゼロ=呼数 k 非依存。
# R1: enabled=false で新 stream を一切引かず・detour/interrupt 0 件=ゴールデン L1 バイト一致。
# 較正ターゲット(interstitial-life §4.1): 日次逸脱 25〜35% / per-move 寄り道 10〜20% / 予測可能性≈93%。
routine:
  stochastic:
    enabled: false              # ★本番はユーザー判断で ON。false=現行の決定論 routine と完全同一
    # ---- L1 骨格 motif(stream "motif"): 朝1回、その日の行動骨格を確率抽選 ----
    novelty_prob: 0.15          # 「いつもと違う一日」を引く確率(1-これ=routine 日)。Schneider: 17motif で90%
    novelty_scale: 1.6          # novelty 日に L2/L3 の強度(ジッター幅・逸脱率)へ掛ける倍率
    # ---- L2 時刻ジッター(stream "jitter_time"): flexible 活動の開始/継続を一様 ±jitter_min ----
    jitter_min: 30              # 片側幅(分)。MATSim mutationRange=1800s=±30分・一様・affectsDuration。fixed アンカーは不変
    # ---- L3 逸脱イベント(stream "detour"/"interrupt"): 活動種別で確率可変(mandatory 低・discretionary 高)----
    detour_prob:                # per-move 寄り道確率(目的地手前で近傍 POI に立ち寄り)
      mandatory: 0.05
      maintenance: 0.12
      discretionary: 0.18
    detour_radius_m: 300        # 寄り道先を探す現在地の近傍半径(m)。周辺スポット密度がそのまま重みになる
    interrupt_prob:             # 滞在中の活動を途中で中断=離脱する確率/step
      mandatory: 0.0
      maintenance: 0.06
      discretionary: 0.10
    # ---- Gumbel ロジット化(stream "gumbel"): 行き先 argmax を U=V+ε の確率選択へ置換(ON 時のみ)----
    gumbel:
      enabled: false            # true で自由時間の行き先選択を Gumbel-max 化(温度は活動3分類で固定)
      temperature:              # 低温=いつもの行き先(≒決定論)/ 高温=多様化(気まぐれ)
        mandatory: 0.3
        maintenance: 0.8
        discretionary: 1.5

# ---- プロンプト調整(改善 P3 第9バッチ。既定 OFF=注入なし=バイト一致)----
# 発話の定型化対策(sim-improvement-analysis.md P3: 冒頭句「この時間の渋谷…」が発話の5〜9.5%)。
# ON で social/reply/solo の状況文に「決まり文句で始めない」注意書きを1行足す(内容のみ=呼数不変=R1)。
prompts:
  variety_hint: false           # ★ON 推奨(本番): true(実LLM の発話多様性を上げる)
  reflect_variety: false        # 第20バッチ検収=belief の25%が雛形復唱(「今日の経験から〜」で始まる定型文)
                                # への対策(A4)。ON で内省プロンプトの belief 説明を個体×日で 4 バリアントの
                                # 決定論ローテーション(_stable_hash 選択=乱数不使用)+「決まり文句で始めない」
                                # 1行を追加。バリアントは意味等価・JSON契約キー不変・呼数/発火は不変(R1)。
                                # 既定 OFF=内省プロンプトが現行とバイト一致=ゴールデン不変。★ON 推奨(本番): true
  # ---- ナラティブ補間(P2 S2。docs/plans/p2-interstitial-design.md §1 S2)。既定 OFF=バイト一致 ----
  # ON 時: 各 LLM 発火(計画/発話/内省)のプロンプトに、前回発火以降のその個体の客観的な出来事
  # (立ち寄った場所・会った人・起きたこと)を機械ダイジェスト(意味づけしない列挙)として1行注入する。
  # 意味づけ(なぜ印象に残ったか)は夜内省の LLM に委ねる二段構え。追加 LLM 呼はゼロ=呼数 k 非依存。
  # ダイジェストは実行時バッファ(有界=最大30件のリングバッファ)から決定論で生成し、記録は増やさない。
  # OFF 時は1行も足さない=ゴールデン(golden_baseline_l1.json)を守る。切替は主計画者が production 側で行う。
  interstitial:
    enabled: false

# ---- 交通機関: タクシー+簡易バス(ユーザー要望 2026-07-06)----
# 電車の高度化(GTFS 実ダイヤ・駅構内)は API 申請待ちのため保留(transit.gtfs_dir 参照)。
transit_ride:
  taxi:                         # 既定 ON。遠距離かつ所持金があれば低確率で乗車。自家用車保有者は使わない
    enabled: true
    prob: 0.15                  # 条件成立時に乗る確率(stream("taxi", id, step))
    min_dist_m: 600             # 直線距離がこれ超で候補(近距離は徒歩/自転車)
    base_fare: 500              # 初乗り(円)
    per_km: 400                 # 距離運賃(円/km)。運賃 = base_fare + per_km × 距離km
  bus:                          # 既定 OFF = 本番トグル。合成/簡易路線での短縮移動+運賃
    enabled: false
    fare: 230                   # 運賃(円)
    stop_radius_m: 100          # 出発/目的ノードが停留所からこの距離内なら乗車可
    headway_steps: 1            # 便の間隔(step。1 step = 10分)
  # ---- 実バスダイヤの静的表 v-Ride-2(既定 OFF=従来の簡易バス近似のまま=バイト一致)。
  #      正典: docs/research/sumo-live-transit.md §3(静的表推奨=SUMO を回さない軽量版)。
  #      ON 時(bus.enabled も要): scripts/build_bus_table.py が GTFS から吐いた実ダイヤ静的表を読み、
  #      出発/目的が停留所 access 圏内なら「次便の待ち時間 + 区間所要」を実ダイヤ近似で乗車に反映する
  #      (到着 step が実際に変わる=別ゴールデン)。ride payload に wait_s/ride_s を追記。運賃は既存のまま。----
  bus_table:
    enabled: false
    path: data/odpt/bus_table_shibuya.json   # build_bus_table.py の出力(停留所・系統・発時刻・区間所要)
    access_radius_m: 150        # 出発/目的が停留所からこの距離内なら乗車可(実ダイヤ近似の access 圏)
  # ---- SUMO ライブ連成タクシー配車 v-Ride-1(既定 OFF=SUMO プロセスを一切起動しない=完全従来挙動=
  #      ゴールデン L1 バイト一致)。正典: docs/research/sumo-live-transit.md / traffic-indirect-effects.md。
  #      ON 時: エージェントが taxi を選んだ瞬間だけ SUMO(taxi device・dispatch=traci)へ予約を注入し、
  #      配車待ち wait_s / 乗車時間 ride_s を到着 step の追加待ちへ量子化する(到着 step が実際に変わる=
  #      別ゴールデン)。乗車判断は既存の非LLM _ride_extra のまま=LLM 呼数を1本も足さない(k 非依存)。----
  live:
    enabled: false
    backend: traci              # traci=実 SUMO(TraCI) / mock=純関数ブリッジ(SUMO 不要・テスト用)
    n_taxis: 8                  # taxi fleet 台数(ソート済みエッジへ決定論配置)
    seed: 42                    # SUMO seed(固定・--random 禁止=決定論)
    max_wait_s: 900             # この秒内に配車できなければ未配車(捕まらない)=徒歩フォールバック
    net: null                   # 車道網 net.xml(null=runs 配下の *_car.net.xml を自動探索)
    # ---- 相乗り・並行配車 v-Ride-3(既定 OFF=v-Ride-1 と完全同一=単発配車のみ・shared キー無し)。
    #      ON 時: 同 step の複数予約を id 昇順で処理(並行配車)し、近接・同方向・回り道上限内の予約を
    #      capacity まで 1 台に束ねる(我々の決定論 greedyShared)。ride payload に shared(同乗者数)を追記。----
    shared:
      enabled: false
      capacity: 3               # 1 台に相乗りできる上限人数
      max_detour_ratio: 1.4     # 相乗りで許容する回り道の上限比(SUMO relLossThreshold 相当)

transit:
  file: data/transit_shibuya.json  # 定刻ダイヤ(乱れなし)。GTFS 実ダイヤに差し替え可
  gtfs_dir: null                # ODPT 等の GTFS(stops.txt 等)を置いたフォルダを指定すると実ダイヤに切替

lod:
  max_llm_per_step: 300         # LLM 発火の step 上限(実機実測で更新)
  congestion_surprise: 0.5      # 混雑係数がこれ未満なら「驚き」
  # ---- 予算のN比例化(P2-S6a・既定OFF=バイト一致)。docs/plans/million-scale.md §2.3 ----
  # 全員思考の「200体相当の思考密度をNに比例して維持」: ON で step 上限を
  # ceil(density × run.n_agents) に置換(固定 max_llm_per_step は使わない)。
  # density=0.15 は 200体較正 day1 実測(4,293呼/144step/200体)。P3 ローテーション導入後は
  # N を「思考層の在場数」に差し替える(presence ゲートとセットで拡張)。
  n_proportional:
    enabled: false
    density: 0.15
  # ---- 入力解像度LOD(第30バッチ・既定OFF=バイト一致)。docs/plans/input-resolution-lod.md ----
  # 「世界に対する解像度」の個体差: 知覚/記憶/フィードの注入件数を水準別に振る(呼数不変=R1安全)。
  # 割当は cognition/lod.py の共通軸機構(trait非依存・軸専用 stream "lod_input_res")。
  # levels 省略時は lod.py の既定(narrow/mid/wide・mid=現行定数。beliefs と全員共通行は対象外)。
  input_res:
    enabled: false

# ---- ペルソナプール / 日次ローテーション(W2 P3・既定 OFF=run.n_agents 固定=ゴールデンバイト一致)----
# docs/plans/w2-execution-plan.md §4 P3 / docs/plans/persona-pool.md §5「presence 純関数」・§9。
# enabled=true で 100万ペルソナプール(data/persona_pool: L1-L5 シャード + meta.json)から日ごとに
# 「今日この街にいる人(present)」を決定論選択し、いない人はドーマント化(コストゼロ・記憶保持)。
# 再来街時は同一実体として記憶が続く。presence は stream("presence", persona_id, day) の純関数
# (k 非依存・trait 非依存・resume 不変)。false=現行の run.n_agents 固定=挙動バイト一致(掟)。
# ON 時は S6a の N 比例 cap の N を「当日の在場数 len(sim.agents)」に自動で差し替える。
pool:
  enabled: false
  dir: data/persona_pool     # P5 生成物(L1-L5 シャード + meta.json)のルート
  present_cap: 300           # 日次の総在場数の上限(層優先で充足)。ON 時は N=在場数
  dormant_cap: 0             # ドーマント退避ストアの上限(0=無制限)。>0 で LRU 退避(有界=persona-pool §3.3)

# ---- LLM一括発行(P2-S6b・既定OFF=バイト一致)----
# 個体間で独立なLLMフェーズ(朝計画。夜内省は次段)を「build id順→未命中のみ並行発行→
# id順apply」に切替。イベント列・カウンタ・キャッシュは逐次と完全同一(test_batch_llm)。
# 実LLMサーバでは並行発行が継続バッチングを充填=スループットがper-callレイテンシから解放。
engine:
  batch_llm:
    enabled: false
    workers: 8                # 並行発行数(実LLM時。mock/1では逐次=同一経路)

# ---- 方針キャッシュ(P2-S7・既定OFF=バイト一致)。docs/research/interstitial-life.md §4.4-b ----
# 朝計画・日中熟慮の出力を k 非依存の物理量キー(職業/年代/曜日型/時間帯/場所種別/天気/活動cat)で
# キャッシュし、類似状況の再訪で LLM 呼をスキップ。本番採否はブラインドA/B比較で決定(既定OFF運用)。
cognition:
  policy_cache:
    enabled: false
    reuse_rate_cap: 0.6   # 再利用の確率ゲート兼ハード上限(多様性の下限を保証)
    per_agent_max: 16     # 個体あたりキャッシュ上限
    global_max: 4096      # 全体 LRU 上限
    max_relax: 2          # near-match 緩和の最大段(0=完全一致/1=+場所種別/2=+時間帯)

# ---- 開放行動+価値の4軸(第17バッチ 2026-07-10。既定 OFF=現行と完全同一)----
# LLM 自身が自由記述で行動を決める "do" をメニューに追加し、価値(実用/感情/社会/認識)で
# 観測する(決定論辞書+中立自己申告のブレンド)。接地: docs/research/desire-value-theory.md。
freedom:
  open_actions: false           # "do" 行をヘッダに足す(OFF=ヘッダ・挙動バイト一致)
  satiation_gain: 0.3           # 価値の飢餓→ゲージ感度の変調幅(0=純観測。k掃引では0推奨)
  sat_step: 0.15                # 自由行動1回の充足量(限界効用逓減つき)
  sat_decay: 0.15               # 日次の中立(0.5)への回帰率(需要の再蓄積)
  max_minutes: 240              # 1回の開放行動の上限時間(分)
  # ---- 生活の自己決定 P2(D3 棚卸し。docs/plans/agent-freedom-plan.md #6-#10。既定 全 OFF=バイト一致)----
  # 5項目を個別 bool で切る(中立メニュー提示+決定論裁定=R1 呼数不変)。ON 化はユーザー判断(daily/production は触らない)。
  p2:
    move_home: false            # #6 空き住戸への転居(敷金=現金障壁)
    buy: false                  # #7 発火時の消費意思(非発火の buy 抽選はフォールバックで残す)
    study: false                # #8 学校/図書館での聴講(記録のみ。賃金経路は Skill 討議後)
    partnership: false          # #9 交際の申込/別れ(相手側の応答は将来拡張)
    deviance: false             # #10 無許可出店(既存 enforcement が近傍で摘発)
    deposit: 50000              # #6 引っ越しの敷金(1ヶ月分の家賃相当の現金障壁)
    deviance_fine: 5000         # #10 無許可出店の摘発時の罰金(既存 enforcement 機構に接続)
    partner_closeness: 15.0     # #9 交際成立の closeness 閾値(household 既定と同値。household OFF 時の後退値)

# ---- 主観的世界モデル(第20バッチ 2026-07-12。既定 OFF=現行と完全同一)----
# 各エージェントの「世界の解釈」: C1 期待形成(場所×時間帯の人出EMA=検証可能な仮説)+
# C2 可制御性(全員0.5起点・世界の応答だけで分岐=純経験の経路依存)+ C6 規範予期
# (新しいことを始める人がいる街かの記述規範)。日次 worldview イベントで観測。
# 乱数ゼロ・呼数不変。接地: docs/research/world-models.md C1/C2/C6。
worldview:
  enabled: false
  crowd_alpha: 0.2              # C1: 期待EMAの学習率
  expect_line: true             # C1: 「いつもと違う」1行(差が gap_min 以上のときだけ)
  gap_min: 3.0                  # C1: 期待との人数差の閾値
  ctrl_line: true               # C2: 手応え/無力の自然文1行(閾値超えのみ)
  ctrl_step: 0.15               # C2: 世界の応答1件あたりの更新幅(限界効用逓減)
  weak_scale: 0.3               # C2: 弱い応答(売上・閲覧・参加・賛同)の倍率
  ctrl_hi: 0.7                  # C2: これ以上で「手応え」文
  ctrl_lo: 0.3                  # C2: これ以下で「無力」文
  ctrl_daily_strong: 2          # C2: 強い応答の日次計上上限(応答洪水での全員天井=飽和を防ぐ)
  ctrl_daily_weak: 3            # C2: 弱い応答の日次計上上限
  norm_line: true               # C6: 記述規範1行(全員共通)
  norm_window_days: 7           # C6: 開拓的行動(出店・提案・主催・結成)の集計窓
  norm_hi: 0.02                 # C6: 1人日あたり率がこれ以上で「珍しくない」
  snapshot: true                # 日次 worldview イベント(観測の要)

# ---- 群のオントロジー(文化圏×経験の世界観共有群。2026-07-21。既定 OFF=属性なし=バイト一致)----
# 「地震に慣れた人と、地震をほとんど経験しない旅行者では行動が大きく異なる」という外部助言を受け、
# 各エージェントに「文化圏×経験」の群を1つ割り当てる。割当は安定ハッシュ(seed, persona id)=run.seed
# 非依存(同一設定なら全ランで同一人物は同一群=比較実験の要)・乱数ゼロ・traits/k 非参照(因子と直交)。
# 行動分岐はルールで書かず、群の「経験の事実」1行(groups.*.line)だけをプロンプトに注入して LLM に委ねる
# (nature-like 方針)。群の割合(composition)を振る A/B で「地震慣れ層の割合→街の反応」を精密に予測する。
# 本番 ON はユーザーが割合を決めてから(daily/production は触らない=既定 OFF のまま)。
ontology:
  enabled: false                # 既定 OFF=属性なし・プロンプト不変=ゴールデン L1 バイト一致
  seed: 20260721                # 群割当の安定ハッシュ種(run.seed と独立=ラン間で同一人物は同一群)
  groups:                       # 群の定義はデータ駆動(基盤コードに文化名・地名リテラルを書かない)
    jp_metro:   { label: "都市圏在住の日本人",   line: "長く都市部で暮らし、地震や混雑した街には慣れている。", quake_exp: high, city_exp: high, ja: native, drill_exp: high, drill_line: "避難訓練には何度も参加したことがあり、揺れたらまず身を守り指定ルートで動く手順が身体に染みついている。" }
    jp_other:   { label: "国内他地域からの来街者", line: "国内の別の地域から来ており、地震には慣れているがこの街の土地勘は薄い。", quake_exp: high, city_exp: mid, ja: native, drill_exp: high, drill_line: "毎年の避難訓練で手順は身体に入っているが、この街の避難経路や集合場所には不慣れだ。" }
    asia_visit: { label: "アジア圏からの旅行者",  line: "海外からの旅行者で、大都市には慣れているが地震の経験は少なく、日本語は限定的だ。", quake_exp: low, city_exp: high, ja: partial, drill_exp: low, drill_line: "避難訓練にはほとんど参加したことがなく、いざという時にどう動けばよいか自信がない。", wv_offsets: { controllability: -0.05 } }
    west_visit: { label: "欧米圏からの旅行者",   line: "海外からの旅行者で、地震をほとんど経験したことがなく、日本語はほぼ話せない。", quake_exp: none, city_exp: mid, ja: none, drill_exp: none, drill_line: "避難訓練を受けた経験がほとんどなく、非常時の手順や標識の意味がすぐには分からない。", wv_offsets: { controllability: -0.1 } }
  # 層別の群構成比(合計は正規化されるので厳密に 1.0 でなくてよい)。tier は P3 presence の実層名:
  #   resident / duty / workday_shift / cadence / stochastic(world/presence.py)+ 直接ラン用 default。
  composition:
    resident:      { jp_metro: 1.0 }                                              # L1 住民/L5 議員
    duty:          { jp_metro: 1.0 }                                              # L5 役割(駅員/運転士/警察/配信者)
    workday_shift: { jp_metro: 0.85, jp_other: 0.15 }                             # L2 域内従業者
    cadence:       { jp_metro: 0.7,  jp_other: 0.3 }                              # L3 定期来街(学生/常連)
    stochastic:    { jp_metro: 0.45, jp_other: 0.40, asia_visit: 0.10, west_visit: 0.05 }  # L4 非定期来街
    default:       { jp_metro: 0.8,  jp_other: 0.2 }                              # プール非使用の直接ラン(n_agents 生成)用
  # ---- 防災訓練経験(方式A。第41バッチ 2026-07-21)。文化圏群の drill_line を別行として付加する
  #      (既定 line は不変=将来 ON でも割当は変わらない)。enabled で訓練句を入/切=A/B に使う。
  #      根拠: 事前の避難訓練参加者は非参加者より避難率が高い(調整 OR=1.99, 東日本大震災 2,314名)。
  drill:
    enabled: true               # ontology ON 時に文化圏群の訓練経験1行を注入(false で行を消す=割当不変)
  # ---- 直交する第2軸(方式B。第41バッチ)。文化圏軸と真に独立な軸を別名前空間で持つ。軸ごとに
  #      独立ハッシュ(_stable_uniform(seed + seed_offset, pid))で割当=同一 pid でも文化圏群と
  #      無相関(直交)。既定 OFF・軸未指定は現行と完全同一(assign_group は axes を読まない)。
  #      第1軸=info_behavior(情報行動・情報源信頼)。根拠: 災害情報の入手手段が 18-29歳 SNS 76.6%>
  #      TV 73.8%・70歳+ TV 91.9%(内閣府 防災世論調査)=年代で SNS→公式へ勾配。年齢は人口統計 P0
  #      属性で traits/k と独立=R1 直交。ステレオタイプ断定を避け「一人称の行動の事実」で書く。
  axes:
    info_behavior:
      seed_offset: 101          # 文化圏軸(seed のみ)と独立なハッシュ=軸間の割当は無相関
      groups:                   # 断定(「若者は〜」)でなく一人称の行動の事実(文言は config 由来)
        info_sns:      { label: "SNS一次情報を頼る人", line: "気になることがあると、まずスマホで現地の投稿や短い動画を探して状況をつかもうとする。" }
        info_mixed:    { label: "両方を使い分ける人",   line: "気になることは、まずスマホで調べつつ、大事な判断はテレビや公式の知らせでも確かめる。" }
        info_official: { label: "公式・放送を頼る人",   line: "大事な知らせは、テレビや駅・行政のアナウンスで確かめてから動く習慣がある。" }
      bands:                    # 年代条件付き構成比(agent.age がある時に優先・キー=年齢下限)。SNS→公式へ勾配
        0:  { info_sns: 0.60, info_mixed: 0.30, info_official: 0.10 }   # ~29: SNS 優位(内閣府。下端で全若年を捕捉)
        30: { info_sns: 0.45, info_mixed: 0.35, info_official: 0.20 }   # 30-44
        45: { info_sns: 0.30, info_mixed: 0.35, info_official: 0.35 }   # 45-59
        60: { info_sns: 0.15, info_mixed: 0.20, info_official: 0.65 }   # 60~: 公式/放送 優位
      composition:              # age 不明時の全体分布(tier 別に振れる)。渋谷=若年濃い
        default: { info_sns: 0.45, info_mixed: 0.30, info_official: 0.25 }
    # ---- 第3軸=同行者構成(単独/連れ)。第42バッチ 2026-07-21。文化圏・情報行動いずれとも直交。
    #      根拠: 2人組は単独より約30%遅い・合議による避難開始遅延・はぐれ待ち(Moussaïd 2010 ほか)。
    #      準静的=当日の同行者構成 (pid, day) の純関数(day_varying=true で day を混ぜる=日ごとに
    #      変わるが決定論・run.seed 非依存)。プールの party_size(L4 来街者に実在=同行人数)がある個体は
    #      party_map でデータ駆動に確定(ハッシュ不要・day 非依存で固定)。無い個体(住民/従業者等)は
    #      tier 別 composition。将来 seam: S-R3 共同行動エンジンが承認されたら pair/group が実同伴者と結ぶ。
    companions:
      seed_offset: 202          # 文化圏軸(seed)・info_behavior(seed+101)と独立なハッシュ=軸間直交
      day_varying: true         # 同行者構成は日単位で変わりうる=day を混ぜる(同一 day=同一割当=resume 安定)
      party_map:                # party_size(実人数)→群 id。データ駆動・最優先(ハッシュ不要・固定)
        "1": solo               # キーは文字列(config_hash の JSON sort_keys が混在型キーで壊れないため)
        "2": pair
        default: group          # 3人以上(party_size>=3)
      groups:                   # 「一人称の行動の事実」規律(配偶断定なし・自分で改善可・断定禁止)
        solo:  { label: "単独で動いている人",        line: "今日は一人で動いている。" }
        pair:  { label: "連れと2人で動いている人",    line: "今日は連れと2人で動いていて、行き先は相談しながら決める。" }
        group: { label: "3人以上のグループで動く人",  line: "今日は3人以上のグループで動いていて、はぐれないよう互いを気にかけている。" }
      composition:              # party_size 不明の個体(住民/従業者/L3常連)の tier 別構成比
        resident:      { solo: 0.82, pair: 0.15, group: 0.03 }   # 住民=単独支配
        duty:          { solo: 0.90, pair: 0.08, group: 0.02 }   # 役割従事(駅員/運転士等)=単独支配
        workday_shift: { solo: 0.80, pair: 0.16, group: 0.04 }   # 域内従業者=単独支配
        cadence:       { solo: 0.55, pair: 0.33, group: 0.12 }   # L3 定期来街(学生/常連)
        stochastic:    { solo: 0.30, pair: 0.46, group: 0.24 }   # L4 非定期(連れ厚め=女友達同伴54%と整合)
        default:       { solo: 0.55, pair: 0.30, group: 0.15 }   # プール非使用の直接ラン用

# ---- 街路の環境情報(第18バッチ 2026-07-11。既定 OFF=現行と完全同一)----
# 街頭広告(OOH)=掲出地点の視認判定→ad_exposure+発火時の中立1行(広告主=シミュ内 POI で
# 接触→来店→購買のファネルが閉じる)。効果量の接地: docs/research/commercial-analytics.md §7。
# 掲出地点(large/slots)は環境プロファイル側で与える(基盤=機構のみ・場所の値を持たない)。
ads:
  enabled: false                # OFF=draw・イベント・プロンプトとも既定と不変
  large: []                     # 大型ビジョンの掲出地点(POI 名)
  slots: []                     # 通常看板の掲出地点(POI 名)
  radius_m: 60.0                # 掲出地点からの視認距離(m)
  p_see_large: 0.45             # 大型の視認率(現実バンド 0.3〜0.6)
  p_see_normal: 0.20            # 通常看板の視認率(0.1〜0.3)
  cooldown_steps: 6             # 同一枠の再接触の最短間隔(6step=1時間)
  daily_cap: 4                  # 1人1日の接触記録上限
  recall_steps: 144             # プロンプト注入の想起窓(1日=adstock 近似)
  eff_frequency: 3              # 有効フリークエンシー(累計これ以上で「何度も」)
  campaign_days: 7              # キャンペーン改定周期(日)
  target_cats: [food, cafe, shop, leisure, nightlife]   # 広告主になれる POI カテゴリ
crowd_visual:
  enabled: false                # 群衆の視覚情報1行(同席者の決定論要約=記述的規範)。OFF=不変

# ---- エージェント視覚 v1: 顕著性駆動の POV 画像(休眠・全プロファイル OFF)----
# 設計: docs/research/agent-vision.md §4 v1。本番初日に採否決定=当面 OFF のまま。
# 骨格のみ配線: 顕著性ゲート(客観量のみ=R1: k 由来量・traits は絶対に入れない)→ CPU 決定論
# POV レンダ(viz/render_pov.py・同一入力→同一バイト PNG)→ サイドカー画像ストア(runs/<name>/pov/)+
# pov_image イベント参照キー。専用 stream "pov_salience" 1 本のみ(既存 draw 順に挿入しない)。
# 追加 LLM 呼はゼロ(VLM は別 tier=text LLM 呼数に非依存)。既定 OFF=stream を引かず・
# イベント 0 件・画像 0 枚・agent に新フィールドを生やさない=バイト一致(ゴールデン維持)。
pov:
  enabled: false
  salience:                     # ゲートは客観量のみ(物理位置・訪問履歴・世界イベント現場・人数)
    first_visit: true           # 初訪問ノードで発火候補
    crowd_min: 12               # 近傍(同席者)人数がこれ以上で発火候補
    world_event: true           # 世界イベントの現場(当 step の world_event/disaster 等)で発火候補
    prob_cap: 0.05              # ゲート通過者のうち実際に撮る確率上限(stream "pov_salience")
  render:
    width: 96                   # POV 画像の幅 px(低解像度セマンティック)
    height: 72                  # 高さ px
    fov_deg: 90.0               # 水平画角
    max_dist_m: 200.0           # レイキャストの最大距離
  store:
    enabled: true               # runs/<name>/pov/ に PNG を保存(pov.enabled=false なら無効)
    dir: pov                    # サイドカー画像フォルダ(out_dir 相対)
  vlm:
    backend: none               # none | mock | <実VLM>。stub 配線(実 VLM は本選 Day-0)。
                                # mock はテストで経路を通すだけ(text LLM 呼数に影響しない)

sns_geo:
  enabled: false                # SNS/DM 伝播に両者の物理距離 dist_m を記録(第22バッチ P2)。
                                # ON でも乱数・LLM呼数は不変(transmission payload にキーを足すだけ)。OFF=バイト一致

labeling:
  mode: constrained             # constrained | open(D9)
  adopt_threshold: 2            # complex contagion: 2回聞いたら採用

rewards:
  enabled: false                # D9: 既定 off(過正当化の交絡を排除)
  amount_per_adoption: 300      # enabled 時、自分の造語が採用されるたび creator に与える報酬額(円)

# ---- 記憶(P2 seam。既定は日常 push のみ=現状不変)----
memory:
  agentic_pull: false           # 発火・内省で能動的に記憶検索する(true でプロンプトに1行想起を追加)
  relations_max: 0              # B6(スケール): 関係台帳の上限件数。>0 で超過時に LRU(last_step 最古)を退避。
                                # 0=無制限で従来と完全同一。大規模ラン(hub 個体の台帳肥大・checkpoint 膨張)対策。

# ---- 社会関係の質(現実ギャップ Wave G2 2026-07-07。既定 OFF=現行挙動と完全同一)----
# ON 時: 関係台帳に親密度 weight(closeness)を持たせ、交流の符号(発話/DM の感情価)で増減。
#   weight の閾値で質的段階 tier(0=見知らぬ/1=知人/2=友人/3=親友)を決定論導出し、プロンプトに
#   「○○とは友人」と載せる。ネガ交流・長期不在(日次減衰)で weight が下がり段階が落ちる
#   (relation_tier/relation_break)。各 agent の評判(reputation)を語の採用・被傾聴で集計し
#   「街で名が知られている」1行に反映(reputation_update)。同じグループ所属は「同じ仲間」注記。
#   すべて決定論・RNG不要・LLM 非増(R1)。tier/reputation は efficacy/grievance 等の因子には
#   結合しない(独立の観測スコア+プロンプト文脈)。OFF 時は closeness を一切足さず・イベント
#   0 件・プロンプト不変=ゴールデン(golden_baseline_l1.json)を守る。
relations:
  enabled: false                # ★ON 推奨(本番): true(関係の質=社会資本を有効化)
  tier_acquaintance: 2.0        # closeness weight がこれ以上で知人(tier 1)
  tier_friend: 5.0              #   〃           友人(tier 2)
  tier_close: 12.0             #   〃           親友(tier 3)
  pos_weight: 1.0               # ポジ交流(感情価≥0)1件あたりの weight 増分
  neg_weight: 2.0               # ネガ交流(感情価<0)1件あたりの weight 減分(悪化は速い)
  decay_per_day: 1.0            # 長期不在の相手の weight を1不在日ごとにこれだけ減衰
  decay_after_days: 0           # 最終接触からこの日数を超えた不在で減衰(0=翌日から)
  rep_adopted: 1.0              # 自分の造語が採用されるたび評判+(影響の可視化)
  rep_mention: 0.2              # 聞き手のいる発話をするたび評判+(社会的可視性)
  rep_decay_per_day: 0.5        # 評判の日次風化
  rep_known_threshold: 3.0      # 評判がこれ以上で「街で名が知られている」文脈をプロンプトに
  faction: true                 # 同じグループ所属を「同じ仲間」1行に(軽量。重い分極は後続波)

# ---- 友人グラフ生成(関係性パッケージ完結 第45バッチ S-R2。ユーザー要望 2026-07-21。既定 OFF=現行挙動と完全同一)----
# 現状の初期関係は「同建物の顔なじみ最大3人」のみ=地理的共在だけが源泉。本ブロックは起動時1回、居住者の
# 現実的な友人ネットワークを決定論で張る: homophily(McPherson: 年齢>職業)+共有所属(同 work org_id=
# 職場友人34.0% / 学生同士=学生時代友人31.6%)+同地区近接、次数は Dunbar の入れ子層(親友~3-5=tier3 /
# 友人~10-15=tier2 / 知人=tier1)で較正して relations の closeness/tier(閾値 2.0/5.0/12.0)へ直接注入する。
# 実装 src/society/friends.py(較正値・所属ロジックはここと friends.py にのみ=no-fingerprint 契約)。
# 決定論・run.seed 非依存: 辺は (persona id ペア, seed) の安定ハッシュ+属性の純関数=乱数 stream ゼロ
# (RngHub 無風)=別ランでも同一人物ペアは同一の間柄(比較実験の要)。来街者は対象外(圏外=household と整合)。
# 既定 OFF=何も張らず・relations 台帳不変・friend_graph_built も出さない=バイト一致(ゴールデンを守る)。
friend_graph:
  enabled: false                # ★ON 推奨(本番): true(現実的な友人ネットワークを有効化。要 relations.enabled=true で質が活きる)
  seed: 20260722                # 安定ハッシュ種(run.seed と独立=別ランで同一人物ペアは同一辺)
  w_age: 1.0                    # homophily 年齢近接の重み(McPherson で最強)
  w_occ: 0.5                    # homophily 職業一致の重み(年齢の次点)
  w_same_work: 1.2              # 共有所属: 同 work org_id(職場友人34.0%)
  w_same_school: 1.0            # 共有所属: 学生同士かつ同 org_id(学生時代友人31.6%)
  w_same_area: 0.4              # 同地区近接(同一住宅建物=近所)
  age_scale: 15.0               # 年齢差の正規化スケール(歳。この差で年齢類似度が 0)
  noise: 0.3                    # スコアの決定論ノイズ幅(タイ破り・多様性=run.seed 非依存)
  close_min: 3                  # 親友層(tier3)の下限次数(Dunbar 支援クリーク~5)
  close_max: 5                  # 親友層の上限次数
  friend_min: 7                 # 友人層(tier2)の追加次数下限(親友+友人で~10-15)
  friend_max: 12                # 友人層の追加次数上限
  acq_extra: 20                 # 知人層(tier1)の追加次数(弱い紐帯を薄く)
  margin: 0.5                   # 注入 closeness の上乗せ(閾値+margin=その tier に確実に載る)

# ---- 社会的ヒエラルキー(地位・信用・名声。第11バッチ 2026-07-08。既定 OFF=現行挙動と完全同一)----
# 調査: docs/research/hierarchy.md(採択候補 #2 観測 + #1 評判→動員 + #3 優先的選択)。
# 理論: マタイ効果/累積優位(Merton, DiPrete)= 信用のある人に人とリソースが集まる正のフィードバック。
#       優先的選択(Barabási)= 既に多く繋がる相手へ優先接続=べき則/ハブの創発。威信=prestige(Henrich)。
# ON 時: 客観カウント(評判/被フォロー数/資産/提案可決数/売上/主催回数)の母集団内百分位を重み混合して
#   各 agent の合成地位 status(0..1)を日次再計算(決定論・非LLM・k 非参照)。地位は既存確率の変調のみに
#   使う: イベント集客(+attract_gain×主催者 status)・グループ加入(同・創設者)・屋台購買(×(1+buy_gain×店主
#   status))・フィード露出(×(1+feed_gain×status)×(1+被フォロー数)=優先的選択)。★禁止(injection):
#   プロンプトへ「地位が高い/低い」注入や高地位個体の変革行動への直接誘導はしない(可視化・変換のみ)。
# OFF 時: status 一切不変(=0)・動員フックは加算0/倍率1・feed は従来 TL・L3 に status なし・L2 集計は列なし
#   =乱数消費・イベント列・スナップショットがバイト一致(ゴールデン golden_baseline_l1.json を守る)。
hierarchy:
  enabled: false                # ★ON 推奨(本番): true(地位=信用に人とリソースが集まる機構)
  attract_gain: 0.15            # イベント参加/グループ加入の確率に + gain × 主催者(創設者)status
  feed_gain: 0.3                # フィード露出重みに ×(1 + gain × 投稿者 status)
  buy_gain: 0.2                 # 屋台購買確率に ×(1 + gain × 店主 status)
  # weights(材料の混合重み)は build_status_cfg の既定に埋め込み済み(rep/followers/wealth/inst/biz/host)。
  # 上書きするなら hierarchy.weights.followers=0.4 のように指定(母集団内百分位への相対重み)。

# ---- 観測レンズ 3本(第50バッチ 2026-07-23。外部アドバイスを observable へ翻訳。既定 OFF)----
# 「読むだけ」= 行動・乱数・LLM 呼を一切増やさない(R1)。ロジックは observer 層(observer/lens.py +
# aggregate.py)と本ブロックに閉じる(engine/cognition/world/factors/actions/labeling に軸語を書かない)。
#   T1 value4:  イベント種 → 価値の4軸(utility/emotion/social/epistemic=第17バッチ values.TAGS を再利用)。
#               当日のイベント数構成を L2 の全体スカラー4列(value4_*)で観測。
#   T2 motives: イベント種 → 3M欲望(earn 儲けたい / love モテたい / recognition 認められたい)。L2 3列(motive_*)。
#   T6 trust:   status.py の合成地位スコアの材料別内訳・分布(status.material_breakdown / L2 trust_gini・trust_top10)。
# 正準の kind_map は observer/lens.py の DEFAULT_*(単一の源)。下の kind_map は「上書き」用の空マップ
# (値を書けば既定へ重なる。値を空にすればそのキーを外す)。ビューアは runs/<name>/lens_map.json 経由で写像を読む。
# enabled=false = L2 に列を足さず・サイドカーも書かず・ダッシュボードのレンズタブは非表示=ゴールデン L1/L2 バイト一致。
lens:
  enabled: false                # マスター。★ON はユーザー判断(production/daily は触らない)
  value4:
    enabled: true               # マスター ON 時に価値4軸の列・タブを出すか
    kind_map: {}                # 例: {free_action: emotion}(既定 DEFAULT_VALUE4_MAP へ上書き)
  motives:
    enabled: true               # マスター ON 時に3M欲望の列・ビューを出すか
    kind_map: {}                # 例: {venture_open: earn}(既定 DEFAULT_MOTIVE_MAP へ上書き)
  trust:
    enabled: true               # マスター ON 時に信用内訳(status 可視化)を出すか。要 hierarchy.enabled=true
  # ---- ペルソナ逸脱率レンズ(第55バッチ タスクA 2026-07-23。独立 observable。既定 OFF)----
  # エージェントが注入されたペルソナ(職業・趣味)にどれだけ従順か/逸脱するかを測る。逸脱がゼロに近いなら
  # それ自体が本シミュレーションの限界を語るデータ(world-changer 検出=k* 測定の感度の補助指標)。観測のみ。
  # 主指標=**裁量時間限定**の逸脱(義務ルーチン=勤務行動を母数から除外=水増しを避ける)。全時間版は参考。
  # 逸脱判定=行動種別(behavior_map で "@work" に落ちる kind=勤務=裁量から除外)による近似。
  # L2 全体スカラー: deviation_mean(裁量・主)/ deviation_var / deviation_top_share / deviation_fulltime_mean(参考)。
  # 住民別スコア・ドリルダウンはビューア事後計算(deviation_map.json サイドカー経由)。正準 map は
  # observer/deviation.py の DEFAULT_*(単一の源)。下の map は「上書き」用の空マップ(値を書けば既定へ重なる)。
  # enabled=false = L2 に列を足さず・サイドカーも書かず・ダッシュボードの逸脱タブは非表示=ゴールデン L1/L2 バイト一致。
  deviation:
    enabled: false              # ★ON はユーザー判断(production/daily は触らない)。lens.enabled とは独立
    top_threshold: 0.5          # 「上位逸脱者」= 裁量逸脱率がこの値以上の測定対象住民の割合(deviation_top_share)
    occupation_map: {}          # 職業→期待勤務POIカテゴリ(ドリルダウンの注記のみ=勤務系イベントにPOIカテゴリが無く厳密判定不能。既定 DEFAULT_OCCUPATION_MAP へ上書き)
    hobby_map: {}               # 職業→期待余暇POIカテゴリ列(既定 DEFAULT_HOBBY_MAP へ上書き。例 {研究員: [leisure]})
    behavior_map: {}            # イベント種→行動カテゴリ(既定 DEFAULT_BEHAVIOR_MAP へ上書き)
  # ---- 社会構造の内生変動レンズ(第56バッチ タスクB 2026-07-24。独立 observable。既定 OFF)----
  # 「強制トリガーなしで社会構造は変化するのか、固着するのか」を正面から測る。関係性の固定化が実際に
  # 起きるかを介入せず観測する(危機トリガー不採用の日常観察方針=Entry 47)。観測のみ。
  # L2 全体スカラー(当日イベント+当日母数だけで計算する軽量スカラー。前日状態をシム側に持たない):
  #   edges_formed(当日 relation_tier{tier==1}=新規紐帯)/ edges_broken(relation_break{cause=contact}=断絶)/
  #   edges_decayed(relation_break{cause=absence}=長期不在の風化)/ edge_churn_rate(=組み替え率=churn/活性関係数)。
  # 順位相関(Kendall τ)・中心性入れ替わり・コミュニティ変化・固着検知は事後層 scripts/analyze_structure.py が
  # L1(+hierarchy ON なら L3 status)から計算(コミュニティ検出=既存の決定論 LPA observer/measure.communities を
  # 再利用=新規依存なし)。ダッシュボードの「🏛 社会構造」タブは structure.json(事後層出力)が有る時だけ表示。
  # enabled=false = L2 に列を足さない=ゴールデン L1/L2 バイト一致。
  structure:
    enabled: false              # ★ON はユーザー判断(production/daily は触らない)。lens.enabled とは独立

# ---- 行動心理プラグイン(config 着脱式・すべて既定 OFF。ユーザー方針 2026-07-06)----
# 文献の数値を固定実装せず、回しながら柔軟に変える seam。OFF 時はイベント列がバイト一致で不変。
# no-fingerprint: engine/cognition は因子名を見ず、factors から不透明な倍率・スコアだけ受け取る。
psych:
  sdt:                          # 自己決定理論(Ryan&Deci): 内発/外発で欲求ゲージ入力を個人別に倍率化
    enabled: false
    intrinsic_boost: 1.4        # 内発(NFC+内的統制)高 → novel_place/unknown_word をこの倍率まで押し上げ
    extrinsic_boost: 1.4        # 外発(外的統制+リスク許容)高 → sns/addressed/company/dm_received を押し上げ
  collective:                   # 集団効力感・社会的アイデンティティ(SIMCA/Bandura)
    enabled: false
    group_success_magnitude: 0.05  # 所属グループの成功(提案成立・イベント参加)→ collective_efficacy+
    ingroup_boost: 1.2          # 同じグループのメンバーの発話を聞く → heard_valence をこの倍率
    attend_threshold: 2         # グループイベントで「成功」とみなす参加メンバー数の下限
  lynch:                        # 都市イメージ(Lynch): landmark 重み付き行き先 + 観測レンズ
    enabled: false
    landmark_weight: 1.0        # landmark_score = 1.0 + weight×(POI数 + 命名地点 + 命名建物)
  searle:                       # 制度化(Searle "X counts as Y"): 成立提案を制度としてプロンプト注入
    enabled: false
    max_recent: 2               # 発火プロンプトに載せる最新の取り決め件数

# ---- 意見力学(Friedkin-Johnsen #16)。チャネル別の説得重み。既定で有効(y_external 不変)----
opinion:
  enabled: true                 # false で意見更新を止める(opinion_shift を出さない)
  w_face: 0.20                  # 対面で聞いた話に意見が寄る強さ
  w_dm: 0.15                    # DM で受け取った話
  w_sns: 0.08                   # SNS 閲覧(弱い)

storage:
  backend: memory               # memory(開発) | redis_pg(本番)

observer:
  snapshot_every: 12            # L3 スナップショット間隔(=2時間ごと)
  checkpoint_every: 0           # D16: この step ごとに完全状態を保存+ログを part 化(0=無効)。
                                # >0 で --resume 可能に。既定0=part を作らず出力・挙動は従来と完全同一。
  flush_every_steps: 0          # B2(スケール): この step ごとに L1 ログを part 化して RAM を解放
                                # (checkpoint とは独立。0=無効で従来と完全同一)。大規模ランの OOM 回避用。
                                # checkpoint_every と同一 step では二重 flush しない。finalize で part を結合。
  y_weights: null               # Y外部(世界改変量)の4層合成重み。既定 null=合成せず列を出すのみ。
                                # ★合成式は B段でユーザーと決定(analyze 側で使用)。例:
                                # y_weights: { spatial: 1.0, resource: 1.0, symbolic: 1.0, network: 1.0 }

# ============================================================
# 第6バッチ(ユーザー要望 2026-07-06)。すべて既定 OFF=現行挙動と完全同一。
# 本番・B段での ON はユーザー承認のうえ一括で行う(ON 例は各ブロックのコメント)。
# ============================================================

# ============================================================
# 制度値 institutions(基盤モデル抽出 D1-W3。docs/plans/env-classification.md の3層設計)。
# 従来 government.py に **コード埋没** していた日本の制度値をここへ外出しした(既定=現行コード値
# =ゴールデン/本番の挙動を一切変えない)。simulation.py が institutions.build_cfg で1回正準化し、
# government(税・予算・給付)が読む。W4 の EnvPack ローダは env.yaml の institutions.pref: tokyo を
# ref/institutions_jp.yaml から解決してこのブロックへ展開する(② 共有参照 → ③ 環境固有 の橋渡し)。
# 掟(値の二重管理のズレ検知): 国・都道府県スコープの値は ref/institutions_jp.yaml と一致させる
# (tests/test_institutions.py が固定)。市区町村スコープ(区の予算・給付)は env 固有=③ として残す。
# ============================================================
institutions:
  # 所得税 実効税率ブラケット(国スコープ。額面年収レンジ→実効税率の近似=累進の圧縮)。
  # up_to=null は上限なし。年換算は日給×labor.annual_workdays。ref national.income_tax_effective と一致。
  income_brackets:
    - {up_to: 2000000,  rate: 0.02}
    - {up_to: 3300000,  rate: 0.03}
    - {up_to: 5000000,  rate: 0.05}
    - {up_to: 7000000,  rate: 0.07}
    - {up_to: 10000000, rate: 0.11}
    - {up_to: null,     rate: 0.20}
  consumption:                    # 消費税(国スコープ)。ref national.consumption と一致。
    rate: 0.10                    # 標準税率
    reduced_rate: 0.08            # 軽減税率(food系)
    national_share: 0.78          # 国:地方=78:22(地方消費税=消費税額×22/78)
    reduced_cats: [food]          # 軽減対象カテゴリ
  resident:                       # 住民税(所得割)。rate=国スコープ / ward_share=都(特別区)スコープ。
    rate: 0.10                    # 標準税率(区6%+都4%)。ref national.resident_tax.rate と一致。
    ward_share: 0.6               # 区:都=6:4。ref prefectures.tokyo.special_ward_resident_split と一致。
  labor:
    annual_workdays: 245          # 年間労働日(日給→年換算)。ref national.labor.annual_workdays と一致。
  budget:                         # 予算初期残高(円。年予算÷人口×100体スケール)。
    ward_initial: 60000000        # 渋谷区(市区町村スコープ=③ 環境固有)
    metro_initial: 65000000       # 東京都(都道府県スコープ)
    nation_initial: 92000000      # 国(国スコープ)
  benefit:                        # 区の生活困窮者支援(市区町村スコープ=③ 環境固有)。
    threshold: 2000               # 所持金がこの額未満で給付
    amount: 3000                  # 給付額

# ---- 行政 B(区/都/国の税・給付・公務員給与。調査: docs/research/shibuya-government.md)----
# ON 時: 賃金から所得税(→国)+住民税(→区6:都4)を源泉徴収(手取り支給)、消費に内税の
# 消費税(標準10%/食品8%、国78:地方22)を計上(価格の名目は不変)。区は困窮者へ給付。
# 公務員(区職員=区予算/警察官・消防士=都予算)の給与は予算から歳出。日次で public_budget。
# 制度値(税率・予算初期値・給付閾値・income_brackets)は上の institutions ブロックが供給する。
# この government ブロックは機構トグル(enabled)を持つ(個別の制度値上書きも後方互換で可)。
government:
  enabled: false                # ★ON 推奨(本番): true。公務員入り名簿 = data/personas_100_civic.json

# ---- 娯楽メディア D(TV/動画/ゲーム。文献: docs/lit/media__entertainment-effects.md)----
# ON 時: 在宅の朝/夜帯に年齢・職業別プロファイルでメディアセッション(media_use)。
# セッション中は外出・SNS閲覧を置換(時間置換)。終了時に factors.media_grievance で気分修復。
media:
  enabled: false                # ★ON 推奨(本番): true(現代生活の再現に必須=ユーザー要望)
  prompt_context: false         # 直近視聴タイトル(架空)1行を発火文脈へ(LLMキャッシュキーに影響する独立フラグ)
  start_prob: 0.5               # 在宅×時間帯の1機会あたり基礎開始確率(×年齢・職業倍率)
  min_steps: 2                  # セッション長 下限(20分)
  max_steps: 8                  # セッション長 上限(80分)
  max_sessions_per_day: 2

# ---- 組織 W2-1(職場・学校の実態。台帳: data/organizations_shibuya.json = 架空・統計準拠)----
# ON 時: 名簿対応の配属(org_assignments_*)で各エージェントに職場/学校を付与。勤務完遂→
# production(何を作った/提供したか)、学生の登校→study(何を学んだか)、プロンプトに所属1行。
# 組織会計(org_ledger)は集計のみ(市場メカニズムは B段)。仕様: docs/design-candidates/org-integration-spec.md
organizations:
  enabled: false                # ★ON 推奨(本番): true(要 agents.personas_file=data/personas_80.json 等)
  book: data/organizations_shibuya.json
  revenue_margin: 1.5           # 勤務完遂1回=日給×これ を組織収益の代理指標として集計
  commute_to_poi: false         # ★ON 推奨(本番): true(第7バッチ)。配属者の職場/学校を台帳の
                                # workplace_poi(実在ノード)へ束縛=実際にそこへ通勤・通学する。
                                # false(既定)なら work_node は上書きしない=既存挙動とバイト一致。

# ---- L2 域内従業者の「業務の実体」(work.service。既定 OFF。設計: docs/research/l2-work-reality.md)----
# 勤務中(work_node に在場・勤務時間帯)のエージェントへ「業務の実体」を与える決定論機構(LLM/乱数ゼロ)。
#  接客系(小売27%/対人サービス14.5%/飲食7%): 客の消費 spend と同一 work_node の勤務中スタッフに serve を帰属。
#  オフィス系(office 51.5%): 日次境界に「出勤者数×role重み」を org_output として集計(会社が何かを作る最小形)。
# 業務が本人に残る: serve 要約を interstitial(S2)ダイジェストに1行供給→夜内省の材料へ自然合流(ONでもLLM呼数不変)。
# 既定 OFF=イベント 0 件・状態も増やさない=ゴールデン L1 とバイト一致(R1)。業種→業務は POI カテゴリ駆動。
work:
  service:
    enabled: false              # ★ON 推奨(本番): true(L2 の業務の実体を有効化=ユーザー要望)
    serve_by_cat:               # 客の消費カテゴリ(spend.cat)→ 接客業務ラベル(業務名は config 由来)
      food: 飲食の接客
      cafe: 飲食の接客
      nightlife: 接客・サービス
      shop: 販売・レジ対応
    max_serve_per_event: 1      # 1消費あたり帰属するスタッフ数の上限(id 昇順で先頭から)
    record_unstaffed: true      # スタッフ不在の消費を agent_id=-1 の記録として残す(挙動変更なし・観測のみ)
    digest: true                # interstitial ON 時、スタッフの S2 ダイジェストに業務要約を1行供給
    office:
      enabled: true             # オフィス系の日次 org_output を出すか
      poi_cats: [office]        # オフィス系職場と見なす職場 POI カテゴリ
      base_weight: 1.0          # role 重みの既定(1人=1.0 → 産出は出勤者数に比例)
      role_weights: {}          # occupation/role → 産出重み(空=全員 base_weight)
  # ---- 職場束ね直し(第49バッチ。既定 OFF=現行の work_node 付与と完全同一=バイト一致)----
  # pool 経路の L2/L3 は occupation(role)が persona._pick_workplace の _WORK_CAT に載らないと
  # work_node を持たない=接客(serve)/産出(org_output)の帰属から漏れる(coverage の穴)。ON 時:
  # 台帳 organizations の workplace_poi.node へ org_id で直束ね(organizations.commute_to_poi の pool 版)。
  # 台帳ノードが現行地図に無い時は POI カテゴリ + 安定ハッシュで決定論マッチ(ontology 流儀)。束ねは
  # (pool_pid, 固定属性)の純関数=run.seed 非依存=hydrate 再入で同一 work_node(P3 ローテーション不変)。
  bind_workplace:
    enabled: false              # ★ON 推奨(本番): true(L2 の work_node coverage 拡大=serve/org_output の網羅率↑)
    book: data/organizations_shibuya_wide11k.json  # org_id が参照する台帳(100万プールの母体)
    rebind_bound: false         # 既に work_node を持つ個体も実 POI へ束ね直すか(既定=未束のみ=coverage 拡大に限定)
    poi_match_fallback: true    # 台帳ノードが現行地図に無い時、POI カテゴリ + 安定ハッシュで決定論マッチ
    seed: 20260722              # 決定論マッチの安定ハッシュ seed(run.seed 非依存)
    default_open: "09:00"       # 勤務窓の既定(台帳/record の shift_pattern が無い時の後退値)
    default_close: "18:00"
    occ_cat: {}                 # occupation/role → 職場 POI カテゴリ(org_id が無い層=L5 等を束ねたい時。既定=空)

# ---- 欲求プロファイルの個人差 W2-2(文献: docs/lit/needs__individual-differences.md)----
# ON 時: traits・年齢・職業から5次元の価値プロファイル(刺激/安全/関係/有能/自律)を決定論生成し、
# 欲求ゲージ入力(novel_place/congestion/silence 等)への個人別感度倍率に変換(「何を欲し・
# 何を不快と感じるか」の個体差)。R1: k 非依存(専用 stream "needs")。psych.sdt と乗算合成可。
needs:
  enabled: false                # ★ON 推奨(本番): true(現実の欲求多様性の再現=ユーザー要望)
  sensitivity_gain: 0.6         # 倍率の効き幅(1±gain×プロファイル偏差)
  profile_sigma: 0.10           # 個体固有ゆらぎ(価値プロファイルの分散)
  occupation_weight: 1.0        # 職業ニュアンスの強さ
  clip_lo: 0.5                  # 倍率下限
  clip_hi: 2.0                  # 倍率上限

# ---- 感情・興味・注意ハブ(affect。文献: docs/lit/neuroscience__emotion-interest-attention.md §5.1/§6)----
# 脳科学の核: 感情・興味・注意は独立モジュールでなく、覚醒度 arousal(1スカラ)+ 顕著さ salience(1関数)を
# 共有した1回路(Russell core affect / Menon&Uddin salience network)。最小版=非LLM・決定論・RNG不要の3改造:
#  (1) arousal スカラ(観測イベントで↑、毎step baseline へ減衰)
#  (2) novelty/arousal → memory.importance 加点(顕著記憶の符号化増強)
#  (3) salience 上位 K ゲート(同時知覚の容量制約 Cowan)+ 発火閾値の逆U字変調(Yerkes-Dodson)
# すべて既定 OFF=現行挙動と完全同一(バイト一致)。R1: 入力は観測イベントのみ(k 非依存)。ON は本番でユーザー承認のうえ。
affect:
  enabled: false               # ★ON推奨: true(感情・興味・注意を有効化)
  arousal_baseline: 0.2
  arousal_gain: 0.0            # ★ON推奨: 例 0.15(観測イベント→覚醒の上がりやすさ)
  arousal_decay: 0.1          # 毎step baseline へ戻る率(ON時のみ効く)
  importance_arousal_w: 0.0   # ★ON推奨: 例 2.0(高覚醒の出来事を顕著記憶に)
  importance_novelty_w: 0.0   # ★ON推奨: 例 1.5
  salience_k: 0               # 0=無効(全通し)。★ON推奨: 4(Cowan。同時知覚の上限)
  threshold_gain: 0.0         # ★ON推奨: 小さめ(中覚醒で発火しやすく=逆U字)

# ---- 内面本格版(現実ギャップ 後続波 H6。文献: docs/lit/neuroscience__emotion-interest-attention.md §5.2)----
# 内面を3機構で豊穣化する。すべて決定論・非LLM・既定 OFF=現行挙動と完全同一(バイト一致)。実装 src/society/inner_life.py。
#  (1) 離散感情ラベル(emotion): core affect(mood_valence × arousal)から Ekman 系ラベルを純関数写像し
#      「今は不安/高揚している」等をプロンプトへ(神経科学 §1.2 の二層設計)。★affect.enabled=true が前提
#      (arousal が動かないと無効)。ラベル変化のときだけ emotion_label を記録(sparse)。
#  (2) 長期目標(goals)★keystone 駆動源: 価値プロファイル(needs)/traits から長期目標を決定論導出し、
#      「長期的に◯◯したい」をプロンプトへ注入して行動を長期的に方向づける(現状は1日計画のみ)。long_goal を記録。
#  (3) 趣味・関心(hobbies): 職業+価値プロファイルから趣味を決定論付与→プロンプト文脈 + 余暇の行き先バイアス。
# R1: 感情/目標/趣味のプロンプト注入は内容のみ=呼数不変(FixedLLM で ON==OFF)。趣味の行き先バイアス
# (hobbies.leisure_bias>0)だけは物理位置=co-location を変えうる=呼数不変は compute_matched 下の k 不変性で担保
# (crowd G4 / 観光 H5 と同型。専用 stream "inner")。既定 leisure_bias=0.0=注入のみ(純粋 ON==OFF を保つ)。
# 既定 OFF(enabled=false)=感情ラベル更新なし・目標/趣味を付けず・プロンプト注入なし・"inner" stream も
# 引かない=イベント 0 件・乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。
inner_life:
  enabled: false               # ★master ゲート。ON推奨(本番): true(内面=感情・目標・趣味を有効化)
  emotion:                     # 離散感情ラベル(要 affect.enabled=true)
    enabled: true
    arousal_high: 0.35         # 覚醒がこれ以上=高覚醒帯(高揚/不安)。未満=低覚醒帯(穏やか/しょんぼり)
    valence_deadzone: 0.15     # |mood_valence| がこれ未満=中立(平静/高ぶり)
  goals:                       # 長期目標・人生設計(keystone 駆動源)
    enabled: true
    inject_prompt: true        # 「長期的な目標: ◯◯」を発火プロンプトへ注入
    leisure_bias: 0.0          # 現状は注入のみ(目標の行き先方向づけは趣味 hobbies 側に集約)
  hobbies:                     # 趣味・関心・サブカルチャー
    enabled: true
    inject_prompt: true        # 「趣味・関心: ◯◯」を発火プロンプトへ注入
    leisure_bias: 0.0          # ★ON推奨: 例 0.3(余暇の行き先を趣味の場所へ寄せる。専用 stream "inner")

# ============================================================
# 第7バッチ(ユーザー要望 2026-07-07: 日付・天気・通勤/通学の物理 POI 束縛)。
# 日付=world.calendar / 通勤=organizations.commute_to_poi / 天気=下記 weather。
# すべて既定 OFF=現行挙動と完全同一(バイト一致)。ON は本番でユーザー承認のうえ。
# ============================================================

# ---- 天気(第7バッチ 2026-07-07)----
# ON 時: 日次で天気を決定論生成(新 stream "weather")。全発火/計画/内省プロンプトに
# 「今日の天気: ◯、最高◯℃。」を1行注入(全員共通・k非依存)。1日の始まりに weather イベントを
# agent_id=-1 で1件ログ。calendar 有効なら月から季節バイアス(夏は高温・梅雨は雨増)を掛ける。
# 雨天の日は rain_grievance 分だけ不快感(grievance)を上げる(factors 経由・1日1回・決定論)。
weather:
  enabled: false                # ★ON 推奨(本番): true(暦とともに現代生活の再現)
  rain_grievance: 0.0           # ★ON 推奨: 0.01(雨天の日の不快感。0.0=天気イベント・文脈行のみで grievance 不変)

# ---- 長期予定・スケジュール帳(第7バッチ 2026-07-07)----
# ON 時: 会話(speak/DM)に未来の日付・時刻が入っていれば決定論パーサで抽出し、話者と
# 聞き手の双方のスケジュール帳へ自動記入(appointment イベント)。近い予定は発火・計画
# プロンプトに1行注入し、行動・発話の継続性(人間らしさ)を出す。追加 LLM 呼び出しゼロ
# (既に生成済みの発話テキストの正規表現解析)。相対日は world.calendar で絶対日に解決。
# 既定 OFF=抽出も注入もせず・appointment 0 件=現行挙動と完全同一(バイト一致)。
schedule:
  enabled: false                # ★ON 推奨(本番): true(会話からの予定抽出・スケジュール帳)
  max_items: 8                  # 1人が保持する予定の上限(超過は古い順に間引き)
  horizon_days: 14              # 何日先まで抽出・注入するか
  inject_prompt: true           # 近い予定をプロンプトに1行注入(ON時のみ効く)

# ---- 制度改変の3ルート(現実ギャップ Wave G3 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 世界改変=制度の変更には現実で3ルートある。既存の propose/rules/government を土台にした最小拡張。
# すべて決定論・非LLM(R1: FixedLLM で ON==OFF 呼数不変)。OFF 時は labor_action/vote_*/enforcement
# が 0 件・プロンプト/イベント列/乱数消費が不変=ゴールデン(golden_baseline_l1.json)を守る。
institution_routes:
  # 労働争議/組合(職域ルート): 被雇用者(organizations 配属の非学生)の propose を「労働争議」
  #   variant として記録(labor_action)。賛同/露出が同じ org の同僚に偏る集合行為。可決は既存
  #   proposal_passed 経路 or 下の投票。要 organizations.enabled=true(org_id が付く)。
  labor:
    enabled: false              # ★ON 推奨(本番): true(要 organizations.enabled=true + personas_file)
  # 選挙/投票(民主ルート): ON かつ露出者が閾値に達したとき、署名でなく決定論投票で可決を決める。
  #   各 agent は grievance が閾値超 or 提案語への opinion 整合で yes(LLM 非呼び出し)。過半数で可決。
  vote:
    enabled: false              # ★ON 推奨(本番): true(署名モードを投票モードに置換)
    grievance_threshold: 0.5    # grievance がこれ以上なら yes(不満が投票行動に出る)
    majority: 0.5               # 可決 = yes 比率がこの値を超える(既定=過半数)
    # 供託金(制度深化 第9バッチ。公選法の供託金=政治参入の所持金障壁のモデル)。既定 0=不変。
    # propose の正式受理に deposit 円の拠出が要る(払えなければ演説どまり=SNS投稿のみで受理されない)。
    # 可決 or 得票率 >= refund_share で返還、未満は没収(government ON なら区の歳入)。deposit イベント。
    deposit: 0                  # ★ON 推奨(本番): 例 30000(区議選の供託金30万円を所持金スケールに圧縮)
    refund_share: 0.1           # 返還ライン(公選法の没収ライン=有効投票の1/10 に準拠)
  # 審議・パブコメ段階(制度深化 第9バッチ。現実の「請願→パブコメ→議会審議→議決(否決可)」の最小形。
  # 調査: docs/research/rights-institutions-gap.md §H=最重要。摩擦ゼロの署名即成立を否決されうる熟議に)。
  # 署名到達で即決せず proposal_review(start)→審議 days 日のあいだ認知者の反対(決定論 no)を集め、
  # 反対 > 賛同×reject_ratio なら否決(reject+供託金没収)、でなければ approve→投票/成立へ。
  # 決定論・非LLM・乱数なし(R1)。既定 OFF=proposal_review 0 件・従来どおり即成立(バイト一致)。
  deliberation:
    enabled: false              # ★ON 推奨(本番): true(制度改変に否決可能な熟議の摩擦を導入)
    days: 2                     # 審議期間(日)=パブコメ窓
    reject_ratio: 0.5           # 否決 = 反対数 > 賛同数 × これ(審議満了時)
  # 代表制議会(制度深化3 2026-07-08。rights-institutions-gap の見送り分)。既定 OFF=露出者の
  # 直接投票のまま(現行挙動と完全同一)。ON: term_days ごとに住民(非来街者)が「意見が最も
  # 近い他の住民」に投票する決定論選挙(Downs 空間投票の最近傍形・非LLM・乱数なし)で size 人の
  # 議会を選出(council_elected)し、提案の採決は露出者でなく議会が行う(vote_cast/vote_result
  # に council 印)。直接投票と結果が変わり得る=代表制の歪みを観測できる。
  assembly:
    enabled: false              # ★ON 推奨(本番): true(要 vote.enabled=true)
    size: 9                     # 議席数(渋谷区議会34議席を100体スケールに圧縮)
    term_days: 30               # 任期(日)。満了で改選(100日ランで3期)
  # 警察/条例執行(執行ルート): 制度DSL の prohibit ルール下で、近傍(同ノード)の警察官が
  #   禁止カテゴリの場所に居る違反者を執行=罰金(区の歳入)+ grievance+(factors 経由)。
  enforcement:
    enabled: false              # ★ON 推奨(本番): true(要 rules.enabled=true + 警察官入り名簿)
    fine: 1000                  # 執行時の罰金(円)。government ON なら区(ward)の歳入へ
    grievance: 0.05             # 執行を受けた違反者の不満増分(0.0=罰金のみで grievance 不変)
    # 勾留の最小形(制度深化2 第10バッチ。逮捕→勾留→処分の「時間による自由の剥奪」を1段で。
    # 調査: docs/research/rights-institutions-gap.md §F)。執行時に違反者をその場で行動停止
    # (会話・発火・移動なし。detention イベント)。既定 0=拘束なし=従来と完全同一。
    detention_steps: 0          # ★ON 推奨(本番): 例 3(=30分の拘束)

# ---- 文化カレンダー・群集(現実ギャップ Wave G4 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 暦(world.calendar)の上に文化的リズムを載せる。ON 時: 命名年中行事(正月/ハロウィン/年末)を
# 暦の特定日に発生させ、全発火プロンプトに「今日は◯◯です。」を1行注入(全員共通・k非依存)+
# annual_event を1日1回記録。群集フラグ(crowd)のある行事日(渋谷ハロウィン)には、自由時間の
# 行き先をスクランブル交差点付近の集会ノードへ確率的に寄せ(専用 stream "crowd")、集中が閾値超で
# crowd_surge を記録する(=世界改変・規制=G3 執行 の実舞台)。要 world.calendar.enabled=true。
# 定例イベント(会場集客の外生リズム)は既存の制度DSL weekly_event(rules)に委ねる(重複回避)。
# R1: 群集は generate を1回も増やさない(行き先バイアス=移動のみ / 群集密度は発火系に接続しない)。
# 既定 OFF=event_line/annual_event/crowd_surge とも無し・乱数消費不変(ゴールデン golden_baseline_l1 を守る)。
# ---- キャリア転換(現実ギャップ Wave G5 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 生活基盤の非連続=行動と動機の転換点。既存の economy/organizations/open_venture の最小拡張。
# ON 時: 日境界で新 stream "career" から確率判定(決定論・非LLM)。
#  失業: 被雇用者(organizations 配属の非学生)が layoff_prob で職を失う=org/勤務窓/賃金クリア(自由時間 EPR へ)+
#        unemployment(lost)+job_change を記録+生活不安(grievance+。unemployment_grievance=factors 経由)。政府 ON なら
#        既存の生活保護 seam に自然に載る。
#  求職: 失業者が rehire_prob で新 org へ再就職=勤務窓・収入が復帰(unemployment(hired)+job_change)。
#  転職: 被雇用者が switch_prob で別 org へ(職場が変わる。job_change。失業と排他=失業判定を優先)。
#  起業転換: open_venture の累計売上 ≥ venture_fulltime_sales かつ開店から venture_fulltime_days 以上で、
#        所有者が本業を辞め出店を本業化(venture_fulltime)=org/本業賃金クリア・勤務地を屋台へ。
# 要 organizations.enabled=true(再配属に会社台帳が要る。失業/起業転換は org 配属が前提)。
# R1: career は generate を1回も増やさず k・内面状態を読まない(呼数は k 非依存)。ただし失業=物理位置が変わり
# 対面 co-location が変化しうる(群集 G4 と同型)=呼数不変は compute_matched 下の k 不変性で担保。
# 既定 OFF=unemployment/job_change/venture_fulltime とも無し・新 stream も引かない=乱数消費不変
# (ゴールデン golden_baseline_l1.json を守る)。
career:
  enabled: false                # ★ON 推奨(本番): true(要 organizations.enabled=true + personas_file)
  layoff_prob: 0.02             # 被雇用者が職を失う日次確率(失業)
  switch_prob: 0.02             # 被雇用者が別 org へ移る日次確率(転職。失業と排他)
  rehire_prob: 0.30             # 失業者が新 org へ再就職する日次確率(求職)
  unemployment_grievance: 0.05  # 失業時の生活不安=不満増分(factors 経由。0.0=金銭のみで grievance 不変)
  venture_fulltime_sales: 8000  # 起業転換の累計売上閾値(open_venture の売上がこれ以上で本業化。0=起業転換 OFF)
  venture_fulltime_days: 2      # 起業転換の最短経過日数(開店からこの日数以上)
  # 解雇規制の最小形(制度深化2 第10バッチ。解雇権濫用法理のモデル。調査: rights-institutions-gap.md §C)
  severance_days: 0.0           # ★ON 推奨(本番): 例 5(解雇時の退職金=日給×日数。wage source="severance")
  unfair_ratio: 0.0             # ★ON 推奨(本番): 例 0.3(解雇のうち不当解雇の割合。>0 のときのみ追加 draw)
  unfair_grievance_mult: 2.0    # 不当解雇時の生活不安(unemployment_grievance)の倍率

annual_events:
  enabled: false                # ★ON 推奨(本番): true(要 world.calendar.enabled=true)
  crowd_threshold: 8            # 集会ノード周辺(crowd_radius_m 内)の在住者数がこれ超で crowd_surge
  crowd_bias: 0.7               # 群集日に自由時間の行き先を集会ノードへ寄せる確率/step(stream "crowd")
  crowd_radius_m: 60.0          # 集会ノード(スクランブル交差点)からこの距離内を群集としてカウント
  ambient: false               # 群集密度(非LLM・可視化用の雰囲気推定)を crowd_surge payload に併記
  ambient_per_surge: 3000       # ambient=true 時、level×これ を推定群集規模として payload に載せる
  # events: 未指定なら既定(正月 1/1 / ハロウィン 10/31=群集 / 年末 12/31)。上書き例:
  #   events: [ {name: ハロウィン, month: 10, day: 31, crowd: true}, {name: 正月, month: 1, day: 1, crowd: false} ]

# ---- 情報環境の非対称(現実ギャップ Wave G6 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 意見分極と伝播の加速器。既存の net/internet(SNS)+ opinion(FJ)の最小拡張。すべて非LLM・決定論。
# ON 時(マスター enabled=true + 各機構 enabled=true):
#  推薦(recommendation): SNS の TL 提示を閲覧者の意見整合バイアスで並べ替え/選別(近い投稿を優先表示・
#    遠い投稿を間引く=エコーチェンバー)。意見参照は opinion.alignment 経由で不透明化。feed_rank を記録。
#  バイラル(influence): フォロワー数の非対称を活かし高フォロワー author の投稿のリシェア到達(reach)を加重
#    (拡散カウンタの増分=非LLM 状態更新・新規投稿は作らない)。viral_cascade を記録。
#  炎上(misinfo): 一部投稿を誤情報として扱い(新 stream "info" で決定論判定)、訂正の拡散・炎上(ネガ反応の
#    殺到)を記録。炎上→発信者の grievance は factors 経由・任意(flame_grievance>0 のときのみ・drive 非接続)。
# R1: どの機構も generate() を1本も足さない。推薦は「どの投稿を読むか」を変えるため FixedLLM で ON!=OFF に
#   なりうるが、機構は k・内面状態を読まず暦・config・意見・フォロワー・新 stream のみ参照する=compute_matched
#   下の k 不変性で担保(career G5 / crowd G4 と同型)。既定 OFF=feed_rank/viral_cascade/misinfo とも 0 件・
#   TL は従来の時系列・乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。
info_env:
  enabled: false                # ★ON 推奨(本番): true(情報環境の非対称=意見分極の加速器を有効化)。マスターゲート
  recommendation:
    enabled: false              # ★ON 推奨(本番): true(意見整合バイアスで TL を選別=エコーチェンバー)
  influence:
    enabled: false              # ★ON 推奨(本番): true(高フォロワー投稿の reach を加重=バイラル)
    follower_threshold: 8       # フォロワーがこれ以上の author をインフルエンサーとみなす
    reach_weight: 1.0           # 追加 reach = weight ×(フォロワー数 − 閾値 + 1)
    max_reach: 30               # 1投稿あたり追加 reach の上限(暴走防止)
  misinfo:
    enabled: false              # ★ON 推奨(本番): true(誤情報・訂正・炎上のダイナミクス)
    rate: 0.15                  # 新規投稿が誤情報として扱われる割合(新 stream "info")
    correction_prob: 0.5        # 誤情報が訂正(拡散)される確率
    flame_grievance: 0.0        # ★ON 推奨: 例 0.02。炎上を受けた発信者の不満増分(factors 経由・drive 非接続)。
                                # 0.0=観測のみ(misinfo イベントは出るが grievance は不変)

# ---- 健康・疲労・病気・メンタル(現実ギャップ 後続波 H1 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 生活の身体的基盤。最小・非LLM・決定論の3機構(実装 src/society/health.py):
#  疲労: fatigue ゲージ(drive/arousal と並列の内部 transient)が活動(勤務/移動)で蓄積・睡眠で回復。
#    高疲労で発火 effective_threshold を上げる(休息へ寄る=行動が鈍る)。fatigue_gain=0 で恒等(不変)。
#  病気: 日次に新 stream "health" で確率発症→欠勤(勤務スキップ)・外出抑制(在宅=自宅へ寄せる)・
#    受診で医療消費(medical_visit=spend cat="medical")。illness_days 日で回復(illness state=onset/recover)。
#  メンタル: 慢性的な高 grievance の持続→引きこもり(withdrawn=自由時間の外出を控え社会的活動が低下)。
#    grievance の参照は health.py(CHECKED_DIRS 外)に閉じる=no-fingerprint 契約に触れない。
# R1: どの機構も generate() を1本も足さない。病気(在宅)・疲労(休息)は物理位置を変え対面 co-location が
#   変化しうる(=FixedLLM で ON!=OFF)が、機構は k・内面状態(構成概念)を発火判断に食わせず暦・config・
#   新 stream・物理位置・grievance(k 非依存)のみ参照=compute_matched 下の k 不変性で呼数一致を担保する。
# 既定 OFF(enabled=false)=疲労更新なし・発症/受診なし・引きこもりなし・health stream も引かない・
#   イベント 0 件・乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。新イベント種は illness /
#   medical_visit / health_update(schema.py 登録済み)。
health:
  enabled: false                # ★ON 推奨(本番): true(生活の身体的基盤=疲労・病気・メンタルを有効化)
  # ---- 疲労(内部 transient。既定 gain=0=恒等=不変)----
  fatigue_gain_work: 0.0        # ★ON 推奨: 例 0.02。勤務中1stepあたりの疲労蓄積
  fatigue_gain_move: 0.0        # ★ON 推奨: 例 0.015。移動中1stepあたりの疲労蓄積
  fatigue_recovery: 0.15        # 睡眠中1stepあたりの回復量(ON時のみ効く)
  fatigue_high: 0.6             # 「高疲労」とみなす閾値(health_update / 行動鈍化の境界)
  fatigue_threshold_gain: 0.0   # ★ON 推奨: 例 0.1。高疲労→発火 effective_threshold の上げ幅(休息へ寄る)。0=恒等
  # ---- 病気(新 stream "health"。既定 onset_prob=0=発症なし)----
  onset_prob: 0.0               # ★ON 推奨: 例 0.02。居住者の日次発症確率(数日間の欠勤・在宅)
  illness_days: 3               # 発症してから回復までの日数
  medical_prob: 0.0             # ★ON 推奨: 例 0.5。発症直後に受診する確率(→ medical_visit + spend)
  medical_cost: 3000            # 受診1回の医療費(spend cat="medical")
  # ---- メンタル(慢性高 grievance→引きこもり。既定 閾値高で通常不発)----
  mental_grievance_threshold: 0.7  # 「高 grievance」とみなす閾値
  mental_withdraw_days: 3       # 高 grievance がこの日数続いたら引きこもり(0=メンタル無効)

# ---- 世帯・家族・恋愛(現実ギャップ 後続波 H2 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 現状は全員独立個人。生活の紐帯(世帯・同居・家族・恋愛)を最小・非LLM・決定論で載せる
# (実装 src/society/household.py)。3機構(childbirth/死別=エージェント数が変わる重い機構は本波では作らない):
#  世帯・同居: 起動時に居住者を決定論で世帯(夫婦・家族・ルームシェア)へグループ化(新 stream "household")。
#    同一世帯は home(住居建物・ノード・階)を共有=夜間の家庭内 co-location(会話の場)。各メンバに
#    household_id / 同居者 id を付し、後段の「顔なじみ」で housemate が初期関係に入る。
#  家族関係: 同居者・恋人が同席したとき「同居する家族/同居人/恋人の○○」をプロンプトに1行添える(G2 と協調)。
#  恋愛・パートナー: G2 relations の親密度 closeness が相互に partner_closeness 超の2者を日次で決定論的に
#    パートナー(恋人)にする(要 relations.enabled=true。closeness が積まれる)。パートナーは特別な間柄
#    (親友の上位)+ デート(共有の目的地・新 stream "date")が移動理由に。partner_formed / life_event を記録。
# R1: どの機構も generate() を1本も足さない。住居共有・デートは物理位置を変え対面 co-location が変化しうる
#   (=FixedLLM で ON!=OFF)が、機構は k・内面状態を読まず名簿・config・closeness・物理位置のみ参照する=
#   compute_matched 下の k 不変性で呼数一致を担保(career G5 / crowd G4 / 健康 H1 と同型)。
# 既定 OFF=世帯を組まず(home 割当も不変)・パートナー形成なし・context/date とも無し・"household"/"date"
#   stream も引かない=イベント 0 件・乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。新イベント種は
#   partner_formed / life_event(schema.py 登録済み。世帯の家族文脈は relation 文脈で表現=新種不要)。
household:
  enabled: false                # ★ON 推奨(本番): true(生活の紐帯=世帯・家族・恋愛を有効化。恋愛は要 relations.enabled=true)
  # ---- 世帯グループ化(起動時1回。新 stream "household")----
  sizes: [1, 2, 3, 4]           # 取りうる世帯サイズ(1=単身は世帯を組まない=個人のまま)
  size_weights: [0.35, 0.30, 0.22, 0.13]  # サイズの相対重み(合計は正規化)
  family_ratio: 0.7             # 2人以上世帯が「家族」の割合(残りはルームシェア=同居人)
  # ---- 世帯の現実化(第44バッチ S-R1。false=現行の id 順機械束ねと完全同一)----
  realistic: false              # ★ON 推奨(本番): true(地理×年齢の整合束ね+続柄=夫/妻/親/子+渋谷 size_weights)
  # 渋谷区の現実(令和2国勢調査: 単身64.5%・2人以上35.5%を全国分布で 2/3/4 に按分)。realistic=true 時のみ使用。
  size_weights_realistic: [0.645, 0.176, 0.104, 0.075]
  # ---- 恋愛・パートナー形成(日次。G2 closeness から決定論。要 relations.enabled=true)----
  partner_closeness: 15.0       # 相互 closeness がこれ以上でパートナー成立(親友 relations.tier_close の上位)
  date_bias: 0.5                # 自由時間にパートナーとの共有デート先へ寄せる確率/step(stream "date")
  # ---- 夕食の共食(第44バッチ S-R1。夜帯に世帯 home へ収束し2人以上同席で joint_activity 記録。新 stream "dinner")----
  family_dinner:
    enabled: false              # ★ON 推奨(本番): true(家族の夕食共食を有効化。要 household.enabled=true)
    prob: 0.69                  # 夕食帯の home 収束バイアス/step(農水省 食育調査 令和5=家族と夕食「ほぼ毎日」68.7%)
    band_start_min: 1080        # 夕食帯の開始(分 of day)= 18:00
    band_end_min: 1260          # 夕食帯の終了(分 of day)= 21:00

# ---- 共同行動エンジン(関係性の再現 第44バッチ S-R3。ユーザー要望 2026-07-21。既定 OFF=現行挙動と完全同一)----
# 関係(友人 relations tier≥2 / 同居人 housemates)を起点に「N人が同一(POI,時刻)へ独立に収束+合流は
# 決定論」で共同行動(外食・カフェ/映画/カラオケ/買い物)を発生させる。誘い→承諾→合流は全決定論=
# LLM 呼を1本も増やさない(既存 household.date_dest の一般化)。合流後の会話は既存の対面会話予算内。
# 実装 src/society/joint.py(較正値・活動名リテラルはここと joint.py にのみ書く=no-fingerprint 契約)。
# R1: 日次編成(新 stream "joint")・同伴選択(relations closeness/housemates=k 非依存)・誘い承諾
#   (新 stream "joint")・ランデブー POI(グループ最小 id/day/活動タイプの純関数=乱数ゼロ)。合流=物理
#   位置=対面 co-location の変化は career/health/household と同型で許容(呼数不変は compute_matched 下の
#   k 不変性で担保)。既定 OFF=何も編成せず・joint_activity 0 件・"joint" stream も引かない(ゴールデンを守る)。
joint:
  enabled: false                # ★ON 推奨(本番): true(友人・同居人の共同行動を有効化。友人には要 relations.enabled=true)
  daily_rate: 0.15              # 1人1日あたりの共同外出の発生確率(学生時代友人と月1=~0.03/特定相手と桁が合う集約率≈週1)
  accept_base: 0.5              # 誘いの基礎承諾確率(host_event の attend_base 相当)
  tier_bonus: 0.3               # 親友(relations tier 3)への承諾加算(関係の強さで参加率↑)
  min_group: 2                  # 成立に必要な最小人数(自分含む)
  max_group: 4                  # グループ最大人数(自分含む。2-4人)
  friend_tier: 2                # 同伴候補の最小 relations tier(2=友人)
  # ---- 職場の会食・飲み会の階層依存(第45バッチ S-R4。§2.5: 飲みニケーション忌避は"上司同席・義務的"に
  #      集中=上司ありの飲み会「苦手」66.7% だが同世代なら「好き」50.8%)。組織台帳に役職(rank/founder)
  #      データは無い(org_role は職種名で階層でない)ため、上司/同世代の代理指標は年齢差>boss_age_gap 歳。----
  hierarchy_penalty: 0.35       # hierarchical=true の活動で、年齢差>boss_age_gap の相手の承諾を下げる幅
  boss_age_gap: 10              # これを超える年齢差を上司/部下(階層)の代理指標に(役職データ不在の近似)
  # 活動カタログ(渋谷較正=レジャー白書 参加率)。poi_cat は routine の food/leisure/shop と整合。
  # band=下の bands の名前。activity_tag=routine 活動タグ(eating で既存 _charge_meal が飲食費を課金)。
  # companion_type=同伴の関係タイプ(friend=友人 tier≥friend_tier[既定] / housemate=同居人 / colleague=同 org_id)。
  # hierarchical=true で上司同席(年齢差>boss_age_gap)の承諾に hierarchy_penalty(飲み会に付す)。
  # ★ 職場の会食(第45バッチ S-R4)は既定の activities マップを変えないため**コメントアウトで同梱**する
  #   (map に足すと活動名の並び=ランデブー POI ハッシュが動き既存 joint ON 挙動が変わるため)。有効化=下の
  #   colleague_* 行のコメントを外し weight を上げる(要 organizations.enabled=true で org_id が付く)。較正
  #   (§2.5): 同僚ランチ14.4%[単独60.4%が主]=weight~0.02、飲み会 月0回64%=weight~0.03(いずれも低頻度)。
  activities:
    meal_cafe: {weight: 0.39, poi_cat: food, band: night, activity_tag: eating}    # 外食・カフェ(参加率39.2%)
    cinema:    {weight: 0.34, poi_cat: leisure, band: day, activity_tag: ""}        # 映画(33.7%)
    karaoke:   {weight: 0.20, poi_cat: leisure, band: night, activity_tag: ""}      # カラオケ(20.2%)
    shopping:  {weight: 0.15, poi_cat: shop, band: day, activity_tag: ""}           # ショッピング(渋谷若年で高頻度)
    # colleague_lunch:  {weight: 0.02, poi_cat: food, band: lunch, activity_tag: eating, companion_type: colleague}                    # 同僚ランチ(昼・低確率=単独が主)
    # colleague_dinner: {weight: 0.03, poi_cat: food, band: night, activity_tag: eating, companion_type: colleague, hierarchical: true}  # 飲み会=居酒屋相当(夜・上司同席で承諾↓)
  # 時間帯(分 of day の [開始, 終了))。day=昼〜夕方、night=夕〜夜、lunch=昼食帯(同僚ランチ有効化時に使用)。
  bands:
    day: [660, 1020]            # 11:00-17:00
    night: [1020, 1320]         # 17:00-22:00
    lunch: [690, 810]           # 11:30-13:30(同僚ランチ)
  # 年齢条件付き重み倍率(キー=年代下限の文字列)。渋谷=若年で友人遊び高(カラオケ/買い物/映画↑)。
  age_weights:
    "0":  {karaoke: 1.6, shopping: 1.4, cinema: 1.2, meal_cafe: 1.0}
    "35": {karaoke: 0.8, shopping: 0.9, cinema: 1.0, meal_cafe: 1.0}
    "55": {karaoke: 0.4, shopping: 0.7, cinema: 0.8, meal_cafe: 1.0}

# ---- 来街者 party の実体化(関係性パッケージ完結 第45バッチ S-R5。ユーザー要望 2026-07-21。既定 OFF=現行挙動と完全同一)----
# プールの L4 来街者 record に party_size 1-5(build_persona_pool.py=同行人数)が実在するが sim 内で未使用
# だった。本ブロックは present な来街者を party_size でグループ化=「同席の連れ」にする: 同一初期ノードへ寄せ・
# 連れ相互に relations 注入・回遊先を代表と共有(party_dest。新 stream "party")。観測は joint_activity{type:party}
# を再利用(過剰な新 kind なし)。実装 src/society/party.py(較正値・グループ化はここと party.py にのみ)。
# presence 整合: presence(P3 純関数)の draw 順に一切触れず、present 実体化の後にグループ化するだけ=rotation の
# 決定論・resume バイト一致(test_pool_rotation)を保つ。乱数は新 stream "party" のみ(回遊バイアス抽選)。
# 既定 OFF=グループ化せず・party_today も付かず・"party" stream も引かず・joint_activity 0 件=バイト一致。
party:
  enabled: false                # ★ON 推奨(本番・pool ON 時): true(来街グループを同席の連れとして実体化)
  max_party: 5                  # party_size の上限(プールは1-5)
  closeness: 5.0                # 連れ相互に注入する closeness(relations の友人 tier2 相当)
  tier: 2                       # 注入する relations tier(2=友人)
  roam_bias: 0.5                # 回遊帯に共有 POI へ寄せる確率/step(新 stream "party")
  band_start_min: 600           # 回遊帯の開始(分 of day)= 10:00
  band_end_min: 1320            # 回遊帯の終了(分 of day)= 22:00

# ---- 火種介入の実験条件化(spark treatment 第53バッチ 2026-07-23。ユーザー要望。既定 OFF=現行挙動と完全同一)----
# 「立ち上げには初期介入が不可欠」という外部の助言と「介入ゼロで観測」という本プロジェクト方針の対立を、
# ON/OFF 可能な treatment として実験で決着させるブロック。介入は hardcode せず、初期条件・環境の差
# (初期関係の束/初期資本・在庫/定期集会アンカー)としてのみ与える。★プロンプトへの台本注入は一切しない。
# 実装 src/society/spark.py(選抜・較正値はここと spark.py にのみ=no-fingerprint 契約)。事後トレーサ
# scripts/trace_spark.py が spark_roster を起点に「sparked 発の現象か」を L1 から追跡(語彙可視化の資産を再利用)。
# 設計絶対条件: (1)選抜は trait-blind 既定=(pid, spark.seed)の安定ハッシュ純関数=無作為(traits を読まない
#   =生得/創発の交絡を排除。ids 明示指定は許可)。(2)decay が効くのは (c)集会アンカーのバイアス強度のみ
#   (a 関係/b 資本・在庫は t=0 一発=減衰対象外)。(3)イベント毎の spark タグは付けず t=0 名簿1件のみ記録。
# 決定論・run.seed 非依存: 選抜・(a)(b)(c)適用とも乱数ゼロ(spark.seed 固定なら run.seed 変更でも同一名簿)。
# 既定 OFF=何も選抜/適用せず・spark_roster も出さず・"spark" stream も引かない=バイト一致(ゴールデンを守る)。
spark:
  enabled: false                # ★実験 treatment(ON/OFF 比較で回すかは D13=GPU 予算判断)
  seed: 20260723                # 選抜の安定ハッシュ種(run.seed 非依存=別ランで同一名簿)
  n: 5                          # 無作為選抜の人数(ids が空のとき)
  ids: []                       # 名簿明示指定(pid か agent.id の文字列。空なら trait-blind 無作為選抜)
  menus:                        # 3メニュー各個別 ON/OFF
    relations:                  # (a) 初期関係の束: sparked 相互+近傍を友人 closeness へ注入(t=0 一発・減衰対象外)
      enabled: true
      closeness: 5.0            # 注入する closeness(relations の友人 tier2 相当=閾値 5.0)
      mutual_k: 4               # 各 sparked に束ねる近傍人数(同 home_building 優先→id 近傍)
    capital:                    # (b) 初期資本・在庫: money 上乗せ+(商業 POI 保持者なら)在庫上乗せ(t=0 一発・減衰対象外)
      enabled: true
      money: 50000             # 手持ちへの上乗せ(円。会社員初期レンジ相当の頭金)
      stock: 20                # 商業 POI 在庫の上乗せ(単位。goods.inventory ON 時のみ実効)
    anchor:                     # (c) 集会アンカー: 共通 POI へ band 内の自由時間を寄せる(bias は step で指数減衰)
      enabled: true
      poi_cat: leisure          # 集会 POI のカテゴリ((poi_cat, seed)純関数で全 sparked 共通の1 POI を決定)
      band: [1020, 1320]        # 寄せる時間帯 [開始, 終了)(分 of day)= 17:00-22:00
      bias: 0.5                 # 寄せる基礎確率/step(新 stream "spark")
      decay: 0.02               # step 経過での指数減衰係数(bias × exp(-decay × step)=介入が初期だけ効く)

# ---- 商業・店舗のダイナミクス(現実ギャップ 後続波 H3 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 現状 POI(店・会社)は静的で常時営業・価格固定。商業の動きを最小・非LLM・決定論で載せる
# (実装 src/society/commerce.py)。3機構(都市再開発=地図が変わる機構は本波では作らない=注記に留める):
#  営業時間: POI のカテゴリから開閉時刻を時刻の純関数で決める(乱数不要)。閉店中のカテゴリは routine の
#    行き先候補(食事/買物/夜遊び先)から除外し、開閉遷移を shop_state(カテゴリ単位=1日数件・sparse)で記録。
#  動的価格・需給: その POI/時間帯の需要(在館数=観測量)に応じて価格係数を決定論で消費額に掛ける
#    (混雑した店で高く=surge、閑散でセール<1)。price_change(cat, ratio)。★係数は既存 spend 抽選の外で掛ける
#    (economy の _poi_price/spend の draw を汚さない)。price_sensitivity=0.0=恒等=不変。
#  在庫・品切れ・行列: 需要が stock_threshold 超の POI で資源希少化(品切れ/行列)= その場の購入抑制 + 不満
#    (factors 経由 on_scarcity)。stock_out(poi, cat)。
# R1: どの機構も generate() を1本も足さない。閉店による行き先除外は物理位置=対面 co-location を変えうる
#   (=FixedLLM で ON!=OFF になりうる=career G5 / crowd G4 / 健康 H1 / 世帯 H2 と同型)が、機構は k・内面状態を
#   読まず時刻・config・在館数(観測量)のみ参照する=compute_matched 下の k 不変性で呼数一致を担保する。
#   動的価格・在庫は移動を変えない(消費額・購入可否のみ)=呼数に無関係。品切れ→grievance は drive 非接続。
# 既定 OFF=営業時間ゲートなし(全 POI 常時営業扱い)・価格係数なし(消費額不変)・品切れなし・
#   shop_state/price_change/stock_out とも 0 件・乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。
commerce:
  enabled: false                # ★ON 推奨(本番): true(商業の動き=営業時間・動的価格・在庫を有効化)
  # ---- 営業時間(cat → [開店時, 閉店時]。24h表記。閉<=開 は翌朝までの夜間営業。未掲載カテゴリは常時営業)----
  hours:
    food: [11, 23]              # 飲食店 11:00〜23:00
    shop: [10, 21]              # 物販 10:00〜21:00
    nightlife: [18, 5]          # 夜遊び 18:00〜翌05:00(夜間営業)
  # ---- 動的価格(需給。在館数=需要 が demand_ref を超えると係数>1=surge、下回るとセール<1)----
  price_sensitivity: 0.15       # 在館数 1 人差あたりの価格係数変化(0.0=恒等=消費額不変)
  demand_ref: 2                 # 基準需要(在館数)。これと同数で係数 1.0
  price_min: 0.7                # 価格係数の下限(セール)
  price_max: 1.6                # 価格係数の上限(surge)
  # ---- 在庫/品切れ・行列(在館数が stock_threshold 以上で品切れ/行列=購入抑制+不満)----
  stock_threshold: 6            # これ以上の在館で品切れ/行列(0 以下=在庫機構 無効)
  stock_grievance: 0.02         # ★ON 推奨: 例 0.02。品切れ/行列に遭遇→不満(factors 経由。0.0=観測のみ=grievance 不変)
  # ---- 物流の実体化 スライス①+②(実装 src/society/goods.py。設計 docs/research/economy-goods-services.md §7 ①②)----
  # 店舗在庫((s,S) 方策)+ 日次補充トリップ(depot=最寄りゲートウェイ→店=delivery_trip→到着で restock)+
  # 商品実体(何を買ったか=spend.item)。決定論・非LLM・乱数ゼロ(R1: 品切れは spend 抑制のみ・補充は
  # agent_id=-1 の世界イベント=個体位置を変えない・新 stream を引かない)。封鎖(災害の運休/摂動 shock_closure)で
  # 補充失敗→欠品波及。上記 commerce.enabled とは独立に効く(inventory.enabled のみで判定)。
  # 既定 OFF=在庫実体なし・delivery_trip/restock/stock_low/stock_out(実在庫版)0 件・所持も生えない=バイト一致。
  inventory:
    enabled: false              # ★ON 推奨(本番): true(実在庫・日次補充トリップ・商品実体を有効化)
    # (s,S) 方策: 在庫が発注点 s(reorder_point)以下で上限 S(capacity=order-up-to)まで補充発注(正典 §3.2/§3.4 較正)
    capacity:      { food: 40, cafe: 40, shop: 30, nightlife: 30 }   # 上限 S = 初期在庫(生鮮 food は回転が速い=厚め)
    reorder_point: { food: 12, cafe: 12, shop: 8,  nightlife: 8 }    # 下限 s = 発注点(food は高め=補充が早く走る)
    default_capacity: 30        # capacity 未掲載カテゴリの既定 S
    default_reorder_point: 8    # reorder_point 未掲載カテゴリの既定 s
    consume_units: 1            # 1購入あたりの在庫消費単位
    lead_time_steps: 3          # 発注→到着(配送トリップの走行時間)のリードタイム(step)
    restock_hour: 4             # 日次補充レビューの時刻(時。物流が街を走る時間帯=正典 §3.4)
    stockout_grievance: 0.02    # 実在庫の品切れで購入不成立に遭遇→不満(factors on_scarcity。0.0=観測のみ)
    belongings_max: 8           # 本人の所持(直近購入)の有界リスト長
    # 商品カタログ(カテゴリ→具体商品テキスト=家計調査費目と整合する粒度。日替わり巡回で決定論に選ぶ)
    catalog:
      food:      [ラーメン, 定食, カレー, 寿司]
      cafe:      [コーヒー, 紅茶, ケーキ, サンドイッチ]
      shop:      [Tシャツ, 雑貨, 文房具, 日用品]
      nightlife: [カクテル, ビール, ハイボール]
    # ---- B2B 卸→小売の仕入れ スライス⑤(実装 src/society/b2b.py。設計 §7 ⑤)----
    # ON 時: 上の補充(restock)の供給元を「外生 depot(街の外のゲートウェイ)」から **卸 org** へ内生化する。
    #   卸/製造 org(organizations の output_kinds に素材/製品=goods/food を持つ org)が勤務完遂ごとに生産で
    #   在庫を積み(production_units)、小売の補充がその在庫から引かれ、org 間で金+物が移転(卸=売上・小売=
    #   仕入費。org_ledger の会計流儀=買い側支出=売り側売上で保存)。卸在庫不足=補充失敗(封鎖時と同じ経路=
    #   欠品波及)。物流トリップ(delivery_trip)は再利用(出発地=卸 org の所在ノード)。全決定論・乱数ゼロ。
    #   要 organizations.enabled=true(卸 org が居ないと外生 depot 扱いで graceful=b2b_trade 0 件)。
    # 既定 OFF=補充供給元は外生 depot のまま・b2b_trade 0 件・卸在庫台帳も生えない=バイト一致。
    b2b:
      enabled: false            # ★ON 推奨(本番): true(要 organizations.enabled=true。供給網の内生化=組織創発)
      supply_kind:              # 小売カテゴリ → 卸が供給する output_kind(実データ実査: food系→food・shop→goods)
        food: food
        cafe: food
        nightlife: food
        shop: goods
      production_units: 8       # 卸 org の勤務完遂1回で増える在庫量(生産)
      initial_stock: 0          # 卸の起動時在庫(0=生産で立ち上げ。>0 で即出荷可能)
      default_wholesale_price: 300  # 1単位あたりの仕入単価(卸値。cat 別に wholesale_price で上書き可)
      wholesale_price: {}       # 例: { food: 250, shop: 800 }(未掲載は default_wholesale_price)

# ---- サービスの実体化 スライス③(実装 src/society/services.py。設計 docs/research/economy-goods-services.md §7 ③)----
# service/education カテゴリの POI で「滞在して効果を受ける」最小形。来店=自由時間の行き先バイアス(routine の
# dest チェーン中立1分岐=date/joint と同型)+ 受給=課金(_spend)+ 効果(factors on_service へ帯 band と不透明
# magnitude)+ 記憶 + service_use。来店抽選は専用 stream "service"(既存 draw 順に不干渉)、利用率は現実頻度に桁を
# 合わせて較正(理美容=月1-2回・ジム/塾=週1-2回・クリーニング=週1回・任意受診=年数回)。R1: generate() を1本も
# 足さない(来店は既存 routine 発火に相乗り)。判定は年齢・所持金・時刻・物理位置・config のみ=k 非依存。
# 供給側 serve(work.service)との seam: 受給の spend は cat=spend_cat(既定 "service")で出る=work.serve_by_cat に
#   "service" を写像すれば同一 work_node の勤務中スタッフに serve が帰属し需要側 service_use と対になる。
# 既定 OFF=来店せず・"service" stream も引かない・service_use/効果とも 0 件=ゴールデン golden_baseline_l1.json をバイト一致で守る。
services:
  enabled: false                # ★ON 推奨(本番): true(service/education POI を経済的に起こす=ユーザー要望・渋谷再現)
  spend_cat: service            # 受給の _spend の cat(work.serve_by_cat と対の seam。消費税等は既存経路)
  open_from: 9                  # サービス営業帯の開始(時)
  open_to: 20                   # サービス営業帯の終了(時)
  radius_m: 700                 # 来店先を探す現在地の近傍半径(m)
  free_steps_ref: 48            # 日次利用率→per-step 化の基準自由 step 数(1日の自由行動 step の目安。桁較正の分母)
  # サービス定義テーブル(cats=ホスト POI カテゴリ / hints=POI 名の部分一致=空なら当該カテゴリの任意 POI /
  #   price=料金 / stay=滞在step / band=効果の帯(mood=気分/vitality=活力/learning=学習素地)/ magnitude=効果の
  #   不透明量(0.0=観測のみ)/ daily_rate=日次利用率(較正)/ age=[min,max] 該当年齢帯 / remember=記憶1行 /
  #   dev_axis+dev_gain+dev_remember=T4 自助努力の累積軸(下の self_dev.enabled=true のときだけ効く。塾→skill=
  #   賃金へ結ぶ唯一の経路 / ジム→fitness=観測のみ。gain/(1+現在値) の逓減で累積))
  services:
    grooming: {cats: [service], hints: [美容, 理容, 床屋, サロン, ヘア, ネイル], price: 4000, stay: 3, band: mood,     magnitude: 0.03,  daily_rate: 0.05,  age: [12, 90],  remember: 髪を整えて気分が上がった}
    clinic:   {cats: [service], hints: [クリニック, 医院, 診療, 歯科, 内科, 眼科], price: 3000, stay: 2, band: vitality, magnitude: 0.02,  daily_rate: 0.012, age: [0, 120],  remember: 健康のために受診してきた}
    lesson:   {cats: [education, service], hints: [塾, スクール, 教室, 予備校, アカデミー], price: 5000, stay: 3, band: learning, magnitude: 0.02, daily_rate: 0.20, age: [8, 35], remember: 習い事で新しいことを学んだ, dev_axis: skill, dev_gain: 0.08, dev_remember: 学びの積み重ねが力になってきた}
    gym:      {cats: [service, leisure], hints: [ジム, フィットネス, スポーツ, ヨガ, プール], price: 2000, stay: 4, band: vitality, magnitude: 0.025, daily_rate: 0.20, age: [15, 75], remember: ジムで汗を流してすっきりした, dev_axis: fitness, dev_gain: 0.08, dev_remember: ジム通いの成果を感じる}
    laundry:  {cats: [service], hints: [クリーニング, ランドリー, 洗濯], price: 1200, stay: 1, band: mood, magnitude: 0.015, daily_rate: 0.14, age: [18, 90], remember: 衣類を整えてもらった}
    service:  {cats: [service], hints: [], price: 2000, stay: 2, band: mood, magnitude: 0.015, daily_rate: 0.03, age: [12, 100], remember: 用事を済ませてきた}
  # 自助努力 affordance(T4 第52バッチ): 「自力で成長・改善できる」可能性を用意する(成長を強制せず選べる状態)。
  #   反復受給の累積ストック agent.self_dev(skill/fitness)を作り、skill だけを賃金へ結ぶ(=経済成果への1本だけの
  #   間接経路)。既定 すべて OFF/0=会計もイベントも不変(ゴールデン golden_baseline_l1.json をバイト一致で守る)。
  self_dev:
    enabled: false              # ★ON 推奨(本番): true(塾=技能/ジム=体力の反復累積と skill→賃金経路を有効化)
    wage_coef: 0.0              # 賃金乗数 =1 + wage_coef × skill(★ON 較正例: 0.10=skill 1.0 で賃金+10%)。0.0=ON でも会計不変
    decay: 0.0                 # skill/fitness の日次乗算減衰(★ON 較正例: 0.01=維持しないと薄れる→有界均衡)。0.0=減衰なし
    remember_threshold: 0.5    # 累積軸がこの値を初めて越えた時だけ記憶を1行残す(反復の毎回は残さない=騒音回避)

# ---- 宅配・フードデリバリー スライス④(実装 src/society/delivery.py。設計 docs/research/economy-goods-services.md §7 ④)----
# 買い手が来店せず注文→配達員が店で受取(① 在庫を1引く)→配送トリップ→到着で受給+課金 の4段(§3.3 ラストマイル ABM)。
# 注文=在宅/職場滞在の agent が食事帯に外食の代替として選ぶ(専用 stream "delivery" の抽選=order_rate)。配達員=economy の
# gig/自営「配達員」職の agent に業務実体を与える(最寄りの勤務可能な配達員を決定論選定=id 昇順。専任不在なら agent_id=-1 の
# 抽象トリップへ graceful=注文は必ず配送される)。到着で注文者へ課金(食事+配達手数料 fee=定額+距離比例=Uber Eats 相当の
# 簡略化)+ 配達員へ gig 収入(手数料×courier_share=金の保存)。R1: generate() を1本も足さない(注文は routine 食事分岐に
# 相乗り)、乱数は "delivery" stream 1本のみ。判定は物理位置・時刻・所持金・config のみ=k 非依存(注文で在宅に留まる=
# co-location 変化は services/goods と同型=compute_matched 下の k 不変性で担保)。① commerce.inventory と併用で実在庫を消費
# (品切れ店は注文不可)。単独(inventory OFF)でも動く(在庫制約なし=どの食 POI も注文可)。
# 較正(§10): order_rate は出前/宅配=月数回/世帯 の桁に合わせた初期値(1日1回上限=max_per_day)。B 段で調律。
# 既定 OFF=注文せず・"delivery" stream も引かない・order/deliver 0 件=ゴールデン golden_baseline_l1.json をバイト一致で守る。
delivery:
  enabled: false                # ★ON 推奨(本番): true(宅配=来店なし注文・配達員の業務実体・ラストマイル配送を有効化)
  order_rate: 0.02              # 食事帯の在宅/職場滞在 step あたりの注文確率(較正: 出前/宅配=月数回/世帯 の桁)
  windows: [[690, 810], [1080, 1260]]   # 注文受付=食事帯(分 of day)。既定=昼11:30-13:30 / 夜18:00-21:00
  cat: food                     # 宅配対象の POI カテゴリ(食=food)
  radius_m: 1500                # 注文先(店)を探す近傍半径(m)。超過は近傍に店なし=注文不可
  base_fee: 350                 # 定額配達手数料(円。Uber Eats 相当の簡略化=定額+距離比例まで)
  per_km_fee: 100               # 距離比例の配達手数料(円/km)
  courier_share: 0.7            # 配達手数料のうち配達員の取り分(残りはプラットフォーム手数料)
  eta_m_per_step: 500           # 配送トリップの走行速度換算(m/step。1 step=10分)。eta=距離/これ(min/max で丸め)
  min_eta_steps: 1
  max_eta_steps: 6
  courier_occupation: 配達員     # 配達員の職業(economy の gig/自営。この職の agent に配達業務が帰属)
  max_per_day: 1                # 1日1個体あたりの宅配注文上限(現実頻度=月数回に桁を合わせる上限)
  menu: [弁当, ラーメン, カレー, ピザ, 寿司]   # ① goods カタログが無い/OFF のときの注文品(日替わり巡回で決定論)

# ---- 都市・環境インフラのショック(現実ギャップ 後続波 H4 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 生活を麻痺させる外生ショック=集団的 grievance の源。既存の scenario/transit の最小拡張(独立 phase。
# 都市再開発=地図が時間で変わる機構は本波では作らない=注記に留める)。実装 src/society/disaster.py。3機構:
#  災害(disaster): 台風/地震/大雪など。発生日(days)or 確率(onset_prob)で発動し、発生中は
#    交通麻痺(電車運休=transit.has_service 停止=駅経由の退出/帰還を止める)+ 外出抑制(在宅=routine が
#    自宅へ寄せる。stay_home_bias)+ 強い grievance(factors 経由)+ プロンプト文脈(「台風で交通が麻痺…」)。
#    発生/解除を disaster(agent_id=-1, phase=onset/clear)で記録。
#  交通の遅延・運休(transit_delay): 電車は現状 定刻(乱れなし)。日次に遅延/運休を新 stream "disaster" で
#    注入(既存の定刻ダイヤの draw は汚さない)。運休日は has_service 停止。乗れない/遅れる→grievance。
#  インフラ障害(infra_outage): 停電/通信断/断水=生活麻痺。軽実装=在宅娯楽(media)・スマホ(SNS/検索等)の
#    一部を抑制 + grievance。発生/解除を infra_outage で記録。
# R1: どの機構も generate() を1本も足さない。発生/遅延/障害の確率判定は新 stream "disaster"(既存 draw 順に
#   挿入しない=決定論)、発生日指定は暦不要の day-index からの純関数(乱数なし)。災害(在宅)・運休は物理位置・
#   移動を変え対面 co-location が変化しうる(=FixedLLM で ON!=OFF=career G5 / crowd G4 / 健康 H1 / 世帯 H2 /
#   商業 H3 と同型)が、機構は k・内面状態を読まず day-index・config・新 stream・物理位置のみ参照する=
#   compute_matched 下の k 不変性で呼数一致を担保。grievance は drive(発火系)に接続しない。既存の摂動シナリオ
#   (world.scenario の shock_closure/shock_event)の挙動・イベント列は一切変えない(独立 phase)。
# 既定 OFF=disaster/transit_delay/infra_outage とも 0 件・transit 運休なし・"disaster" stream も引かない=
#   乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。新イベント種は disaster / transit_delay /
#   infra_outage(schema.py 登録済み)。
disaster:
  enabled: false                # ★ON 推奨(本番): true(生活を麻痺させる外生ショック=集団的 grievance の源を有効化)
  # ---- 災害ショック(台風/地震/大雪)----
  days: []                      # 発生日の day-index リスト(run 開始=0。決定論・乱数不要)。例: [10, 45]
  onset_prob: 0.0               # ★ON 推奨: 例 0.01。days 非該当日の発症確率(新 stream "disaster")
  duration_days: 1              # 1回の災害の継続日数
  kind: 台風                    # 災害の種類(台風/地震/大雪。プロンプト・イベントの語)
  grievance: 0.0                # ★ON 推奨: 例 0.06。災害中の不満増分(factors 経由・1日1回。0.0=観測のみ)
  stay_home_bias: 0.0           # ★ON 推奨: 例 0.7。災害中に住民が在宅(外出抑制)になる確率(新 stream "disaster")
  suspend_transit: true         # 災害中に電車を運休にするか(交通麻痺。false で運休なし)
  # ---- 交通の遅延・遅刻・運休(独立。定刻ダイヤを新 stream "disaster" で乱す)----
  delay_prob: 0.0               # ★ON 推奨: 例 0.05。日次の遅延/運休発生確率(新 stream "disaster")
  suspend_prob: 0.0             # ★ON 推奨: 例 0.3。遅延日のうち運休(has_service 停止)になる確率(残りは遅延=grievanceのみ)
  delay_grievance: 0.0          # ★ON 推奨: 例 0.02。遅延/運休に遭遇した街内の人の不満増分(factors 経由。0.0=観測のみ)
  # ---- インフラ障害(停電/通信断/断水。軽実装)----
  outage_prob: 0.0              # ★ON 推奨: 例 0.02。日次の障害発生確率(新 stream "disaster")
  outage_kind: 停電             # 障害の種類(停電/通信断/断水)
  outage_duration_days: 1       # 障害の継続日数
  outage_grievance: 0.0         # ★ON 推奨: 例 0.03。障害中の不満増分(factors 経由・1日1回。0.0=観測のみ)

# ---- 生活の偶発イベント層(第54バッチ 2026-07-23。純観察=不確実性許容モードの柱。既定 OFF=現行挙動と完全同一)----
# ユーザー要望(2026-07-23): 「純粋な観察なので不確実性を許容できるシミュレーション」を選べるように。
# システムの決定論(同 seed 同結果)は壊さず、「エージェント視点の不確実な世界」= 人生に効く偶発イベント層で与える。
# 実装 src/society/chance.py + scheduler の _phase_chance。日境界に専用 stream "chance"((agent, day) 個体別キー=
# 編成順非依存)で 1人1日 daily_rate の確率で偶発事に遭い、重み付きカタログから1件を適用する:
#   windfall(臨時収入=拾得/還付/当選小口。money+)/ loss(財布紛失/急な出費。money−)/ encounter(偶然の再会・
#   出会い。近傍 or 関係台帳の既知相手と closeness+ を双方に)。効果は money/relations/記憶のみ=ドライブ/発火に流さ
#   ない(k の同定を汚さない)。運/実力分解(scripts/analyze_luck.py)では audit_uncertainty.LUCK_KINDS 経由で
#   chance_event が運側説明変数になり、windfall/loss で「収入は運にほぼ無感応(第51実測 ΔR²≈0.001)」の穴に外生分散を
#   狙って注入できる(=ダイナミズムを設計変数として制御。docs/research/uncertainty-audit.md §4)。
# ---- 較正根拠(現実の桁) ----
#   daily_rate 0.03 = 1人1日 3%(≈月1回、何か「想定外の偶発事」に遭う)。第51監査の平常日実測「住民の 96% が
#     1日 平均5件超の想定外(寄り道/中断/退屈探索/被害/発症)を経験」の中で、金銭/出会いに効く節目イベントは
#     もっと稀=月オーダー、という桁に合わせた保守既定。★ダイナミズムを厚くしたい観察ランは daily_rate や money 幅を
#     上げる(income の運感度が直に上がる=audit_uncertainty で観測)。
#   money 1,000〜20,000 円 = 経済スケール(会社員 日給 12,000・食事 900・買い物 2,500)に対し「小銭〜給料1日弱」。
#     拾得/還付/小口当選・財布の現金相当。loss は手持ちの範囲(現金の外生流出。0 未満にはしない)。
#   encounter weight 2.0(windfall/loss は各 1.0)= 偶然の再会は最も日常的(第51実測: 関係数は運が主経路 ΔR²≈0.19)
#     ため他より厚く。closeness 1.5 = relations の tier 閾値(知人 2.0)に一歩近づく1回の再会。
# R1: 新 stream "chance" 1本のみ・追加 LLM 呼ゼロ=呼数 k 非依存。enabled=false で chance_event 0 件・"chance"
#   stream も引かない=ゴールデン L1 バイト一致。production/daily は触らない(純観察は conf/observe.yaml で束ねる)。
chance:
  enabled: false                # ★純観察ラン(不確実性許容)で ON。false=現行挙動と完全同一(バイト一致)
  daily_rate: 0.03              # 1人1日あたり偶発事に遭う確率(≈月1回。上げると income の運感度が上がる)
  events:                       # データ駆動カタログ(重み付き抽選)
    windfall:  {weight: 1.0, money_lo: 1000, money_hi: 20000}   # 臨時収入(拾得/還付/当選小口)= money+
    loss:      {weight: 1.0, money_lo: 1000, money_hi: 20000}   # 財布紛失/急な出費 = money−(手持ちの範囲)
    encounter: {weight: 2.0, closeness: 1.5}                    # 偶然の再会/出会い = closeness+(双方)

# ---- 宿泊・ホテル滞在(第9バッチ Wave L 2026-07-07。既定 OFF=現行挙動と完全同一)----
# 来街者(visitor)が夜の帰宅退出の代わりにホテルへ宿泊する(実装 src/society/lodging.py +
# scheduler の _maybe_lodge/_lodging_checkin/_phase_lodging)。夜の帰宅(homing)の退出時に
# 新 stream "lodging" で抽選→最寄り hotel POI へ→チェックイン(lodging_checkin+spend
# cat="lodging")→建物内で就寝(内省=k 処置も自宅就寝と同格に発火)→checkout_hour に
# チェックアウト。連泊は max_nights まで(毎晩支払い。帰宅=退出でリセット)。
# R1: generate() を足さない。宿泊は物理位置を変え FixedLLM で ON!=OFF になりうるが、機構は
# k・内面状態を読まない=compute_matched 下の k 不変性で担保(G4/G5/H1 と同型)。
# 既定 OFF=抽選せず・lodging_checkin/checkout 0 件・"lodging" stream も引かない(ゴールデンを守る)。
lodging:
  enabled: false                # ★ON 推奨(本番): true(hotel POI が地図に無ければ ON でも完全 no-op)
  price_per_night: 12000        # 1泊の宿泊費(spend cat="lodging")
  prob: 0.4                     # 夜の帰宅退出の代わりにホテル泊を選ぶ確率(所持金が足りる visitor のみ)
  checkout_hour: 9              # チェックアウト時刻(この時刻に活動再開)
  max_nights: 3                 # 連泊の上限(超えたら帰宅=範囲外退出)

# ---- 観光・多言語・犯罪・治安(現実ギャップ 後続波 H5 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 渋谷の街の多様性と負の相互作用を最小・非LLM・決定論で載せる(実装 src/society/diversity.py)。4機構:
#  観光客・訪日客: visitor の一部を「回遊型の観光客」に決定論(名簿・id 順)で仕立て、自由時間の行き先を
#    landmark_score 高ノード(イメージアビリティ、既存 Lynch と同素材)へ寄せる(tourist_visit・専用 stream
#    "tourist")。プロンプト文脈「観光で来ている」。
#  多言語・文化の多様性: 一部を非日本語話者に決定論で仕立て、語の採用(labeling)で異言語間は採用閾値を
#    上げる(伝播障壁=語が言語をまたぐと広まりにくい)。プロンプト文脈「主に○○語を話す」。
#  犯罪・迷惑行為: 街内で窃盗(被害者 money−+grievance を factors 経由)・迷惑行為(その場の周囲の grievance)を
#    発生させる(crime/nuisance・専用 stream "crime")。近傍(同ノード)に警察官(G3)が居れば抑止。
#  治安の体感・回避: 犯罪履歴のあるノード=危険地帯を、自由時間の行き先(EPR)から避ける(空間行動の変化)。
# R1: どの機構も generate() を1本も足さない。観光属性・言語属性は名簿からの決定論付与、観光回遊/犯罪発生は
#   専用 stream(既存 draw 順に挿入しない)、伝播障壁は言語属性からの純関数、危険地帯回避は犯罪履歴(観測量)
#   からの決定論。観光回遊・犯罪(被害者 money−)・危険地帯回避は物理位置=対面 co-location を変えうる(=FixedLLM
#   で ON!=OFF になりうる=career G5 / crowd G4 / 健康 H1 / 世帯 H2 / 商業 H3 / 災害 H4 と同型)が、機構は k・内面
#   状態を読まず名簿・config・新 stream・物理位置・犯罪履歴(k 非依存)のみ参照=compute_matched 下の k 不変性で
#   呼数一致を担保。grievance は drive(発火系)に接続しない。
# 既定 OFF=属性付与なし・観光回遊なし・伝播障壁なし・犯罪/迷惑なし・危険地帯回避なし・"tourist"/"crime" stream も
#   引かない=イベント 0 件・乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。新イベント種は crime /
#   nuisance / tourist_visit(schema.py 登録済み)。
society_diversity:
  enabled: false                # ★ON 推奨(本番): true(街の多様性と負の相互作用を有効化。観光は要 visitor 入り名簿、犯罪抑止は要 警察官入り名簿)
  # ---- 観光客・訪日客(回遊型)----
  tourist_ratio: 0.0            # ★ON 推奨: 例 0.5(visitor のうち観光客にする割合。決定論・id 順)
  tourist_bias: 0.7            # 自由時間にランドマークへ回遊する確率/step(stream "tourist")
  landmark_top: 8              # 回遊先候補にする上位ランドマーク数
  # ---- 多言語・文化の多様性 ----
  foreign_ratio: 0.0            # ★ON 推奨: 例 0.2(非日本語話者にする割合。決定論・id 順)
  languages: [英語, 中国語, 韓国語]  # 割り当てる言語ラベル(循環)
  cross_lang_barrier: 2         # 異言語間の語採用に必要な追加聴取回数(伝播障壁)
  # ---- 犯罪・迷惑行為 ----
  crime_prob: 0.0               # ★ON 推奨: 例 0.005(街内の1人1stepあたりの窃盗発生確率。stream "crime")
  nuisance_prob: 0.0            # ★ON 推奨: 例 0.005(迷惑行為の発生確率。stream "crime")
  theft_amount: 3000.0          # 窃盗の被害額(被害者 money−。現金の範囲で)
  crime_grievance: 0.0          # ★ON 推奨: 例 0.08(窃盗被害者の不満増分。factors 経由。0.0=金銭のみで grievance 不変)
  nuisance_grievance: 0.0       # ★ON 推奨: 例 0.03(迷惑行為の周囲の不満増分。factors 経由。0.0=観測のみ)
  nuisance_kinds: [客引き, ナンパ, 喧嘩, 路上の騒ぎ]  # 迷惑行為の種類(決定論で選択)
  # ---- 治安の体感・回避 ----
  danger_threshold: 3           # 犯罪履歴回数がこれ以上のノード=危険地帯(避ける)。0 以下=回避無効
  avoid_danger: true            # 危険地帯を自由時間の行き先から避ける(enabled 時のみ効く)
