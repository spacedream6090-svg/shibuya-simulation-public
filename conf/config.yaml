  band_start_min: 600           # 回遊帯の開始(分 of day)= 10:00
  band_end_min: 1320            # 回遊帯の終了(分 of day)= 22:00

# ---- 火種介入の実験条件化(spark treatment 第53バッチ 2026-07-23。ユーザー要望。既定 OFF=現行挙動と完全同一)----
# 「立ち上げには初期介入が不可欠」という外部の助言と「介入ゼロで観測」という本プロジェクト方針の対立を、
# ON/OFF 可能な treatment として実験で決着させるブロック。介入は hardcode せず、初期条件・環境の差
# (初期関係の束/初期資本・在庫/定期集会アンカー)としてのみ与える。★プロンプトへの台本注入は一切しない。
# 実装 src/society/spark.py(選抜・較正値はここと spark.py にのみ=no-fingerprint 契約)。事後トレーサ
# scripts/trace_spark.py が spark_roster を起点に「sparked 発の現象か」を L1 から追跡(語彙可視化の資産を再利用)。
# 設計絶対条件: (1)選抜は trait-blind 既定=(pid, spark.seed)の安定ハッシュ純関数=無作為(traits を読まない
#   =生得/創発の交絡を排除。ids 明示指定は許可)。(2)decay が効くのは (c)集会アンカーのバイアス強度のみ
#   (a 関係/b 資本・在庫は t=0 一発=減衰対象外)。(3)イベント毎の spark タグは付けず t=0 名簿1件のみ記録。
# 決定論・run.seed 非依存: 選抜・(a)(b)(c)適用とも乱数ゼロ(spark.seed 固定なら run.seed 変更でも同一名簿)。
# 既定 OFF=何も選抜/適用せず・spark_roster も出さず・"spark" stream も引かない=バイト一致(ゴールデンを守る)。
spark:
  enabled: false                # ★実験 treatment(ON/OFF 比較で回すかは D13=GPU 予算判断)
  seed: 20260723                # 選抜の安定ハッシュ種(run.seed 非依存=別ランで同一名簿)
  n: 5                          # 無作為選抜の人数(ids が空のとき)
  ids: []                       # 名簿明示指定(pid か agent.id の文字列。空なら trait-blind 無作為選抜)
  menus:                        # 3メニュー各個別 ON/OFF
    relations:                  # (a) 初期関係の束: sparked 相互+近傍を友人 closeness へ注入(t=0 一発・減衰対象外)
      enabled: true
      closeness: 5.0            # 注入する closeness(relations の友人 tier2 相当=閾値 5.0)
      mutual_k: 4               # 各 sparked に束ねる近傍人数(同 home_building 優先→id 近傍)
    capital:                    # (b) 初期資本・在庫: money 上乗せ+(商業 POI 保持者なら)在庫上乗せ(t=0 一発・減衰対象外)
      enabled: true
      money: 50000             # 手持ちへの上乗せ(円。会社員初期レンジ相当の頭金)
      stock: 20                # 商業 POI 在庫の上乗せ(単位。goods.inventory ON 時のみ実効)
    anchor:                     # (c) 集会アンカー: 共通 POI へ band 内の自由時間を寄せる(bias は step で指数減衰)
      enabled: true
      poi_cat: leisure          # 集会 POI のカテゴリ((poi_cat, seed)純関数で全 sparked 共通の1 POI を決定)
      band: [1020, 1320]        # 寄せる時間帯 [開始, 終了)(分 of day)= 17:00-22:00
      bias: 0.5                 # 寄せる基礎確率/step(新 stream "spark")
      decay: 0.02               # step 経過での指数減衰係数(bias × exp(-decay × step)=介入が初期だけ効く)

# ---- 商業・店舗のダイナミクス(現実ギャップ 後続波 H3 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 現状 POI(店・会社)は静的で常時営業・価格固定。商業の動きを最小・非LLM・決定論で載せる
# (実装 src/society/commerce.py)。3機構(都市再開発=地図が変わる機構は本波では作らない=注記に留める):
#  営業時間: POI のカテゴリから開閉時刻を時刻の純関数で決める(乱数不要)。閉店中のカテゴリは routine の
#    行き先候補(食事/買物/夜遊び先)から除外し、開閉遷移を shop_state(カテゴリ単位=1日数件・sparse)で記録。
#  動的価格・需給: その POI/時間帯の需要(在館数=観測量)に応じて価格係数を決定論で消費額に掛ける
#    (混雑した店で高く=surge、閑散でセール<1)。price_change(cat, ratio)。★係数は既存 spend 抽選の外で掛ける
#    (economy の _poi_price/spend の draw を汚さない)。price_sensitivity=0.0=恒等=不変。
#  在庫・品切れ・行列: 需要が stock_threshold 超の POI で資源希少化(品切れ/行列)= その場の購入抑制 + 不満
#    (factors 経由 on_scarcity)。stock_out(poi, cat)。
# R1: どの機構も generate() を1本も足さない。閉店による行き先除外は物理位置=対面 co-location を変えうる
#   (=FixedLLM で ON!=OFF になりうる=career G5 / crowd G4 / 健康 H1 / 世帯 H2 と同型)が、機構は k・内面状態を
#   読まず時刻・config・在館数(観測量)のみ参照する=compute_matched 下の k 不変性で呼数一致を担保する。
#   動的価格・在庫は移動を変えない(消費額・購入可否のみ)=呼数に無関係。品切れ→grievance は drive 非接続。
# 既定 OFF=営業時間ゲートなし(全 POI 常時営業扱い)・価格係数なし(消費額不変)・品切れなし・
#   shop_state/price_change/stock_out とも 0 件・乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。
commerce:
  enabled: false                # ★ON 推奨(本番): true(商業の動き=営業時間・動的価格・在庫を有効化)
  # ---- 営業時間(cat → [開店時, 閉店時]。24h表記。閉<=開 は翌朝までの夜間営業。未掲載カテゴリは常時営業)----
  hours:
    food: [11, 23]              # 飲食店 11:00〜23:00
    shop: [10, 21]              # 物販 10:00〜21:00
    nightlife: [18, 5]          # 夜遊び 18:00〜翌05:00(夜間営業)
  # ---- 動的価格(需給。在館数=需要 が demand_ref を超えると係数>1=surge、下回るとセール<1)----
  price_sensitivity: 0.15       # 在館数 1 人差あたりの価格係数変化(0.0=恒等=消費額不変)
  demand_ref: 2                 # 基準需要(在館数)。これと同数で係数 1.0
  price_min: 0.7                # 価格係数の下限(セール)
  price_max: 1.6                # 価格係数の上限(surge)
  # ---- 在庫/品切れ・行列(在館数が stock_threshold 以上で品切れ/行列=購入抑制+不満)----
  stock_threshold: 6            # これ以上の在館で品切れ/行列(0 以下=在庫機構 無効)
  stock_grievance: 0.02         # ★ON 推奨: 例 0.02。品切れ/行列に遭遇→不満(factors 経由。0.0=観測のみ=grievance 不変)
  # ---- 物流の実体化 スライス①+②(実装 src/society/goods.py。設計 docs/research/economy-goods-services.md §7 ①②)----
  # 店舗在庫((s,S) 方策)+ 日次補充トリップ(depot=最寄りゲートウェイ→店=delivery_trip→到着で restock)+
  # 商品実体(何を買ったか=spend.item)。決定論・非LLM・乱数ゼロ(R1: 品切れは spend 抑制のみ・補充は
  # agent_id=-1 の世界イベント=個体位置を変えない・新 stream を引かない)。封鎖(災害の運休/摂動 shock_closure)で
  # 補充失敗→欠品波及。上記 commerce.enabled とは独立に効く(inventory.enabled のみで判定)。
  # 既定 OFF=在庫実体なし・delivery_trip/restock/stock_low/stock_out(実在庫版)0 件・所持も生えない=バイト一致。
  inventory:
    enabled: false              # ★ON 推奨(本番): true(実在庫・日次補充トリップ・商品実体を有効化)
    # (s,S) 方策: 在庫が発注点 s(reorder_point)以下で上限 S(capacity=order-up-to)まで補充発注(正典 §3.2/§3.4 較正)
    capacity:      { food: 40, cafe: 40, shop: 30, nightlife: 30 }   # 上限 S = 初期在庫(生鮮 food は回転が速い=厚め)
    reorder_point: { food: 12, cafe: 12, shop: 8,  nightlife: 8 }    # 下限 s = 発注点(food は高め=補充が早く走る)
    default_capacity: 30        # capacity 未掲載カテゴリの既定 S
    default_reorder_point: 8    # reorder_point 未掲載カテゴリの既定 s
    consume_units: 1            # 1購入あたりの在庫消費単位
    lead_time_steps: 3          # 発注→到着(配送トリップの走行時間)のリードタイム(step)
    restock_hour: 4             # 日次補充レビューの時刻(時。物流が街を走る時間帯=正典 §3.4)
    stockout_grievance: 0.02    # 実在庫の品切れで購入不成立に遭遇→不満(factors on_scarcity。0.0=観測のみ)
    belongings_max: 8           # 本人の所持(直近購入)の有界リスト長
    # 商品カタログ(カテゴリ→具体商品テキスト=家計調査費目と整合する粒度。日替わり巡回で決定論に選ぶ)
    catalog:
      food:      [ラーメン, 定食, カレー, 寿司]
      cafe:      [コーヒー, 紅茶, ケーキ, サンドイッチ]
      shop:      [Tシャツ, 雑貨, 文房具, 日用品]
      nightlife: [カクテル, ビール, ハイボール]
    # ---- B2B 卸→小売の仕入れ スライス⑤(実装 src/society/b2b.py。設計 §7 ⑤)----
    # ON 時: 上の補充(restock)の供給元を「外生 depot(街の外のゲートウェイ)」から **卸 org** へ内生化する。
    #   卸/製造 org(organizations の output_kinds に素材/製品=goods/food を持つ org)が勤務完遂ごとに生産で
    #   在庫を積み(production_units)、小売の補充がその在庫から引かれ、org 間で金+物が移転(卸=売上・小売=
    #   仕入費。org_ledger の会計流儀=買い側支出=売り側売上で保存)。卸在庫不足=補充失敗(封鎖時と同じ経路=
    #   欠品波及)。物流トリップ(delivery_trip)は再利用(出発地=卸 org の所在ノード)。全決定論・乱数ゼロ。
    #   要 organizations.enabled=true(卸 org が居ないと外生 depot 扱いで graceful=b2b_trade 0 件)。
    # 既定 OFF=補充供給元は外生 depot のまま・b2b_trade 0 件・卸在庫台帳も生えない=バイト一致。
    b2b:
      enabled: false            # ★ON 推奨(本番): true(要 organizations.enabled=true。供給網の内生化=組織創発)
      supply_kind:              # 小売カテゴリ → 卸が供給する output_kind(実データ実査: food系→food・shop→goods)
        food: food
        cafe: food
        nightlife: food
        shop: goods
      production_units: 8       # 卸 org の勤務完遂1回で増える在庫量(生産)
      initial_stock: 0          # 卸の起動時在庫(0=生産で立ち上げ。>0 で即出荷可能)
      default_wholesale_price: 300  # 1単位あたりの仕入単価(卸値。cat 別に wholesale_price で上書き可)
      wholesale_price: {}       # 例: { food: 250, shop: 800 }(未掲載は default_wholesale_price)

# ---- サービスの実体化 スライス③(実装 src/society/services.py。設計 docs/research/economy-goods-services.md §7 ③)----
# service/education カテゴリの POI で「滞在して効果を受ける」最小形。来店=自由時間の行き先バイアス(routine の
# dest チェーン中立1分岐=date/joint と同型)+ 受給=課金(_spend)+ 効果(factors on_service へ帯 band と不透明
# magnitude)+ 記憶 + service_use。来店抽選は専用 stream "service"(既存 draw 順に不干渉)、利用率は現実頻度に桁を
# 合わせて較正(理美容=月1-2回・ジム/塾=週1-2回・クリーニング=週1回・任意受診=年数回)。R1: generate() を1本も
# 足さない(来店は既存 routine 発火に相乗り)。判定は年齢・所持金・時刻・物理位置・config のみ=k 非依存。
# 供給側 serve(work.service)との seam: 受給の spend は cat=spend_cat(既定 "service")で出る=work.serve_by_cat に
#   "service" を写像すれば同一 work_node の勤務中スタッフに serve が帰属し需要側 service_use と対になる。
# 既定 OFF=来店せず・"service" stream も引かない・service_use/効果とも 0 件=ゴールデン golden_baseline_l1.json をバイト一致で守る。
services:
  enabled: false                # ★ON 推奨(本番): true(service/education POI を経済的に起こす=ユーザー要望・渋谷再現)
  spend_cat: service            # 受給の _spend の cat(work.serve_by_cat と対の seam。消費税等は既存経路)
  open_from: 9                  # サービス営業帯の開始(時)
  open_to: 20                   # サービス営業帯の終了(時)
  radius_m: 700                 # 来店先を探す現在地の近傍半径(m)
  free_steps_ref: 48            # 日次利用率→per-step 化の基準自由 step 数(1日の自由行動 step の目安。桁較正の分母)
  # サービス定義テーブル(cats=ホスト POI カテゴリ / hints=POI 名の部分一致=空なら当該カテゴリの任意 POI /
  #   price=料金 / stay=滞在step / band=効果の帯(mood=気分/vitality=活力/learning=学習素地)/ magnitude=効果の
  #   不透明量(0.0=観測のみ)/ daily_rate=日次利用率(較正)/ age=[min,max] 該当年齢帯 / remember=記憶1行 /
  #   dev_axis+dev_gain+dev_remember=T4 自助努力の累積軸(下の self_dev.enabled=true のときだけ効く。塾→skill=
  #   賃金へ結ぶ唯一の経路 / ジム→fitness=観測のみ。gain/(1+現在値) の逓減で累積))
  services:
    grooming: {cats: [service], hints: [美容, 理容, 床屋, サロン, ヘア, ネイル], price: 4000, stay: 3, band: mood,     magnitude: 0.03,  daily_rate: 0.05,  age: [12, 90],  remember: 髪を整えて気分が上がった}
    # ★exclude_subcats(H2 是正): 地図 v8 の総合病院(subcat=hospital)は名前ヒントに当たる
    #   ものが実在する(「〜クリニック」)。病院は救急の**搬送先**であって健診で歩いて行く
    #   場所ではないのでここから除く。subcat を持たない地図では何も落ちない=完全同値。
    clinic:   {cats: [service], hints: [クリニック, 医院, 診療, 歯科, 内科, 眼科], exclude_subcats: [hospital], price: 3000, stay: 2, band: vitality, magnitude: 0.02,  daily_rate: 0.012, age: [0, 120],  remember: 健康のために受診してきた}
    lesson:   {cats: [education, service], hints: [塾, スクール, 教室, 予備校, アカデミー], price: 5000, stay: 3, band: learning, magnitude: 0.02, daily_rate: 0.20, age: [8, 35], remember: 習い事で新しいことを学んだ, dev_axis: skill, dev_gain: 0.08, dev_remember: 学びの積み重ねが力になってきた}
    gym:      {cats: [service, leisure], hints: [ジム, フィットネス, スポーツ, ヨガ, プール], price: 2000, stay: 4, band: vitality, magnitude: 0.025, daily_rate: 0.20, age: [15, 75], remember: ジムで汗を流してすっきりした, dev_axis: fitness, dev_gain: 0.08, dev_remember: ジム通いの成果を感じる}
    laundry:  {cats: [service], hints: [クリーニング, ランドリー, 洗濯], price: 1200, stay: 1, band: mood, magnitude: 0.015, daily_rate: 0.14, age: [18, 90], remember: 衣類を整えてもらった}
    service:  {cats: [service], hints: [], price: 2000, stay: 2, band: mood, magnitude: 0.015, daily_rate: 0.03, age: [12, 100], remember: 用事を済ませてきた}
  # 自助努力 affordance(T4 第52バッチ): 「自力で成長・改善できる」可能性を用意する(成長を強制せず選べる状態)。
  #   反復受給の累積ストック agent.self_dev(skill/fitness)を作り、skill だけを賃金へ結ぶ(=経済成果への1本だけの
  #   間接経路)。既定 すべて OFF/0=会計もイベントも不変(ゴールデン golden_baseline_l1.json をバイト一致で守る)。
  self_dev:
    enabled: false              # ★ON 推奨(本番): true(塾=技能/ジム=体力の反復累積と skill→賃金経路を有効化)
    wage_coef: 0.0              # 賃金乗数 =1 + wage_coef × skill(★ON 較正例: 0.10=skill 1.0 で賃金+10%)。0.0=ON でも会計不変
    decay: 0.0                 # skill/fitness の日次乗算減衰(★ON 較正例: 0.01=維持しないと薄れる→有界均衡)。0.0=減衰なし
    remember_threshold: 0.5    # 累積軸がこの値を初めて越えた時だけ記憶を1行残す(反復の毎回は残さない=騒音回避)

# ---- 宅配・フードデリバリー スライス④(実装 src/society/delivery.py。設計 docs/research/economy-goods-services.md §7 ④)----
# 買い手が来店せず注文→配達員が店で受取(① 在庫を1引く)→配送トリップ→到着で受給+課金 の4段(§3.3 ラストマイル ABM)。
# 注文=在宅/職場滞在の agent が食事帯に外食の代替として選ぶ(専用 stream "delivery" の抽選=order_rate)。配達員=economy の
# gig/自営「配達員」職の agent に業務実体を与える(最寄りの勤務可能な配達員を決定論選定=id 昇順。専任不在なら agent_id=-1 の
# 抽象トリップへ graceful=注文は必ず配送される)。到着で注文者へ課金(食事+配達手数料 fee=定額+距離比例=Uber Eats 相当の
# 簡略化)+ 配達員へ gig 収入(手数料×courier_share=金の保存)。R1: generate() を1本も足さない(注文は routine 食事分岐に
# 相乗り)、乱数は "delivery" stream 1本のみ。判定は物理位置・時刻・所持金・config のみ=k 非依存(注文で在宅に留まる=
# co-location 変化は services/goods と同型=compute_matched 下の k 不変性で担保)。① commerce.inventory と併用で実在庫を消費
# (品切れ店は注文不可)。単独(inventory OFF)でも動く(在庫制約なし=どの食 POI も注文可)。
# 較正(§10): order_rate は出前/宅配=月数回/世帯 の桁に合わせた初期値(1日1回上限=max_per_day)。B 段で調律。
# 既定 OFF=注文せず・"delivery" stream も引かない・order/deliver 0 件=ゴールデン golden_baseline_l1.json をバイト一致で守る。
delivery:
  enabled: false                # ★ON 推奨(本番): true(宅配=来店なし注文・配達員の業務実体・ラストマイル配送を有効化)
  order_rate: 0.02              # 食事帯の在宅/職場滞在 step あたりの注文確率(較正: 出前/宅配=月数回/世帯 の桁)
  windows: [[690, 810], [1080, 1260]]   # 注文受付=食事帯(分 of day)。既定=昼11:30-13:30 / 夜18:00-21:00
  cat: food                     # 宅配対象の POI カテゴリ(食=food)
  radius_m: 1500                # 注文先(店)を探す近傍半径(m)。超過は近傍に店なし=注文不可
  base_fee: 350                 # 定額配達手数料(円。Uber Eats 相当の簡略化=定額+距離比例まで)
  per_km_fee: 100               # 距離比例の配達手数料(円/km)
  courier_share: 0.7            # 配達手数料のうち配達員の取り分(残りはプラットフォーム手数料)
  eta_m_per_step: 500           # 配送トリップの走行速度換算(m/step。1 step=10分)。eta=距離/これ(min/max で丸め)
  min_eta_steps: 1
  max_eta_steps: 6
  courier_occupation: 配達員     # 配達員の職業(economy の gig/自営。この職の agent に配達業務が帰属)
  max_per_day: 1                # 1日1個体あたりの宅配注文上限(現実頻度=月数回に桁を合わせる上限)
  menu: [弁当, ラーメン, カレー, ピザ, 寿司]   # ① goods カタログが無い/OFF のときの注文品(日替わり巡回で決定論)

# ---- 都市・環境インフラのショック(現実ギャップ 後続波 H4 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 生活を麻痺させる外生ショック=集団的 grievance の源。既存の scenario/transit の最小拡張(独立 phase。
# 都市再開発=地図が時間で変わる機構は本波では作らない=注記に留める)。実装 src/society/disaster.py。3機構:
#  災害(disaster): 台風/地震/大雪など。発生日(days)or 確率(onset_prob)で発動し、発生中は
#    交通麻痺(電車運休=transit.has_service 停止=駅経由の退出/帰還を止める)+ 外出抑制(在宅=routine が
#    自宅へ寄せる。stay_home_bias)+ 強い grievance(factors 経由)+ プロンプト文脈(「台風で交通が麻痺…」)。
#    発生/解除を disaster(agent_id=-1, phase=onset/clear)で記録。
#  交通の遅延・運休(transit_delay): 電車は現状 定刻(乱れなし)。日次に遅延/運休を新 stream "disaster" で
#    注入(既存の定刻ダイヤの draw は汚さない)。運休日は has_service 停止。乗れない/遅れる→grievance。
#  インフラ障害(infra_outage): 停電/通信断/断水=生活麻痺。軽実装=在宅娯楽(media)・スマホ(SNS/検索等)の
#    一部を抑制 + grievance。発生/解除を infra_outage で記録。
# R1: どの機構も generate() を1本も足さない。発生/遅延/障害の確率判定は新 stream "disaster"(既存 draw 順に
#   挿入しない=決定論)、発生日指定は暦不要の day-index からの純関数(乱数なし)。災害(在宅)・運休は物理位置・
#   移動を変え対面 co-location が変化しうる(=FixedLLM で ON!=OFF=career G5 / crowd G4 / 健康 H1 / 世帯 H2 /
#   商業 H3 と同型)が、機構は k・内面状態を読まず day-index・config・新 stream・物理位置のみ参照する=
#   compute_matched 下の k 不変性で呼数一致を担保。grievance は drive(発火系)に接続しない。既存の摂動シナリオ
#   (world.scenario の shock_closure/shock_event)の挙動・イベント列は一切変えない(独立 phase)。
# 既定 OFF=disaster/transit_delay/infra_outage とも 0 件・transit 運休なし・"disaster" stream も引かない=
#   乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。新イベント種は disaster / transit_delay /
#   infra_outage(schema.py 登録済み)。
disaster:
  enabled: false                # ★ON 推奨(本番): true(生活を麻痺させる外生ショック=集団的 grievance の源を有効化)
  # ---- 災害ショック(台風/地震/大雪)----
  days: []                      # 発生日の day-index リスト(run 開始=0。決定論・乱数不要)。例: [10, 45]
  onset_prob: 0.0               # ★ON 推奨: 例 0.01。days 非該当日の発症確率(新 stream "disaster")
  duration_days: 1              # 1回の災害の継続日数
  kind: 台風                    # 災害の種類(台風/地震/大雪。プロンプト・イベントの語)
  grievance: 0.0                # ★ON 推奨: 例 0.06。災害中の不満増分(factors 経由・1日1回。0.0=観測のみ)
  stay_home_bias: 0.0           # ★ON 推奨: 例 0.7。災害中に住民が在宅(外出抑制)になる確率(新 stream "disaster")
  suspend_transit: true         # 災害中に電車を運休にするか(交通麻痺。false で運休なし)
  # ---- 交通の遅延・遅刻・運休(独立。定刻ダイヤを新 stream "disaster" で乱す)----
  delay_prob: 0.0               # ★ON 推奨: 例 0.05。日次の遅延/運休発生確率(新 stream "disaster")
  suspend_prob: 0.0             # ★ON 推奨: 例 0.3。遅延日のうち運休(has_service 停止)になる確率(残りは遅延=grievanceのみ)
  delay_grievance: 0.0          # ★ON 推奨: 例 0.02。遅延/運休に遭遇した街内の人の不満増分(factors 経由。0.0=観測のみ)
  # ---- インフラ障害(停電/通信断/断水。軽実装)----
  outage_prob: 0.0              # ★ON 推奨: 例 0.02。日次の障害発生確率(新 stream "disaster")
  outage_kind: 停電             # 障害の種類(停電/通信断/断水)
  outage_duration_days: 1       # 障害の継続日数
  outage_grievance: 0.0         # ★ON 推奨: 例 0.03。障害中の不満増分(factors 経由・1日1回。0.0=観測のみ)

# ---- 生活の偶発イベント層(第54バッチ 2026-07-23。純観察=不確実性許容モードの柱。既定 OFF=現行挙動と完全同一)----
# ユーザー要望(2026-07-23): 「純粋な観察なので不確実性を許容できるシミュレーション」を選べるように。
# システムの決定論(同 seed 同結果)は壊さず、「エージェント視点の不確実な世界」= 人生に効く偶発イベント層で与える。
# 実装 src/society/chance.py + scheduler の _phase_chance。日境界に専用 stream "chance"((agent, day) 個体別キー=
# 編成順非依存)で 1人1日 daily_rate の確率で偶発事に遭い、重み付きカタログから1件を適用する:
#   windfall(臨時収入=拾得/還付/当選小口。money+)/ loss(財布紛失/急な出費。money−)/ encounter(偶然の再会・
#   出会い。近傍 or 関係台帳の既知相手と closeness+ を双方に)。効果は money/relations/記憶のみ=ドライブ/発火に流さ
#   ない(k の同定を汚さない)。運/実力分解(scripts/analyze_luck.py)では audit_uncertainty.LUCK_KINDS 経由で
#   chance_event が運側説明変数になり、windfall/loss で「収入は運にほぼ無感応(第51実測 ΔR²≈0.001)」の穴に外生分散を
#   狙って注入できる(=ダイナミズムを設計変数として制御。docs/research/uncertainty-audit.md §4)。
# ---- 較正根拠(現実の桁) ----
#   daily_rate 0.03 = 1人1日 3%(≈月1回、何か「想定外の偶発事」に遭う)。第51監査の平常日実測「住民の 96% が
#     1日 平均5件超の想定外(寄り道/中断/退屈探索/被害/発症)を経験」の中で、金銭/出会いに効く節目イベントは
#     もっと稀=月オーダー、という桁に合わせた保守既定。★ダイナミズムを厚くしたい観察ランは daily_rate や money 幅を
#     上げる(income の運感度が直に上がる=audit_uncertainty で観測)。
#   money 1,000〜20,000 円 = 経済スケール(会社員 日給 12,000・食事 900・買い物 2,500)に対し「小銭〜給料1日弱」。
#     拾得/還付/小口当選・財布の現金相当。loss は手持ちの範囲(現金の外生流出。0 未満にはしない)。
#   encounter weight 2.0(windfall/loss は各 1.0)= 偶然の再会は最も日常的(第51実測: 関係数は運が主経路 ΔR²≈0.19)
#     ため他より厚く。closeness 1.5 = relations の tier 閾値(知人 2.0)に一歩近づく1回の再会。
# R1: 新 stream "chance" 1本のみ・追加 LLM 呼ゼロ=呼数 k 非依存。enabled=false で chance_event 0 件・"chance"
#   stream も引かない=ゴールデン L1 バイト一致。production/daily は触らない(純観察は conf/observe.yaml で束ねる)。
chance:
  enabled: false                # ★純観察ラン(不確実性許容)で ON。false=現行挙動と完全同一(バイト一致)
  daily_rate: 0.03              # 1人1日あたり偶発事に遭う確率(≈月1回。上げると income の運感度が上がる)
  events:                       # データ駆動カタログ(重み付き抽選)
    windfall:  {weight: 1.0, money_lo: 1000, money_hi: 20000}   # 臨時収入(拾得/還付/当選小口)= money+
    loss:      {weight: 1.0, money_lo: 1000, money_hi: 20000}   # 財布紛失/急な出費 = money−(手持ちの範囲)
    encounter: {weight: 2.0, closeness: 1.5}                    # 偶然の再会/出会い = closeness+(双方)

# ---- 遺失物ループ H3 = 完全内生の事件(実装 src/society/lost_property.py。既定 OFF=現行と完全同一)----
# 正典: docs/plans/body-incident-layer-plan.md §3(遺失物行)+ §4(chance_event の溶解)。
# 落とす(移動/飲酒/混雑のハザード)→ 気づく(品目別の遅れ+遺失届)→ 拾う(落下地点の共在=
# sim.percept_index)→ 届ける/無視/着服 → 交番 → 返還+報労金5-20%(遺失物法28条)/ 3か月時効(同7条)。
# ★上の chance.windfall(臨時収入=拾得)の**構造的な代替**: 拾得金は必ず誰かの drop から出る
#   =貨幣保存(IF-E ゼロ和検査)と整合する。chance の退役は H3+H4 完了後の別バッチ。
# 較正の出どころは lost_property.py の docstring「較正」節(警視庁 拾得454万件/年 → 渋谷来街者
# スケール ≈2.9e-3件/人日 / 東京都遺失物センターの品目別返還率 傘1%・財布60-80%・携帯87%)。
# R1: 新 stream "lost_drop" 1本のみ(落とすかどうかだけが確率事象)・追加 LLM 呼ゼロ。
lost_property:
  enabled: false                # ★false=完全 no-op(L1 バイト一致)。true で遺失物ループが動く
  # ---- ① 落とす: 共変量を1つも掛けない基底の落下率[件/人日]。品目構成は警視庁の受理内訳の桁 ----
  base_daily:                   # 合計 2.0e-3。曝露分布で期待値化すると実現 2.92e-3=都実測の目標
    umbrella: 0.00008           # 傘   (実現構成比 7.4%。警視庁の受理内訳の桁)
    wallet:   0.00016           # 財布 (8.7%)
    phone:    0.00016           # 携帯 (8.7%)
    other:    0.00160           # その他(証明書類・衣類等が大半=75.1%)
  move_mult: 1.8                # 移動中(経路を持っている)=遺失の主戦場
  crowd_mult: 1.5               # 混雑ノード(財布・携帯)
  crowd_threshold: 8            # 同一ノードの在場者数(これ以上を「混雑」と呼ぶ)
  drink_mult: 3.0               # 飲酒(夜の nightlife ノード。財布・携帯のみ)
  rain_mult: 5.0                # 雨/雪の日(傘のみ)
  dry_mult: 0.2                 # 雨でない日の傘(そもそも持ち歩いていない)
  indoor_mult: 2.0              # 店内の置き忘れ(傘のみ)
  drink_start_min: 1080         # 飲酒帯の始まり 18:00(分 of day)
  drink_end_min: 300            # 同・終わり 05:00(日をまたぐ帯)
  drink_cats: ["nightlife"]
  indoor_cats: ["shop", "food", "cafe", "nightlife"]
  # ---- ② 気づく/引き取る: notice_prob × claim_prob が実測の品目別返還率になる ----
  notice_delay:                 # 紛失に気づくまでの遅れ(携帯は即・傘は次に降るまで)
    phone: 1
    wallet: 3
    other: 9
    umbrella: 18
  notice_prob:  {phone: 0.99, wallet: 0.98, other: 0.60, umbrella: 0.35}
  claim_prob:   {phone: 0.92, wallet: 0.73, other: 0.36, umbrella: 0.03}
  # ---- ③ 拾う/届ける/着服 ----
  pickup_prob:  {phone: 0.80, wallet: 0.85, other: 0.45, umbrella: 0.25}
  turnin_prob: 0.78             # 拾った人が届ける確率(1−これ=着服)。日本の財布返還実験の水準
  temptation: 0.25              # 金額が大きいほど着服へ傾く強さ(0=金額に無感応)
  guardian_mult: 1.20           # 監視者(同席者)が居るときの届ける倍率(RAT の guardianship)
  # ---- ④ 金(すべて家計間の直接授受=総額は1円も増減しない)----
  wallet_cash_frac: 0.35        # 財布に入れて持ち歩く現金の割合(所持金比)
  wallet_cash_max: 50000
  item_value:   {umbrella: 1500, wallet: 3000, phone: 60000, other: 3000}
  reward_lo: 0.05               # 報労金の下限(遺失物法28条: 5%以上)
  reward_hi: 0.20               # 同・上限(20%以下)
  # ---- ⑤ 時間 ----
  statute_steps: 12960          # 3か月時効(遺失物法7条)= 90日
  abandon_steps: 432            # 誰にも拾われないまま消えるまで = 3日
  # ---- ⑥ 安全弁 ----
  max_events_per_step: 24       # 本 module が1 step に出す L1 件数の上限
  max_items: 4096               # 同時に存在する未解決の遺失物の上限

# ---- 宿泊・ホテル滞在(第9バッチ Wave L 2026-07-07。既定 OFF=現行挙動と完全同一)----
# 来街者(visitor)が夜の帰宅退出の代わりにホテルへ宿泊する(実装 src/society/lodging.py +
# scheduler の _maybe_lodge/_lodging_checkin/_phase_lodging)。夜の帰宅(homing)の退出時に
# 新 stream "lodging" で抽選→最寄り hotel POI へ→チェックイン(lodging_checkin+spend
# cat="lodging")→建物内で就寝(内省=k 処置も自宅就寝と同格に発火)→checkout_hour に
# チェックアウト。連泊は max_nights まで(毎晩支払い。帰宅=退出でリセット)。
# R1: generate() を足さない。宿泊は物理位置を変え FixedLLM で ON!=OFF になりうるが、機構は
# k・内面状態を読まない=compute_matched 下の k 不変性で担保(G4/G5/H1 と同型)。
# 既定 OFF=抽選せず・lodging_checkin/checkout 0 件・"lodging" stream も引かない(ゴールデンを守る)。
lodging:
  enabled: false                # ★ON 推奨(本番): true(hotel POI が地図に無ければ ON でも完全 no-op)
  price_per_night: 12000        # 1泊の宿泊費(spend cat="lodging")
  prob: 0.4                     # 夜の帰宅退出の代わりにホテル泊を選ぶ確率(所持金が足りる visitor のみ)
  checkout_hour: 9              # チェックアウト時刻(この時刻に活動再開)
  max_nights: 3                 # 連泊の上限(超えたら帰宅=範囲外退出)

# ---- 観光・多言語・犯罪・治安(現実ギャップ 後続波 H5 2026-07-07。すべて既定 OFF=現行挙動と完全同一)----
# 渋谷の街の多様性と負の相互作用を最小・非LLM・決定論で載せる(実装 src/society/diversity.py)。4機構:
#  観光客・訪日客: visitor の一部を「回遊型の観光客」に決定論(名簿・id 順)で仕立て、自由時間の行き先を
#    landmark_score 高ノード(イメージアビリティ、既存 Lynch と同素材)へ寄せる(tourist_visit・専用 stream
#    "tourist")。プロンプト文脈「観光で来ている」。
#  多言語・文化の多様性: 一部を非日本語話者に決定論で仕立て、語の採用(labeling)で異言語間は採用閾値を
#    上げる(伝播障壁=語が言語をまたぐと広まりにくい)。プロンプト文脈「主に○○語を話す」。
#  犯罪・迷惑行為: 街内で窃盗(被害者 money−+grievance を factors 経由)・迷惑行為(その場の周囲の grievance)を
#    発生させる(crime/nuisance・専用 stream "crime")。近傍(同ノード)に警察官(G3)が居れば抑止。
#  治安の体感・回避: 犯罪履歴のあるノード=危険地帯を、自由時間の行き先(EPR)から避ける(空間行動の変化)。
# R1: どの機構も generate() を1本も足さない。観光属性・言語属性は名簿からの決定論付与、観光回遊/犯罪発生は
#   専用 stream(既存 draw 順に挿入しない)、伝播障壁は言語属性からの純関数、危険地帯回避は犯罪履歴(観測量)
#   からの決定論。観光回遊・犯罪(被害者 money−)・危険地帯回避は物理位置=対面 co-location を変えうる(=FixedLLM
#   で ON!=OFF になりうる=career G5 / crowd G4 / 健康 H1 / 世帯 H2 / 商業 H3 / 災害 H4 と同型)が、機構は k・内面
#   状態を読まず名簿・config・新 stream・物理位置・犯罪履歴(k 非依存)のみ参照=compute_matched 下の k 不変性で
#   呼数一致を担保。grievance は drive(発火系)に接続しない。
# 既定 OFF=属性付与なし・観光回遊なし・伝播障壁なし・犯罪/迷惑なし・危険地帯回避なし・"tourist"/"crime" stream も
#   引かない=イベント 0 件・乱数消費不変(ゴールデン golden_baseline_l1.json を守る)。新イベント種は crime /
#   nuisance / tourist_visit(schema.py 登録済み)。
society_diversity:
  enabled: false                # ★ON 推奨(本番): true(街の多様性と負の相互作用を有効化。観光は要 visitor 入り名簿、犯罪抑止は要 警察官入り名簿)
  # ---- 観光客・訪日客(回遊型)----
  tourist_ratio: 0.0            # ★ON 推奨: 例 0.5(visitor のうち観光客にする割合。決定論・id 順)
  tourist_bias: 0.7            # 自由時間にランドマークへ回遊する確率/step(stream "tourist")
  landmark_top: 8              # 回遊先候補にする上位ランドマーク数
  # ---- 多言語・文化の多様性 ----
  foreign_ratio: 0.0            # ★ON 推奨: 例 0.2(非日本語話者にする割合。決定論・id 順)
  languages: [英語, 中国語, 韓国語]  # 割り当てる言語ラベル(循環)
  cross_lang_barrier: 2         # 異言語間の語採用に必要な追加聴取回数(伝播障壁)
  # ---- 犯罪・迷惑行為 ----
  crime_prob: 0.0               # ★ON 推奨: 例 0.005(街内の1人1stepあたりの窃盗発生確率。stream "crime")
  nuisance_prob: 0.0            # ★ON 推奨: 例 0.005(迷惑行為の発生確率。stream "crime")
  theft_amount: 3000.0          # 窃盗の被害額(被害者 money−。現金の範囲で)
  crime_grievance: 0.0          # ★ON 推奨: 例 0.08(窃盗被害者の不満増分。factors 経由。0.0=金銭のみで grievance 不変)
  nuisance_grievance: 0.0       # ★ON 推奨: 例 0.03(迷惑行為の周囲の不満増分。factors 経由。0.0=観測のみ)
  nuisance_kinds: [客引き, ナンパ, 喧嘩, 路上の騒ぎ]  # 迷惑行為の種類(決定論で選択)
  # ---- 治安の体感・回避 ----
  danger_threshold: 3           # 犯罪履歴回数がこれ以上のノード=危険地帯(避ける)。0 以下=回避無効
  avoid_danger: true            # 危険地帯を自由時間の行き先から避ける(enabled 時のみ効く)

# ---- 環境フィードバック(エージェント → 環境)第84バッチ 2026-08-01。**既定 OFF**=現行挙動と完全同一 ----
# 正典: docs/plans/source/cognition-design-record.md §4(全体)。実装 src/society/envfeedback.py。
# これまで因果は「環境 → エージェント」の一方向だった。逆向きの矢印を1本だけ通して環を閉じる:
#   行動 → 集約物理量 → 閾値超過 → 環境イベント → 知覚 → 行動
# ★原則(§4.1): エージェントは環境イベントを宣言できない。LLM に「電車が遅延した」と言わせた瞬間
#   世界は「エージェントが言ったこと」になる。因果は必ず物理量を経由させる=ここは全部コード側。
#   LLM 呼び出し 0 本・乱数 0 本(完全決定論=repro_tier strict)。
# 規則は §4.2 の最小 3 本だけ(それ以上足さない=指紋対策(1)):
#   1) ホームへの流入 → ホーム密度 → 停車時間延長 → 遅延伝播(回復運転で減衰)
#   2) 改札通過     → 改札スループット飽和 → 入場規制(有限時間+クールダウン)
#   3) POI 滞在     → 占有率>容量 → 待ち行列 → 他 POI へ流出(既存の行き先候補フィルタを使う)
# ★発散対策(§4.4): 3規則すべてに減衰項と上限。遅延は毎 step γ<1 倍(回復運転)+ 上限、
#   規制は有限 step で必ず解除、個体は max_hold_steps を超えて待たされない(必ず通す安全弁)。
# ★指紋対策(§4.4): プロンプトに1バイトも足さない(遅延・規制・待ちは「動けない/候補に無い/
#   混雑の不快感」という既存語彙の世界の事実としてしか現れない)。ON/OFF を実験条件にする。
# ★較正の口(§4.4 対策2): 下の閾値・係数は**すべて仮値**。将来 渋谷駅の実データ
#   (遅延統計・改札通過人数・POI 滞留)で較正する前提。文献の裏づけ=乗降人数と混雑が停車時間を
#   延ばすこと・通勤列車の遅延の9割は5分以下の停車時間超過で乗降人数の説明力は約4割
#   (Stockholm/Tokyo 実測比較)・混雑時の改札閉鎖は実運用の常套手段・遅延は余裕時分で回復する。
# 既定 OFF=env_feedback 0 件・遅延も規制も待ち行列も発生しない・状態も生えない=L1 バイト一致。
env:
  feedback:
    enabled: false              # ★実験条件: OFF ランとの差分でのみ「環境からの反作用の効果」を言う
    log_every_steps: 4          # 世界側イベントの記録間引き(観測装置の設定。個体の待ちは常に記録)
    # ---- 規則1: ホーム密度 → 停車時間延長 → 遅延伝播 ----
    transit:
      enabled: true
      platform_threshold: 25    # ホーム負荷(在ノード人数+この step の乗降人数)がこれを超えると
                                #   停車時間が延び始める(仮値・要較正)
      dwell_sec_per_pax: 0.8    # 超過1人あたりの停車時間延長[秒](仮値・実証は乗降1人0.5〜1.5秒帯)
      dwell_cap_min: 3.0        # 1 step ぶんの注入の上限[分](上限=発散対策。Δt でスケール)
      recovery: 0.7             # 回復運転項 γ<1(次の発車へ持ち越す割合。減衰項=発散対策)
      delay_cap_min: 15.0       # 遅延の絶対上限[分](上限=発散対策)
      flag_min: 3.0             # 観測チャンネル ext.transit_delay を1にする遅延[分]
      max_hold_steps: 3         # 1回の退出/帰還で待たせる合計の上限(超えたら必ず通す安全弁)
    # ---- 規則2: 改札スループット飽和 → 入場規制 ----
    gate:
      enabled: true
      capacity_per_min: 1.5     # 改札の処理能力[人/分](仮値・要較正)。world.mod.gate_capacity の係数を掛ける
      hold_steps: 2             # 規制の継続(有限=必ず解除される)
      cooldown_steps: 3         # 解除後にこの間は再発動しない(振動の減衰項)
    # ---- 規則3: POI 占有 > 容量 → 待ち行列 → 他 POI へ流出 ----
    poi:
      enabled: true
      capacity: 12              # POI ノードの収容人数(超過で待ち行列。仮値・要較正)
      hold_steps: 3             # 行き先候補から外す長さ(自動失効=減衰項)
      max_nodes: 8              # 同時に外せるノード数の上限(候補の全滅を防ぐ上限)

# ---- 微視歩行者物理(Social Force Model の確定パラメータ宣言。竹-3 バッチ 2026-08-02)----
# 正典: docs/research/physics-engine-selection.md「★ P2 決定(2026-08-02・確定)」
#   = ゾーン別ハイブリッド(既定エンジン=自前 SFM / 多方向交差流ゾーンのみ ORCA)。
# ★本ブロックは【宣言だけ】: 2026-08-02 時点で **これを読むコードは存在しない**(src/ の
#   grep で参照ゼロ)。値はすべて実装側の既定値(src/society/world/sfm_core.py の
#   WALL_A_DEFAULT / WALL_B_DEFAULT / WALL_RANGE_M)と一致させてあり、ここを触らない限り
#   一切の挙動は変わらない=どこからも自動で ON にならない(bool トグルを持たないので
#   registry.py の repro_tier 宣言対象にもならない。将来トグルを足すときは strict で宣言する)。
# ★竹-4(P3 境界縫合)で `physics.zones_enabled` / `physics.zones` / `physics.perception` を
#   追加した(下段)。**既定は zones_enabled=false かつ zones=[] = 一切の新経路を通らない**。
# 屋内(遷移駆動 SFM)の実パラメータは従来どおり indoor.sfm.* が正典(こちらは配線済み)。
physics:
  sfm:
    # 対壁斥力 f_iW = A_w · exp((r_i − d_iW)/B_w) · n_iW   (Helbing, Farkas & Vicsek 2000)
    #   d_iW = 個体中心 → 壁線分の最近点距離、n_iW = 壁 → 個体の単位法線。
    #   閾値距離内の壁セグメント **全部** の合力(最近傍1本ではない=Helbing 標準)。
    wall_A: 2000.0              # A_w [N] 壁斥力の強さ(対人 A と同値の Helbing2000 標準値)
    wall_B: 0.08                # B_w [m] 壁斥力の特性距離(同上)
    wall_range: 2.0             # 作用距離 [m]。d_iW > r_i + これ で寄与 0(exp は B=0.08 で数m先 ~0)
    wall_hash_cell: 2.35        # 壁最近点探索の空間ハッシュ格子 [m](既定 = wall_range + 半径上限
                                #   0.35 = リング1周ぶんで距離 reach 以内の壁を必ず含む)。
                                #   全ペア走査版とビット一致することを tests/test_sfm_walls.py が固定。
    # 揺らぎ項 ξ(Helbing&Molnár1995)。f に m·N(0, noise) を足す。0.0 = 無効 = 完全決定論。
    #   ★竹-3 の修正点: 壁ありの経路(WallCrowd)で ξ が落ちていたバグを解消した。noise>0 でも
    #     「同一 seed の Generator を渡せば同一軌跡」= 決定論は保たれる(seed 固定が条件)。
    #   ★実測(reference/physics_bench・counterflow w6 ρ=1.11/m²)では ξ を入れると
    #     レーン秩序 φ はむしろ下がった。値は**未較正**で、既定は 0.0(無効)のまま置く。
    noise: 0.0                  # ξ の標準偏差 [m/s²]。0.0 = 無効(既定)
    noise_seed: 20260802        # ξ 専用 Generator の seed(noise>0 のときだけ意味を持つ)

    # ==== P4-2 / P4-3 歩行物理較正(2026-08-05。**既定は現行挙動と完全に恒等**)========
    # 正典: docs/research/p4-calibration-research.md §4/§6 /
    #       docs/plans/if-sv-p4-plan.md P4-2・P4-3 行 /
    #       reference/physics_bench/out/calib_results.json(P4-1)と calib_p43_results.json(P4-3)
    # 実装: src/society/physics.py の `_CalibratedCrowd`(sfm_core.Crowd の薄い派生)。
    #   **3 機能とも既定 OFF/現行値**。OFF のときは派生クラスすら作らず `sfm_core.Crowd` を
    #   そのまま構築する = 演算順も引数も 1 バイト変わらない = golden L1 バイト一致。
    #   ★これらは `physics.zones_enabled: true` のゾーン物理にだけ効く(屋内 indoor.sfm は別系統)。
    #     さらに **engine: sfm のゾーンにだけ**効く(ORCA は力ベースではないので無関係)。
    #
    # ---- (1) 長距離 social 項(P4-2)----
    # VISSIM 製品版 SFM は 2 項構造(短距離 25 m/s²・B 0.2 m + 長距離 0.5 m/s²・B 2.8 m)で、
    # 本リポジトリは短距離項しか持っていない(A=2000 N ÷ 80 kg = 25 m/s² が短距離項と一致)。
    #   f2_ij = m · a2 · exp((r_i+r_j − d)/b2) · w(φ) · n_ij     [N]
    # ★カットオフ規則(cutoff_factor・taper_m)は **a2 とセットでしか意味を持たない**
    #   (切って失う裾を a2 が吸収するため)。較正値だけ移して規則を変えてはいけない。
    far_field:
      enabled: false            # 既定 OFF(= 項が 1 度も評価されない)
      a2: 0.119                 # A2 [m/s²] P4-1 の Nelder-Mead 収束先
      b2: 1.890                 # B2 [m]    同上
      cutoff_factor: 2.5        # 体表間隔 cutoff_factor·b2 [m] で打ち切る
      taper_m: 1.0              # その手前 1 m を C¹ smoothstep で 0 へ落とす(不連続を作らない)
    # ---- (2) 間隔ベース希望速度 V(s)(P4-3・Tordeux, Chraibi & Seyfried 2015)----
    #   V(s) = min{ v0 , max{ 0 , (s − l)/T } }
    #   s = 進行方向の最近前方者までの**中心間距離** [m](横ずれが体半径和以内の相手だけ)。
    #   **駆動項の希望速度だけ**を差し替える(方向モデル・斥力・v_max は SFM のまま)。
    #   原論文は v0=1.2 / l=0.3 / T=1 だが、それは単列歩行(体長 0.3 m)の値。本リポジトリの
    #   体径は 0.5–0.7 m なので l・T は借りずに較正した(calib_p43_results.json)。
    v_of_s:
      enabled: false            # 既定 OFF(= V(s) を 1 度も評価しない)
      T: 0.482                  # 時間ギャップ T [s]  ← P4-3 較正値(JSON は 0.4823492)
      l: 0.297                  # 体長パラメータ l [m] ← P4-3 較正値(JSON は 0.2965060)
    # ---- (3) 壁斥力(P4-3)----
    #   f_iW = wall.a · exp((r_i − d_iW)/wall.b) · n_iW
    #   **既定は現行 src と同じ 2000 N / 0.08 m**(= 何も変わらない)。
    #   P4-1 の実測で b=0.08 は体半径に加えて片側 約 0.15 m の余分なクリアランスを要求し、
    #   w ≤ 0.9 m の開口は**単独歩行者でも通れない**(Jülich には b=0.6 m の実験があり
    #   実際の歩行者は通れるので、これはモデルの欠陥)。
    #   ★P4-3 較正値(適用は conf で明示したときだけ。既定は 0.08 のまま):
    #       b = 0.03  … 較正ハーネスの推奨(w=0.8 m まで単独通過・J(w) 線形性 R²=0.999)
    #       b = 0.06  … 保守側の別解(目標「w=0.9 m 単独通過」を満たす **最大の** b
    #                    = Helbing2000 の 0.08 からの乖離が最小)
    #     どちらでも隔壁貫通は 0 名。壁面へのめり込み(体表クリアランス)はむしろ
    #     現行 0.08 がいちばん悪い(−0.125 m → b=0.03 で −0.082 m)。
    #     ただし **specific flow J/w は b を縮めても受入帯 [1.5,2.3] に届かない**
    #     (0.59〜1.11)。水準不足は壁パラメータでは説明しきれない = 未解決。
    wall:
      a: 2000.0                 # A_w [N](Helbing2000 標準値。既定=現行)
      b: 0.08                   # B_w [m](既定=現行。較正値は上のコメント/calib_p43_results.json)

  # ==== P3 境界縫合(竹-4 2026-08-02。**既定 OFF = 現行挙動と完全同一**)============
  # 正典: docs/plans/source/physics-instructions.md Part P3 /
  #       docs/research/physics-engine-selection.md ★P2 決定(2026-08-02)条件 1〜6。
  # 実装: src/society/world/zones.py(宣言・幾何・ゲート)+ src/society/physics.py(実行)
  #       + src/society/world/orca_core.py(ORCA。reference/physics_bench から昇格)。
  #
  # 何が起きるか(ON のとき): ゾーンのポリゴンを**通り抜ける**経路を持つ個体を、その step の
  # 頭で物理が**所有**し(= グラフ移動をしない)、dt_sub 刻みでゾーンの中を実際に歩かせる。
  # ゾーンの外へ出た時点で経路の折れ線へ射影してグラフ状態へ返す。
  #   → **ON にすると世界が変わる**(位置・到着時刻が物理で決まる)。opt-in の世界変更機能で、
  #     registry.py に physics.zones_enabled を strict / affects_k=false / risk=none で宣言済み。
  #   → プロンプト文字列は 1 バイトも変わらない(第85 契約の body 欄は prompt_kwargs に出ない)。
  #     「同一の位置系列なら文字列不変」を tests/test_physics_zones.py が固定する。
  #
  # OFF が保つ不変条件: zones_enabled=false(既定)または zones=[](既定)のとき、
  #   physics.phase() は即 return・agent._phys_* 属性が 1 つも生えない・zone_gate イベント 0 件・
  #   L2 に列なし・"physics" stream を 1 本も引かない・**L1 バイト一致**。
  zones_enabled: false
  perception:
    # 物理 → 知覚(P3(3))。値は Perception.body の既存 3 欄(blocked/contact/local_density)へ。
    density_radius_m: 2.0       # 局所密度を測る円の半径 [m](local_density = 円内人数 / 円の面積)
    contact_gap_m: 0.05         # 体表間がこれ以下のサブステップを「接触」と数える [m]
    # ★将来の発火チャンネル接続(ext.crowd 系)。**配線だけ**用意して既定 OFF。
    #   true にすると ext.crowd_local の値が「同席人数」から「実測近傍人数」へ変わるので、
    #   第80 の σ 較正をやり直す必要がある(だから既定は false)。
    channels: false
  # ゾーン宣言。**空 = 既定 = 物理 OFF**。
  zones: []
  # ★★ 実配置は conf/zones_shibuya.yaml にある(第100バッチ Wave4 I-2。2026-08-06)★★
  #   渋谷の 3 空間 = スクランブル交差点(orca・実信号 140/37/10 を data/crossings_shibuya.json の
  #   crossing_id 291758776「渋谷駅前」pedestrian_scramble から table 引き)/ ハチ公前広場(sfm)/
  #   センター街 入口〜中程(sfm)を、**data/shibuya_osm_wide_v7.json の実座標**で宣言してある。
  #   使い方:  python scripts/run.py --profile conf/zones_shibuya.yaml
  #            観察ラン(conf/observe.yaml)や本番(conf/production.yaml)と併せるときは、
  #            --profile が 1 本しか取れないので **同ファイルの `physics:` ブロックを相手の
  #            プロファイルへそのまま貼る**(world.map が wide_v7 でなければその行も一緒に)。
  #   検収:    tests/test_zones_shibuya.py(内部ノード/ゲート/面積/信号の実体/較正の選択/
  #            resume/決定論/既定 OFF の不変)。
  #   ★ここ(基底)は `zones_enabled: false` / `zones: []` のまま **絶対に触らない**
  #     = ゴールデンは 1 バイトも動かない。ON は常に profile 側の opt-in である。
  #   ★正直な申告(実測): 所有は「経路がゾーンを通り抜ける個体」に対して**現在地から**始まる
  #     (グラフ移動は 1 step で 800 m 進むので、そうしないとゾーンを跳び越す個体を取りこぼす)。
  #     そのため zone_gate の span_m は数百 m に達し、**L2 の zone_occupancy /
  #     zone_density_mean は「ポリゴン内の人数」ではなく「所有中の人数」**である。
  #     ポリゴン内の実密度を見たいときは個体側の Perception.body.local_density を使うこと。
  # ---- 記入例(コメントアウト。上の実配置を使わず自分で書くときの雛形)----
  # 交差点ゾーン: 開放平面の多方向交差流 = P2 決定の割当規則で **engine: orca**。
  # 信号は既存の交差点表(data/crossings_shibuya.json)から引く(cycle/green/flash を実測値で)。
  # crossing_id 250652228 は同表の 1 件(cycle_s 140 / green_s 37 / flash_s 10)。
  # ※雛形なので任意の 1 件を挙げているだけ。**実際のスクランブル交差点は 291758776**
  #   (scramble: true / crossing_ref: pedestrian_scramble / name: 渋谷駅前)で、
  #   その id はグラフのノード id n291758776 と同じ = conf/zones_shibuya.yaml はそちらを使う。
  # ※ポリゴンは平面図形なので、地上の交差点を囲むと**真下の地下通路ノードも囲む**。
  #   地上だけを縫い付けたいゾーンには `layers: [0]` を書くこと(既定 [] = 全レイヤー)。
  # zones:
  #   - id: scramble
  #     engine: orca              # 交差流の実測: 効率 0.924 vs SFM 0.530・反転 1/5(P2 決定)
  #     dt_sub: 0.05              # P2 条件1: 0.02–0.05(dt>=0.1 は SFM が rho>=1.5 で後退爆発)
  #     polygon: [[-45, -45], [45, -45], [45, 45], [-45, 45]]   # 地図ローカル m(原点=交差点中心)
  #     arrive_radius_m: 1.0
  #     signal:
  #       mode: table
  #       path: data/crossings_shibuya.json
  #       crossing_id: 250652228  # 赤の間は入場させない=縁石に溜まり、青で一斉横断(SignalGate)
  #     orca:
  #       pref_noise: 0.05        # 対称性の破れ(未較正。0.0 で乱数ゼロ)
  #       radius_margin_m: 0.05   # P2 条件3(a) 半径マージン
  #       separation_iters: 64    # P2 条件3(b) 決定論的な事後分離パス(反復上限)
  #     gate:
  #       min_gap_m: 0.10         # guarded: 入口がこの余裕ぶん空いていなければ入れない
  #       band_m: 3.0             # 緩和帯(この帯の指標は内部と分けて出す)
  #       max_hold_steps: 3       # 入場待ちの上限 step(安全弁)
  #       max_zone_steps: 6       # ゾーン滞在の上限 step(安全弁)
  # 地下通路ゾーンの例(壁あり = engine: sfm。地下街 LOD4.1 の壁線分を層指定で読む):
  #   - id: underpass
  #     engine: sfm
  #     dt_sub: 0.05
  #     polygon: [[-60, -80], [10, -80], [10, -20], [-60, -20]]
  #     walls: { mode: layered_json, path: data/plateau/ubld_lod4.json, layers: [3] }
  #     walkable: { mode: polygons_json, path: data/plateau/tran_lod3.json }

# --------------------------------------------------------------------------- #
# 街の顔 = 路上の生業と条例(Wave 4 III-3。実装 src/society/street_life.py。**既定 OFF**)
#
# 何を足すのか: 本シムの路上には「店」と「通行人」しか居なかった。現実の渋谷の路上で
# いちばん目に入るのは**そこで生計を立てている人**である。
#   ティッシュ配り / ストリートミュージシャン / キッチンカー営業者 / 路上占い師 /
#   街頭演説者 / 募金スタッフ / 路上生活者 / 路上支援員(区の巡回相談)
# の 8 役割を L5 名簿に足し、持ち場と時間帯に沿った日課を tier0(LLM 追加呼ゼロ・
# **乱数ゼロ**)で回す。持ち場は**地図の構造から決定論導出**する(駅ノード・POI 密度・
# POI カテゴリ・レイヤー)= conf にもコードにも地名・ブランド名を 1 つも書かない。
#
# ★客引き / スカウトは**独立した職業にしない**: 渋谷区の条例(2025-04 改正で過料 5 万円・
#   立入調査・氏名公表)は**雇い主(店)も対象**にしており、実際の客引きは夜の店に雇われた
#   従業員の副業務である。そこで「夜間店舗に職場を持つ既存の従業者の決定論的な部分集合」が
#   夜の時間帯に店の前で客引きに立つ(touting)。近傍の警察官が警告(touting_warning)→
#   再犯で過料(touting_fine)→ クールダウンで持ち場を移す=いたちごっこ。
# ★既存の迷惑行為「客引き」(society_diversity.nuisance_kinds)は本機構 ON のとき
#   **供給を止める**(併存ではなく置き換え)= 同じ出来事を二重に出さない。
#
# ★尊厳規約(路上生活者。ユーザー承認済みの明文条件):
#   語彙は「路上生活者」のみ / 犯罪・迷惑機構に**一切接続しない**(加害者・被害者・周囲の
#   すべてから除外)/ 記憶・行動・発火の権利は他と完全同一 / 区の支援事業が世界に存在する
#   (outreach_contact → 積み重なれば既存の住居機構経由で shelter_move)/ 夜は公園のそば・
#   地下通路、日中は街を移動、雨天は屋根のある場所へ。
#
# R1: LLM 追加呼ゼロ・**乱数 stream ゼロ**・プロンプトの節ゼロ増(路上の出来事は既存の
#   記憶欄に定型 1 行が入るだけ)。OFF が保つ不変条件: 新 12 種の L1 が 0 件・agent に属性が
#   生えない・sim に state が生えない・summary に street_life キーなし・プロンプト 1 バイト
#   不変・L1 バイト一致(golden_baseline_l1.json)。
street_life:
  enabled: false                # ★false=完全 no-op(バイト一致)。true で路上の生業・条例が動く
  # ---- 持ち場(地図からの決定論導出)----
  posts_per_role: 4             # 1 役割に用意する持ち場ノード数(id 昇順で循環割当)
  notice_radius_m: 25.0         # 路上の出来事に気づく距離[m](知覚半径とは別系統)
  notice_cap: 8                 # 1 セッションで記憶 1 行が入る人数の上限(暴走の安全弁)
  # ---- 活動(**確率ではなく決定論の刻み**: 何人に 1 人が応じるか = 乱数を引かない)----
  tissue_accept_every: 4        # 通行人の 4 人に 1 人が受け取る
  stall_price: 900.0            # キッチンカーの単価[円]
  stall_buy_every: 6
  fortune_fee: 2000.0           # 路上占いの料金[円]
  fortune_every: 12
  donation_amount: 300.0        # 街頭募金の 1 口[円](街の外の団体へ = SFC ON では RoW)
  donation_every: 8
  # ---- 客引き(条例の対象)----
  tout_every: 4                 # 夜間店舗の従業者の 4 人に 1 人が客引きに立つ(決定論)
  tout_accept_every: 10
  tout_bands: [1140, 1440]      # 客引きの時間帯[分 of day]= 19:00〜24:00
  zone_radius_m: 700.0          # 条例の啓発区域(駅からおよそ 700 m)
  # ---- 条例パトロール ----
  fine_amount: 50000.0          # 過料 5 万円(渋谷区の条例 2025-04 改正)
  fine_grievance: 0.0           # 過料を受けた不満(factors 経由。0.0=接続しない=既定)
  warn_before_fine: 1           # 何回目の警告までは過料にしないか(1=2 回目で過料)
  cooldown_steps: 6             # 警告/退去のあと活動を止める step 数(いたちごっこ)
  # ---- 路上生活者(尊厳規約)----
  rough_money_cap: 3000.0       # 手持ちの上限[円](名簿の既定レンジは住民向けのため丸める)
  # ★巡回相談が届く範囲[m]。notice_radius_m(25m=路上の視聴距離)とは**別の値**にする:
  #   巡回相談は「その一帯を回る」行為で、公園や地下通路という**範囲**を対象にするから。
  #   25m を使い回した初版は接触が**実測 0 件**になった(支援員と路上生活者が同じ帯に
  #   街に居ても最近接 121m)= 支援事業が世界に存在しないのと同じ状態だった。
  outreach_radius_m: 150.0
  outreach_period_days: 3       # 区の巡回相談の周期[日]
  outreach_shelter_after: 3     # 何回の相談で住居へ移行するか(0=移行なし)
  # ---- L1 安全弁 ----
  max_events_per_step: 32       # 1 step に出す本機構の L1 件数の上限(超過分は捨てる)

# ---- 都市運営 = 見えない労働力(Wave 4 III-4。実装 src/society/city_ops.py・既定 OFF)----
# 街を成り立たせているのに世界に 1 人も居なかった層を載せる: 交番の警察官・ごみ収集・
# 納品の運転手・ビルの夜間清掃・救急。**すべて tier0**(LLM 追加呼ゼロ・乱数 stream ゼロ・
# 判定は id / step / sim_min / 地図 / 暦 / 既存状態 の純関数)。
# ★救急は**時刻表ではなく行為の連鎖**である(ユーザー指定の設計原則「世界の出来事は
#   すべて誰かの行為に対応する」): 既存の健康機構が成立させた状態から個体が倒れ(collapse)、
#   **近くに居合わせた誰かが通報し**(ems_call)、当直の救急隊がその通報に応える(ems_dispatch)。
#   したがって health.enabled=false / onset_prob=0 のランでは救急の連鎖は 1 件も起きない
#   (正直な依存関係。ems.require_sick=false にすれば既存の疲労ゲージが代替の引き金になる)。
# ★自販機の補充は**作っていない**: 地図に自販機 POI が 1 件も無いため(無い行き先へ
#   行かせない)。★v8 を実査した上での判断である: v8 は subcat を通している
#   (convenience 93 / love_hotel 63 / karaoke 17 / club 17 / sauna 4 / net_cafe 1 /
#   hospital 7 …)のに自販機は 0 件だった(地図生成器が amenity=vending_machine を
#   拾っていない)。地図側で通すのが先で、そのとき役割を足せば成立する。
#   ★同じ実査の副産物: v8 の hospital subcat 7 件は、搬送先を持つ救急(重症度→搬送→入院)を
#   後続で設計するときの受け皿になる。
city_ops:
  enabled: false                # ★false=完全 no-op(バイト一致)。true で見えない労働力が動く
  max_events_per_step: 24       # 1 step に出す本機構の L1 件数の上限(超過分は捨てる)
  # ---- ① 交番配置(名簿の警察官 140 人は今までどこにも束ねられていなかった)----
  police:
    enabled: true
    occupations: ["警察官"]
    poi_cats: ["service", "police"]   # v7/v8 は amenity=police→service。police は前方互換(現状 0 件)
    name_keywords: ["交番", "警察署"]   # 一般名詞のみ(ブランド名・地名は書かない)
    first_open: 0               # 最初の直の始まり[分 of day]
    shift_hours: 8
    n_shifts: 3                 # 24 時間を 3 直で回す(交番の実態)
    patrol_every: 4             # 名簿順で n 人に 1 人は持ち場を持たない「巡回ユニット」
  # ---- ② ごみ収集(可燃 2 回/週の地区別曜日表・繁華街の期限 07:30・事業系は深夜)----
  waste:
    enabled: true
    occupations: ["清掃作業員"]
    grid_cols: 3                # 地区 = 地図 bbox の格子分割(区の実際の収集区割りは持たない)
    grid_rows: 2
    stops_per_round: 6          # 1 巡回で回るノード数
    ward_start_min: 300         # 05:00
    ward_deadline_min: 450      # 07:30(繁華街の収集期限)
    commercial_enabled: true
    commercial_start_min: 120   # 02:00(事業系=民間業者の深夜収集)
    commercial_end_min: 300     # 05:00
    commercial_every: 2         # 名簿順で n 人に 1 人が深夜班
    commercial_cats: ["nightlife", "food"]
    require_night: true         # ★false にしない限り、夜間開放 OFF では深夜班を束ねない
  # ---- ③ 納品の運転手化(物流①の delivery_trip に運転席の人を与える)----
  driver:
    enabled: true
    occupations: ["納品ドライバー"]
    start_min: 240              # 04:00(荷捌き場への集中帯)
    end_min: 660                # 11:00
    stops_per_round: 8
    stop_cats: ["shop", "food", "cafe", "nightlife"]
  # ---- ④ ビル夜間清掃(この街最大のサービス業)----
  night_cleaning:
    enabled: true
    occupations: ["夜間清掃員", "夜間清掃"]   # L5 新役割 + 台帳(build_orgs)の夜勤ロール名
    start_min: 1320             # 22:00
    end_min: 300                # 05:00(日跨ぎ。夜間開放 OFF では 24:00 へ畳む)
    max_per_night: 16           # 1 晩に出す night_cleaning の上限(1 人 1 棟の割当)
  # ---- ⑤ 救急(通報から始まる行為の連鎖。時刻表では撃たない)----
  ems:
    enabled: true
    crew_occupations: ["救急隊員", "消防士"]
    first_open: 0
    shift_hours: 8
    n_shifts: 3
    collapse_per_10k: 400       # 既存の病人のうち 1 日に 1 万人あたり何人が倒れるか(決定論)
    require_sick: true          # false = 既存の疲労ゲージも引き金にする(健康 OFF でも動く)
    collapse_fatigue: 0.95      # require_sick=false のときの疲労側の閾値
    call_radius_m: 40.0         # 通報者を探す半径[m](居なければ本人が自分で呼ぶ)
    treatment_steps: 3          # 倒れた個体がその場に留まる長さ[step]
    on_scene_steps: 3           # 救急隊が現場に留まる長さ[step]
    speed_m_per_min: 300.0      # response_min の換算(モデル値。実走行時間ではない)
    max_calls_per_day: 8        # 1 日に出す連鎖の上限(L1 の安全弁)
    ward_calls_per_day: 65.0    # ★参照値のみ(区の実測 65 件/日 ≒ 22 分に 1 件)。判定に使わない
    # ---- 傍観者モデル(**health.severity.enabled が true のときだけ効く**)----
    #  OFF のときは従来どおり「最近傍の誰かが必ず通報する」。ON のときは居合わせた集団から
    #  決定論で通報者を選ぶ: P(誰かが動く) = 1 − (1 − solo)^(n^(1−alpha))。
    #  実測との整合 = 集団としての介入率 0.85〜0.95(実 CCTV 研究で介入は規範・91%)。
    #  責任分散(Darley-Latané)は**曖昧で軽微な状況にだけ**効かせ、危険が明白な事態では
    #  alpha=0(メタ分析: 危険なほど傍観者効果は消え、人数が増えるほど誰かが動く)。
    bystander_solo_prob: 0.65        # 1 人しか居合わせないときの介入率(帯から逆算した値)
    bystander_alpha_ambiguous: 0.4   # 見かけが中等症以下 = 曖昧・軽微(責任分散が効く)
    bystander_alpha_danger: 0.0      # 見かけが重症以上 = 危険が明白(責任分散なし)
    bystander_related_mult: 1.5      # 家族・同居人・同僚が居合わせたときの倍率
    bystander_max_prob: 0.98
    # 通報までの所要時間の分布(実測 46% が 1 分未満 / 29% が 1〜5 分 / 25% が 5 分超)。
    # ★正直な限界: 既定 Δt ではどのビンも同じ 1 刻みに丸まるので、**発火時刻は動かさず**
    #   観測量として ems_call の payload に載せる(より細かい Δt で意味を持つ)。
    call_delay_fast_min: 0.5
    call_delay_mid_min: 3.0
    call_delay_slow_min: 8.0
    call_delay_fast_share: 0.46
    call_delay_mid_share: 0.29

# ---- 対人事件の収束化 H4(docs/plans/body-incident-layer-plan.md §3 対人行・§6-3 ユーザー決定)----
# ★**既定 OFF=現行と完全同一**(L1 バイト一致・乱数消費不変・プロンプト不変)。
#
# ユーザー決定(原文)「**H4はエージェントドリブンで設計**」= レート抽選の残滓を残さない。
# 事件は「誰もいなければ起きない」を**構造で**保証する:
#   基底レート(pair_prob)は **共在ペア 1 組 1 step あたりの条件付き確率**としてのみ存在し、
#   人口にも時間にも直接掛からない。共在ペアが空なら乱数は 1 本も引かれない
#   (src/society/incidents_interpersonal.py の _pair_draw が唯一の抽選点)。
#
# RAT(Birks / Groff)の 3 要素はすべて**既存 agent 状態と世界状態の純関数**:
#   動機   = 金欠 / 滞納・立退き・破産(一時的で回復可能)/ 酩酊 / 疲労  ★人格ラベルは作らない
#   標的   = 携行現金 / 携帯 / 酩酊 / 孤立(VIVA の観測可能な代理)
#   監視   = 同席者数 + 交番の近接 + traces の摘発痕跡 + 同ノードの警察官
#            ★block 以上なら**抽選そのものを行わない**(事後フィルタにしない)
#
# ★トップレベルのキーを incidents_interpersonal にした理由: H3(遺失物)/ H5(火災・設備)が
#   同時進行の別レーンなので、共有の incidents: ブロックを 3 レーンで奪い合わない
#   (所有権が config から一意に読める = street_life / city_ops と同じ「1 レーン 1 ブロック」)。
incidents_interpersonal:
  enabled: false                # ★false=完全 no-op(バイト一致)。true で共在収束が動く
  max_events_per_step: 16       # 1 step に出す本機構の L1 件数の上限(超過分は捨てて数える)
  max_pairs_per_offender: 8     # 1 候補が同 step に見る共在ペア数の上限(O(n・k) の頭を抑える)
  # ---- 動機(加害者候補)。★一時的で回復可能な状態だけ = 新しい人格ラベルを付けない ----
  motive:
    money_low: 1500.0           # 手持ちがこれ未満 = 金欠(円)
    w_money: 0.50
    w_distress: 0.30            # 家賃滞納 / 立退き / 破産(既存フィールドの読み取り)
    w_intox: 0.40
    w_fatigue: 0.20
    w_grievance: 0.0            # ★既定 0: 構成概念(不満)を発火判断に食わせない(R1)。
                                #   >0 にすると k 非依存性の主張が弱まるので実験条件として明示すること
    min: 0.05                   # これ未満の動機は候補にしない(前置フィルタ)
  # ---- 標的の適性(VIVA = 価値・慣性・可視性・接近可能性の観測可能な代理)----
  target:
    cash_ref: 8000.0            # これだけ持っていれば価値項が飽和(円)
    w_cash: 0.60
    w_phone: 0.20
    w_intox: 0.40
    w_alone: 0.40               # 同伴者が居ない(孤立)
    min: 0.05
  # ---- 監視(guardianship)。★閾値以上なら抽選そのものを行わない ----
  guardian:
    w_watcher: 0.34             # 同席者 1 人あたり(3 人で block に届く = 目があれば起きない)
    w_koban: 1.00               # 交番・警察署の近く
    w_trace: 0.50               # traces(IF-D)の摘発痕跡 1.0 あたり。traces OFF なら常に 0
    block: 1.00                 # このスコア以上で不発。★0 以下 = 「常に監視されている」対照条件
    koban_radius_m: 60.0
    koban_keywords: ["交番", "警察署"]      # 一般名詞のみ(ブランド名・地名は書かない)
    koban_cats: ["service", "police"]     # v7/v8 は amenity=police→service。police は前方互換
    police_blocks: true         # 同ノードの警察官は無条件で抑止(G3 執行との接続)
  # ---- 酩酊 = 夜間店舗に居た痕跡の減衰する印(血中濃度は作らない)----
  intox:
    steps: 12                   # 印の寿命[step](既定 dt=10 分なら 2 時間)
    cats: ["nightlife"]
    open_hour: 18               # 夜間店舗の窓(commerce の既定表と同値)
    close_hour: 5
  # ---- 窃盗(既存 diversity.crime_prob の世代交代)----
  theft:
    enabled: true
    # ★較正値: 共在ペア 1 組 1 step あたりの条件付き確率。**実測してから置いた値**:
    #   production の規模(mock 100 体 144 step)の共在重み和 theft 251.4 / brawl 27.9 から、
    #   窃盗が既存の実測較正値 ~2.8e-5 件/人日(渋谷区の認知件数 ÷ 昼間人口。許容帯 1e-5〜3e-4)
    #   と同水準(theft 2.4e-5 + brawl 0.4e-5)になるように置いた。★同じ値でも人口密度が上がれば
    #   1 人あたりの件数は増える(共在の機会が増えるから = RAT そのもの)。別の規模で回すときは
    #   summary の weight_by_kind / per_person_day / per_pair_step を見て置き直すこと。
    #   ★分母は人口比ではなく**共在機会比**
    #   (summary.incidents_interpersonal の pairs_seen / weight_sum / per_pair_step)。
    pair_prob: 0.0000095        # = 9.5e-6(実測: production 100 体で共在重み和 251.4)
    amount: 3000.0              # 被害額(diversity.theft_amount と同値)
    grievance: 0.0              # 被害者の不満増分(factors 経由。0=金銭のみ)
    supersede_diversity: true   # ★true = diversity.tick_crime は窃盗の枝を供給しない(置き換え)
  # ---- 喧嘩(酒 x 密度 x 閉店放出)----
  brawl:
    enabled: true
    pair_prob: 0.000014         # = 1.4e-5(実測: production 100 体で共在重み和 27.9)
    density_min: 3              # 同席者がこの人数以上のときだけ(密度項)
    require_intox: true         # 片方以上が酩酊していること(酒項)
    closing_window_min: 60      # 閉店から何分を「放出」とみなすか
    closing_boost: 0.16         # ★閉店 +1 時間の実証弾性 +16%(検証対象)
    night_only: true            # 夜間店舗の窓 or 閉店放出の帯でだけ起きる
    injury_density: 5           # 密度がこれ以上 かつ 双方酩酊 → S2(中等症)。既定は S1
    grievance: 0.0
  # ---- 通報層(110 番 = 目撃者/被害者の行為。★新しい乱数を 1 本も引かない完全決定論)----
  report:
    enabled: true
    victim_base: 1.00           # 被害者本人の通報確率(傍観者ではないので人数減衰なし)
    witness_base: 0.70          # 目撃者 1 人あたりの通報確率(人数減衰の基点)
    kin_bonus: 0.30             # 家族・同居人・恋人は倍率>1(関係者)
    threshold: 0.50             # ★**集団**の通報確率 1-Π(1-p) がこれ以上なら通報が起きる。
                                #   個人 p は n^-alpha で落ちるが集団の確率は人数で上がる
                                #   (既定値: n=3→0.83 / n=5→0.90 / n=8→0.94 = 実測 0.85-0.95 の帯)
    alpha_ambiguous: 0.40       # 曖昧・軽微な状況の**個人**の人数減衰(Darley & Latane)
    alpha_danger: 0.0           # ★危険事態は人数で落ちない(メタ分析。介入が規範)
    clear_radius_m: 12.0        # これより遠い目撃者は加害者を特定できない(誤通報の内生の源)
    response: true              # 通報への臨場(police_response)を出す
    speed_m_per_min: 300.0      # response_min の換算(モデル値。実走行時間ではない)
    detain_steps: 0             # ★既定 0: >0 で既存の勾留 seam(detained_until)を使うが、
                                #   勾留は発火権を止める=LLM 呼数が動くので既定では 1 も動かさない
    ward_calls_per_day: 0.0     # ★参照値のみ(判定には使わない)。0=未設定

# ============================================================================ #
# 事件レイヤー H5 = 環境側の 3 族(火災 / 交通 / 群集)。**既定 OFF=現行と完全同一**
# ---------------------------------------------------------------------------- #
# 実装 src/society/incidents_env.py。計画 docs/plans/body-incident-layer-plan.md §3 の
# 「火災 = 薄いレート + 完全アクター連鎖」「交通 = 曝露の積」「群集 = 生成しない = 状態が事件」。
#
# ★較正の書き方(計画 §7「管轄混同」= 渋谷署 ≠ 渋谷区・消防も同様 = 3 倍ズレの源)
#   換算を 3 段に割って**全部 conf のキーとして外に出す**:
#     ① jurisdiction_per_day … アンカー(**管轄スケール**の実測値)
#     ② jurisdiction_to_ward … 管轄 → 区スケールの換算(**既定 1.0**)
#     ③ area_share           … 区 → この世界の規模比(0 = 地図 bbox から自動計算)
#   ②の既定を 1.0 にしたのは**少なく見積もる向き**へ倒すため: 火災 0.66 件/日 は年 241 件で、
#   渋谷区を 2 署が分担するので素朴には ×2 だが、それは東京消防庁管内の総火災件数(年約 4,000 件)を
#   23 区へ按分した水準(区あたり年 60〜200 件)と 2〜8 倍食い違う。「アンカー × 署数」は
#   **上振れの上限側**であって実測ではない。上限側を測るランは 2.0(火災)/ 3.0(交通)を書く。
#   ③は地図メタの bbox から計算する(v7 では約 3.8 km² / 渋谷区 15.11 km² ≒ 0.25)。
#
# ★停電・漏水は**作らない**(skip の明示): 東京の SAIDI は年約 13 分 = 10 日ランの期待値 0.4 秒。
#   「起きない」が正しい答えなので、起こす機構を書けばそれは較正ではなく演出になる。
#
# R1: LLM 追加呼ゼロ・プロンプトの節ゼロ増(出来事は既存の記憶欄に定型 1 行が入るだけ)・
#   新しい乱数は新 stream 2 本("incident_fire" / "incident_traffic")だけ・群集は乱数ゼロ。
# OFF が保つ不変条件: 新 7 種の L1 0 件・sim に state が生えない・agent に属性が生えない・
#   stream を 1 本も引かない・プロンプト 1 バイト不変・L1 バイト一致(golden_baseline_l1.json)。
incidents_env:
  enabled: false                # ★false=完全 no-op(バイト一致)。true で 3 族が動きはじめる
  max_events_per_step: 24       # 1 step に出す本機構の L1 件数の上限(超過分は捨てる)
  area_share: 0.0               # 0 = 地図 bbox から自動計算(発明した定数を置かない)
  # ---- ① 火災(薄いレート → 第一発見者 → 119 → 出場 → 鎮火)----
  fire:
    enabled: true
    # 出場する当直を名簿から探すときの職の語(第109バッチ D2 で src のハードコードから conf へ)。
    # ★正直な現状: ペルソナプール(build_persona_pool.py の _L5_ROLES)に「消防士」は
    #   **1 人も居ない**ので、既定のままでは出場者が見つからず fire_dispatch の
    #   unstaffed=true(= 無人で燃え尽きる)が立つ。これは不具合ではなく**正直なマーカー**で、
    #   居ない職を別の職(救急隊員など)で埋めることはしない。summary.json の
    #   incidents_env.fire_roster に名簿の実人数が出るので事後に判別できる。
    occupations: [消防士]
    jurisdiction_per_day: 0.66  # ★アンカー(消防署管轄スケールの実測 = 年 241 件)
    jurisdiction_to_ward: 1.0   # ★管轄 → 区。既定 1.0(上限側は 2.0)
    # ★重度分布のアンカー = **ぼや 175 : 全焼 0**(同じ年報)。頻度と**同時に**較正する
    #   ことが計画 §7 の要求(= 災害映画化の防止)。全焼の重み 0 = 既定では 1 件も起きない。
    #   ★固定アンカーは「ぼやが 7 割強」と「全焼ゼロ」の 2 点だけで、残余 66 件を
    #     部分焼 : 半焼 = 3 : 1 に割ったのは**仮定**である(ここを差し替えれば試せる)。
    severity_weights: {boya: 175.0, partial: 50.0, half: 16.0, total: 0.0}
    # ★出火原因の **73% は器具使用に帰属可能**(kitchen+heating+electrical = 0.73)。
    #   none(0.27)= たばこ・放火・不明の族 = 器具に帰属できない残り。
    appliance_weights: {kitchen: 0.34, heating: 0.20, electrical: 0.19, none: 0.27}
    # 用途別の火災荷重(飲食は火気を扱うので高い)。用途は地図の POI cat と建物 kind の純関数。
    use_weights: {eating: 4.0, retail: 2.0, office: 1.5, lodging: 2.0,
                  public: 1.0, residential: 1.0, other: 0.5}
    level_gain: 0.05            # 階数 1 につき荷重 +5%(規模の代理)
    cold_temp_c: 20.0           # この気温を下回るほど暖房起因が増える(季節の共変量)
    cold_gain: 0.5              # 最も寒い日の出火レート倍率の上乗せ
    discover_radius_m: 40.0     # 第一発見者を探す半径(建物内に居る者が優先)
    response_reference_min: 9.0 # ★実測アンカー(通報から現着まで 9 分)。payload に併記する
    speed_m_per_min: 300.0      # response_min の換算(モデル値。実走行時間ではない)
    on_scene_steps: 3           # 隊が現場に留まる長さ[step]
    burn_steps:                 # 重度別の燃焼の長さ[step](実時間で同じ長さを保つ)
      boya: 1
      partial: 2
      half: 3
      total: 4
    injury_severities: [half, total]   # 負傷者が出る重度(ぼやでは出ない)
    max_per_day: 8              # 1 日に出す出火の上限(L1 の安全弁)
  # ---- ② 交通(曝露の積。被害者は**実在の横断中エージェント**)----
  traffic:
    enabled: true
    jurisdiction_per_day: 0.9   # ★アンカー(警察署管内 328 件/年)
    jurisdiction_to_ward: 1.0   # ★管轄 → 区。既定 1.0(渋谷区は 3 署 = 上限側は 3.0)
    pedestrian_share: 0.22      # 人身事故のうち**人対車両**の割合(残りは車対車=巻き込まれない)
    # 曝露 1 単位(**横断中の歩行者 1 人 × その step に走った車 1 台**)あたりのハザード。
    # ★正直な限界(実測して判ったこと): ambient の背景交通は 1 step で経路を走り切るので
    #   「その step にその node に居た車」という量が世界に残っていない(step 末の cars は
    #   常に空)。持っていない量を node へ按分すると捏造になるので、車流は街全体の
    #   台数(traffic.last_n)を使い、場所の情報は歩行者側だけが持つ。
    # ★既定値の出どころ(実測): 参照ラン(既定地図・60 体・144 step)の曝露の積の総和は
    #   144,916/日。アンカー 0.9 × 0.22 × area_share(0.0476)= 0.0094 件/日 を割り戻すと
    #   2.95e-7 → 丸めて 3.0e-7。**人数・地図が変われば合わなくなる暫定値**なので、
    #   provenance が「実測件数/日 vs アンカー」を必ず並べて出す(city_ops と同じ流儀)。
    hazard_per_exposure: 3.0e-7
    # 人身事故の重度。★死亡は **H1(身体レイヤー)の管轄**なので既定重み 0(計画 §6-1)。
    severity_weights: {light: 92.0, serious: 7.0, fatal: 0.0}
    injury_severities: [light, serious, fatal]
    call_radius_m: 40.0         # 通報者を探す半径(居なければ本人が自分で呼ぶ)
    signalized_only: false      # true = 信号のある交差点だけを横断部とみなす
    max_per_day: 8              # 1 日に出す事故の上限(L1 の安全弁)
  # ---- ③ 群集(**生成しない = 状態が事件**。人工的な群集注入は禁忌)----
  crowd:
    enabled: true
    # 密度の 3 閾値[人/m²]。4 = 歩行が困難になる水準(near-miss)/ 6 = 群集事故が
    # 起こりうる水準 / 13 = 群集雪崩の水準(明石歩道橋の実測級)。
    # ★物理ゾーン(physics.zones_enabled)が ON のランでしか測っていない = OFF では 0 件。
    #   測っていない量を推定して埋めることはしない(捏造しない)。
    levels: [4.0, 6.0, 13.0]
    hysteresis: 0.85            # 閾値 × この係数を下回ったら「跨ぎ」を再武装(上をうろつく
                                #   あいだ何度も出さない = 1 エピソード 1 件にするための係数)
    # 雑踏警備として数える職の語(第109バッチ D2 で src のハードコードから conf へ)。
    # ★payload の guards に出るだけ = 密度も行動も 1 ミリも動かさない(読み取り専用)。
    #   センサス較正台帳の実在語彙「常駐警備」(L2 に 3,875 人)は既定に**入れていない**
    #   (既定は現行値と完全同値を保つ)。入れる提案は conf/finals_observe.yaml を参照。
    guard_occupations: [警備員, 警察官]
    guard_radius_m: 50.0        # 上の職の頭数を数える半径。**読むだけ**
    max_per_day: 24             # 1 日に出す群集 incident の上限(L1 の安全弁)
