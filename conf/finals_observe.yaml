#   k.writeback(free 据置)/ controls.mode / world.scenario / world.mod / spark.* / rewards /
#   ablate.*(llm_off・propagation_off・cognitive_tier・shuffle_partners・context_shuffle・
#            persona_swap・context_sever・prompt_paraphrase)/ experiment.flat_traits /
#   observer.state_hash / model.cache_mode=replay
