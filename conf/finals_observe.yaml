society_diversity:
  enabled: true
  # ★第114 レーン 1b: 観光客・非日本語話者は**名簿 record から**決める(台帳が真実)。
  #   第113 の実測で見つかった内部矛盾の解消 —— persona 文に「訪日外国人」と書かれた
  #   14.9 万人と、engine が別ハッシュで決めていた agent.language が一致していなかった。
  #   ON にすると下の tourist_ratio / foreign_ratio は**名簿の欄を持つ層には効かない**
  #   (実効の観光客 = L4 の visit_purpose「観光・見物」= 24% / 非日本語話者 = L4 の 15%)。
  #   2 つの比率は欄を持たない層(L1/L2/L3/L5)の後退値としてそのまま残す。
  record_driven: true
