work:
  service:
    enabled: true
    indoor_fields: true
    # ★接客写像に service 行を足す(第109バッチ D2)。
    #   services.spend_cat の既定は "service" で、受給の _spend は cat="service" で出る。
    #   ところが基底 conf/config.yaml の work.service.serve_by_cat は food/cafe/nightlife/shop の
    #   4 行しか持たない(work.py の DEFAULT_SERVE_BY_CAT には第106で service 行が入ったが、
    #   conf が serve_by_cat を書いている以上そちらが丸ごと勝つ = 既定は使われない)。
    #   その結果、センサス較正台帳の **service 職場 1,972 社が構造的に無人接客**になり、
    #   services.enabled=true(上で ON)の来店が 1 件も serve に帰属しない。
    #   ここは OmegaConf の深いマージなので、この 1 行だけで 4 行 → 5 行になる
    #   (基底の 4 行は上書きされない)。値は work.py の DEFAULT_SERVE_BY_CAT と同一語。
    # ★挙動は ONセット承認(OBS-U1/U3)に同梱。基底 conf/config.yaml は触っていない。
    serve_by_cat:
      service: 窓口・施術の接客
    office:
      by_org: true
    ledger:
      enabled: true
  # ---- 職場束ね直し(第109バッチ レーン ORG。★ユーザー承認 2026-08-12「両方実装してON」)----
  # ON の理由:
  #  ① **pool ランでは work_node を持てない層が構造的に生まれる**。プールの L2(域内従業者
  #     224,240 人)は occupation が persona._WORK_CAT に載らない台帳ロール名(「常駐警備」
  #     「設備巡回」等)なので _pick_workplace が None を返し、勤務地が無いまま街に立つ。
  #     その結果 street_life の客引き(夜の持ち場 = work_node)も serve も org_output も
  #     原理的に成立しない。第108 縦煙の「客引き 0 件」はこの一点が原因だった。
  #  ② organizations 側の pool 配属(同承認)と**対**である。organizations の束縛は台帳 node を
  #     無条件に採るが、bind_workplace は「その node が実際にその業種の POI を持つか」まで見て
  #     実在の店舗へ着地させる(第100 の是正)。両方 ON で「台帳 → 実在 POI」が繋がる。
  # ★rebind_bound: true を**必ず同伴**する(第102 の記録 = org 帰属の意味論でこれが正)。
  #   false だと organizations.commute_to_poi が先に置いた台帳 node(POI 実体と食い違いうる)を
  #   「既に束ね済み」と見なして触らないので、①の是正が効かない個体が残る。
  # ★book は **センサス較正台帳**を明示する(既定は wide11k)。プールは
  #   build_persona_pool --orgs data/organizations_shibuya_census.json で再生成してあり、
  #   record の org_id は census 側の id 体系。wide11k と重なるのは 9,882 中 4,383 だけなので、
  #   既定のままだと半数以上が台帳直束ねに失敗して POI マッチへ落ちる(黙って劣化する)。
  # 正直な限界: ON で serve/spend の統計は大きく動く(第102 実測 serve 1259→301)。
  #   したがって **ON/OFF を跨いだ経済統計の比較はしない**(本選は ON セット内で完結させる)。
  bind_workplace:
    enabled: true
    rebind_bound: true
    book: data/organizations_shibuya_census.json

