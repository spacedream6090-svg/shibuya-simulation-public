  # ★正直な限界: pool ラン(agents.personas_file=null)では organizations.attach が 0 件を返す
  #   = agent.org_id は付かない。これは PENDING §3「pool 経路の agent.org_id 付与」= 判断待ち。
  #   台帳自体は career の再配属先・commerce.inventory.b2b の卸先として読まれる。

