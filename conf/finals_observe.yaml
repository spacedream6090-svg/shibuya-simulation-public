# ============================================================================
# (12) 心・社会・情報環境(観察の主眼)
# ============================================================================
relations:
  enabled: true
  dunbar:
    enabled: true          # 認知枠。pool.relations_cap を 60 に広げてある((2) 参照)
  endogenous_accept:
    enabled: true
  endogenous_invite:
    enabled: true
  endogenous_quality:
    enabled: true
friend_graph:
  enabled: true
  # ------------------------------------------------------------------------
  # β4 初期関係の較正(第117 レーンB3・**本選プロファイルのみ**。基底 conf は不変)
  # 出典: docs/research/initial-relations-improvement.md
  #   §0 R2(表の行「初期 closeness の減衰整合」)/ §1.3(蒸発の日数表)/
  #   §4 機構4 (4-d)(較正値の変更案の表)/ §8.1(Dunbar 実証値)/
  #   §8.2(交際頻度の中央値)/ §8.5(Fischer 1977 の年齢差)/ §3.7(強:弱の比)
  #
  # ★塞ぐ穴: 注入 closeness が「tier 閾値 + margin(0.5)」ちょうどだったので、
  #   relations.decay_per_day = 1.0 / decay_after_days = 0(下の relations: 参照)が
  #   **翌日には 1 tier 落とす**。§1.3 の実測表:
  #     親友 12.5 → tier 落ちまで **1 日** / 関係消滅まで 13 日
  #     友人  5.5 → tier 落ちまで **1 日** / 関係消滅まで  6 日
  #     知人  2.5 → tier 落ちまで **1 日** / 関係消滅まで  3 日
  #   = day0 に張った友人グラフが 10 日ランを生き延びない(2 週間で蒸発する過渡現象)。
  #   しかも顔なじみ・icebreak は closeness を持たず減衰の対象外なので、
  #   **構造化された初期関係だけが真っ先に腐る**という逆転が起きていた。
  # ★較正の錨: 内閣官房の一次調査 = 日本人の対面交際頻度の**中央値は「月1回〜2週に1回」**
  #   (§8.2)。「知人は 2 日会わないと消える」は現実と 1 桁以上ずれている。
  # ★制約: relations.tier_of は closeness から tier を引き直すので、注入値が上の層の閾値
  #   (2.0 / 5.0 / 12.0)に**届くと昇格**してしまう → margin_friend < 7.0・margin_acq < 3.0。
  margin_close: 15.0     # 12.0+15.0=27.0 → 1.0/日 で **15 日**tier3 のまま(§4 R2「親友 +~15」)
  margin_friend: 6.5     # 5.0+ 6.5=11.5 → **6 日**tier2(7 日目に tier1 へ)。7.0 は親友へ昇格
  margin_acq: 2.5        # 2.0+ 2.5= 4.5 → **2 日**tier1(3 日目に関係消滅)。3.0 は友人へ昇格
  # Dunbar 実証値(§8.1: 9 データセット平均の最内層 **2.0 人**・累積 L2=5.8 / L4=34.6)。
  # 現行 3-5 は親友を配りすぎ。総次数は 29-35 に留まり実証の 30-37 帯から出ない(§3.7)。
  close_min: 1           # 3 → 1(§4 (4-d))
  close_max: 3           # 5 → 3
  friend_min: 4          # 7 → 4(累積 L2 = 5.8 に合わせる)
  friend_max: 8          # 12 → 8
