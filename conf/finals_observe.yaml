# ============================================================================
# 存在の内生化 POP(2026-08-14 ユーザー承認・本線前試行)
# ============================================================================
# 正典: docs/plans/population-endogenization-plan.md / src/society/population.py。
# ユーザー決定(2026-08-14): ①転入は**案A(L4 定着昇格)** ②「イベントが発生することが重要で、
# エージェントの増減はあまり気にしていない」= 転出/転入/出生という人生イベントが 10 日ランで
# 実際に観測されることが主眼 ③量は現実量(渋谷区実勢の 10 日換算)を**検証目標のバンド**とする。
# 実数アンカー(bbox 常住 3 万按分・**駆動ではなく検証目標**): 転入 8.4 / 転出 7.8 / 出生 0.59 人日。
population:
  # ---- ③ 出生 = 本セットで ON ------------------------------------------------------
  # ON にする理由: **リスクがゼロで、10 日ランでも実発火する**唯一のレーンだから。
  #   ・新生児は sim.agents に入らない = 在場数・LLM 呼数・予算・発火母集団を 1 つも変えない
  #     (戸籍 = 台帳の 1 行 + 親の housemates の 1 要素という「世帯メンバの最小エージェント」)
  #   ・金も資産も 1 円も動かない(新生児は財産ゼロで生まれる = どの保存則も破らない)
  #   ・PRES-A1 と同じ Bresenham 構成なので、θ が夫婦ごとに一様に散っている = **どの 10 日を
  #     切っても 10/I の割合の夫婦の位相がその窓に入る** = 10 日ランでも出生が観測される
  #     (「この 10 日で出会って産んだ」ではなく「既に居る夫婦のもとに子が生まれた」)。
  # 前提は本セットで全て満たしている(household.enabled + realistic + cohabit + relations)。
  births:
    enabled: true
    interval_days: 3000.0  # 夫婦 1 組の平均出産間隔[日]。IPSS 完結出生児数 1.90 からの設計値
    couple_share: 0.6      # 子を持つ性向を持つ夫婦の割合(夫婦固定=当日の抽選ではない)
    age_min: 18
    age_max: 45
    # ★**この 1 行が 10 日ランで出生が起きるか否かを決める**: partner_id は form_partners が
    #   closeness 閾値超でしか張らないので 10 日では成立しない。true にすると
    #   household.realistic が配った続柄(夫/妻)= **初期条件として既にこの街に居る夫婦**を
    #   拾う(本セットは household.realistic + pool_bind とも ON なので途中入場者も含む)。
    # 見積り(既定パラメタ): L1 3 万 → 家族世帯の夫婦 ≒ 4,800 組 → 両親 18-45 歳 ≒ 1,900 組 →
    #   性向 0.6 で資格 ≒ 1,150 組 × 1/3000 日 ≒ **0.38 件/日**(実勢 0.59 件/日 と同桁)。
    household_spouses: true
  # ---- ① 恒久転出 / ② 転入(定着昇格)= **コード先行 OFF 待機**(実測ゲート)-----------
  # 下の 2 つの `enabled: false` を `true` に替えるだけで本番投入できる状態にしてある
  #   (src の再ビルドも名簿の再生成も要らない = PRES-A2 と同じ「1 行で ON」の作法)。
  # ★いま OFF にしている理由は**設計の不安ではなく、25 万規模での発生量が未実測**だから:
  #   (a) 転出量は「いま何人が家賃を滞納しているか」(economy.accounts の E5)に比例するが、
  #       25 万在場・10 日での滞納者数は一度も測っていない。閾値 6.0 は bbox 按分 7.8 人日 を
  #       狙った**設計値**であって実測較正値ではない。
  #   (b) 転入は**転出の裏面**である(名簿の常住 3 万が住宅系 5,531 棟をほぼ埋め切っているので、
  #       空き住戸は誰かが出ていくことでしか生まれない)。したがって (a) の実測なしに ② だけを
  #       ON にしても 1 件も起きず、② だけの判断は原理的に成立しない = 2 つは同時に判断する。
  #   (c) 転出は現金・口座を IF-E の RoW へ持ち出す(org 会計 ON の本セットでは実際に金が動く)。
  #       量が読めないまま本番へ入れると、貨幣の域外流出が街の会計を意図せず動かしうる。
  # 実測手順(リハーサル 1 本で足りる): 本セット + population.emigration.enabled=true で
  #   1-2 日ぶんを回し、summary.json の population.per_day.emigrate を
  #   **7.8 人日 のバンドと同桁か**で判定する。桁がずれていたら threshold(= 個人の閾値)を
  #   動かす(世界側のレートノブは作らない = Cadyts 流に較正を個人属性へ帰す)。
  emigration:
    enabled: false         # ← 実測後に true(上の手順)。ON で L1 に life_event{kind:emigrate}
    threshold: 6.0         # 転出を決断する蓄積ストレスの基準値(個体ごとに spread で散る)
    spread: 0.6
  immigration:
    enabled: false         # ← emigration と**同時に**判断する(空き住戸は転出の裏面)
    days_min: 4            # この街で過ごした日数の基準値(個体固定閾値の中心)
    ties_min: 2            # 域内に築いた関係の最小本数(縁が無い人は定着しない)
    require_job: true      # 求人の空き定員(域内の受け皿)を条件にする

factors:
  relative_deprivation_grievance: 0.012

economy:
  fixed_cost_daily: 300
  visitor_refresh: true
  min_wage_hourly: 1226
  accounts:
    enabled: true
    eviction_days: 30
    bankruptcy_days: 60
  consumption:
    enabled: true
  payment:
    enabled: true
  bank:
    enabled: true
  vc:
    enabled: true
  org_accounting:
    enabled: true          # IF-E2 案B(2026-08-06 決定)。RoW を宣言して総マネー保存を立てる
    # レーン乙 D1: 期首預金の母集団を「day0 の在場者(名簿の 1/4 のさらに一部)」から
    # 「束ねられた名簿全体」へ。世界の在場アルゴリズムが会社の運転資金を決めない。
    seed_from_pool_roster: true
  # ---- 賃金多様性 WAGE(第112バッチ。★ユーザー承認 2026-08-13)------------------------
  # ON の理由:
  #  ① **本選の L2 は 1 円も稼がない**。プールの L2(域内従業者 224,240 人)のうち 198,264 人は
  #     職業名が economy.WAGE_CAT(25語)に無く wage_amount が 0 を返す。残りも accounts ON では
  #     _phase_accounts_day の `if agent.visitor: continue`(=家賃のための門)に阻まれて
  #     給料日が構造的に来ない。つまり在場者の最大層が無収入のまま消費だけする世界だった。
  #  ② 給料日 25 日は `block_day % 30 + 1` では**到達しない**(8/16 開始・10日ラン)。
  #     calendar: true で実暦判定に切り替えると、本線の窓(day0=8/16 … day9=8/25)で
  #     **20 日組(重み0.12)と 25 日組(0.40)= 職場の約 52% が実際に発火する**。
  #     10 日組・15 日組・月末組(合計 48%)は窓の外 = その人たちは今回のランでは
  #     給料を受け取らない。これは隠さず正直に受け取る(10 日間の街を切り取れば
  #     給料日がまだ来ていない人が居るのが現実で、そこを均すほうが嘘になる)。
  #  ②' 支給額は**日割り**になる。weekday_work: true なので勤務日は 8/17-21 と 8/24-25 の
  #     7 日だけで、20 日組は 4 日ぶん(月額の 20%)・25 日組は 7 日ぶん(35%)を受け取る。
  #     満額の月給が出るのは所定労働日数(20日)を積んだ個体だけ = 実務の中途入社日割りと同じ。
  #  ③ 額が職種に見合う: 産業(14種)× 職種群 × 規模帯(8区分)× 個体差 ±15%。
  #     例(実測) エンジニア≈39万/月・営業≈28-35万・事務≈22-26万・店長≈26万・常駐警備≈20万・
  #     夜間清掃≈18万・教員≈29万。最低賃金の床(min_wage_hourly 1226 → 月196,160円)が
  #     零細飲食の接客を法定水準へ持ち上げる。
  #  ④ 支給形態の多様性: 月給が既定、日給は接客/現業/清掃の小規模職場の 15% だけ
  #     (週給は日本の慣行に無いので作らない)。賞与は規模帯で支給有無・月数が決まる。
  # ★較正への影響: 家計の月次可処分(monthly_net)・貯蓄率・家賃比が動く。帯の再較正は
  #   検収側の判断(calibrate_report の帯はこのプロファイルの実測後に見直す)。
  # ★org_accounting との相互作用: org の初期預金(配属者の日給合計 × month_days × σ)も
  #   新しい日給で計算されるので、**このプロファイルの財務量は WAGE OFF のランと比較不能**。
  wage_profile:
    enabled: true
    calendar: true         # 実暦判定(上記②)。world.calendar.enabled=true が前提=(3)で ON 済み

commerce:
  enabled: true
  stock_grievance: 0.02
  inventory:
    enabled: true
    b2b:
      enabled: true
      # レーン乙 D2: 卸の起動時在庫を「受け持つ小売の上限在庫 S の合計 × 日数」で与える
      # (0=現行=生産だけで立ち上げ)。initial_stock: 0 のままだと day1 の一斉補充が
      # すべて空の卸に当たり、all-or-nothing の仕入れ(b2b.py の have<qty)で全店品切れが
      # 波及する。初期条件として正当な「開業時の手持ち在庫」を置いて立ち上がりを渡す。
      initial_stock_days: 3
      # 第114 レーン乙: 初期在庫 3 日ぶんは**立ち上がり**しか渡さない。恒常的な需給ギャップ
      # (第113 実測: 生産 42,408 / 需要 44,604 = わずか 5%)に対して all-or-nothing の
      # 仕入れは「あと 1 個足りない」だけで補充を丸ごと失敗させ、翌日も同じ量を要求して
      # また失敗する自己再生産の詰まりを作る。★生産量(production_units)は**実勢**なので
      # 触らない —— 直すのは配分の規則の側である、というのがこの 2 行の判断。
      partial_fulfillment: true   # 在庫の範囲で納め、残りは翌日の (s,S) レビューが再発注
      multi_source: true          # 指名卸が空なら近傍の同業卸へ(決定論・距離昇順)
      max_sources: 3
services:
  enabled: true
  self_dev:
    enabled: true
delivery:
  enabled: true

work:
  service:
    enabled: true
    indoor_fields: true
    # ★接客写像に service 行を足す(第109バッチ D2)。
    #   services.spend_cat の既定は "service" で、受給の _spend は cat="service" で出る。
    #   ところが基底 conf/config.yaml の work.service.serve_by_cat は food/cafe/nightlife/shop の
    #   4 行しか持たない(work.py の DEFAULT_SERVE_BY_CAT には第106で service 行が入ったが、
    #   conf が serve_by_cat を書いている以上そちらが丸ごと勝つ = 既定は使われない)。
    #   その結果、センサス較正台帳の **service 職場 1,972 社が構造的に無人接客**になり、
    #   services.enabled=true(上で ON)の来店が 1 件も serve に帰属しない。
    #   ここは OmegaConf の深いマージなので、この 1 行だけで 4 行 → 5 行になる
    #   (基底の 4 行は上書きされない)。値は work.py の DEFAULT_SERVE_BY_CAT と同一語。
    # ★挙動は ONセット承認(OBS-U1/U3)に同梱。基底 conf/config.yaml は触っていない。
    serve_by_cat:
      service: 窓口・施術の接客
    office:
      by_org: true
    ledger:
      enabled: true
  # ---- 職場束ね直し(第109バッチ レーン ORG。★ユーザー承認 2026-08-12「両方実装してON」)----
  # ON の理由:
  #  ① **pool ランでは work_node を持てない層が構造的に生まれる**。プールの L2(域内従業者
  #     224,240 人)は occupation が persona._WORK_CAT に載らない台帳ロール名(「常駐警備」
  #     「設備巡回」等)なので _pick_workplace が None を返し、勤務地が無いまま街に立つ。
  #     その結果 street_life の客引き(夜の持ち場 = work_node)も serve も org_output も
  #     原理的に成立しない。第108 縦煙の「客引き 0 件」はこの一点が原因だった。
  #  ② organizations 側の pool 配属(同承認)と**対**である。organizations の束縛は台帳 node を
  #     無条件に採るが、bind_workplace は「その node が実際にその業種の POI を持つか」まで見て
  #     実在の店舗へ着地させる(第100 の是正)。両方 ON で「台帳 → 実在 POI」が繋がる。
  # ★rebind_bound: true を**必ず同伴**する(第102 の記録 = org 帰属の意味論でこれが正)。
  #   false だと organizations.commute_to_poi が先に置いた台帳 node(POI 実体と食い違いうる)を
  #   「既に束ね済み」と見なして触らないので、①の是正が効かない個体が残る。
  # ★book は **センサス較正台帳**を明示する(既定は wide11k)。プールは
  #   build_persona_pool --orgs data/organizations_shibuya_census.json で再生成してあり、
  #   record の org_id は census 側の id 体系。wide11k と重なるのは 9,882 中 4,383 だけなので、
  #   既定のままだと半数以上が台帳直束ねに失敗して POI マッチへ落ちる(黙って劣化する)。
  # 正直な限界: ON で serve/spend の統計は大きく動く(第102 実測 serve 1259→301)。
  #   したがって **ON/OFF を跨いだ経済統計の比較はしない**(本選は ON セット内で完結させる)。
  bind_workplace:
    enabled: true
    rebind_bound: true
    book: data/organizations_shibuya_census.json

