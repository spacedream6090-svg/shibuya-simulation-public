# =============================================================================
# 本選観察ラン ONセット候補(Wave 4 Day 3・2026-08-12)
#
# ユーザー方針(wave4-reality-coverage-plan.md §4-2「実装が終われば全てON」)を、
# **1本の自己完結プロファイル**として実体化したもの。--profile は 1 本しか取れないので
# production.yaml / observe.yaml / zones_shibuya.yaml の3系統をここへ合流させてある
# (zones_shibuya.yaml の合成作法「physics: ブロックと world.map 行を相手へ貼る」に従う)。
#
#   python scripts/run.py --profile conf/finals_observe.yaml run.name=obs_finals
#
# ★これは**候補**である。承認は OBS-U1/U3(PENDING §3)= 8/14。承認前に本ランは開始しない。
# ★本選のバックエンド配線(vLLM 艦隊)は入れていない。conf/profiles/finals-vllm7.yaml の
#   model: ブロックを下の model: へ貼るか、dotlist で上書きする(用途=配線 と 用途=世界 の分離)。
#
# 前提(このプロファイルは以下が再生成済みであることを要求する。Day 3 で実施済み):
#   ① 地図 v8            data/shibuya_osm_wide_v8.json           (POI 2,337・コンビニ93・subcat 付き)
#   ② 組織台帳(センサス較正+夜勤)
#        python scripts/build_orgs.py --census --count 9872 --night-shifts \
#               --map data/shibuya_osm_wide_v8.json --report
#        → data/organizations_shibuya_census.json (9,872社 / 従業者 222,849 / 夜勤枠 3,370社)
#   ③ ペルソナプール(②から再生成=夜勤者と新職業が載る)
#        python scripts/build_persona_pool.py --orgs data/organizations_shibuya_census.json
#        → data/persona_pool (100万件 / L2 224,240 / L5 1,292)
#          ★L5 は第109バッチ レーン FIX の消防士 45 人ぶんで 1,247 → 1,292。**プールを
#            再生成していないと消防士が 0 人**のままで fire_dispatch が恒久 unstaffed になる
#   ②③ を飛ばすと night_economy の夜勤者・street_life/city_ops の担い手が名簿に居らず、
#   「ONにしたのに1件も出ない」族が大量に出る(第107縦煙の実測)。
#
# 何を入れて何を入れなかったかの根拠表は docs/log/devlog.md の Day 3 エントリを正典とする。
# =============================================================================

# ============================================================================
# (0) ラン基本 — 規模は DP-U3 決定(本線10日ラン=25万・現実同等規模)
# ============================================================================
run:
  seed_auto: true          # 観察ラン=実験者が seed を選ばない(採取して config/summary に記録)
  n_agents: 250000         # pool ON では present_cap が実効。名目 N も揃えておく(smoke_wide と同じ流儀)
  n_steps: 1440            # 10日 = 144 step/日 × 10(Δt=10 分)。8/16-8/26 の本線
  dt_min: 10               # ★正準。≠10 は「別の世界」= 触らない
  start_tod: "00:00"       # day 境界=深夜0時。natural_start と併せて初日から全員に朝計画が出る
  natural_start: true      # 初日コールドスタート改善。★conf に「本番 ON はユーザー判断」= OBS-U1 で承認を取る
  mode: observe            # 機能レジストリ: 全 repro_tier を許可(宣言を manifest に残すだけ)

# ============================================================================
# (1) 観察ランの必須記録(observe.yaml (1b)。外してはならない層)
# ============================================================================
model:
  # backend/servers は本選で conf/profiles/finals-vllm7.yaml の model: ブロックへ差し替える。
  # ここは基底(mock)のまま=縦煙とドライランがそのまま通る。
  journal: true            # 全 LLM 呼のプロンプト全文+応答を llm_journal.jsonl.gz に残す
  cache_mode: free         # 観察ランは新規推論を許す(再生は llm_cache から replay で行う)
  reflect_think: false     # think=true は内省 JSON が全滅する実測(第34)。本番既定
  reflect_max_tokens: 768  # 右サイズ化(vLLM の KV 予約が縮み高並列が改善)

# ============================================================================
# (2) 名簿 = 100万プール(pool)+ 層別クォータ(DP-U3 案A)
# ============================================================================
# ★agents.personas_file は **null のまま**(プールが名簿を供給する)。ここに固定名簿を書くと
#   organizations.attach が「pool の密 id % 名簿人数」で無関係な配属を撒くので絶対に書かない。
pool:
  enabled: true
  dir: data/persona_pool   # ②③ で再生成したプール(L2 224,240 = センサス従業者 222,849 + 教職員)
                           # ★L2 の record は台帳の org_id/role を持つ = organizations の
                           #   pool 配属(attach_record)と work.bind_workplace の入力そのもの
  # ======================================================================== #
  # ★★ ペルソナプール v2 への切替(**待機ブロック**。切替判断は Fable / ユーザー)★★
  # ======================================================================== #
  # 正典: docs/plans/persona-pool-v2-plan.md(1,220行)/ docs/plans/age-diversity-plan.md
  # 生成:
  #   python scripts/build_orgs.py --childcare
  #   python scripts/build_persona_pool.py --v2 --fraction 1.0 \
  #       --orgs data/organizations_shibuya_census.json \
  #       --childcare data/organizations_shibuya_childcare.json --clean
  #   (出力 = data/persona_pool_v2。★--clean 必須 = 幽霊 part が llm_targets を汚す)
  # 切替は**この 1 行だけ**:
  #   dir: data/persona_pool_v2
  #
  # ---- 切り替えると何が変わるか(seed 42・fraction 1.0 の実測)-----------------
  #   層別件数   L1 30,000(不変)/ L2 224,240 → **138,759**(出勤率 0.62)
  #              L3 36,690(不変)/ L4 707,778 → **793,259**(L2 の空き枠が残余へ移る)
  #              L5 1,292(不変)/ 総数 1,000,000(不変 = 総量保存)
  #   presence   平日資格者 306,716 → **270,255**(-11.9%)
  #                resident 30,034(不変)/ duty 1,258(不変)/ cadence 25,238 → 25,257
  #                workday_shift 224,240 → **138,759** / stochastic 25,946 → **74,947**
  #              週末資格者 135,157 → **184,765**(週末/平日 = 0.44 → 0.68)
  #   ⇒ ★**tier_quota の配分が全層で変わる**(平日 [24480,1026,182775,20571,21148] は
  #      v1 の資格者数で計算された値なので、v2 に切り替えたら再計算される)。
  #   ⇒ ★present_cap 250,000 に対し平日資格者 270,255 なので**まだ cap が binding する**
  #      (v1 は 306,716)。cap 撤去(PRES-A2)の判断とは独立。
  #   ⇒ ★非通勤の来街(stochastic 74,947)が計画の較正目標「6万〜13万人/日」に入る
  #      (v1 は 25,946 = 実在の 1/3〜1/5)。
  #
  # ---- 年齢機構が「初めて発火する」(計画書 §6-4)----------------------------
  #   L1 に 0-14 歳 9.75% と 85+ 3.75% が実在化する(v1 は 0% / 0%)。
  #   health.severity の転倒外傷(65+ 0.5→75+ 2.0→999 5.0)・熱中症 ×3.0、services の
  #   年齢 HARD gate、tools の voter_age_min: 18(v1 は 1 人も落とせていなかった)、
  #   policy_cache のキー濃度(age//10*10)が**実際に効き始める**。
  #   ⇒ 行動が変わる = **呼数とメモリが動く**。切替の前に fraction 0.1 で縦煙を焚くこと。
  #
  # ---- 語彙の互換(壊れないことの根拠)---------------------------------------
  #   visit_purpose は 7 語のまま(presence の曜日プロファイル表・雨弾性表と完全一致)。
  #   occupation は v1 186 語の上位集合で、新語は 5 語だけ(未就学児 / 保育士 / 調理員 /
  #   幼稚園教諭 / 年金生活者)。5 語とも economy.WAGE_CAT・MONEY_INIT・OCC_GROUP_RULES・
  #   persona._WORK_CAT へ登録済み(tests/test_persona_pool_v2.py が全数で固定)。
  #   下の facility_devices / incidents_env が名指しする語(設備保守員・警備員・常駐警備・
  #   警察官)は v2 でも生える(台帳の SV 業種由来なので不変)。
  #
  # ---- 未解決(切替前に読むこと)--------------------------------------------
  #   (a) 来街者の年齢周辺分布・来訪頻度分布の形は**暫定**(distinct 来訪者の公表値は
  #       存在しない。水準だけ三点測量に合わせてある)。
  #   (b) 公務(PA)は台帳に org が無いので workplace_scope=out_area で表現(区役所を
  #       台帳へ足すかは未判断 = 計画書 §8-8)。
  #   (c) workplace_scope / at_home は **record に載っているだけで engine が読んでいない**。
  #       plan_boundary.eligible をこの欄へ繋ぐのは別レーン(PPv2-G・未実装)。
  #   (d) is_foreign を 0.15 → 0.30 に上げたが、engine 側の society_diversity.record_driven
  #       が ON でなければ language には効かない。
  # ======================================================================== #
  present_cap: 250000      # 在場 = 25万(DP-U3 本線)
  dormant_cap: 50000       # ★既定 0(無制限)は日次ローテーションで際限なく膨れる。LRU で有界化
  # ---- 層別クォータ(第98 小粒G・DP-U3 案A)----
  # OFF だと平日は workday_shift が cap を食い切り cadence/stochastic が 0 人=来街者ゼロの街に
  # なる(第91 実測)。ON の実走照合は Day 3 で完了(平日 day0・cap 25万で計算値と 5 層すべて差 0)。
  tier_quota:
    enabled: true
  # ---- 在場の内生化(第109バッチ PRES-A1/A2。ユーザー承認 2026-08-12)----------------
  # ユーザー原理:「範囲内にいる人の数もこちらが指定するものではない…世界のアルゴリズムに
  # よって結果が左右されたり、エージェントの量が決まったりすることはなく、エージェントの
  # 行動や思考、推論によって結果が現れるような状態にしたい」。
  presence:
    # ---- A1(習慣の内生化)= 本セットで ON ----------------------------------------
    # 非定期来街(L4 707,778 人)の「今日この街に居るか」を、世界のコイン
    # (`visit_rate × 当日乱数`)から**個体固定の習慣カレンダー**へ移す。
    # ★ON にしても既存の較正は 1 人も動かない: 1 日あたりの在場確率が
    #   Bernoulli(visit_rate) と**厳密に一致**する構成(Bresenham 列)で、曜日プロファイルも
    #   週平均 1.0 に正規化してある(= 週次の総来街量は不変・週内の配分だけが動く)。
    #   乱数はむしろ**減る**(当日 draw が消える)。
    # ★天候(weather)は本セットの weather.mode=generated で**実働**する
    #   (synthetic のランでは同じ行を書いても不活性 = 正直な宣言)。雨/雪の日に
    #   観光 −27%・買物 −10%…(週末は 1.5 倍・上限 29%)の弾性で「出控える人」が出る。
    habit:
      enabled: true
      weekday: true
      weather: true
    # ---- A2(cap 撤去)= コード先行・**8/15-16 の RSS/R_eff 実測後に 1 行で ON** --------
    # いまは既定の quota(present_cap 25万 + 層別クォータ)のまま。下の 1 行を
    #     mode: emergent
    # に替えるだけで「当日の資格者がそのまま在場者」になる(present_cap も quota_by_ratio も
    # 通らない)。src の再ビルドも名簿の再生成も要らない。
    #
    # 実測の見込み(docs/research/presence-endogenization.md §4.1・§4.3):
    #   平日 306,716 人(cap 25万比 ×1.227)・週末 135,157 人(元々 cap 未達)
    #   本選 10 日の平均在場 215,547 → 255,248(**+18.4%**)
    #   現実照合: 平日ピーク 371,829 に対し 0.67 → **0.82**(近づく)
    #   メモリ推定 316 GB → **388 GB(+72 GB)**  ← ここが ON 判断のゲート
    # ★ON にするときの規律:
    #   ① 縮退線が cap から **プール規模**へ移る(scripts/build_persona_pool.py --fraction)。
    #      当日の緊急縮退で人数を下げたくなったら mode を quota に戻すこと(= 原理から
    #      一時離脱している状態だと自覚して戻す)。
    #   ② tier_quota.enabled は残しておいてよい(emergent では 1 度も参照されない)。
    mode: quota
  # 忘却/再会を観察するランなので退避台帳を広げる(dunbar ON との相互作用。conf の注記どおり)
  relations_cap: 60
  episodes_cap: 60

# ============================================================================
# (3) 世界 — 地図 v8 + 暦 + 夜 + 装置 + 痕跡 + 設備
# ============================================================================
world:
  # ★v8 が本番地図(ユーザー決定 2026-08-10 §4-1)。night_economy の subcat 表(convenience/
  #   net_cafe/sauna/karaoke/club)と medical の subcat=hospital は **v8 でしか当たらない**。
  map: data/shibuya_osm_wide_v8.json

  calendar:
    enabled: true
    start_date: "auto"     # 実行当日を初日に(本選は 8/16)。weather.mode=generated が月を読む
    weekday_work: true

  # ---- 夜間解禁(Wave 4 III-1)。1つのクランプ修正が夜の街全体を開ける ----
  night_economy:
    enabled: true          # 日跨ぎシフト(close<open)+ 24h コンビニ + 深夜営業 + 終電後の受け皿

  # ---- 駅到着のパルス化(Wave 3)。transit_interior と faregate の前提 ----
  inflow_pulse:
    enabled: true

  # ---- 装置層 DEVS(Wave 1-2)----
  devices:
    enabled: true
    faregate:
      enabled: true        # 改札 60人/分。★inflow_pulse ON が前提(平滑流入では待ち行列が立たない)
    signal_events: true    # signal_summary 日次 1 件(観測)
    transit_operator: true # 運休判定を装置 δ_ext 経由へ(素通し=ビット同値)

  # ---- 場所のイベント履歴=スティグマジー(IF-D)----
  traces:
    enabled: true          # incidents_interpersonal.guardian.w_trace の前提でもある

  # ---- 昇降設備の摩耗・閉じ込め(H5)----
  facilities:
    enabled: true
    # ★★ Day 3 のリビルド検収で見つかった**名簿と conf の食い違い**への提案(要 Fable 承認)。
    #   基底の responder_occupations は ["設備保守員", "警備員"] だが、再生成した名簿には
    #   **どちらも 1 人も居ない**(実測: 設備保守員 0 / 警備員 0)。実際に居るのは
    #   センサス台帳が生やした L2 の夜勤ロール **「設備巡回」3,944 人 / 「常駐警備」3,875 人**。
    #   このままでは故障の対応者が原理的に 0 人=facility_call/dispatch/restore が永久に出ない。
    #   city_ops.night_cleaning.occupations が ["夜間清掃員", "夜間清掃"](L5 役割名 + 台帳ロール名)
    #   を**両方**並べている前例と同型に、台帳ロール名を足す。src は 1 行も触っていない。
    responder_occupations: ["設備保守員", "警備員", "設備巡回", "常駐警備"]
    # escalator.traps は **false のまま**(「エスカレータで閉じ込め」は現実に反する対照条件)

  # ---- 所有権レイヤー O1(登記簿)+ O3(相続)----
  # ON の理由:
  #  ① **観測層に完全に閉じている**(fingerprint_risk=none・LLM 呼数増分ゼロ・プロンプトの
  #     行も節も 1 つも増えない)。ON にしても生きている個体の行動は 1 バイトも変わらない。
  #  ② 本選の観測価値が大きい: 総資産 Gini(現金だけ見ると住宅資産を落とす = 資産格差の
  #     観測が原理的に歪む)・所有ネットワーク(創業者が何を持って始めたか)・空き住戸率。
  #  ③ **第107 の観測盲点の解消**(死者の財布に凍結された金が相続で流通へ戻る)。
  #     health.severity + medical が ON の本セットでは死が実際に起きるので、O3 が実働する。
  # コスト: 起動時 1 回の初期配賦だけ(地図 v8 = 延べ 11,948 戸 + has_car の車両)で、
  #   毎 step の走査はゼロ(死亡・転居があった step だけ L1 の watermark を見る)。
  # 前提: organizations が ON でセンサス台帳(9,872社)が載っていること
  #   = 賃貸住戸の家主に**域内の不動産 org**(RE × 賃貸仲介/管理・開発/PM = 487 社)が入る。
  #   organizations OFF だと賃貸は全部 RoW(不在家主)へ落ちる(= 現行と同じ絵)。
  assets:
    enabled: true
    # 既定値(持ち家率 0.32 / 法人家主 0.20 / RE × 賃貸仲介-管理・開発/PM)をそのまま使う。
    # ★較正を動かす提案は無い(住宅・土地統計調査と国交省調査の実測アンカーが源)。
    # 第114 レーン 優先2(O4 権利行): 賃貸中の住戸に lease 行を立て、家賃の受け手を
    # own 行の家主(域内不動産 org の預金 / 個人家主の口座)へ解決する。これまで家賃は
    # 誰が家主でも一律に域外(RoW)へ出ていた = 街の賃料が 1 円も域内で循環しなかった。
    # ★お金は増えない(引落は従来どおりで着金先が変わるだけ)。保有数は own 行だけを数える。
    # ★8/16-8/26 の窓では家賃の引落日そのものが窓外に落ちうる(第113 実測)ので、
    #   発火は暦次第 —— 機構は本番投入可能な状態で載せておく。
    lease:
      enabled: true

  # ---- 都市リアリズム(production 由来)----
  floor_clamp:
    enabled: true          # 階を実階数へ丸める(conf「★観察ランで ON」)
  elevation:
    enabled: true          # 標高 z を payload へ(表示・観測専用)
  heights:
    enabled: true          # 建物実高さ(PLATEAU)
  vision:
    enabled: true          # 壁による視線遮蔽(outdoor は重いので据え置き)
  scene_desc:
    enabled: true          # 方向つき視界の構造化シーン記述(追加 LLM 呼ゼロ)
  traffic:
    mode: od               # 信号69基・車線・一方通行295区間
    signal_from_crossings: true   # 車と歩行者を同一交差点装置へ(Wave 2 device_id 統一)

# ============================================================================
# (4) 交通 — 駅員/車掌 + 車内空間
# ============================================================================
transit:
  file: data/transit_odpt.json    # ODPT 実ダイヤ(6/9 路線。駅時刻表 or 静的 GTFS)
  # 第114 レーン 3b: 1 本ごとの**実発車時刻**を使う(これまでは実時刻を読んだ後で
  # (始発, 終電, 中央値間隔) の 3 値へ畳んでおり、シムが見ていたのは等間隔の再構成だった)。
  # ★効くのは時刻帯プロファイル: 朝 7:30-9:00 の到着 228→269 本(+18.0%)・1 日 2,911→2,601 本。
  #   単一の中央値間隔は朝(実測 2〜3 分)を過少・日中(4〜5 分)を過大に代表していた。
  #   ★塊(platoon)は立たない(到着のない分は 95→73 分に減った)= 期待と逆の実測。
  # ★JR 3 路線(山手内回り/外回り・埼京)は駅時刻表が非提供なので従来の再構成のまま(混在)。
  real_departures: true

transit_staff:
  enabled: true            # 駅員(在席)+ 車掌(ドア閉判断)。遅延の内生化
  bind:
    # ★ON の理由(street_life/city_ops.rebind_daily と同じ・第110 レーン PRES-C):
    #   駅員・車掌・電車運転士は名簿 L5 の duty 層で、在場ローテーションで毎日入れ替わる。
    #   起動時1回きりだと後半の日ほど駅に誰も立たず、ドア閉判断が unstaffed へ倒れる
    #   (= 停車時間の内生化そのものが 10 日ランの後半で死ぬ)。
    rebind_daily: true
  dwell:
    calibrated: true       # 東京実測則(+15人/車両 ≒ +1秒)へ係数差替

transit_interior:
  enabled: true            # 車両割当 + 車内ゾーン + 静かな共在 + familiar strangers + 車掌巡回
                           # ★world.inflow_pulse ON との論理積でしか動かない(上で ON 済み)
  copresence:
    # 第114 レーン 1c: 1 日 1 人あたりの同席記録の上限を 8 → 24 へ引き上げる。
    # ★これは**ログの量の上限だけ**を動かす(動力学は 1 バイトも変わらない)。
    #   `_copresence` は Event を 1 件出すか出さないかを分けるだけで、乱数を引かず、
    #   重複判定の印(`_train_seen`)は**出しても捨てても同じように付く**ので、
    #   上限を変えても他の L1 行・乱数消費列は完全に一致する
    #   (tests/test_transit_interior.py が同 seed 2 ラン(8 と 24)で機械固定)。
    # ★なぜ上げるか: familiar strangers(同じ相手と何度もすれ違う)は 1 日 8 対では
    #   飽和して観測できない —— 渋谷の通勤 1 往復で同じ車両に居合わせる相手は
    #   容易にそれを超える。本選は観察ランなので素材を絞る理由が無い。
    max_pairs_per_day: 24

transit_ride:
  taxi:
    prob: 0.02             # 現実較正(徒歩圏2kmの街でタクシーは例外的)
  bus:
    enabled: true
  bus_table:
    enabled: true          # 実バスダイヤ(GTFS 静的表)

# ============================================================================
# (5) 屋外の連続物理ゾーン(P3 竹-4 / P4-2)
#     conf/zones_shibuya.yaml の physics: ブロックを**そのまま**貼ったもの(合成作法)。
#     コスト実測: +2.66 s/step(人数ではなくゾーン数でほぼ決まる)。
#     ★incidents_env.crowd は zones ON のランでしか密度を測れない(H5 の設計上の制約)。
# ============================================================================
physics:
  sfm:
    far_field:
      enabled: true        # P4-2。A/B/C 受入が揃うのはこの構成だけ(v_of_s / wall は ON にしない)
      a2: 0.119
      b2: 1.890
      cutoff_factor: 2.5
      taper_m: 1.0

  zones_enabled: true
  # perception.channels は **false のまま**(true にすると第80 の σ 較正をやり直す必要がある)

  zones:
    # 並び順に意味がある: 信号を持つ scramble を先頭に置く(逆順だと赤信号を無視して車道を渡る)
    - id: scramble
      engine: orca
      dt_sub: 0.05
      layers: [0]
      polygon: [[9.92, -3.37], [0.58, 14.05], [-12.27, 10.08], [-22.54, 9.53],
                [-32.34, 2.27], [-22.85, -13.82], [-4.22, -16.8], [1.38, -10.67]]
      arrive_radius_m: 1.0
      signal:
        mode: table
        path: data/crossings_shibuya.json
        crossing_id: 291758776        # 実測 cycle 140 / green 37 / flash 10
        offset_s: 0.0
      orca:
        pref_noise: 0.05
        radius_margin_m: 0.05
        separation_iters: 64
      gate:
        min_gap_m: 0.10
        band_m: 3.0

    - id: hachiko_square
      engine: sfm
      dt_sub: 0.05
      layers: [0]
      polygon: [[-24.0, -56.0], [14.0, -56.0], [14.0, -27.0], [-24.0, -27.0]]
      arrive_radius_m: 1.0
      sfm:
        noise: 0.0
        wall_range_m: 2.0
      gate:
        min_gap_m: 0.10
        band_m: 3.0

    - id: center_gai
      engine: sfm
      dt_sub: 0.05
      layers: [0]
      polygon: [[-85.71, 12.02], [-76.77, 11.05], [-70.69, 67.09], [-79.63, 68.06]]
      arrive_radius_m: 1.0
      sfm:
        noise: 0.0
        wall_range_m: 2.0
      gate:
        min_gap_m: 0.10
        band_m: 3.0

# ============================================================================
# (6) 街路の顔と都市運営(Wave 4 III-3 / III-4)
# ============================================================================
street_life:
  enabled: true            # 客引き/スカウト・ティッシュ配り・路上音楽・キッチンカー・占い・
                           # 街頭演説・募金・路上生活者(尊厳規約は street_life.py が機械固定)
  # ★ON の理由(第109の実測発見・第110 レーン PRES-C):
  #   役割バインドは既定で**起動時1回きり**なので、pool の在場ローテーションが毎日回る
  #   本セット(present_cap 25万/100万プール)では、日を追って担い手が痩せる
  #   (退場した客引き・ティッシュ配り・路上支援員の枠が誰にも埋められない)。
  #   本線は10日ランなので、この追随が無いと後半の街から路上の生業が消えていく。
  #   追随は起動時と同一の決定論(乱数ゼロ・LLM呼数増分ゼロ)で、既に束ねた在場者は
  #   1 バイトも触らない。日ごとの担い手数は summary.street_life.bind_by_day に残る。
  rebind_daily: true
city_ops:
  enabled: true            # 交番8箇所への警官配置・ごみ収集・納品・ビル夜間清掃・救急出動
                           # ★ems は health.enabled(下で ON)・waste の深夜班は night_economy が前提
  # ★ON の理由: street_life.rebind_daily と同じ(担い手が日を追って痩せる)。こちらは
  #   交番の警官・収集班・納品ドライバー・夜間清掃員・**救急隊**の5群が対象で、痩せると
  #   ems_dispatch が unstaffed へ倒れる(第107で実際に全件 unstaffed だった族)。
  #   追随は出動中の隊を引き戻さない(枠を持つ在場者は触らない=冪等)。
  rebind_daily: true

# ============================================================================
# (7) 身体と事件レイヤー(第107 H1〜H5)
# ============================================================================
health:
  enabled: true
  fatigue_gain_work: 0.02
  fatigue_gain_move: 0.015
  fatigue_threshold_gain: 0.1
  onset_prob: 0.02
  medical_prob: 0.5
  # ---- 重症度 S0-S4 と死(H1)。★ユーザー決定 2026-08-11「死は現実量で実装」----
  severity:
    enabled: true          # mortality は本トグル配下(別オプトインは無い)。現実量較正済み

medical:
  enabled: true            # 搬送・受診・入院・会計(金の三本足)。★health.severity + city_ops.ems +
                           #   **v8 地図**(subcat=hospital)が前提。3つとも上で満たしてある

lost_property:
  enabled: true            # 落とす→拾う→交番→返還/所有権(chance の windfall/loss の機能代替)

incidents_interpersonal:
  enabled: true            # 窃盗・喧嘩・110番(RAT=共在なければ事件なし)
                           # detain_steps は **0 のまま**(勾留 seam は発火権が動くので踏まない)

incidents_env:
  enabled: true            # 火災 / 設備 / 群集 / 交通(全焼0既定・群集は生成しない=既存混雑を読む)
  # ---- 担い手の語(第109バッチ D2 で src ハードコードから conf キーへ)----
  # ★名簿の実測(data/persona_pool。上の ②③ で再生成したもの):
  #     消防士      45 人  … ★第109バッチ レーン FIX で _L5_ROLES へ**末尾追加**(本署の
  #                          消火部隊 3 隊 × 5 人 × 3 部制)。これ以前は 0 人だった
  #     救急隊員     6 人  … L5 役割(city_ops.ems が消防士と併せて 3 直で束ねる)
  #     警備員       0 人  … 「警備員」という語は名簿のどこにも無い(足していない=下記)
  #     警察官     140 人  … L5 役割(交番8箇所へ city_ops が 3 直で束ねる)
  #     常駐警備  3,875 人 … ★センサス較正台帳(build_orgs --census --night-shifts)の
  #                          ビル常駐警備ロール。L2 = この街で実際に働いている警備の実数。
  #                          L5 に「警備員」を別に立てると**同じ職の二重計上**になるので
  #                          名簿は増やさず、この語を conf 側で引く(下の guard_occupations)
  crowd:
    # 雑踏警備の頭数(payload の guards)は**読み取り専用**で密度も行動も動かさないので、
    # 名簿に実在する語を足して「警備が何人居合わせたか」を実測できる形にする。
    # ★正直な限界: 常駐警備はビル常駐の警備であって**雑踏警備(群集整理)ではない**。
    #   したがってこの数字は「その場に居合わせた警備の人数」であって「群集整理の配置人数」
    #   ではない。解釈するときは必ずこの区別を添えること。
    guard_occupations: [常駐警備, 警備員, 警察官]
  # ★fire.occupations は **既定のまま**(= ["消防士"])。第108 の時点では名簿に 0 人で
  #   fire_dispatch が恒久 unstaffed だったが、第109バッチ レーン FIX が
  #   scripts/build_persona_pool.py の _L5_ROLES へ消防士 45 人を末尾追加したので、
  #   **名簿を直す**ことで解消してある(救急隊員や警察官を conf で代用して「消防が居る街」の
  #   偽像を作る、という当時の禁じ手は採っていない)。
  #   summary.json の incidents_env.fire_roster が 0 でないことがその証拠になる
  #   (0 に戻っていたら = プールを再生成し忘れている、と読む)。

# ============================================================================
# (8) 情報・認知・計画(IF-A〜E)
# ============================================================================
information:
  rumors:
    enabled: true          # 噂オブジェクト+MT型 stifler(既存会話に相乗り=発話本文は非注入)

cognition:
  channels:
    enabled: true          # 読み取り専用・L1 バイト不変(σ 較正の観測点)
    # G6(第114 GT ロガー): 価値 4 軸の充足 sat を末尾 4 列として足す。
    # ON の理由: sat(「いま何が満たされていないか」)は復元実験の**直接の正解ラベル**なのに
    # writer が 1 本も無く、checkpoint にしか残らない = 世代を剪定すると消える。
    # needs / 内部状態が既に載っている channels.parquet に相乗りさせるのが最も安い(+0.6GB)。
    # cognition/channels.py の CHANNELS は 1 本も動かないので σ_c 凍結ファイルは無効化されない。
    sat_columns: true
  # ---- 拒否通知(IF-B)----
  # ★engaged 水準は cognition.engaged.enabled が OFF のとき memory へ**縮退**する(仕様)。
  rejection_notify: engaged
  # ---- 認知スタック本体(OBS-U3)------------------------------------------------------
  # g_update = **OBS-U3 で 2026-08-14 にユーザー承認**。根拠: 第112 レーン乙 B7 が可塑性の
  # 学習状態 11 欄(g / g0 / g_init / ē / credit / pending / η / λ / θ倍率 / day_n / f̄)を
  # プール回転の搬送集合へ入れたので、在場ローテーションで感度が毎日リセットされる問題
  # (= 役割分化が原理的に観測できない)は解消済み。第114 の棚卸しでも g 族に漏れは無い。
  #
  # ★★正直な申告(第114 実測): `cognition.g_update` は **`cognition.fire` が ON でなければ
  #    1 行も走らない**(plasticity.enabled() が fire.enabled() を前提にしている)。したがって
  #    下の 1 行だけでは cognition_g.parquet は生えない = 現状では無効な宣言である。
  #    fire は affects_k=True(LLM 呼の発生点そのものが変わる)の別項目で、OBS-U3 の承認は
  #    g_update に対してしか出ていないため**ここでは開けない**。fire を開ける判断が出たら
  #    下の fire 行のコメントを外すこと(そのとき初めて g_update が実効になる)。
  g_update:
    enabled: true
  # ---- AGE-C 年齢 → 思考/推論の量(第116バッチ 2026-08-15)----
  # 正典: docs/plans/age-diversity-plan.md §4-4。実装: src/society/cognition/age_cog.py。
  # ON の理由: 既定 conf では年齢が影響するのは**プロンプト中の `{age}歳` だけ**で、
  #   LLM 呼の割当・層・予算・内省頻度・day_plan の全選抜が年齢盲目だった(全数実測)。
  #   しかも「プロンプトに年齢を書くだけ」の steering は 3 つの独立研究で無効が実証済み
  #   (Santurkar ICML 2023 / Liu EMNLP 2024 / Hong & Choi *The Gerontologist* 66(2) =
  #   モデルの 60/70/80/90 歳は互いにコサイン類似度 0.73-0.90 でほぼ同一)。
  #   ⇒ 年齢を効かせるならアーキテクチャ側(個体の認知パラメタ)に置くほかない。
  # ★ユーザー原理との整合: 年齢は「誰が撃てるか」を決めない。`lod.budget` の配分も
  #   `mind.tiers.high.select: uniform`(k* 自壊回避の掟)も 1 行も動かさない。
  #   年齢が変えるのは個体の思考周期と発火閾値だけで、量は本人の発火から創発する。
  # ★呼数(mock 実測 n=120 / cap=2 = 予算が深く binding する構成):
  #   総数 142 → 142(**完全一致**)。動いたのは内訳だけ(social 106→104 /
  #   novel_place 20→26)= 「変わるのは *誰が* 撃つか」が実測で成立している。
  #   ★正直な限界: cap が binding しない構成では呼数が動きうる(§4-2)。
  # ★正直な限界(効果の期待値): Park 2024(実在 1,052 名)ではデモグラフィックだけの
  #   ベースラインが既に人間再テスト一致の 74%。個体の作り込みで買えるのは +9〜12 点
  #   オーダーであり、「年齢を入れれば劇的に変わる」とは主張しない。
  # ★正直な限界(人口側): AGE-A(人口の年齢実在化)は**未実施**。現在のプールは
  #   0-14 歳 0.259% / 65 歳以上 1.794% / 85 歳以上 0 人で、実在の渋谷区(年少 10.03% /
  #   高齢 18.76%)とは違う。曲線の両端(子ども・後期高齢)はほぼ無人なので、本トグルが
  #   実際に動かすのは主に 20-50 代の帯である。
  age:
    enabled: true
  # ==========================================================================
  # ★D1 = b案(2026-08-15 ユーザー決定): 「8/15 診断で呼数実測 → 許容ならこの 3 行を解凍」
  # ==========================================================================
  # 解凍手順・判定基準・事前チェックリストは docs/plans/decision-dashboard.md §D1 に
  # 実測コマンドつきで書いてある。**数値を見る前に開けてはいけない**(affects_k=True)。
  #
  # 判定基準(要点だけ再掲。導出は dashboard §D1):
  #   許容線 = fire ON による **予算内呼の増分が総枠の +15% 以内**、かつ
  #            per-step 実効呼(cap + 予算外)のピークが壁時計の余裕を食い潰さないこと。
  #   +15% の出どころ = Δt 計画の壁時計表(dt-reduction-plan.md §5)。エンジン側の余裕は
  #   ×1.65 で消えるので、思考側に許せるのは総枠の 1 割台までという実測由来の線。
  # 相互作用(必ず同時に見る):
  #   - fire が増やす呼は **general レーン**(発火)に入る。lod.budget.tiers が ON なら
  #     reply / life の予約は原理的に食われないので、fire ON の副作用は「発火同士の競合が
  #     増えて granted 率が下がる」に閉じる(= 返事の飢餓は悪化しない)。tiers が OFF の
  #     ままだと fire ON は D4 の reply 飢餓を直接悪化させる → **B と同時に開けること**。
  #   - fire ON で初めて g_update(上の 1 行)と watch / engaged が実効になる。
  #   - rotation 搬送は第113 で 4 族(g 族・θ倍率・ê・credit)済み = 在場回転で消えない。
  #
  # watch:     { enabled: true }   # ← ô を LLM が出す層(fire ON が前提)
  # fire:      { enabled: true }   # ← ★affects_k=True。開けると g_update が実効になる
  # engaged:   { enabled: true }   # ← エピソード層(fire ON が前提)

planning:
  day_plan:
    enabled: true          # 構造化された朝の計画(conf「★本番はユーザー判断で ON」)
    use_contingency: true  # 第86 のデッドデータ(if_then)を消費する
    # ---- DPH-C 日跨ぎブロック(2026-08-15 ユーザー決定 D3)----
    # 渋谷は夜の街なのに「23:00 から 2:00 まで」が書けず 23:00-23:10 へ潰れていた。
    # 台帳実測: 日跨ぎシフト 254 社・従業者 4,984 人(18:00→02:00)が毎日
    # 「勤務末尾 2 時間 + 帰宅 + 就寝(02:30)まで」を無計画で過ごしていた。
    # プロンプトは 1 バイトも変わらず(HH:MM のまま)、朝の呼数も 1 も変わらない。
    wrap_blocks: true
    boundary:
      enabled: true        # 計画駆動の圏外滞在(despawn/respawn=朝の計画が予定表)
                           # transit_interior.include_plan_returnees の前提

# ============================================================================
# (9) 偶発イベント chance = **運用退役**(第107 決着)
# ============================================================================
# ユーザー原理「運は世界のアルゴリズムでなく人の行動から」(2026-08-11)。
#   windfall  → H3 拾得(lost_property)   loss → H3 遺失 + H4 窃盗被害
#   encounter → 既存の共在で機能代替完備
# 機能代替が完備したので本選 ONセットでは切る。**コード削除は本選後**(golden 保護)。
# observe.yaml は chance.enabled=true を持つが、本ファイルはそれを意図的に上書きする。
chance:
  enabled: false

# ============================================================================
# (10) 天候 — ★generated(H1 熱中症チャネルの前提)
# ============================================================================
# 既定 synthetic は WBGT 欠測 = heat チャネルが恒久的に不活性(第107 残課題)。
#   generated … 実測30年から較正した確率生成器(3状態マルコフ + 2変量AR(1) + 年効果)。
#               repro_tier=strict(静的ファイルと seed の純関数・ネットワーク呼び出しゼロ)。
#               較正済みは **8月のみ**(data/snapshot/weather_gen_params.json)= 本選 8/16-8/26 に一致。
#   table     … 凍結実測を実日付で引くが、凍結範囲は 1996-2025 年の8月 = **2026年は範囲外**で
#               synthetic へフォールバックする。よって table は採らない。
weather:
  enabled: true
  mode: generated
  rain_grievance: 0.01
  extra_prompt_fields: true   # 最低気温・湿度・降水・猛暑日・暑さ指数を天気1行へ(mode≠synthetic で有効)

# ============================================================================
# (11) 経済・組織・制度(production 相当のリアリズム)
# ============================================================================
agents: {}                 # ★personas_file は書かない(= null のまま。(2) の注記参照)

organizations:
  enabled: true
  commute_to_poi: true
  book: data/organizations_shibuya_census.json   # ★v8 + センサス較正 + 夜勤の台帳
  # ★第109バッチ レーン ORG(ユーザー承認 2026-08-12「両方実装してON」)で解消済み:
  #   pool ラン(agents.personas_file=null)は organizations.attach が構造的に 0 件を返していたが、
  #   プールの record は台帳から逆算して作られていて org_id/role を持っているので、
  #   build_pool_agent が **その org_id で配属する**(organizations.attach_record)。
