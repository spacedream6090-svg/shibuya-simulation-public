  # ---- RFX-A 内省の現実的タイミング / RFX-O 発火文脈の観測(第116バッチ 2026-08-15)----
  # 正典: docs/plans/reflection-leisure-plan.md §3。実装 src/society/cognition/reflect_timing.py。
  # ON の理由: **これは新機能ではなく内部不整合の解消**である。100 日ラン実測で
  #   来街者は「帰路の電車で今日を内省」しており **17-20 時に 35.6%** が発火する一方、
  #   居住者は **100.0% が 22-06 時**。原因は設計判断ではなく、居住者の帰宅が
  #   「入館 → 即就寝」の 1 アクションに畳まれていて "帰路" という状態が無いから。
  # ★発火点は 1 つも足していない: 起床時に「今日ぶんの内省」を 1 枚 armed にし、務め終了以降の
  #   最初の内省的瞬間(一人 かつ 非作業 かつ 低負荷文脈)で満期にする。早期発火は
  #   `reflect_suppress_arm` でその夜の予約を 1 回見送らせる = **1 予約 1 発火**。
  # ★前提: lod.budget.tiers(DPH-B)= 上で ON 済み。内省呼は life レーンに入る。
  # ★mock 実測(60 体 3 日・DPH-B ON): 22-06 時シェア **100.0% → 52.4%**。
  #   発火文脈の内訳は walk 92 / sleep 70 / home 6(居住者は 1 日 8.43 時間を路上に居るので
  #   walk が厚いのは事前登録どおり H-R3)。内省件数 161 → 168(**+4.3%**)。
  #   ★この差はラン境界効果: 夕方に早期発火した個体がその夜に眠らないままランが終わると、
  #   OFF では起きなかった内省が ON では起きる(±1 日ぶん。同書 §3.3 が事前に申告している唯一の
  #   非一致ケース)。総 LLM 呼は 2,869 → 2,845 で**増えていない**。
  # ★正直な限界(文献): 発火条件を「活動名のホワイトリスト」で書く方式そのものは文献の支持が
  #   弱い(K&G 2010 補遺 = 活動の種類は心のさまよいの個人間分散の 3.5% しか説明しない。
  #   効いているのは作業記憶負荷)。ここは `activity ∈ {working, commuting}` と勤務窓で近似している。
  # ★正直な限界(未実装): 「**選んで**一人になったか」が孤独の価値を決める(Nguyen 2018 研究 4)
  #   という含意は本シムでは表現できない(孤独は移動の副産物であって選択ではない)。
  # ★`transit` タグは語彙に在るが現行実装では到達しない(車内層は圏外の個体にしか付かず、
  #   圏外は述語で除外される)。在るふりをしないための注記。
  timing:
    mode: reflective_moment
    evening_floor_hour: 18
    context_tag: true          # RFX-O: 観測のみ(世界も乱数も 1 ビットも動かさない)
    # ★sleep_task_rewrite は **OFF 据え置き**(ユーザー判断待ち)。現行の就寝前テンプレは
    #   文献の分類では良眠者ではなく**不眠者**の就寝前認知(Lemyre 2020 の系統的レビュー)で、
    #   言い換え版は実装済み。ただしこれは**プロンプト変更 = 挙動変化**であり、実 LLM での
    #   検収を経ていない(reflect_variety が実 LLM 検収で正味悪化して OFF 据え置きになった前例)。
    sleep_task_rewrite: false
