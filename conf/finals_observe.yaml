#   physics.perception.channels … true で ext.crowd_local の意味が変わり第80 σ 較正がやり直し
#   physics.sfm.v_of_s          … 限界効用ほぼゼロ(最大相対誤差 0.113→0.131 と微悪化)
#   physics.sfm.wall.{a,b}      … 単独 ON は悪化。かつ本3ゾーンは walls 宣言ゼロ=評価されない
#   routine.stochastic.gumbel   … 行き先分布の形を変える(較正済み既定からの逸脱を本選で混ぜない)
#   prompts.reflect_variety     … 実LLM で丸写し 33%(正味悪化)
# ● 再現不能(repro_tier=none)
#   transit_ride.live.* … SUMO 外部プロセス。observe モードでは許可されるが事後再生できない
# ● 規模の都合
#   indoor.*(markov/sfm/tracks/meeting/los)… PENDING §4「D16 屋内 ON」未解決。
#     indoor_tracks ON はディスク +19GB(W4-E 申告)。25万では別途容量計画が要る
#   pov.enabled … POV 画像(CPU レンダ)。容量・時間コストが 25万で成立しない
#   world.vision.outdoor … 建物 footprint で屋外も遮蔽する重い版
#   observer.regression … (13) の理由
# ● 現実に反する対照条件(conf が明記)
#   world.facilities.escalator.traps / incidents_interpersonal.theft.supersede_diversity=false /
#   brawl.require_intox=false / brawl.night_only=false / transit_staff.dwell.require_service=false /
