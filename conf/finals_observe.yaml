# (13) 観測 — 25万 × 10日を「書き終われる」形にする
# ============================================================================
observer:
  # ---- DPH-O 観測 4 点(2026-08-15 ユーザー決定 D3。**世界を 1 バイトも動かさない**)----
  # ON の理由: 本選 10 日ランで「返事が落ちた」「日跨ぎの予定が潰れた」「朝の計画が立たな
  # かった」「どの用途で予算が枯れた」が **事後に 1 件も検出できない**のが現状。記録専用で
  # 分岐も乱数も呼数も 1 つも動かさないのでリスクはゼロ、規模も L1 の新 kind 3 種だけ。
  starvation:
    enabled: true
  causality:
    enabled: true          # cause_type / actor_id / device_id(「世界を変えた人」の測定に必須)
  llm_link: true           # 行為 → 思考の PROV リンク
  llm_health:
    enabled: true          # watchdog の監視対象(本選10日ランでは ON)
  finalize:
    streaming: true        # ★25万体では必須。OFF だと「書き終わり」で落ちる(第99 実測)
  regression:
    enabled: false         # ★25万では OFF(窓合計が在場個体数に比例して常駐する)。退行検出は縦煙の仕事
  flush_every_steps: 6     # L1 を 1 シミュ時間ごとに part flush(バッファ OOM の回避)
  snapshot_every: 144      # L3 は 25万 × 250B/体 ≈ 60MB/回。1日1回に絞る
  checkpoint_every: 72     # 半日ごと。★25万体の完全状態 pickle=ディスクを先に確認すること
  initial_frame:
    days: 1
  # ---- A13 日次入場者名簿(レーン丙 2)-------------------------------------------------
  # ON の理由: この構成では day1 以降に **20.9 万人**が入場するが、その素性は
  #   traits.json(day0 の在場者だけ)にも agents.json(その瞬間の在場者だけ)にも載らない。
  #   observer/measure.py の R² 回帰・deviation のペルソナ逸脱・**復元実験**は名簿を
  #   traits.json > agents.json の順に引くので、本ランの在場者の 4 割超が
  #   「観測されているのに素性が不明」= 分母から落ちる。1 枚 +100MB 前後で塞げる穴。
  # 観測側だけで閉じる(L1・乱数・LLM 呼数・プロンプトはいずれも 1 バイト不変)。
  roster_daily:
    enabled: true
  # ---- GT ロガー(第114。docs/plans/metaverse-projection-plan.md §4)------------------
  # ON の共通の理由: **本選前に入れないと復元実験の正解ラベルが二度と取れない**もの。
  # 「観測痕跡だけから内部状態をどこまで復元できるか」という問いは、真値(= 内部状態の
  # 時系列)が残っていて初めて成立する。以下はいずれも checkpoint にしか無く、世代の剪定・
  # dormant の LRU 溢れ・日々の忘却で**ランの成果物からは消える**ものばかりである。
  # 全て observer 側で閉じる(世界も乱数も LLM 呼数もプロンプトも 1 バイト変わらない)。
  # 追加ディスク合計 ≈ +3.4GB(現行 67GB の +5%)。
  input_provenance:
    enabled: true          # G1: プール/地図/組織台帳の sha256。agent_id → ペルソナの決定論
                           #     逆引きの来歴保証(これが無いと逆引きが原理的に検証不能)
  memory_daily:
    enabled: true          # G4: 記憶ストリームの本文。★+1.5-1.8GB = 本ランで最大の 1 枚
                           #     (睡眠時の buffer 切り・store_cap 超過で日々消えるので、
                           #      日境界のスナップショットでしか捕まえられない)
  relations_daily:
    enabled: true          # G5: closeness の連続値軌跡(差分)+ C3 すれ違い集計。
                           #     「共在 → 関係」の復元実験は説明変数と被説明変数が
                           #     両方ともここにしか残らない。+0.4GB
  gt_extras:
    enabled: true          # G7: 計画の mood/carry/同行者・自己像本文・感情句・needs 5 軸・
                           #     期待表の上位 k。既存 payload にキーを足すだけ。+0.5GB

