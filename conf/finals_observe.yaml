  max_llm_per_step: 300
  # ---- DPH-B 二層予算 + FIFO 繰り越し(2026-08-15 ユーザー決定 D3)----
  # 塞ぐ穴(600体×3日 mock 実測): cap が binding なランでは発火側が先に食い切り、
  #   **返答保証が 08-23 時に 100% 消滅**する(reply 16,722 → 618 = −96%)。しかも
  #   その枯渇は L1 に 1 件も残らない(= 観測不能なまま「誰も返さない街」が成立する)。
  #   さらに朝の計画と夜の内省が予算外を無条件に走るので、実効の per-step 上限は
  #   cap+予算外(実測 cap60 で 96 呼)= 25 万在場のピーク step で推定 1.5 万呼。
  # ON で総呼数は増えない(used <= max_llm_per_step を常に満たす)。分配だけが変わる。
  # ★D1(fire)を開けるならこちらも ON でなければならない: fire が増やすのは general
  #   レーンの呼なので、tiers ON なら reply / life の予約は原理的に食われない。
  budget:
