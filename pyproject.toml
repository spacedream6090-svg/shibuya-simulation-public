[project]
name = "shibuya-society"
version = "0.0.1"
description = "LLM artificial society in Shibuya — emergence of world-changers (k* phase transition)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "networkx>=3.2",
    "omegaconf>=2.3",
    "pyarrow>=15.0",
]

[dependency-groups]
# tomli = tests/test_xdist_grouping.py の tomllib フォールバック(Python 3.10 = GPU サーバー実測)。
# pytest-xdist = フルゲート常用の -n auto / loadgroup 分配(addopts 参照)に必須。
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 第86バッチ保守 M-2: サブプロセスを**実際に起動する**テストの並列フレーク対策。
# pytest-xdist 3.8 の loadgroup 分配 = `@pytest.mark.xdist_group("名前")` が付いた
# テストを**同じワーカーへ集める**(= 互いに並列に走らない)。ここを addopts に置くのは、
# 常用のフルゲート `python -m pytest tests -q -n auto` にオプションを足させないため
# (既定の `--dist load` のままだとマーカーが無視されて対策が効かない)。
# -n を付けない実行では分配モード自体が働かないので完全に無害。
addopts = ["--dist", "loadgroup"]
markers = [
    "slow: 重い合成データ・スケール検証(`-m 'not slow'` でスキップ可)",
]
